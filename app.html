function renderSceneProperties(props) {
  var content = document.getElementById('scene-properties-content');
  var shotDate = props.exifDate
    ? escapeHtml(formatDateTime(props.exifDate))
    : escapeHtml(formatDateTime(props.lastUpdated));
  var cameraLabel = (props.cameraMake || props.cameraModel)
    ? escapeHtml([props.cameraMake, props.cameraModel].filter(Boolean).join(' '))
    : '不明';
  var resolutionLabel = (props.width != null && props.height != null)
    ? escapeHtml(props.width + ' × ' + props.height + ' px')
    : '不明';
  var northLabel = (props.northOffset != null)
    ? escapeHtml(props.northOffset + '度 (北基準)')
    : '情報なし';

  var rows = [
    { key: '名前',       value: escapeHtml(props.name || '') },
    { key: '撮影日時',   value: shotDate },
    { key: 'カメラ機種', value: cameraLabel },
    { key: '解像度',     value: resolutionLabel },
    { key: '撮影方位',   value: northLabel },
    { key: 'ファイルサイズ', value: escapeHtml(formatFileSize(props.sizeBytes)) },
    { key: 'Drive URL',  value: props.url ? '<a href="' + escapeHtml(props.url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(props.url) + '</a>' : 'なし' }
  ];

  content.innerHTML = rows.map(function (row) {
    return '' +
      '<div class="scene-properties-row">' +
      '  <div class="scene-properties-key">' + row.key + '</div>' +
      '  <div class="scene-properties-value">' + row.value + '</div>' +
      '</div>';
  }).join('');

  document.getElementById('scene-properties-backdrop').classList.add('visible');
}

function closeScenePropertiesDialog() {
  document.getElementById('scene-properties-backdrop').classList.remove('visible');
}

function onScenePropertiesBackdropClick(evt) {
  if (evt.target.id === 'scene-properties-backdrop') {
    closeScenePropertiesDialog();
  }
}

function formatFileSize(bytes) {
  var size = Number(bytes);
  if (!isFinite(size) || size < 0) return '不明';
  if (size < 1024) return size + ' B';
  if (size < 1024 * 1024) return (size / 1024).toFixed(1) + ' KB';
  if (size < 1024 * 1024 * 1024) return (size / (1024 * 1024)).toFixed(1) + ' MB';
  return (size / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
}

function formatDateTime(value) {
  if (!value) return '不明';
  var date = new Date(value);
  if (isNaN(date.getTime())) return String(value);
  return date.toLocaleString('ja-JP');
}

/**
 * ホームボタン押下時: homeImageId のシーンへ遷移する
 */
function goHome() {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('go-home')) return false;
  if (!homeImageId) return;
  stopGyroIfActive('home');
  var homeImg = getSceneImageById(homeImageId);
  if (homeImg) {
    previousSceneId = null; // ホームへの移動は振り返り演出なし
    loadScene(homeImg);
  }
}

/**
 * 現在の画質モードに応じたGoogleusercontent URLサフィックスを返す。
 * @returns {string} '=w4096' または '=s0'
 */
function getQualitySuffix() {
  return imageQualityMode === 'high' ? '=s0' : '=w4096';
}

function getDirectImageUrl(imgData) {
  if (imgData && imgData.imageUrl) {
    return String(imgData.imageUrl).replace(/=(s0|w\d+)$/, getQualitySuffix());
  }
  return 'https://lh3.googleusercontent.com/d/' + imgData.id + getQualitySuffix();
}

function scenePerformanceNow_() {
  return window.performance && typeof window.performance.now === 'function'
    ? window.performance.now()
    : Date.now();
}

function createScenePerformanceRecord(generation, sceneType, sceneStartedAt) {
  if (!scenePerformanceEnabled) return null;
  if (activeScenePerformanceRecord && !activeScenePerformanceRecord.finished) {
    finishScenePerformanceRecord(activeScenePerformanceRecord, 'superseded');
  }
  var startedAt = Number(sceneStartedAt);
  if (!isFinite(startedAt)) startedAt = scenePerformanceNow_();
  var record = {
    generation: Number(generation) || 0,
    delivery: deliveryMode,
    type: sceneType === '2D' ? '2D' : '360',
    status: 'loading',
    marks: { sceneStart: startedAt }
  };
  scenePerformanceRecords.push(record);
  if (scenePerformanceRecords.length > 20) scenePerformanceRecords.shift();
  activeScenePerformanceRecord = record;
  return record;
}

function markScenePerformanceRecord(record, name) {
  if (!record || record.finished || !name) return;
  if (Object.prototype.hasOwnProperty.call(record.marks, name)) return;
  record.marks[name] = scenePerformanceNow_();
}

function markScenePerformanceRecordAt(record, name, timestamp) {
  if (!record || record.finished || !name) return;
  if (Object.prototype.hasOwnProperty.call(record.marks, name)) return;
  record.marks[name] = Number(timestamp);
}

function createAutoFallbackController(shouldHandle, performanceRecord, onFallback, sceneStartedAt) {
  var canHandle = typeof shouldHandle === 'function' ? shouldHandle : function () { return true; };
  var startedAt = Number(sceneStartedAt);
  if (!isFinite(startedAt)) {
    startedAt = performanceRecord && performanceRecord.marks
      ? Number(performanceRecord.marks.sceneStart)
      : NaN;
  }
  if (!isFinite(startedAt)) startedAt = scenePerformanceNow_();
  var deadlineAt = startedAt + DIRECT_FALLBACK_TIMEOUT_MS;
  var timer = null;
  var fallbackStarted = false;
  var directDisplaySucceeded = false;

  markScenePerformanceRecordAt(performanceRecord, 'autoFallbackDeadline', deadlineAt);

  function clearTimer() {
    if (timer !== null) {
      clearTimeout(timer);
      timer = null;
    }
  }

  function startFallback(reason) {
    if (!canHandle() || fallbackStarted || directDisplaySucceeded) return false;
    fallbackStarted = true;
    clearTimer();
    markScenePerformanceRecord(performanceRecord, 'autoFallbackStart');
    if (typeof onFallback === 'function') onFallback(reason || 'deadline');
    return true;
  }

  timer = setTimeout(function () {
    timer = null;
    startFallback('deadline');
  }, Math.max(1, deadlineAt - scenePerformanceNow_()));

  return {
    cancel: clearTimer,
    getRemainingMs: function () {
      return Math.max(1, deadlineAt - scenePerformanceNow_());
    },
    hasFallbackStarted: function () {
      return fallbackStarted;
    },
    hasDirectDisplaySucceeded: function () {
      return directDisplaySucceeded;
    },
    markDirectDisplayStart: function () {
      if (!canHandle() || fallbackStarted) return false;
      markScenePerformanceRecord(performanceRecord, 'directDisplayStart');
      return true;
    },
    markDirectDisplaySucceeded: function () {
      if (!canHandle() || fallbackStarted) return false;
      directDisplaySucceeded = true;
      clearTimer();
      return true;
    },
    startFallback: startFallback
  };
}

function finishScenePerformanceRecord(record, status) {
  if (!record || record.finished) return;
  var finishedAt = scenePerformanceNow_();
  record.finished = true;
  record.status = String(status || 'loaded');
  record.marks.total = finishedAt;
  record.duration = finishedAt - record.marks.sceneStart;
  if (!appStartupPerformance.finished) {
    appStartupPerformance.finished = true;
    console.info('[app-perf]', JSON.stringify({
      status: record.status,
      duration: finishedAt - appStartupPerformance.startedAt,
      configDuration: appStartupPerformance.configEnd == null || appStartupPerformance.configStart == null
        ? null : appStartupPerformance.configEnd - appStartupPerformance.configStart
    }));
  }
  if (activeScenePerformanceRecord === record) activeScenePerformanceRecord = null;
  var relativeMarks = {};
  Object.keys(record.marks).forEach(function (name) {
    relativeMarks[name] = record.marks[name] - record.marks.sceneStart;
  });
  console.info('[scene-perf]', JSON.stringify({
    generation: record.generation,
    delivery: record.delivery,
    type: record.type,
    status: record.status,
    duration: record.duration,
    hotspotSource: record.hotspotSource || 'network',
    metadataPrefetch: sceneMetadataPrefetchEnabled,
    marks: relativeMarks
  }));
}

function preloadSceneImage(imageUrl, shouldHandle, performanceRecord, timeoutMs) {
  markScenePerformanceRecord(performanceRecord, 'imagePreparationStart');
  return new Promise(function (resolve) {
    var image = new Image();
    var settled = false;
    var timer = null;
    var canHandle = typeof shouldHandle === 'function' ? shouldHandle : function () { return true; };

    function finish(status) {
      if (settled) return;
      settled = true;
      if (timer) clearTimeout(timer);
      image.onload = null;
      image.onerror = null;
      if (!canHandle()) return;
      if (status === 'loaded') {
        markScenePerformanceRecord(performanceRecord, 'imagePreloadComplete');
      } else {
        markScenePerformanceRecord(performanceRecord, 'imagePreloadFailure');
      }
      resolve({ status: status, image: image });
    }

    image.onload = function () { finish('loaded'); };
    image.onerror = function () { finish('failed'); };
    image.crossOrigin = 'anonymous';
    image.src = imageUrl;
    timer = setTimeout(function () { finish('timeout'); }, Math.max(1, Number(timeoutMs) || DIRECT_IMAGE_PRELOAD_TIMEOUT_MS));
  });
}

function startBase64ImagePreparation(fileId, shouldHandle, performanceRecord) {
  markScenePerformanceRecord(performanceRecord, 'imagePreparationStart');
  return new Promise(function (resolve) {
    var canHandle = typeof shouldHandle === 'function' ? shouldHandle : function () { return true; };
    loadBase64ImageForScene(fileId, function (imageUrl) {
      if (!canHandle()) return;
      markScenePerformanceRecord(performanceRecord, 'imagePreparationComplete');
      resolve({ status: 'loaded', imageUrl: imageUrl });
    }, function (message) {
      if (!canHandle()) return;
      markScenePerformanceRecord(performanceRecord, 'imagePreparationFailure');
      resolve({ status: 'failed', message: message || '' });
    });
  });
}

function startHotspotPreparation(fileId, northFileId, shouldHandle, performanceRecord) {
  markScenePerformanceRecord(performanceRecord, 'hotspotsStart');
  return new Promise(function (resolve) {
    var canHandle = typeof shouldHandle === 'function' ? shouldHandle : function () { return true; };
    loadHotspotsCached(fileId, function (result, source) {
      if (!canHandle()) return;
      if (performanceRecord) performanceRecord.hotspotSource = source;
      markScenePerformanceRecord(performanceRecord, 'hotspotsEnd');
      resolve({
        status: 'loaded',
        hotspots: result.hotspots || [],
        northOffset: result && typeof result.northOffset === 'number' ? result.northOffset : null
      });
    }, function () {
      if (!canHandle()) return;
      markScenePerformanceRecord(performanceRecord, 'hotspotsEnd');
      resolve({ status: 'failed', hotspots: [], northOffset: null });
    }, northFileId, shouldHandle);
  });
}

function fallbackToBase64(fileId, onSuccess, onFailure) {
  var requestedQuality = imageQualityMode;
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.success && res.imageUrl) {
        if (scenePerformanceEnabled) console.info('[image-delivery]', JSON.stringify({
          requestedQuality: requestedQuality,
          servedQuality: res.quality === 'fast' || res.quality === 'original' ? res.quality : 'unknown',
          characters: res.imageUrl.length
        }));
        onSuccess(res.imageUrl);
      } else {
        onFailure((res && res.error) || 'Base64画像を取得できませんでした。');
      }
    })
    .withFailureHandler(function () {
      onFailure('Base64画像の取得中に通信エラーが発生しました。');
    })
    .getImageDataUri(fileId, 'public', requestedQuality);
}

function loadBase64ImageForScene(fileId, onSuccess, onFailure) {
  var key = String(fileId || '') + ':' + imageQualityMode;
  var now = Date.now();
  base64ImageCache.forEach(function (entry, entryKey) {
    if (entry.expiresAt <= now) base64ImageCache.delete(entryKey);
  });
  var cached = base64ImageCache.get(key);
  if (cached) {
    base64ImageCache.delete(key);
    base64ImageCache.set(key, cached);
    onSuccess(cached.imageUrl);
    return;
  }
  var pending = base64ImageRequests.get(key);
  if (pending) {
    pending.push({ success: onSuccess, failure: onFailure });
    return;
  }
  pending = [{ success: onSuccess, failure: onFailure }];
  base64ImageRequests.set(key, pending);
  function finish(imageUrl, error) {
    // 一覧更新後に到着した旧通信は新しいキャッシュや通信を上書きしない。
    if (base64ImageRequests.get(key) === pending) {
      base64ImageRequests.delete(key);
      if (imageUrl && imageUrl.length <= BASE64_IMAGE_CACHE_MAX_CHARS) {
        base64ImageCache.set(key, { imageUrl: imageUrl, expiresAt: Date.now() + BASE64_IMAGE_CACHE_TTL_MS });
        var totalChars = 0;
        base64ImageCache.forEach(function (entry) { totalChars += entry.imageUrl.length; });
        while (base64ImageCache.size > BASE64_IMAGE_CACHE_MAX_ENTRIES || totalChars > BASE64_IMAGE_CACHE_MAX_CHARS) {
          var oldestKey = base64ImageCache.keys().next().value;
          totalChars -= base64ImageCache.get(oldestKey).imageUrl.length;
          base64ImageCache.delete(oldestKey);
        }
      }
    }
    pending.forEach(function (callback) {
      if (imageUrl) callback.success(imageUrl);
      else callback.failure(error);
    });
  }
  fallbackToBase64(fileId, function (imageUrl) { finish(imageUrl, null); }, function (error) { finish(null, error); });
}

function getSceneDeliveryMode(fileId) {
  if (deliveryMode !== 'auto') return deliveryMode;
  var key = String(fileId || '') + ':' + imageQualityMode;
  var cached = base64ImageCache.get(key);
  return (cached && cached.expiresAt > Date.now()) || base64ImageRequests.has(key) ? 'base64' : 'auto';
}

function scheduleSceneImagePrefetch(fileId) {
  clearTimeout(scenePrefetchTimer);
  var generation = ++scenePrefetchGeneration;
  scenePrefetchTimer = setTimeout(function () {
    if (generation !== scenePrefetchGeneration || scenePrefetchActive || isSwitching ||
        !fileId || fileId === currentFileId || isEditMode || imageQualityMode !== 'fast') return;
    var connection = navigator.connection;
    if (connection && (connection.saveData || /(^|-)2g$/.test(connection.effectiveType || ''))) return;
    scenePrefetchActive = true;
    var pending = isPublicViewingMode() && !isEditMode ? 2 : 1;
    function finish() { if (--pending === 0) scenePrefetchActive = false; }
    if (pending === 2) loadHotspotsCached(fileId, finish, finish, fileId);
    if (deliveryMode === 'base64') {
      loadBase64ImageForScene(fileId, finish, finish);
    } else {
      // Match the foreground URL / CORS mode. A speculative read must not switch auto to Base64.
      var scene = (allImages || []).filter(function (item) { return item.id === fileId; })[0] || { id: fileId };
      preloadSceneImage(getDirectImageUrl(scene), null, null, 3000).then(finish, finish);
    }
  }, 180);
}

function clearBase64ImageCache() {
  base64ImageCache.clear();
  base64ImageRequests.clear();
  sceneThumbnailCache.clear();
  scenePrefetchGeneration++;
  clearTimeout(scenePrefetchTimer);
}

function getHotspotCacheKey(fileId) {
  return String(fileId || '');
}

function cloneHotspotResult(result) {
  try {
    return JSON.parse(JSON.stringify(result || { hotspots: [], northOffset: null }));
  } catch (e) {
    return { hotspots: [], northOffset: null };
  }
}

function normalizeHotspotResult(res) {
  return {
    hotspots: (res && res.hotspots) ? res.hotspots : (Array.isArray(res) ? res : []),
    northOffset: (res && typeof res.northOffset === 'number') ? res.northOffset : null
  };
}

function clearHotspotCache(fileId) {
  if (typeof fileId === 'undefined') {
    hotspotCacheByFileId = {};
    hotspotCacheExpiresByFileId = {};
    hotspotRequestsByFileId = {};
    return;
  }
  var key = getHotspotCacheKey(fileId);
  delete hotspotCacheByFileId[key];
  delete hotspotCacheExpiresByFileId[key];
  delete hotspotRequestsByFileId[key];
}

function loadHotspotsCached(fileId, onSuccess, onFailure, northFileId, shouldHandle) {
  var hotspotFileId = String(fileId || '');
  northFileId = String(northFileId || hotspotFileId);
  var canHandle = typeof shouldHandle === 'function' ? shouldHandle : function () { return true; };
  var cacheKey = getHotspotCacheKey(northFileId || hotspotFileId);
  var useCache = isPublicViewingMode() && !isEditMode;
  var cacheTarget = hotspotCacheByFileId;
  if (useCache && hotspotCacheByFileId[cacheKey] && hotspotCacheExpiresByFileId[cacheKey] > Date.now()) {
    var cachedResult = cloneHotspotResult(hotspotCacheByFileId[cacheKey]);
    setTimeout(function () {
      if (!canHandle()) return;
      onSuccess(cachedResult, 'cache');
    }, 0);
    return;
  }

  var listener = { success: onSuccess, failure: onFailure, canHandle: canHandle, source: 'network' };
  var pending = useCache && hotspotRequestsByFileId[cacheKey];
  if (pending && pending.hotspotFileId === hotspotFileId) {
    listener.source = 'pending';
    pending.listeners.push(listener);
    return;
  }
  pending = { hotspotFileId: hotspotFileId, listeners: [listener] };
  if (useCache) hotspotRequestsByFileId[cacheKey] = pending;
  var timer = setTimeout(function () { finish(null); }, 30000);

  function finish(result) {
    if (pending.settled) return;
    pending.settled = true;
    clearTimeout(timer);
    if (useCache && hotspotRequestsByFileId[cacheKey] === pending) {
      delete hotspotRequestsByFileId[cacheKey];
      if (result && cacheTarget === hotspotCacheByFileId && !isEditMode) {
        delete hotspotCacheByFileId[cacheKey];
        hotspotCacheByFileId[cacheKey] = cloneHotspotResult(result);
        hotspotCacheExpiresByFileId[cacheKey] = Date.now() + HOTSPOT_CACHE_TTL_MS;
        var keys = Object.keys(hotspotCacheByFileId);
        while (keys.length > HOTSPOT_CACHE_MAX_ENTRIES) {
          var oldest = keys.shift();
          delete hotspotCacheByFileId[oldest];
          delete hotspotCacheExpiresByFileId[oldest];
        }
      }
    }
    pending.listeners.forEach(function (entry) {
      if (!entry.canHandle()) return;
      if (result) entry.success(cloneHotspotResult(result), entry.source);
      else if (typeof entry.failure === 'function') entry.failure();
    });
  }

  var request = northFileId && northFileId !== hotspotFileId
    ? { fileId: northFileId, hotspotFileId: hotspotFileId }
    : hotspotFileId;

  google.script.run
    .withSuccessHandler(function (res) {
      finish(normalizeHotspotResult(res));
    })
    .withFailureHandler(function () {
      finish(null);
    })
    .loadHotspots(request);
}

/** Prepare only lightweight scene metadata, with one background RPC across folder changes. */
function startSceneMetadataPrefetchQueue(images) {
  var generation = ++sceneMetadataPrefetchGeneration;
  clearTimeout(sceneMetadataPrefetchTimer);
  sceneMetadataPrefetchResume = null;
  if (!sceneMetadataPrefetchEnabled || !isPublicViewingMode() || isEditMode) return;
  var candidates = (images || []).filter(function (item) { return item && item.id && item.type !== 'folder'; }).slice(0, 20);
  var next = 0;
  sceneMetadataPrefetchResume = schedule;
  function schedule() {
    if (generation !== sceneMetadataPrefetchGeneration) return;
    clearTimeout(sceneMetadataPrefetchTimer);
    sceneMetadataPrefetchTimer = setTimeout(pump, 350);
  }
  function pump() {
    if (generation !== sceneMetadataPrefetchGeneration || !sceneMetadataPrefetchEnabled || !isPublicViewingMode() || isEditMode) return;
    var connection = navigator.connection;
    if (connection && (connection.saveData || /(^|-)2g$/.test(connection.effectiveType || ''))) return;
    if (isSwitching || !sceneDisplayReady || document.hidden || sceneMetadataPrefetchActive) { schedule(); return; }
    while (next < candidates.length) {
      var index = next++, id = candidates[index].id;
      if (id === currentFileId || (hotspotCacheByFileId[id] && hotspotCacheExpiresByFileId[id] > Date.now())) continue;
      sceneMetadataPrefetchActive++;
      var started = Date.now();
      function finish(success) {
        sceneMetadataPrefetchActive--;
        if (generation === sceneMetadataPrefetchGeneration && scenePerformanceEnabled) {
          console.info('[metadata-prefetch]', JSON.stringify({ index: index, success: success, duration: Date.now() - started }));
        }
        if (sceneMetadataPrefetchResume) sceneMetadataPrefetchResume();
      }
      loadHotspotsCached(id, function () { finish(true); }, function () { finish(false); }, id);
      return;
    }
  }
  schedule();
}

/**
 * ホットスポットのジャンプ先シーン画像を先読み（プリロード）してブラウザキャッシュに乗せる。
 * @param {Array} hotspots ホットスポット配列
 */
function preloadJumpScenes(hotspots) {
  if (!Array.isArray(hotspots)) return;
  hotspots.forEach(function (hs) {
    var sceneId = hs.jumpSceneId;
    if (!sceneId || preloadedScenes.has(sceneId)) return;
    preloadedScenes.add(sceneId);
    var url = 'https://lh3.googleusercontent.com/d/' + sceneId + getQualitySuffix();
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = url;
  });
}

/**
 * 指定した画像シーンを読み込む。
 * viewer を破棄して再生成し、その画像専用のホットスポットを取得する。
 *
 * @param {{ id:string, name:string, imageUrl:string }} imgData
 * @param {number=} preferredYaw
 * @param {number=} preferredPitch
 */
function loadScene(imgData, preferredYaw, preferredPitch) {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('load-scene')) return false;
  if (hotspotMoveState.active && hotspotMoveState.saving) {
    showToast('ホットスポットの移動を保存中です。完了までシーンを切り替えられません。', 'error');
    return false;
  }
  var sceneStartedAt = scenePerformanceNow_();
  var sceneDeliveryMode = getSceneDeliveryMode(imgData.id);
  closeQuizModal({ restoreFocus: false });
  closePhotoLightbox({ restoreFocus: false });
  stopGyroIfActive('load-scene');
  cancelHotspotMove('シーンが変更されたため移動をキャンセルしました。', { silent: true });
  closePopup();
  closeActiveInfoPopup({ restoreFocus: false });
  clearHotspotAudioCache();
  var loadGeneration = ++sceneLoadGeneration;
  isSwitching   = true;
  currentFileId = imgData.id;
  var sceneIs2D = getExplicitSceneType(imgData) === '2D';
  var performanceRecord = createScenePerformanceRecord(
    loadGeneration,
    sceneIs2D ? '2D' : '360',
    sceneStartedAt
  );

  function isCurrentLoad() {
    return isSwitching && isCurrentSceneLoadRequest(loadGeneration, imgData.id);
  }

  // 暗転オーバーレイをパノラマ領域に合わせて表示（フェードアウト開始）
  var _transOverlay = document.getElementById('scene-transition-overlay');
  if (_transOverlay) {
    var _tSidebar = document.getElementById('scene-sidebar');
    var _tHasSidebar = _tSidebar &&
                       !_tSidebar.classList.contains('hidden') &&
                       !sidebarCollapsed &&
                       window.innerWidth > 600;
    _transOverlay.style.left = _tHasSidebar ? 'var(--scene-sidebar-width)' : '0';
    _transOverlay.classList.add('active');
  }

  // ホバーツールチップ・情報ポップアップを閉じる
  hideJumpTooltip();

  // ローディング表示（写真エリアのみカバー）
  showSceneLoading();

  // アクティブ状態を更新
  syncActiveSceneItem(imgData.id);
  closeSceneContextMenu();

  // 既存ビューアを破棄
  if (viewer) {
    clearInterval(loadPollInterval);
    try { viewer.destroy(); } catch (e) { /* ignore */ }
    viewer = null;
  }

  // scenes の明示種別を優先し、旧データだけファイル名へフォールバック
  is2DMode = sceneIs2D;
  syncSceneActionButtons();

  // GASコールが返ってこない場合のタイムアウト（30秒）
  var sceneLoadTimer = setTimeout(function () {
    if (isCurrentLoad() && isSwitching) {
      isSwitching = false;
      finishScenePerformanceRecord(performanceRecord, 'timeout');
      showLoadError('画像の読み込みがタイムアウトしました。再度お試しください。');
    }
  }, 30000);

  var directImageUrl = getDirectImageUrl(imgData);
  var autoFallbackController = null;
  var pannellumSession = null;
  if (sceneDeliveryMode === 'auto') {
    autoFallbackController = createAutoFallbackController(
      isCurrentLoad,
      performanceRecord,
      beginBase64Fallback,
      sceneStartedAt
    );
  }
  var hotspotPreparation = startHotspotPreparation(imgData.id, imgData.id, isCurrentLoad, performanceRecord);
  var directImagePreparation = null;
  var base64Preparation = null;
  if (sceneDeliveryMode === 'base64') {
    base64Preparation = startBase64ImagePreparation(imgData.id, isCurrentLoad, performanceRecord);
  } else {
    directImagePreparation = preloadSceneImage(
      directImageUrl,
      isCurrentLoad,
      performanceRecord,
      autoFallbackController ? autoFallbackController.getRemainingMs() : DIRECT_IMAGE_PRELOAD_TIMEOUT_MS
    );
  }
  if (autoFallbackController && directImagePreparation) {
    directImagePreparation.then(function (preparedImage) {
      if (!isCurrentLoad() || autoFallbackController.hasFallbackStarted()) return;
      if (!preparedImage || preparedImage.status === 'loaded') return;
      autoFallbackController.startFallback(
        preparedImage.status === 'timeout'
          ? 'preload-timeout'
          : 'preload-failed'
      );
    });
  }
  hotspotPreparation.then(function (prepared) {
    if (!isCurrentLoad()) return;
    setTimeout(function () {
      if (isCurrentLoad()) preloadJumpScenes(prepared.hotspots || []);
    }, 0);
  });

  function clearSceneTransitionOverlay() {
    var ov = document.getElementById('scene-transition-overlay');
    if (ov) ov.classList.remove('active');
  }

  function finishSceneDisplay() {
    if (!isCurrentLoad()) return;
    clearTimeout(sceneLoadTimer);
    if (autoFallbackController) autoFallbackController.cancel();
    isSwitching = false;
    finishScenePerformanceRecord(performanceRecord, 'loaded');
  }

  function showDeliveryError(message) {
    if (!isCurrentLoad()) return;
    clearTimeout(sceneLoadTimer);
    if (autoFallbackController) autoFallbackController.cancel();
    isSwitching = false;
    finishScenePerformanceRecord(performanceRecord, 'error');
    clearSceneTransitionOverlay();
    showLoadError(message, sceneDeliveryMode === 'direct' ? function () {
      deliveryMode = 'base64';
      loadScene(imgData, preferredYaw, preferredPitch);
    } : null);
  }

  function beginBase64Fallback() {
    if (!isCurrentLoad() || !autoFallbackController || !autoFallbackController.hasFallbackStarted()) return;
    showSceneLoading();
    var fallbackImagePreparation = startBase64ImagePreparation(imgData.id, isCurrentLoad, performanceRecord);
    Promise.all([hotspotPreparation, fallbackImagePreparation]).then(function (prepared) {
      if (!isCurrentLoad() || autoFallbackController.hasDirectDisplaySucceeded()) return;
      if (prepared[1].status !== 'loaded') {
        showDeliveryError('直リンクで画像を読み込めず、Base64 fallbackも取得できませんでした。Driveの共有設定を確認してください。');
        return;
      }
      displayPreparedImage(prepared[1].imageUrl, prepared[0], 'fallback', function () {
        showDeliveryError('直リンクとBase64 fallbackの両方で画像を読み込めませんでした。Driveの共有設定を確認してください。');
      });
    });
  }

  /**
   * 取得した imageUrl・hotspots・northOffset でビューアを起動するヘルパー
   * @param {string} imageUrl
   * @param {Array}  spots
   * @param {number|null} northOffset
   */
  function startViewer(imageUrl, spots, northOffset, initialYaw, initialPitch, imageRoute, onDisplayError) {
    var isDirectAttempt = imageRoute === 'direct';
    function isCurrentImageAttempt() {
      return isCurrentLoad() && !(
        autoFallbackController && autoFallbackController.hasFallbackStarted() && isDirectAttempt
      );
    }
    if (!isCurrentImageAttempt() && isDirectAttempt) return;
    if (!isCurrentLoad()) return;
    spots = spots || [];
    var isAutoDirectImage = !!autoFallbackController && isDirectAttempt && !autoFallbackController.hasFallbackStarted();
    var canReusePannellum = !sceneIs2D && pannellumSession && viewer === pannellumSession.viewer;
    if (viewer && !canReusePannellum) {
      clearInterval(loadPollInterval);
      try { viewer.destroy(); } catch (e) { /* ignore */ }
      viewer = null;
    }
    if (isAutoDirectImage) autoFallbackController.markDirectDisplayStart();

    function handleDisplayError() {
      if (!isCurrentImageAttempt()) return;
      if (typeof onDisplayError === 'function') {
        onDisplayError();
      } else {
        showDeliveryError('画像の読み込みに失敗しました。Driveの共有設定またはURLを確認してください。');
      }
    }

    function handleDisplayLoaded() {
      if (!isCurrentImageAttempt()) return;
      if (isAutoDirectImage) autoFallbackController.markDirectDisplaySucceeded();
