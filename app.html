    settled = true;
    cleanup();
    if (fullscreenEntryPromise === trackedPromise) fullscreenEntryPromise = null;
    if (
      !success &&
      allowFallback &&
      requestGeneration === fullscreenRequestGeneration &&
      !isEditMode &&
      !editModeFullscreenExitPending &&
      sceneDisplayReady
    ) {
      openInNewTab_();
    }
    resolveTracker(!!success);
  }

  function onFullscreenChange() {
    if (getNativeFullscreenElement_()) finish(true, false);
  }

  events.forEach(function (eventName) {
    document.addEventListener(eventName, onFullscreenChange);
  });

  try {
    // Promiseを返す実装でも未解決のままになる場合があるため、常に上限を設ける。
    timeoutId = setTimeout(function () {
      var entered = !!getNativeFullscreenElement_();
      finish(entered, !entered);
    }, FULLSCREEN_REQUEST_SETTLE_TIMEOUT_MS);
    var requestResult = requestFS.call(doc);
    if (requestResult && typeof requestResult.then === 'function') {
      Promise.resolve(requestResult).then(function () {
        finish(true, false);
      }, function () {
        finish(false, true);
      });
    }
  } catch (error) {
    finish(false, true);
  }

  return trackedPromise;
}

function toggleFullscreen() {
  if (isEditMode || editModeFullscreenExitPending || !sceneDisplayReady || fullscreenEntryPromise) return false;
  stopGyroIfActive('fullscreen');
  // すでにCSS全画面状態（古いフォールバック）なら解除
  if (isCssFullscreen) {
    exitCssFullscreen_();
    return;
  }

  var doc = document.documentElement;
  var requestFS = doc.requestFullscreen || doc.webkitRequestFullscreen || doc.mozRequestFullScreen || doc.msRequestFullscreen;
  var isFS = getNativeFullscreenElement_();

  if (!isFS) {
    if (requestFS) {
      // 1. まずはネイティブ全画面を試み、連打や編集遷移と競合しないよう単一要求として追跡する
      beginFullscreenRequest_(requestFS, doc);
    } else {
      // API自体が存在しない古いブラウザ等でも別タブへ
      openInNewTab_();
    }
  } else {
    // 全画面解除
    var exitFS = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if (exitFS) {
      exitFS.call(document);
    }
  }
  return true;
}

// 別タブで開き直す処理
function openInNewTab_() {
  if (isEditMode || editModeFullscreenExitPending || !sceneDisplayReady) return false;
  var targetUrl = appBaseUrl || window.location.href;
  if (appMode && targetUrl.indexOf('mode=') === -1) {
    var separator = targetUrl.indexOf('?') !== -1 ? '&' : '?';
    targetUrl += separator + 'mode=' + appMode;
  }
  window.open(targetUrl, '_blank', 'noopener,noreferrer');
  return true;
}

function enterCssFullscreen_() {
  if (isEditMode || editModeFullscreenExitPending || !sceneDisplayReady) return false;
  isCssFullscreen = true;
  document.body.classList.add('is-fullscreen', 'css-fullscreen');
  updateFullscreenIcon_(true);
  return true;
}

function exitCssFullscreen_() {
  isCssFullscreen = false;
  document.body.classList.remove('is-fullscreen', 'css-fullscreen');
  updateFullscreenIcon_(false);
}

/** ネイティブ／CSS全画面を終了し、終了確認後に true を返す。 */
function exitFullscreenBeforeEdit_() {
  if (isCssFullscreen) exitCssFullscreen_();

  if (fullscreenEntryPromise) {
    return fullscreenEntryPromise.then(function () {
      return exitFullscreenBeforeEdit_();
    });
  }

  if (!getNativeFullscreenElement_()) return Promise.resolve(true);
  var exitFS = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
  if (!exitFS) return Promise.resolve(false);

  return new Promise(function (resolve) {
    var settled = false;
    var timeoutId = null;
    var events = ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'];

    function cleanup() {
      if (timeoutId) clearTimeout(timeoutId);
      events.forEach(function (eventName) {
        document.removeEventListener(eventName, onFullscreenChange);
      });
    }

    function finish(success) {
      if (settled) return;
      settled = true;
      cleanup();
      resolve(!!success);
    }

    function onFullscreenChange() {
      if (!getNativeFullscreenElement_()) finish(true);
    }

    events.forEach(function (eventName) {
      document.addEventListener(eventName, onFullscreenChange);
    });
    timeoutId = setTimeout(function () {
      finish(!getNativeFullscreenElement_());
    }, 1200);

    try {
      var result = exitFS.call(document);
      if (result && typeof result.then === 'function') {
        result.then(function () {
          finish(!getNativeFullscreenElement_());
        }, function () {
          finish(false);
        });
      } else if (!getNativeFullscreenElement_()) {
        finish(true);
      }
    } catch (error) {
      finish(false);
    }
  });
}

function updateFullscreenIcon_(isFullscreen) {
  var icon = document.getElementById('fullscreen-icon');
  var btn = document.getElementById('fullscreen-btn');
  if (isFullscreen) {
    icon.innerHTML =
      '<polyline points="4 14 10 14 10 20"/>' +
      '<polyline points="20 10 14 10 14 4"/>' +
      '<line x1="10" y1="14" x2="3" y2="21"/>' +
      '<line x1="21" y1="3" x2="14" y2="10"/>';
    btn.title = '全画面を終了';
    btn.setAttribute('aria-label', '全画面を終了');
  } else {
    icon.innerHTML =
      '<polyline points="15 3 21 3 21 9"/>' +
      '<polyline points="9 21 3 21 3 15"/>' +
      '<line x1="21" y1="3" x2="14" y2="10"/>' +
      '<line x1="3" y1="21" x2="10" y2="14"/>';
    btn.title = '全画面表示';
    btn.setAttribute('aria-label', '全画面表示');
  }
}

// 全画面状態変化でアイコンを切り替える
['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function(evtName) {
  document.addEventListener(evtName, function () {
    var isFullscreen = !!getNativeFullscreenElement_();
    if (isEditMode && isFullscreen) {
      exitFullscreenBeforeEdit_();
      return;
    }
    document.body.classList.toggle('is-fullscreen', isFullscreen);
    updateFullscreenIcon_(isFullscreen);
  });
});

function normalizeMarkerShape(value) {
  var normalized = String(value || '').trim().toLowerCase();
  return MARKER_SHAPE_LABELS[normalized] ? normalized : DEFAULT_MARKER_SHAPE;
}

function normalizeMarkerColor(value) {
  var normalized = String(value || '').trim().toLowerCase();
  return MARKER_COLOR_LABELS[normalized] ? normalized : DEFAULT_MARKER_COLOR;
}

function normalizeMarkerIcon(value) {
  var normalized = String(value || '').trim().toLowerCase();
  return SUPPORTED_MARKER_ICONS.indexOf(normalized) >= 0 ? normalized : DEFAULT_MARKER_ICON;
}

function normalizeSelectableMarkerIcon(value) {
  var normalized = normalizeMarkerIcon(value);
  return SELECTABLE_MARKER_ICONS.indexOf(normalized) >= 0 ? normalized : DEFAULT_MARKER_ICON;
}

function setMarkerIconSelectValue(icon, allowLegacy) {
  var iconInput = document.getElementById('marker-icon');
  var legacyGroup = document.getElementById('marker-icon-legacy-group');
  if (!iconInput) return DEFAULT_MARKER_ICON;

  if (legacyGroup) {
    while (legacyGroup.firstChild) legacyGroup.removeChild(legacyGroup.firstChild);
    legacyGroup.hidden = true;
  }

  var normalized = normalizeMarkerIcon(icon);
  if (allowLegacy && LEGACY_MARKER_ICONS.indexOf(normalized) >= 0 && legacyGroup) {
    var option = document.createElement('option');
    option.value = normalized;
    option.textContent = MARKER_ICON_LABELS[normalized] + '（旧アイコン）';
    legacyGroup.appendChild(option);
    legacyGroup.hidden = false;
    iconInput.value = normalized;
    return normalized;
  }

  normalized = normalizeSelectableMarkerIcon(normalized);
  iconInput.value = normalized;
  return normalized;
}

function removeMarkerClassesByPrefix(target, prefix) {
  if (!target || !target.classList) return;
  Array.from(target.classList).forEach(function (className) {
    if (className.indexOf(prefix) === 0) target.classList.remove(className);
  });
}

function createMarkerIconSvg(icon) {
  var normalizedIcon = normalizeMarkerIcon(icon);
  return '<svg class="marker-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
    MARKER_ICON_SVGS[normalizedIcon] + '</svg>';
}

function applyMarkerClasses(target, shape, color) {
  if (!target) return;
  var normalizedShape = normalizeMarkerShape(shape);
  var normalizedColor = normalizeMarkerColor(color);
  removeMarkerClassesByPrefix(target, 'marker-shape-');
  removeMarkerClassesByPrefix(target, 'marker-color-');
  target.classList.add('marker-shape-' + normalizedShape, 'marker-color-' + normalizedColor);
}

function applyMarkerIconClass(target, icon) {
  if (!target) return;
  var normalizedIcon = normalizeMarkerIcon(icon);
  removeMarkerClassesByPrefix(target, 'marker-icon-');
  target.classList.add('marker-icon-' + normalizedIcon);
  target.innerHTML = createMarkerIconSvg(normalizedIcon);
}

function renderMarkerAppearance(container, shape, color, icon) {
  if (!container) return null;
  container.textContent = '';
  applyMarkerClasses(container, shape, color);
  var core = document.createElement('span');
  core.className = 'hs-marker-core';
  applyMarkerIconClass(core, icon);
  container.appendChild(core);
  return core;
}

function createStandaloneMarkerElement(args) {
  var marker = document.createElement('div');
  marker.className = 'hs-marker';
  renderMarkerAppearance(
    marker,
    args && args.markerShape,
    args && args.markerColor,
    args && args.markerIcon
  );
  return marker;
}

function getHotspotDraftAppearance() {
  return {
    markerShape: normalizeMarkerShape(document.getElementById('marker-shape').value),
    markerColor: normalizeMarkerColor(document.getElementById('marker-color').value),
    markerIcon: normalizeMarkerIcon(document.getElementById('marker-icon').value)
  };
}

function buildHotspotDraftMarkerElement(container, args) {
  renderMarkerAppearance(container, args.markerShape, args.markerColor, args.markerIcon);
  container.classList.add('hs-marker-draft');
  container.style.pointerEvents = 'none';
  hotspotDraftState.draftElement = container;
}

function renderHotspotDraftAtCoordinates() {
  if (!hotspotDraftState.active || !hotspotDraftState.coordinates) return false;
  var coordinates = hotspotDraftState.coordinates;
  var appearance = getHotspotDraftAppearance();

  if (hotspotDraftState.mode2D) {
    var inner = document.getElementById('flat-map-inner');
    if (!inner) return false;
    var positioner = hotspotDraftState.draftElement && hotspotDraftState.draftElement.parentNode;
    if (!positioner || !positioner.classList || !positioner.classList.contains('flat-hs-draft')) {
      positioner = document.createElement('div');
      positioner.className = 'flat-hs-marker flat-hs-draft';
      positioner.style.pointerEvents = 'none';
      var marker = createStandaloneMarkerElement(appearance);
      marker.classList.add('hs-marker-draft');
      marker.style.pointerEvents = 'none';
      positioner.appendChild(marker);
      inner.appendChild(positioner);
      hotspotDraftState.draftElement = marker;
    }
    positioner.style.left = coordinates.yaw + '%';
    positioner.style.top = coordinates.pitch + '%';
    updateHotspotDraftAppearance();
    return true;
  }

  if (!viewer || typeof viewer.addHotSpot !== 'function') return false;
  if (hotspotDraftState.pannellumHotspotId && typeof viewer.removeHotSpot === 'function') {
    try { viewer.removeHotSpot(hotspotDraftState.pannellumHotspotId); } catch (e) { /* ignore */ }
  }
  hotspotDraftState.draftElement = null;
  try {
    viewer.addHotSpot({
      id: hotspotDraftState.pannellumHotspotId,
      pitch: coordinates.pitch,
      yaw: coordinates.yaw,
      type: 'custom',
      cssClass: 'hs-marker hs-marker-draft',
      createTooltipFunc: buildHotspotDraftMarkerElement,
      createTooltipArgs: appearance
    });
    return true;
  } catch (e) {
    return false;
  }
}

function updateHotspotDraftAppearance() {
  if (!hotspotDraftState.active || !hotspotDraftState.draftElement) return false;
  var appearance = getHotspotDraftAppearance();
  renderMarkerAppearance(
    hotspotDraftState.draftElement,
    appearance.markerShape,
    appearance.markerColor,
    appearance.markerIcon
  );
  hotspotDraftState.draftElement.classList.add('hs-marker-draft');
  hotspotDraftState.draftElement.style.pointerEvents = 'none';
  return true;
}

function startHotspotDraft(coordinates) {
  cleanupHotspotDraft();
  if (!coordinates || !isFinite(coordinates.pitch) || !isFinite(coordinates.yaw)) return false;
  hotspotDraftState.active = true;
  hotspotDraftState.startSceneId = String(currentFileId || '');
  hotspotDraftState.sceneType = is2DMode ? '2D' : '360';
  hotspotDraftState.coordinates = { pitch: Number(coordinates.pitch), yaw: Number(coordinates.yaw) };
  hotspotDraftState.initialCoordinates = { pitch: Number(coordinates.pitch), yaw: Number(coordinates.yaw) };
  hotspotDraftState.draftElement = null;
  hotspotDraftState.pannellumHotspotId = 'hs_draft_' + Date.now();
  hotspotDraftState.repositioning = false;
  hotspotDraftState.positionBeforeChange = null;
  hotspotDraftState.pointerPosition = null;
  hotspotDraftState.pointerDown = null;
  hotspotDraftState.rafId = null;
  hotspotDraftState.mode2D = !!is2DMode;
  hotspotDraftState.listenersAttached = false;
  pendingPitch = hotspotDraftState.coordinates.pitch;
  pendingYaw = hotspotDraftState.coordinates.yaw;
  return renderHotspotDraftAtCoordinates();
}

function setHotspotDraftCoordinates(coordinates) {
  if (!hotspotDraftState.active || !coordinates) return false;
  if (!isFinite(coordinates.pitch) || !isFinite(coordinates.yaw)) return false;
  hotspotDraftState.coordinates = {
    pitch: Number(coordinates.pitch),
    yaw: Number(coordinates.yaw)
  };
  pendingPitch = hotspotDraftState.coordinates.pitch;
  pendingYaw = hotspotDraftState.coordinates.yaw;
  return renderHotspotDraftAtCoordinates();
}

function getHotspotDraftCoordinatesFromPointer(evt) {
  if (!hotspotDraftState.active || !evt || !isFinite(evt.clientX) || !isFinite(evt.clientY)) return null;
  if (String(currentFileId || '') !== hotspotDraftState.startSceneId ||
      (is2DMode ? '2D' : '360') !== hotspotDraftState.sceneType) {
    handleUnexpectedHotspotSceneChange();
    return null;
  }
  if (hotspotDraftState.mode2D) {
    return get2DHotspotCoordinates(
      evt.clientX,
      evt.clientY,
      document.getElementById('flat-map-img')
    );
  }
  var panorama = document.getElementById('panorama');
  if (!panorama || !isPointInsideRect(evt.clientX, evt.clientY, panorama.getBoundingClientRect())) return null;
  if (shouldIgnorePanoramaPointer(evt)) return null;
  try {
    var converted = viewer.mouseEventToCoords(evt);
    var coordinates = { pitch: Number(converted[0]), yaw: Number(converted[1]) };
    return isFinite(coordinates.pitch) && isFinite(coordinates.yaw) ? coordinates : null;
  } catch (e) {
    return null;
  }
}

function renderHotspotDraftFromPointer() {
  if (!hotspotDraftState.active || !hotspotDraftState.repositioning || !hotspotDraftState.pointerPosition) return;
  var coordinates = getHotspotDraftCoordinatesFromPointer(hotspotDraftState.pointerPosition);
  if (coordinates) setHotspotDraftCoordinates(coordinates);
}

function scheduleHotspotDraftRender() {
  if (!hotspotDraftState.active || !hotspotDraftState.repositioning) return;
  if (hotspotDraftState.rafId !== null) return;
  hotspotDraftState.rafId = requestAnimationFrame(function () {
    hotspotDraftState.rafId = null;
    renderHotspotDraftFromPointer();
  });
}

function attachHotspotDraftListeners() {
  if (hotspotDraftState.listenersAttached) return;
  document.addEventListener('pointerdown', onHotspotDraftPointerDown, true);
  document.addEventListener('pointermove', onHotspotDraftPointerMove, { passive: true, capture: true });
  document.addEventListener('pointerup', onHotspotDraftPointerUp, true);
  document.addEventListener('pointercancel', onHotspotDraftPointerCancel, true);
  hotspotDraftState.listenersAttached = true;
}

function detachHotspotDraftListeners() {
  if (!hotspotDraftState.listenersAttached) return;
  document.removeEventListener('pointerdown', onHotspotDraftPointerDown, true);
  document.removeEventListener('pointermove', onHotspotDraftPointerMove, true);
  document.removeEventListener('pointerup', onHotspotDraftPointerUp, true);
  document.removeEventListener('pointercancel', onHotspotDraftPointerCancel, true);
  hotspotDraftState.listenersAttached = false;
}

function isHotspotDraftPointerDrag(start, evt) {
  if (!start || !evt) return false;
  var dx = evt.clientX - start.clientX;
  var dy = evt.clientY - start.clientY;
  return dx * dx + dy * dy > EDIT_MODE_DRAG_THRESHOLD_PX * EDIT_MODE_DRAG_THRESHOLD_PX;
}

function onHotspotDraftPointerDown(evt) {
  if (!hotspotDraftState.active || !hotspotDraftState.repositioning) return;
  if (evt.button != null && evt.button !== 0) return;
  var coordinates = getHotspotDraftCoordinatesFromPointer(evt);
  if (!coordinates) return;
  hotspotDraftState.pointerDown = {
    pointerId: evt.pointerId,
    clientX: evt.clientX,
    clientY: evt.clientY
  };
  hotspotDraftState.pointerPosition = { clientX: evt.clientX, clientY: evt.clientY };
  setHotspotDraftCoordinates(coordinates);
}

function onHotspotDraftPointerMove(evt) {
  if (!hotspotDraftState.active || !hotspotDraftState.repositioning) return;
  if (!isFinite(evt.clientX) || !isFinite(evt.clientY)) return;
  hotspotDraftState.pointerPosition = { clientX: evt.clientX, clientY: evt.clientY };
  scheduleHotspotDraftRender();
}

function onHotspotDraftPointerUp(evt) {
  if (!hotspotDraftState.active || !hotspotDraftState.repositioning) return;
  var start = hotspotDraftState.pointerDown;
  if (!start) return;
  if (start.pointerId != null && evt.pointerId != null && start.pointerId !== evt.pointerId) return;
  hotspotDraftState.pointerDown = null;
  var coordinates = getHotspotDraftCoordinatesFromPointer(evt);
  if (coordinates) setHotspotDraftCoordinates(coordinates);
  if (isHotspotDraftPointerDrag(start, evt)) {
    suppressHotspotMoveFollowupClick();
    return;
  }
  if (!coordinates) return;
  suppressHotspotMoveFollowupClick();
  finishHotspotDraftReposition();
}

function onHotspotDraftPointerCancel() {
  cancelHotspotDraftReposition();
}

function updateHotspotDraftPositionStatus(message) {
  var status = document.getElementById('hs-position-status');
  if (status) status.textContent = message || '';
}

function startHotspotDraftReposition() {
  if (!hotspotDraftState.active || editingHotspot) return false;
  if (hotspotDraftState.repositioning) return true;
  hotspotDraftState.positionBeforeChange = {
    pitch: hotspotDraftState.coordinates.pitch,
    yaw: hotspotDraftState.coordinates.yaw
  };
  hotspotDraftState.repositioning = true;
  hotspotDraftState.pointerDown = null;
  hotspotDraftState.pointerPosition = null;
  document.getElementById('hotspot-popup').classList.add('is-repositioning');
  document.getElementById('hs-change-position-btn').setAttribute('aria-pressed', 'true');
  updateHotspotDraftPositionStatus('画像上で位置を選んでください。ドラッグは視点移動、Escは元の位置へ戻します。');
  attachHotspotDraftListeners();
  return true;
}

function finishHotspotDraftReposition() {
  if (!hotspotDraftState.repositioning) return false;
  hotspotDraftState.repositioning = false;
  hotspotDraftState.positionBeforeChange = null;
  hotspotDraftState.pointerDown = null;
  hotspotDraftState.pointerPosition = null;
  detachHotspotDraftListeners();
  document.getElementById('hotspot-popup').classList.remove('is-repositioning');
  document.getElementById('hs-change-position-btn').setAttribute('aria-pressed', 'false');
  updateHotspotDraftPositionStatus('新しい位置を確定しました。');
  return true;
}

function cancelHotspotDraftReposition() {
  if (!hotspotDraftState.active || !hotspotDraftState.repositioning) return false;
  var previous = hotspotDraftState.positionBeforeChange;
  hotspotDraftState.repositioning = false;
  hotspotDraftState.positionBeforeChange = null;
  hotspotDraftState.pointerDown = null;
  hotspotDraftState.pointerPosition = null;
  if (hotspotDraftState.rafId !== null) {
    cancelAnimationFrame(hotspotDraftState.rafId);
    hotspotDraftState.rafId = null;
  }
  detachHotspotDraftListeners();
  if (previous) setHotspotDraftCoordinates(previous);
  document.getElementById('hotspot-popup').classList.remove('is-repositioning');
  document.getElementById('hs-change-position-btn').setAttribute('aria-pressed', 'false');
  updateHotspotDraftPositionStatus('位置の変更を取り消しました。');
  return true;
}

function cleanupHotspotDraft() {
  if (hotspotDraftState.rafId !== null) {
    cancelAnimationFrame(hotspotDraftState.rafId);
  }
  detachHotspotDraftListeners();
  if (hotspotDraftState.mode2D) {
    var positioner = hotspotDraftState.draftElement && hotspotDraftState.draftElement.parentNode;
    if (positioner && positioner.classList && positioner.classList.contains('flat-hs-draft')) {
      positioner.remove();
    }
  } else if (hotspotDraftState.pannellumHotspotId && viewer && typeof viewer.removeHotSpot === 'function') {
    try { viewer.removeHotSpot(hotspotDraftState.pannellumHotspotId); } catch (e) { /* ignore */ }
  }
  if (hotspotDraftState.draftElement && hotspotDraftState.draftElement.parentNode) {
    hotspotDraftState.draftElement.remove();
  }
  hotspotDraftState.active = false;
  hotspotDraftState.startSceneId = '';
  hotspotDraftState.sceneType = '';
  hotspotDraftState.coordinates = null;
  hotspotDraftState.initialCoordinates = null;
  hotspotDraftState.draftElement = null;
  hotspotDraftState.pannellumHotspotId = '';
  hotspotDraftState.repositioning = false;
  hotspotDraftState.positionBeforeChange = null;
  hotspotDraftState.pointerPosition = null;
  hotspotDraftState.pointerDown = null;
  hotspotDraftState.rafId = null;
  hotspotDraftState.mode2D = false;
  hotspotDraftState.listenersAttached = false;
  var popup = document.getElementById('hotspot-popup');
  if (popup) popup.classList.remove('is-repositioning');
  var changeButton = document.getElementById('hs-change-position-btn');
  if (changeButton) changeButton.setAttribute('aria-pressed', 'false');
  updateHotspotDraftPositionStatus('');
}

function completeHotspotDraftSave() {
  cleanupHotspotDraft();
}

function createHotspotMovePreviewElement(args) {
  var positioner = document.createElement('div');
  positioner.className = 'hs-move-preview-positioner ' + (is2DMode ? 'is-2d' : 'is-360');
  positioner.style.pointerEvents = 'none';
  var marker = createStandaloneMarkerElement(args);
  marker.classList.add('hs-marker-move-preview');
  positioner.appendChild(marker);
  return positioner;
}

function clampHotspotPercent(value) {
  var number = Number(value);
  if (!isFinite(number)) return 0;
  return Math.min(100, Math.max(0, number));
}

function get2DHotspotCoordinates(clientX, clientY, image) {
  if (!image) return null;
  var rect = typeof image.getBoundingClientRect === 'function'
    ? image.getBoundingClientRect()
    : image;
  if (!rect || !(rect.width > 0) || !(rect.height > 0)) return null;
  var right = typeof rect.right === 'number' ? rect.right : rect.left + rect.width;
  var bottom = typeof rect.bottom === 'number' ? rect.bottom : rect.top + rect.height;
  if (clientX < rect.left || clientX > right || clientY < rect.top || clientY > bottom) return null;
  var yaw = clampHotspotPercent(((clientX - rect.left) / rect.width) * 100);
  var pitch = clampHotspotPercent(((clientY - rect.top) / rect.height) * 100);
  return {
    pitch: parseFloat(pitch.toFixed(4)),
    yaw: parseFloat(yaw.toFixed(4))
  };
}

function buildHotspotMoveSaveData(target, coordinates, fileId, sceneType) {
  return {
    fileId: String(fileId || ''),
    sceneType: sceneType === '2D' ? '2D' : '360',
    label: target && target.label || '',
    description: target && target.description || '',
    linkUrl: target && target.linkUrl || '',
    markerShape: target && target.markerShape || '',
    markerColor: target && target.markerColor || '',
    markerIcon: target && target.markerIcon || '',
    pitch: coordinates.pitch,
    yaw: coordinates.yaw,
    photoId: target && target.photoId || '',
    audioId: target && target.audioId || '',
    jumpSceneId: target && target.jumpSceneId || ''
  };
}

function getHotspotMovePreviewParent() {
  if (hotspotMoveState.mode2D) return document.getElementById('flat-map-inner');
  return document.body;
}

function isPointInsideRect(clientX, clientY, rect) {
  if (!rect || !(rect.width > 0) || !(rect.height > 0)) return false;
  var right = typeof rect.right === 'number' ? rect.right : rect.left + rect.width;
  var bottom = typeof rect.bottom === 'number' ? rect.bottom : rect.top + rect.height;
  return clientX >= rect.left && clientX <= right && clientY >= rect.top && clientY <= bottom;
}

function isHotspotMovePointAllowed(evt) {
  if (!evt || !isFinite(evt.clientX) || !isFinite(evt.clientY)) return false;
  if (hotspotMoveState.mode2D) {
    return !!get2DHotspotCoordinates(
      evt.clientX,
      evt.clientY,
      document.getElementById('flat-map-img')
    );
  }
  var panorama = document.getElementById('panorama');
  if (!panorama || !isPointInsideRect(evt.clientX, evt.clientY, panorama.getBoundingClientRect())) return false;
  return !shouldIgnorePanoramaPointer(evt);
}

function renderHotspotMovePreview() {
  if (!hotspotMoveState.active || !hotspotMoveState.previewElement || !hotspotMoveState.pointerPosition) return;
  var preview = hotspotMoveState.previewElement;
  var point = hotspotMoveState.pointerPosition;
  if (hotspotMoveState.mode2D) {
    var image = document.getElementById('flat-map-img');
    var inner = document.getElementById('flat-map-inner');
    var coordinates = get2DHotspotCoordinates(point.clientX, point.clientY, image);
    if (!coordinates || !inner) {
      preview.style.display = 'none';
      return;
    }
    var innerRect = inner.getBoundingClientRect();
    preview.style.display = '';
    preview.style.left = (point.clientX - innerRect.left) + 'px';
    preview.style.top = (point.clientY - innerRect.top) + 'px';
    return;
  }

  var panorama = document.getElementById('panorama');
  if (!panorama || !isPointInsideRect(point.clientX, point.clientY, panorama.getBoundingClientRect())) {
    preview.style.display = 'none';
    return;
  }
  preview.style.display = '';
  preview.style.left = point.clientX + 'px';
  preview.style.top = point.clientY + 'px';
}

function updateHotspotMovePreview(evt) {
  if (!hotspotMoveState.active || hotspotMoveState.saving || !evt) return;
  if (!isFinite(evt.clientX) || !isFinite(evt.clientY)) return;
  hotspotMoveState.pointerPosition = { clientX: evt.clientX, clientY: evt.clientY };
  scheduleHotspotMovePreviewRender();
}

function scheduleHotspotMovePreviewRender() {
  if (!hotspotMoveState.active || !hotspotMoveState.previewElement) return;
  if (hotspotMoveState.rafId !== null) return;
  hotspotMoveState.rafId = requestAnimationFrame(function () {
    hotspotMoveState.rafId = null;
    renderHotspotMovePreview();
  });
}

function attachHotspotMoveListeners() {
  if (hotspotMoveState.listenersAttached) return;
  document.addEventListener('pointerdown', onHotspotMovePointerDown);
  document.addEventListener('pointermove', onHotspotMovePointerMove, { passive: true });
  document.addEventListener('pointerup', onHotspotMovePointerUp);
  document.addEventListener('pointercancel', onHotspotMovePointerCancel);
  window.addEventListener('resize', scheduleHotspotMovePreviewRender);
  window.addEventListener('scroll', scheduleHotspotMovePreviewRender, true);
  hotspotMoveState.listenersAttached = true;
}

function detachHotspotMoveListeners() {
  if (!hotspotMoveState.listenersAttached) return;
  document.removeEventListener('pointerdown', onHotspotMovePointerDown);
  document.removeEventListener('pointermove', onHotspotMovePointerMove);
  document.removeEventListener('pointerup', onHotspotMovePointerUp);
  document.removeEventListener('pointercancel', onHotspotMovePointerCancel);
  window.removeEventListener('resize', scheduleHotspotMovePreviewRender);
  window.removeEventListener('scroll', scheduleHotspotMovePreviewRender, true);
  hotspotMoveState.listenersAttached = false;
}

function cleanupHotspotMovePreview() {
  if (hotspotMoveState.rafId !== null) {
    cancelAnimationFrame(hotspotMoveState.rafId);
  }
  detachHotspotMoveListeners();
  if (hotspotMoveState.previewElement && hotspotMoveState.previewElement.parentNode) {
    hotspotMoveState.previewElement.parentNode.removeChild(hotspotMoveState.previewElement);
  }
  if (hotspotMoveState.sourceElement && hotspotMoveState.sourceElement.classList) {
    hotspotMoveState.sourceElement.classList.remove('hs-marker-moving-source');
  }
  hotspotMoveState.active = false;
  hotspotMoveState.target = null;
  hotspotMoveState.sourceElement = null;
  hotspotMoveState.previewElement = null;
  hotspotMoveState.pointerPosition = null;
  hotspotMoveState.rafId = null;
  hotspotMoveState.startSceneId = '';
  hotspotMoveState.saving = false;
  hotspotMoveState.pointerDown = null;
  hotspotMoveState.mode2D = false;
  hotspotMoveState.listenersAttached = false;
  isMovingHotspot = false;
  movingHotspotTarget = null;
}

function cancelHotspotMove(message, options) {
  if (!hotspotMoveState.active && !hotspotMoveState.previewElement) return false;
  var opts = options || {};
  if (hotspotMoveState.saving && !opts.allowDuringSave) {
    if (!opts.silent) showToast('移動を保存中です。完了までお待ちください。', 'error');
    return false;
  }
  hotspotMoveState.generation += 1;
  cleanupHotspotMovePreview();
  if (message && !opts.silent) showToast(message, opts.type || 'error');
  return true;
}

function startHotspotMovePreview(target, sourceElement) {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('move-other-hotspot')) return false;
  if (!canEdit || !isEditMode || !target) return false;
  if (hotspotMoveState.active && hotspotMoveState.saving) {
    showToast('別の移動を保存中です。完了までお待ちください。', 'error');
    return false;
  }
  if (hasPendingHotspotMutationForTarget(target.id)) {
    showToast('このホットスポットの更新を処理中です。完了までお待ちください。', 'error');
    return false;
  }
  if (hotspotMoveState.active) cancelHotspotMove('', { silent: true });

  hotspotMoveState.mode2D = !!is2DMode;
  var preview = createHotspotMovePreviewElement(target);
  var parent = getHotspotMovePreviewParent();
  if (!preview || !parent) {
    hotspotMoveState.mode2D = false;
    return false;
  }

  hotspotMoveState.generation += 1;
  hotspotMoveState.active = true;
  hotspotMoveState.target = target;
  hotspotMoveState.sourceElement = sourceElement || null;
  hotspotMoveState.previewElement = preview;
  hotspotMoveState.startSceneId = String(currentFileId || '');
  hotspotMoveState.saving = false;
  hotspotMoveState.pointerDown = null;
  isMovingHotspot = true;
  movingHotspotTarget = target;

  stopGyroIfActive('hotspot-move');
  if (sourceElement && sourceElement.classList) {
    sourceElement.classList.add('hs-marker-moving-source');
  }
  parent.appendChild(preview);

  if (sourceElement && typeof sourceElement.getBoundingClientRect === 'function') {
    var sourceRect = sourceElement.getBoundingClientRect();
    hotspotMoveState.pointerPosition = {
      clientX: sourceRect.left + (sourceRect.width || 0) / 2,
      clientY: sourceRect.top + (sourceRect.height || 0) / 2
    };
    renderHotspotMovePreview();
  }

  attachHotspotMoveListeners();
  showToast('移動先をクリックまたはタップしてください。(Escキーでキャンセル)', 'success');
  return true;
}

function isHotspotMovePointerDrag(start, evt) {
  if (!start || !evt) return false;
  var dx = evt.clientX - start.clientX;
  var dy = evt.clientY - start.clientY;
  return dx * dx + dy * dy > EDIT_MODE_DRAG_THRESHOLD_PX * EDIT_MODE_DRAG_THRESHOLD_PX;
}

function suppressHotspotMoveFollowupClick() {
  suppressNextPanoramaClick = true;
  setTimeout(function () {
    suppressNextPanoramaClick = false;
  }, 250);
}

function onHotspotMovePointerDown(evt) {
  if (!hotspotMoveState.active || hotspotMoveState.saving) return;
  if (evt.button != null && evt.button !== 0) return;
  if (!isHotspotMovePointAllowed(evt)) return;
  hotspotMoveState.pointerDown = {
    pointerId: evt.pointerId,
    clientX: evt.clientX,
    clientY: evt.clientY
  };
  updateHotspotMovePreview(evt);
}

function onHotspotMovePointerMove(evt) {
  if (!hotspotMoveState.active || hotspotMoveState.saving) return;
  updateHotspotMovePreview(evt);
}

function onHotspotMovePointerUp(evt) {
  if (!hotspotMoveState.active || hotspotMoveState.saving) return;
  updateHotspotMovePreview(evt);
  var start = hotspotMoveState.pointerDown;
  if (!start) return;
  if (start.pointerId != null && evt.pointerId != null && start.pointerId !== evt.pointerId) return;
  hotspotMoveState.pointerDown = null;
  if (isHotspotMovePointerDrag(start, evt)) {
    suppressHotspotMoveFollowupClick();
    return;
  }
  if (!isHotspotMovePointAllowed(evt)) return;
  suppressHotspotMoveFollowupClick();
  commitHotspotMove(evt);
}

function onHotspotMovePointerCancel() {
  cancelHotspotMove('移動をキャンセルしました。', { type: 'error' });
}

function isCurrentHotspotMoveRequest(generation, startSceneId, target) {
  return isPendingHotspotMoveRequest(generation, startSceneId, target) &&
    String(currentFileId || '') === startSceneId;
}

function isPendingHotspotMoveRequest(generation, startSceneId, target) {
  return hotspotMoveState.active &&
    hotspotMoveState.generation === generation &&
    hotspotMoveState.startSceneId === startSceneId &&
    hotspotMoveState.target === target;
}

function commitHotspotMove(evt) {
  if (!hotspotMoveState.active || hotspotMoveState.saving || !hotspotMoveState.target) return false;
  var target = hotspotMoveState.target;
  var startSceneId = hotspotMoveState.startSceneId;
  var generation = hotspotMoveState.generation;
  if (String(currentFileId || '') !== startSceneId) {
    cancelHotspotMove('シーンが変更されたため移動をキャンセルしました。', { type: 'error' });
    return false;
  }

  var coordinates = null;
  if (hotspotMoveState.mode2D) {
    coordinates = get2DHotspotCoordinates(
      evt.clientX,
      evt.clientY,
      document.getElementById('flat-map-img')
    );
    if (!coordinates) {
      showToast('画像の範囲内をクリックしてください。', 'error');
      return false;
    }
  } else {
    try {
      var converted = viewer.mouseEventToCoords(evt);
      coordinates = { pitch: Number(converted[0]), yaw: Number(converted[1]) };
    } catch (e) {
      showToast('座標の取得に失敗しました。再度クリックしてください。', 'error');
      return false;
    }
    if (!isFinite(coordinates.pitch) || !isFinite(coordinates.yaw)) {
      showToast('座標の取得に失敗しました。再度クリックしてください。', 'error');
      return false;
    }
  }

  var saveData = buildHotspotMoveSaveData(
    target,
    coordinates,
    startSceneId,
    hotspotMoveState.mode2D ? '2D' : '360'
  );
  hotspotMoveState.saving = true;
  hotspotMoveState.pointerDown = null;
  showToast('移動中...', 'success');

  google.script.run
    .withSuccessHandler(function (result) {
      if (!isPendingHotspotMoveRequest(generation, startSceneId, target)) {
        if (result && result.success) clearHotspotCache(startSceneId);
        return;
      }
      if (!isCurrentHotspotMoveRequest(generation, startSceneId, target)) {
        if (result && result.success) clearHotspotCache(startSceneId);
        cleanupHotspotMovePreview();
        return;
      }
      if (!result || !result.success) {
        cancelHotspotMove(
          '移動に失敗しました: ' + ((result && result.error) || '不明なエラー'),
          { type: 'error', allowDuringSave: true }
        );
        return;
      }

      clearHotspotCache(startSceneId);
      cleanupHotspotMovePreview();
      var confirmedHotspot = result.hotspot || saveData;
      target.pitch = coordinates.pitch;
      target.yaw = coordinates.yaw;
      updateSpotInViewer(target, confirmedHotspot);
      if (result.partialSuccess) {
        showToast('ホットスポットを移動しました。' + (result.warning || '古い写真の整理に失敗しました。'), 'warning');
      } else {
        showToast('ホットスポットを移動しました！', 'success');
      }
    })
    .withFailureHandler(function () {
      if (!isPendingHotspotMoveRequest(generation, startSceneId, target)) return;
      if (!isCurrentHotspotMoveRequest(generation, startSceneId, target)) {
        cleanupHotspotMovePreview();
        return;
      }
      cancelHotspotMove(
        '通信エラーが発生しました。元の位置へ戻しました。',
        { type: 'error', allowDuringSave: true }
      );
    })
    .updateHotspot(withEditToken(saveData), target.id);
  return true;
}

function updateMarkerStyleSummary(shape, color, icon) {
  var normalizedShape = normalizeMarkerShape(shape);
  var normalizedColor = normalizeMarkerColor(color);
  var normalizedIcon = normalizeMarkerIcon(icon);
  var preview = document.getElementById('marker-style-preview');
  var previewIcon = preview.querySelector('.hs-marker-core');
  var summary = document.getElementById('marker-style-summary-text');
  applyMarkerClasses(preview, normalizedShape, normalizedColor);
  applyMarkerIconClass(previewIcon, normalizedIcon);
  summary.textContent = MARKER_SHAPE_LABELS[normalizedShape] + '・' + MARKER_COLOR_LABELS[normalizedColor] + '・' + MARKER_ICON_LABELS[normalizedIcon];
}

function loadMarkerStylePreference() {
  try {
    lastMarkerShape = normalizeMarkerShape(window.localStorage.getItem('hsMarkerShape'));
    lastMarkerColor = normalizeMarkerColor(window.localStorage.getItem('hsMarkerColor'));
    lastMarkerIcon = normalizeSelectableMarkerIcon(window.localStorage.getItem('hsMarkerIcon'));
  } catch (e) {
    lastMarkerShape = DEFAULT_MARKER_SHAPE;
    lastMarkerColor = DEFAULT_MARKER_COLOR;
    lastMarkerIcon = DEFAULT_MARKER_ICON;
  }
}

function persistMarkerStylePreference(shape, color, icon) {
  var normalizedShape = normalizeMarkerShape(shape);
  var normalizedColor = normalizeMarkerColor(color);
  var normalizedIcon = normalizeSelectableMarkerIcon(icon);
  lastMarkerShape = normalizedShape;
  lastMarkerColor = normalizedColor;
  lastMarkerIcon = normalizedIcon;
  try {
    window.localStorage.setItem('hsMarkerShape', normalizedShape);
    window.localStorage.setItem('hsMarkerColor', normalizedColor);
    window.localStorage.setItem('hsMarkerIcon', normalizedIcon);
  } catch (e) {
    // localStorage が使えない環境でもメモリ上の既定値は維持する
  }
  updateMarkerStyleSummary(normalizedShape, normalizedColor, normalizedIcon);
}

function syncMarkerStyleInputsFromPreference() {
  var shapeInput = document.getElementById('marker-shape');
  var colorInput = document.getElementById('marker-color');
  shapeInput.value = lastMarkerShape;
  colorInput.value = lastMarkerColor;
  setMarkerIconSelectValue(lastMarkerIcon, false);
  updateMarkerStyleSummary(lastMarkerShape, lastMarkerColor, lastMarkerIcon);
}

function syncMarkerStyleSummaryFromInputs() {
  var shapeInput = document.getElementById('marker-shape');
  var colorInput = document.getElementById('marker-color');
  var iconInput = document.getElementById('marker-icon');
  updateMarkerStyleSummary(shapeInput.value, colorInput.value, iconInput.value);
  updateHotspotDraftAppearance();
}

function isHotspotBottomSheetViewport() {
  return window.innerWidth <= 600;
}

function positionHotspotPopup(clientX, clientY) {
  var popup = document.getElementById('hotspot-popup');
  if (!popup || !popup.classList.contains('visible')) return false;
  var visualViewport = window.visualViewport;
  var bounds = visualViewport
    ? {
        left: visualViewport.offsetLeft,
        top: visualViewport.offsetTop,
        width: visualViewport.width,
        height: visualViewport.height
      }
    : { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
  bounds.right = bounds.left + bounds.width;
  bounds.bottom = bounds.top + bounds.height;

  popup.style.setProperty('--hotspot-visual-left', Math.max(0, bounds.left) + 'px');
  popup.style.setProperty('--hotspot-visual-right', Math.max(0, window.innerWidth - bounds.right) + 'px');
  popup.style.setProperty('--hotspot-visual-bottom', Math.max(0, window.innerHeight - bounds.bottom) + 'px');
  popup.style.setProperty('--hotspot-visual-height', Math.max(1, bounds.height) + 'px');

  if (isHotspotBottomSheetViewport()) {
    popup.style.left = '';
    popup.style.right = '';
    popup.style.top = '';
    popup.style.bottom = '';
    return true;
  }

  var width = popup.offsetWidth || 340;
  var height = popup.offsetHeight || Math.min(460, bounds.height - 20);
  var anchorX = isFinite(clientX) ? Number(clientX) : hotspotFormSessionState.anchorClientX;
  var anchorY = isFinite(clientY) ? Number(clientY) : hotspotFormSessionState.anchorClientY;
  var minLeft = bounds.left + 10;
  var minTop = bounds.top + 10;
  var maxLeft = Math.max(minLeft, bounds.right - width - 10);
  var maxTop = Math.max(minTop, bounds.bottom - height - 10);
  var left = Math.min(Math.max(anchorX + 12, minLeft), maxLeft);
  var top = Math.min(Math.max(anchorY - 20, minTop), maxTop);
  popup.style.left = left + 'px';
  popup.style.right = 'auto';
  popup.style.top = top + 'px';
  popup.style.bottom = 'auto';
  return true;
}

function repositionHotspotPopupWithinViewport() {
  return positionHotspotPopup(
    hotspotFormSessionState.anchorClientX,
    hotspotFormSessionState.anchorClientY
  );
}

function scheduleHotspotPopupReposition() {
  if (!isHotspotFormSessionActive() || hotspotPopupLayoutFrame !== null) return;
  hotspotPopupLayoutFrame = requestAnimationFrame(function () {
    hotspotPopupLayoutFrame = null;
    repositionHotspotPopupWithinViewport();
  });
}

function initializeHotspotPopupViewportTracking() {
  if (hotspotPopupViewportTrackingInitialized) return;
  hotspotPopupViewportTrackingInitialized = true;
  window.addEventListener('resize', scheduleHotspotPopupReposition);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scheduleHotspotPopupReposition);
    window.visualViewport.addEventListener('scroll', scheduleHotspotPopupReposition);
  }
}

function setMarkerStylePanelExpanded(isExpanded) {
  document.getElementById('marker-style-panel').classList.toggle('expanded', isExpanded);
  scheduleHotspotPopupReposition();
}

function toggleMarkerStylePanel() {
  var panel = document.getElementById('marker-style-panel');
  setMarkerStylePanelExpanded(!panel.classList.contains('expanded'));
}

/**
 * ポップアップの表示モードを切り替える
 * @param {string} mode  'type' | 'info' | 'jump'
 */
function setPopupMode(mode) {
  var inFolderMode = !!(allImages && allImages.length > 0);
  currentPopupMode = mode;
  var typeSelector = document.getElementById('hs-type-selector');
  var form         = document.getElementById('hs-form');
  var typeFooter   = document.getElementById('hs-type-footer');
  var formFooter   = document.getElementById('hs-form-footer');
  var infoFields   = document.getElementById('hs-info-fields');
  var jumpFields   = document.getElementById('hs-jump-fields');
  var photoGroup   = document.getElementById('photo-select-group');
  var backBtn      = document.getElementById('hs-back-btn');
  var typeBackBtn  = document.getElementById('hs-type-back-btn');
  var labelGroup   = document.getElementById('input-label-group');
  var labelInput   = document.getElementById('input-label');
  var positionControls = document.getElementById('hs-position-controls');
  if (positionControls) positionControls.style.display = editingHotspot ? 'none' : '';
  if (labelGroup) labelGroup.style.display = mode === 'jump' ? 'none' : '';
  if (labelInput) {
    labelInput.disabled = mode === 'jump';
    labelInput.required = mode !== 'jump';
  }

  if (mode === 'type') {
    typeSelector.style.display = '';
    form.style.display         = 'none';
    typeFooter.style.display   = 'flex';
    formFooter.style.display   = 'none';
    document.getElementById('popup-header-title').textContent = 'ホットスポットを追加';
  } else {
    typeSelector.style.display = 'none';
    form.style.display         = 'flex';
    typeFooter.style.display   = 'none';
    formFooter.style.display   = 'flex';
    infoFields.style.display   = mode === 'info' ? '' : 'none';
    jumpFields.style.display   = mode === 'jump' ? '' : 'none';
    // 写真アップロードは単一画像／フォルダの双方で情報モードに表示する。
    if (photoGroup) photoGroup.style.display = mode === 'info' ? '' : 'none';
    // 新規追加×フォルダモードでは種類選択へ戻る操作も残し、キャンセルは常設する。
    var canGoBack = !editingHotspot && inFolderMode;
    if (typeBackBtn) typeBackBtn.style.display = canGoBack ? '' : 'none';
    backBtn.textContent = 'キャンセル';
    // タイトル・保存ボタンテキスト
    if (!editingHotspot) {
      document.getElementById('popup-header-title').textContent =
        mode === 'jump' ? 'ジャンプスポットを追加' : '情報スポットを追加';
      document.getElementById('save-label').textContent = '保存する';
    }
    setMarkerStylePanelExpanded(false);
    setTimeout(function () {
      var popup = document.getElementById('hotspot-popup');
      if (!popup || !popup.classList.contains('visible')) return;
      if (document.activeElement &&
          popup.contains(document.activeElement) &&
          document.activeElement.offsetParent !== null) return;
      document.getElementById(mode === 'jump' ? 'input-jump-scene' : 'input-label').focus();
    }, 60);
  }
  scheduleHotspotPopupReposition();
}

/**
 * quiz/info の説明欄を切り替える。
 * isQuiz=true → 質問・答えの2欄を表示、通常説明欄を非表示
 */
function setQuizDescMode(isQuiz) {
  document.getElementById('hs-desc-group').style.display      = isQuiz ? 'none' : '';
  document.getElementById('hs-quiz-desc-group').style.display = isQuiz ? '' : 'none';
  scheduleHotspotPopupReposition();
}

/** タイプ選択ボタンクリック */
function selectHotspotType(type) {
  if (type === 'quiz') {
    setPopupMode('info');
    document.getElementById('marker-icon').value = 'quiz';
    syncMarkerStyleSummaryFromInputs();
    document.getElementById('quiz-input-question').value = '';
    document.getElementById('quiz-input-answer').value   = '';
    setQuizDescMode(true);
    document.getElementById('popup-header-title').textContent = 'クイズスポットを追加';
  } else {
    if (type === 'jump' && !editingHotspot) {
      document.getElementById('input-label').value = '';
    }
    setPopupMode(type);
    var markerIconInput = document.getElementById('marker-icon');
    if (normalizeMarkerIcon(markerIconInput.value) === 'quiz') {
      markerIconInput.value = DEFAULT_MARKER_ICON;
      syncMarkerStyleSummaryFromInputs();
    }
    setQuizDescMode(false);
  }
}

/** フォーム画面の「戻る / キャンセル」ボタン */
function onHotspotTypeBackClick() {
  var inFolderMode = !!(allImages && allImages.length > 0);
  if (!editingHotspot && inFolderMode) {
    setPopupMode('type');
  }
}

// =============================================
//  ホットスポットマーカー要素の生成
//  Pannellumの createTooltipFunc として呼ばれる
// =============================================
function buildMarkerElement(container, args) {
  renderMarkerAppearance(
    container,
    args && args.markerShape,
    args && args.markerColor,
    args && args.markerIcon
  );
  bindHotspotAudioPrefetch(container, args);

  // 編集モード: 右クリックでコンテキストメニューを表示
  container.addEventListener('contextmenu', function (evt) {
    if (!canEdit || !isEditMode) return;
    evt.preventDefault();
    evt.stopPropagation();
    openHotspotContextMenu(evt, args, container);
  });

  // ホバーツールチップ
  if (args && args.jumpSceneId) {
    // ジャンプ先がある場合: ジャンプ先シーン名を表示
    container.addEventListener('mouseenter', function () {
      if (isEditMode) return;
      showJumpTooltip(container, args.jumpSceneId, args.label);
    });
    container.addEventListener('mouseleave', function () {
      hideJumpTooltip();
    });
  } else if (args && args.label) {
    // 通常ホットスポット: ラベルを表示
    container.addEventListener('mouseenter', function () {
      if (isEditMode) return;
      showLabelTooltip(container, args.label);
    });
    container.addEventListener('mouseleave', function () {
      hideJumpTooltip();
    });
  }
}

// =============================================
//  閲覧モード: マーカークリックで情報を表示
// =============================================
function onMarkerClick(evt, args) {
  if (isEditMode) return; // 編集モード中は無効
  closeQuizModal({ restoreFocus: false });

  // ジャンプ機能: jumpSceneId が設定されていればシーン移動
  if (args && args.jumpSceneId) {
    hideJumpTooltip();
    var target = getSceneImageById(args.jumpSceneId);
    if (target) {
      stopGyroIfActive('jump');
      previousSceneId = currentFileId; // 振り返り視点用: 移動前のシーンIDを記憶
      loadScene(target);
    } else {
      showToast('ジャンプ先のシーンが見つかりません。', 'error');
    }
    return;
  }

  // クイズモード: icon が 'quiz' の場合はフリップカードモーダルを表示
  if (args && args.markerIcon === 'quiz') {
    var quizOverlay = document.getElementById('quiz-modal-overlay');
    var quizCard    = document.getElementById('quiz-card');
    var parts       = (args.description || '').split('|');
    var question    = parts[0].trim() || '問題が設定されていません';
    var answer      = parts.length > 1 ? parts[1].trim() : '答えが設定されていません';
    var linkUrl     = normalizeHttpUrl(args.linkUrl);

    document.getElementById('quiz-card-title').textContent    = args.label || 'クイズ';
    document.getElementById('quiz-card-question').innerHTML = escapeHtml(question).replace(/\r?\n|\r/g, '<br>');
    document.getElementById('quiz-card-answer').innerHTML   = escapeHtml(answer).replace(/\r?\n|\r/g, '<br>');

    var linkEl = document.getElementById('quiz-card-link');
    if (linkUrl) {
      linkEl.href = linkUrl;
      linkEl.classList.remove('hidden');
    } else {
      linkEl.href = '#';
      linkEl.classList.add('hidden');
    }

    closeActiveInfoPopup({ restoreFocus: false });
    activeQuizReturnFocus = evt && evt.currentTarget && evt.currentTarget.focus ? evt.currentTarget : document.activeElement;
    setQuizAnswerVisible(false);
    quizOverlay.classList.remove('hidden');
    renderQuizAttachments(args);
    document.getElementById('quiz-flip-button').focus();
    return;
  }

  // 情報表示モード: 既存の音声再生と遅延要求を破棄してから新しいポップアップを開く
  closeActiveInfoPopup({ restoreFocus: false });
  var popupGeneration = infoPopupGeneration;
  activeInfoPopupReturnFocus = evt && evt.currentTarget && evt.currentTarget.focus
    ? evt.currentTarget
    : null;

  var popup = document.createElement('div');
  popup.id = 'active-info-popup';
  popup.className = 'info-popup';
  popup.__infoPopupGeneration = popupGeneration;
  popup.dataset.fileId = String(args && args.fileId || currentFileId || '');
  popup.dataset.hotspotId = String(args && args.id || '');
  popup.dataset.audioId = String(args && args.audioId || '');
  var useMobileInfoSheet = isPublicViewingMode() && isSmallViewport();
  if (useMobileInfoSheet) popup.classList.add('mobile-info-sheet');

  // 画面端からはみ出ないよう位置を補正
  if (!useMobileInfoSheet) {
    var x = Math.min(evt.clientX + 12, window.innerWidth  - 310);
    var y = Math.max(evt.clientY - 110, 68);
    y = Math.min(y, window.innerHeight - 180);
    popup.style.left = x + 'px';
    popup.style.top  = y + 'px';
  }

  var linkUrl = normalizeHttpUrl(args && args.linkUrl);
  var linkHtml = '';
  if (linkUrl) {
    linkHtml =
      '<div style="margin-top:10px">' +
      '  <a href="' + escapeHtml(linkUrl) + '" target="_blank" rel="noopener noreferrer" ' +
      '     style="font-size:13px;font-weight:600;color:#2563eb;text-decoration:underline">' +
      '    リンクを開く' +
      '  </a>' +
      '</div>';
  }

  // 写真プレースホルダー（写真IDがあれば後から差し替え）
  var photoHtml = '';
  if (args && args.photoId) {
    photoHtml = '<div class="info-popup-photo-placeholder" id="popup-photo-area">写真を読み込んでいます...</div>';
  }
  var audioHtml = '';
  if (args && args.audioId) {
    audioHtml =
      '<div class="info-popup-audio is-loading" id="popup-audio-area">' +
      '  <audio controls controlsList="nodownload" preload="none" aria-disabled="true" aria-label="' +
           escapeHtml((args.label ? String(args.label) : 'ホットスポット') + 'の音声') + '"></audio>' +
      '  <span class="info-popup-audio-status" role="status" aria-live="polite">音声を準備しています…</span>' +
      '</div>';
  }

  popup.innerHTML =
    '<div class="info-popup-header">' +
    '  <span class="info-popup-title">' + escapeHtml(args.label) + '</span>' +
    '  <button class="info-popup-close" type="button" onclick="closeActiveInfoPopup()" aria-label="情報を閉じる">&times;</button>' +
    '</div>' +
    '<div class="info-popup-divider"></div>' +
    photoHtml +
    audioHtml +
    (args.description ? '<p class="info-popup-body">' + escapeHtml(args.description).replace(/\r?\n|\r/g, '<br>') + '</p>' : '') +
    linkHtml;

  document.getElementById('ui-overlay').appendChild(popup);

  // 写真の遅延ロード
  if (args && args.photoId) {
    renderPhotoInPopup(popup, args);
  }
  if (args && args.audioId) {
    loadHotspotAudioForPopup(popup, args);
  }
}

function closeActiveInfoPopup(options) {
  var opts = options || {};
  infoPopupGeneration += 1;
  var popup = document.getElementById('active-info-popup');
  if (popup) {
    Array.from(popup.querySelectorAll('audio')).forEach(function (audio) {
      clearAudioElementSource(audio);
    });
    popup.remove();
  }
  var returnFocus = activeInfoPopupReturnFocus;
  activeInfoPopupReturnFocus = null;
  if (opts.restoreFocus !== false && returnFocus && returnFocus.isConnected) {
    try { returnFocus.focus(); } catch (error) {}
  }
}

function isCurrentInfoPopupRequest(popup, identity) {
  return !!(
    popup && popup.isConnected && popup.id === 'active-info-popup' &&
    popup.__infoPopupGeneration === identity.popupGeneration &&
    infoPopupGeneration === identity.popupGeneration &&
    sceneLoadGeneration === identity.sceneGeneration &&
    (!currentFileId || String(currentFileId) === identity.fileId) &&
    popup.dataset.fileId === identity.fileId &&
    popup.dataset.hotspotId === identity.hotspotId &&
    popup.dataset.audioId === identity.audioId
  );
}

function clearHotspotAudioCache() {
  hotspotAudioCache = {};
  hotspotAudioCacheOrder = [];
  hotspotAudioRequestGeneration += 1;
  hotspotAudioInFlight = {};
  hotspotAudioPrefetchTimers.forEach(function (timer) { clearTimeout(timer); });
  hotspotAudioPrefetchTimers = [];
}

function putHotspotAudioCache(cacheKey, value) {
  delete hotspotAudioCache[cacheKey];
  hotspotAudioCache[cacheKey] = value;
  hotspotAudioCacheOrder = hotspotAudioCacheOrder.filter(function (key) { return key !== cacheKey; });
  hotspotAudioCacheOrder.push(cacheKey);
  while (hotspotAudioCacheOrder.length > HOTSPOT_AUDIO_CACHE_LIMIT) {
    delete hotspotAudioCache[hotspotAudioCacheOrder.shift()];
  }
}

function getHotspotAudioCacheKey(identity) {
  return [
    String(identity && identity.fileId || ''),
    String(identity && identity.hotspotId || ''),
    String(identity && identity.audioId || '')
  ].join('|');
}

function normalizeHotspotAudioIdentity(args) {
  return {
    fileId: String(args && args.fileId || currentFileId || ''),
    hotspotId: String(args && (args.hotspotId || args.id) || ''),
    audioId: String(args && args.audioId || ''),
    sceneGeneration: args && typeof args.sceneGeneration === 'number'
      ? args.sceneGeneration
      : sceneLoadGeneration
  };
}

/** 同じ音声のキャッシュ・通信中要求を共有し、シーン世代が変わった応答は破棄する。 */
function requestHotspotAudio(identity, callbacks) {
  var normalized = normalizeHotspotAudioIdentity(identity);
  var handlers = callbacks || {};
  if (!normalized.fileId || !normalized.hotspotId || !normalized.audioId) {
    if (typeof handlers.failure === 'function') handlers.failure();
    return false;
  }
  var cacheKey = getHotspotAudioCacheKey(normalized);
  if (hotspotAudioCache[cacheKey]) {
    var cachedResult = hotspotAudioCache[cacheKey];
    setTimeout(function () {
      if (typeof handlers.success === 'function') handlers.success(cachedResult, true);
    }, 0);
    return true;
  }

  var currentEntry = hotspotAudioInFlight[cacheKey];
  if (currentEntry && currentEntry.requestGeneration === hotspotAudioRequestGeneration) {
    if (typeof handlers.success === 'function') currentEntry.successHandlers.push(handlers.success);
    if (typeof handlers.failure === 'function') currentEntry.failureHandlers.push(handlers.failure);
    return true;
  }

  var entry = {
    cacheKey: cacheKey,
    identity: normalized,
    requestGeneration: hotspotAudioRequestGeneration,
    successHandlers: typeof handlers.success === 'function' ? [handlers.success] : [],
    failureHandlers: typeof handlers.failure === 'function' ? [handlers.failure] : []
  };
  hotspotAudioInFlight[cacheKey] = entry;

  function isCurrentEntry() {
    return hotspotAudioInFlight[cacheKey] === entry &&
      entry.requestGeneration === hotspotAudioRequestGeneration &&
      sceneLoadGeneration === entry.identity.sceneGeneration &&
      (!currentFileId || String(currentFileId) === entry.identity.fileId);
  }
  function finishFailure() {
    if (!isCurrentEntry()) return;
    delete hotspotAudioInFlight[cacheKey];
    entry.failureHandlers.forEach(function (handler) { handler(); });
  }

  google.script.run
    .withSuccessHandler(function (result) {
      if (!isCurrentEntry()) return;
      delete hotspotAudioInFlight[cacheKey];
      if (!result || !result.success || !result.dataUri) {
        entry.failureHandlers.forEach(function (handler) { handler(); });
        return;
      }
      var cachedResult = {
        success: true,
        dataUri: String(result.dataUri),
        mimeType: String(result.mimeType || 'audio/mpeg'),
        sizeBytes: Number(result.sizeBytes) || 0
      };
      putHotspotAudioCache(cacheKey, cachedResult);
      entry.successHandlers.forEach(function (handler) { handler(cachedResult, false); });
    })
    .withFailureHandler(finishFailure)
    .getHotspotAudioData({
      fileId: normalized.fileId,
      hotspotId: normalized.hotspotId,
      audioId: normalized.audioId
    });
  return true;
}

function prefetchHotspotAudio(args) {
  if (isEditMode || !args || !args.audioId || args.jumpSceneId) return false;
  var identity = normalizeHotspotAudioIdentity(args);
  if (!identity.fileId || !identity.hotspotId || !identity.audioId) return false;
  return requestHotspotAudio(identity);
}

function bindHotspotAudioPrefetch(container, args) {
  if (!container || !args) return;
  container.tabIndex = 0;
  container.setAttribute('role', 'button');
  container.setAttribute('aria-label', String(args.label || 'ホットスポット') + 'を開く');
  container.addEventListener('click', function (event) {
    if (!canEdit || !isEditMode) return;
    event.stopPropagation();
    openHotspotContextMenu(event, args, container);
  });
  container.addEventListener('keydown', function (event) {
    if (event.target !== container || (event.key !== 'Enter' && event.key !== ' ')) return;
    event.preventDefault();
    container.click();
  });
  if (!args.audioId || args.jumpSceneId) return;
  var hoverTimer = null;
  function cancelHoverPrefetch() {
    if (hoverTimer === null) return;
    clearTimeout(hoverTimer);
    hotspotAudioPrefetchTimers = hotspotAudioPrefetchTimers.filter(function (timer) {
      return timer !== hoverTimer;
    });
    hoverTimer = null;
  }
  container.addEventListener('pointerenter', function (event) {
    if (isEditMode || (event.pointerType && event.pointerType !== 'mouse')) return;
    cancelHoverPrefetch();
    hoverTimer = setTimeout(function () {
      var completedTimer = hoverTimer;
      hoverTimer = null;
      hotspotAudioPrefetchTimers = hotspotAudioPrefetchTimers.filter(function (timer) {
        return timer !== completedTimer;
      });
      prefetchHotspotAudio(args);
    }, HOTSPOT_AUDIO_PREFETCH_DELAY_MS);
    hotspotAudioPrefetchTimers.push(hoverTimer);
  });
  container.addEventListener('pointerleave', cancelHoverPrefetch);
  container.addEventListener('focusin', function () {
    cancelHoverPrefetch();
    prefetchHotspotAudio(args);
  });
}

function loadHotspotAudioForPopup(popup, args) {
  var identity = normalizeHotspotAudioIdentity(args);
  identity.popupGeneration = popup && popup.__infoPopupGeneration;
  function showAudio(result) {
    if (!isCurrentInfoPopupRequest(popup, identity)) return;
    var area = popup.querySelector('#popup-audio-area');
    if (!area) return;
    var audio = area.querySelector('audio');
    var status = area.querySelector('.info-popup-audio-status');
    if (!audio) return;
    clearAudioElementSource(audio);
    audio.src = result.dataUri;
    audio.setAttribute('aria-disabled', 'false');
    try { audio.load(); } catch (error) {}
    area.classList.remove('is-loading', 'info-popup-audio-error');
    if (status) {
      status.textContent = '';
      status.hidden = true;
    }
  }
  function showFailure() {
    if (!isCurrentInfoPopupRequest(popup, identity)) return;
    var area = popup.querySelector('#popup-audio-area');
    if (area) {
      var audio = area.querySelector('audio');
      var status = area.querySelector('.info-popup-audio-status');
      clearAudioElementSource(audio);
      if (audio) audio.setAttribute('aria-disabled', 'true');
      area.classList.remove('is-loading');
      area.classList.add('info-popup-audio-error');
      if (status) {
        status.hidden = false;
        status.textContent = '音声を読み込めませんでした';
      }
    }
  }

  requestHotspotAudio(identity, { success: showAudio, failure: showFailure });
}

/**
 * 情報ポップアップに写真を表示する（GASから取得、キャッシュあり）
 */
function renderPhotoInPopup(popup, args) {
  var fileId = String(args && args.fileId || currentFileId || '');
  var hotspotId = String(args && args.id || '');
  var photoId = String(args && args.photoId || '');
  var popupGeneration = popup && popup.__infoPopupGeneration;
  var sceneGeneration = sceneLoadGeneration;
  var cacheKey = [fileId, hotspotId, photoId].join('|');
  function isCurrentPhotoRequest() {
    return !!(popup && popup.isConnected && popup.id === 'active-info-popup' &&
      popup.__infoPopupGeneration === popupGeneration && infoPopupGeneration === popupGeneration &&
      sceneLoadGeneration === sceneGeneration && String(currentFileId || '') === fileId &&
      popup.dataset.fileId === fileId && popup.dataset.hotspotId === hotspotId);
  }
  function showPhotoInArea(dataUri) {
    if (!isCurrentPhotoRequest()) return;
    var area = popup.querySelector('#popup-photo-area');
    if (!area) return;
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'info-popup-photo-button';
    button.setAttribute('aria-label', '写真を拡大表示');
    button.title = '写真を拡大表示';
    var img = document.createElement('img');
    img.className = 'info-popup-photo';
    img.src = dataUri;
    img.alt = args && args.label ? String(args.label) + 'の写真' : 'ホットスポットの写真';
    button.appendChild(img);
    button.addEventListener('click', function () {
      openPhotoLightbox(dataUri, button, args && args.label);
    });
    area.parentNode.replaceChild(button, area);
  }

  // キャッシュあり
  if (photoCache[cacheKey]) {
    showPhotoInArea(photoCache[cacheKey]);
    return;
  }

  google.script.run
    .withSuccessHandler(function (result) {
      if (!isCurrentPhotoRequest()) return;
      var area = popup.querySelector('#popup-photo-area');
      if (!area) return; // popup が閉じられた場合
      if (result && result.success) {
        photoCache[cacheKey] = result.dataUri;
        showPhotoInArea(result.dataUri);
      } else {
        area.textContent = '写真を読み込めませんでした';
      }
    })
    .withFailureHandler(function () {
      if (!isCurrentPhotoRequest()) return;
      var area = popup.querySelector('#popup-photo-area');
      if (area) area.textContent = '写真を読み込めませんでした';
    })
    .getHotspotPhotoDataUri({
      fileId: fileId,
      hotspotId: hotspotId,
      photoId: photoId
    });
}

function isPhotoLightboxOpen() {
  return !!photoLightboxState.open;
}

function renderPhotoLightboxTransform() {
  var image = document.getElementById('photo-lightbox-image');
  var stage = document.getElementById('photo-lightbox-stage');
  if (!image || !stage) return;
  image.style.transform = 'translate3d(' + photoLightboxState.x + 'px,' + photoLightboxState.y + 'px,0) scale(' + photoLightboxState.scale + ')';
  stage.classList.toggle('can-pan', photoLightboxState.scale > PHOTO_LIGHTBOX_MIN_SCALE);
}

function getPhotoLightboxBaseSize() {
  var image = document.getElementById('photo-lightbox-image');
  var stage = document.getElementById('photo-lightbox-stage');
  if (!image || !stage || !(image.naturalWidth > 0) || !(image.naturalHeight > 0)) return null;
  var width = Math.max(0, stage.clientWidth);
  var height = Math.max(0, stage.clientHeight);
  if (!width || !height) return null;
  var fit = Math.min(1, width / image.naturalWidth, height / image.naturalHeight);
  return {
    stageWidth: width,
    stageHeight: height,
    imageWidth: image.naturalWidth * fit,
    imageHeight: image.naturalHeight * fit
  };
}

/** 拡大画像の端が表示領域より内側へ抜けない範囲にパンを制限する。 */
function clampPhotoLightboxPan() {
  var size = getPhotoLightboxBaseSize();
  if (!size || photoLightboxState.scale <= PHOTO_LIGHTBOX_MIN_SCALE) {
    photoLightboxState.x = 0;
    photoLightboxState.y = 0;
    return;
  }
  var scaledWidth = size.imageWidth * photoLightboxState.scale;
  var scaledHeight = size.imageHeight * photoLightboxState.scale;
  var maxX = Math.max(0, (scaledWidth - size.stageWidth) / 2);
  var maxY = Math.max(0, (scaledHeight - size.stageHeight) / 2);
  photoLightboxState.x = Math.max(-maxX, Math.min(maxX, photoLightboxState.x));
  photoLightboxState.y = Math.max(-maxY, Math.min(maxY, photoLightboxState.y));
}

function resetPhotoLightboxView() {
  photoLightboxState.scale = PHOTO_LIGHTBOX_MIN_SCALE;
  photoLightboxState.x = 0;
  photoLightboxState.y = 0;
  photoLightboxState.pointers = {};
  photoLightboxState.dragStart = null;
  photoLightboxState.pinchStart = null;
  photoLightboxState.pointerMoved = false;
  photoLightboxState.suppressStageClick = false;
  photoLightboxState.stageClickStartedOnImage = false;
  var stage = document.getElementById('photo-lightbox-stage');
  if (stage) stage.classList.remove('is-dragging');
  renderPhotoLightboxTransform();
}

function setPhotoLightboxScale(nextScale, originClientX, originClientY) {
  var previousScale = photoLightboxState.scale;
  var normalized = Math.max(PHOTO_LIGHTBOX_MIN_SCALE, Math.min(PHOTO_LIGHTBOX_MAX_SCALE, Number(nextScale) || PHOTO_LIGHTBOX_MIN_SCALE));
  if (normalized === previousScale) return;

  var stage = document.getElementById('photo-lightbox-stage');
  if (stage && typeof originClientX === 'number' && typeof originClientY === 'number') {
    var rect = stage.getBoundingClientRect();
    var relativeX = originClientX - (rect.left + rect.width / 2);
    var relativeY = originClientY - (rect.top + rect.height / 2);
    var ratio = normalized / previousScale;
    photoLightboxState.x = relativeX - (relativeX - photoLightboxState.x) * ratio;
    photoLightboxState.y = relativeY - (relativeY - photoLightboxState.y) * ratio;
  }
  photoLightboxState.scale = normalized;
  clampPhotoLightboxPan();
  renderPhotoLightboxTransform();
}

function zoomPhotoLightbox(direction) {
  if (!isPhotoLightboxOpen()) return false;
  var factor = direction > 0 ? PHOTO_LIGHTBOX_ZOOM_FACTOR : 1 / PHOTO_LIGHTBOX_ZOOM_FACTOR;
  setPhotoLightboxScale(photoLightboxState.scale * factor);
  return true;
}

function openPhotoLightbox(dataUri, trigger, label) {
  if (isEditMode || !dataUri) return false;
  var dialog = document.getElementById('photo-lightbox');
  var image = document.getElementById('photo-lightbox-image');
  var closeButton = document.getElementById('photo-lightbox-close');
  if (!dialog || !image || !closeButton) return false;

  photoLightboxState.open = true;
  photoLightboxState.returnFocus = trigger && typeof trigger.focus === 'function' ? trigger : null;
  resetPhotoLightboxView();
  image.alt = label ? String(label) + 'の拡大写真' : 'ホットスポットの拡大写真';
  image.src = dataUri;
  dialog.hidden = false;
  document.body.classList.add('photo-lightbox-open');
  closeButton.focus();
  requestAnimationFrame(function () {
    if (!isPhotoLightboxOpen()) return;
    clampPhotoLightboxPan();
    renderPhotoLightboxTransform();
  });
  return true;
}

function closePhotoLightbox(options) {
  var opts = options || {};
  var dialog = document.getElementById('photo-lightbox');
  var image = document.getElementById('photo-lightbox-image');
  if (!dialog || !photoLightboxState.open) return false;
  var returnFocus = photoLightboxState.returnFocus;

  dialog.hidden = true;
  document.body.classList.remove('photo-lightbox-open');
  photoLightboxState.open = false;
  photoLightboxState.returnFocus = null;
  resetPhotoLightboxView();
  if (image) {
    image.removeAttribute('src');
    image.alt = '';
  }
  if (opts.restoreFocus !== false && returnFocus && returnFocus.isConnected && typeof returnFocus.focus === 'function') {
    returnFocus.focus();
  }
  return true;
}

function initializePhotoLightbox() {
  var dialog = document.getElementById('photo-lightbox');
  var stage = document.getElementById('photo-lightbox-stage');
  var image = document.getElementById('photo-lightbox-image');
  if (!dialog || !stage || !image) return;

  function pointerList() {
    return Object.keys(photoLightboxState.pointers).map(function (key) {
      return photoLightboxState.pointers[key];
    });
  }

  function distance(left, right) {
    var dx = right.x - left.x;
    var dy = right.y - left.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function midpoint(left, right) {
    return { x: (left.x + right.x) / 2, y: (left.y + right.y) / 2 };
  }

  stage.addEventListener('wheel', function (evt) {
    if (!isPhotoLightboxOpen()) return;
    evt.preventDefault();
    evt.stopPropagation();
    var factor = evt.deltaY < 0 ? PHOTO_LIGHTBOX_ZOOM_FACTOR : 1 / PHOTO_LIGHTBOX_ZOOM_FACTOR;
    setPhotoLightboxScale(photoLightboxState.scale * factor, evt.clientX, evt.clientY);
  }, { passive: false });

  stage.addEventListener('pointerdown', function (evt) {
    if (!isPhotoLightboxOpen() || (evt.pointerType === 'mouse' && evt.button !== 0)) return;
    evt.preventDefault();
    evt.stopPropagation();
    photoLightboxState.pointers[evt.pointerId] = { id: evt.pointerId, x: evt.clientX, y: evt.clientY };
    if (Object.keys(photoLightboxState.pointers).length === 1) {
      photoLightboxState.pointerMoved = false;
      photoLightboxState.stageClickStartedOnImage = evt.target === image;
    }
    try { stage.setPointerCapture(evt.pointerId); } catch (error) { /* capture is optional */ }
    var pointers = pointerList();
    stage.classList.add('is-dragging');
    if (pointers.length >= 2) {
      var startMidpoint = midpoint(pointers[0], pointers[1]);
      photoLightboxState.pinchStart = {
        distance: Math.max(1, distance(pointers[0], pointers[1])),
        scale: photoLightboxState.scale,
        x: photoLightboxState.x,
        y: photoLightboxState.y,
        midpoint: startMidpoint
      };
      photoLightboxState.dragStart = null;
    } else {
      photoLightboxState.dragStart = {
        pointerX: evt.clientX,
        pointerY: evt.clientY,
        x: photoLightboxState.x,
        y: photoLightboxState.y
      };
    }
  });

  stage.addEventListener('pointermove', function (evt) {
    if (!photoLightboxState.pointers[evt.pointerId]) return;
    evt.preventDefault();
    evt.stopPropagation();
    photoLightboxState.pointers[evt.pointerId].x = evt.clientX;
    photoLightboxState.pointers[evt.pointerId].y = evt.clientY;
    photoLightboxState.pointerMoved = true;
    var pointers = pointerList();
    if (pointers.length >= 2 && photoLightboxState.pinchStart) {
      var currentDistance = Math.max(1, distance(pointers[0], pointers[1]));
      var currentMidpoint = midpoint(pointers[0], pointers[1]);
      photoLightboxState.scale = Math.max(
        PHOTO_LIGHTBOX_MIN_SCALE,
        Math.min(PHOTO_LIGHTBOX_MAX_SCALE, photoLightboxState.pinchStart.scale * currentDistance / photoLightboxState.pinchStart.distance)
      );
      photoLightboxState.x = photoLightboxState.pinchStart.x + currentMidpoint.x - photoLightboxState.pinchStart.midpoint.x;
      photoLightboxState.y = photoLightboxState.pinchStart.y + currentMidpoint.y - photoLightboxState.pinchStart.midpoint.y;
    } else if (pointers.length === 1 && photoLightboxState.dragStart && photoLightboxState.scale > PHOTO_LIGHTBOX_MIN_SCALE) {
      photoLightboxState.x = photoLightboxState.dragStart.x + evt.clientX - photoLightboxState.dragStart.pointerX;
      photoLightboxState.y = photoLightboxState.dragStart.y + evt.clientY - photoLightboxState.dragStart.pointerY;
    }
    clampPhotoLightboxPan();
    renderPhotoLightboxTransform();
  });

  function finishPointer(evt) {
    if (!photoLightboxState.pointers[evt.pointerId]) return;
    delete photoLightboxState.pointers[evt.pointerId];
    try {
      if (stage.hasPointerCapture(evt.pointerId)) stage.releasePointerCapture(evt.pointerId);
    } catch (error) { /* capture is optional */ }
    var pointers = pointerList();
    photoLightboxState.pinchStart = null;
    if (pointers.length === 1) {
      photoLightboxState.dragStart = {
        pointerX: pointers[0].x,
        pointerY: pointers[0].y,
        x: photoLightboxState.x,
        y: photoLightboxState.y
      };
    } else {
      photoLightboxState.dragStart = null;
      stage.classList.remove('is-dragging');
      if (photoLightboxState.pointerMoved) {
        photoLightboxState.suppressStageClick = true;
        setTimeout(function () { photoLightboxState.suppressStageClick = false; }, 0);
      }
      photoLightboxState.pointerMoved = false;
    }
  }

  stage.addEventListener('pointerup', finishPointer);
  stage.addEventListener('pointercancel', finishPointer);
  stage.addEventListener('click', function (evt) {
    var startedOnImage = photoLightboxState.stageClickStartedOnImage;
    photoLightboxState.stageClickStartedOnImage = false;
    if (!isPhotoLightboxOpen() || evt.target !== stage || startedOnImage) return;
    if (photoLightboxState.suppressStageClick) {
      photoLightboxState.suppressStageClick = false;
      return;
    }
    closePhotoLightbox();
  });
  image.addEventListener('load', function () {
    if (!isPhotoLightboxOpen()) return;
    resetPhotoLightboxView();
  });
  window.addEventListener('resize', function () {
    if (!isPhotoLightboxOpen()) return;
    clampPhotoLightboxPan();
    renderPhotoLightboxTransform();
  });
  dialog.addEventListener('keydown', function (evt) {
    if (evt.key !== 'Tab' || !isPhotoLightboxOpen()) return;
    var controls = Array.from(dialog.querySelectorAll('button:not([disabled])'));
    if (!controls.length) return;
    var first = controls[0];
    var last = controls[controls.length - 1];
    if (evt.shiftKey && document.activeElement === first) {
      evt.preventDefault();
      last.focus();
    } else if (!evt.shiftKey && document.activeElement === last) {
      evt.preventDefault();
      first.focus();
    }
  });
}
