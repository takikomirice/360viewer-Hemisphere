      cleanupHotspotMovePreview();
      var confirmedHotspot = result.hotspot || saveData;
      target.pitch = coordinates.pitch;
      target.yaw = coordinates.yaw;
      updateSpotInViewer(target, confirmedHotspot);
      if (result.partialSuccess) {
        showToast('ホットスポットを移動しました。' + (result.warning || '古い写真の整理に失敗しました。'), 'warning');
      } else {
        showToast('ホットスポットを移動しました！', 'success');
      }
    })
    .withFailureHandler(function () {
      if (!isPendingHotspotMoveRequest(generation, startSceneId, target)) return;
      if (!isCurrentHotspotMoveRequest(generation, startSceneId, target)) {
        cleanupHotspotMovePreview();
        return;
      }
      cancelHotspotMove(
        '通信エラーが発生しました。元の位置へ戻しました。',
        { type: 'error', allowDuringSave: true }
      );
    })
    .updateHotspot(withEditToken(saveData), target.id);
  return true;
}

function updateMarkerStyleSummary(shape, color, icon) {
  var normalizedShape = normalizeMarkerShape(shape);
  var normalizedColor = normalizeMarkerColor(color);
  var normalizedIcon = normalizeMarkerIcon(icon);
  var preview = document.getElementById('marker-style-preview');
  var previewIcon = preview.querySelector('.hs-marker-core');
  var summary = document.getElementById('marker-style-summary-text');
  applyMarkerClasses(preview, normalizedShape, normalizedColor);
  applyMarkerIconClass(previewIcon, normalizedIcon);
  summary.textContent = MARKER_SHAPE_LABELS[normalizedShape] + '・' + MARKER_COLOR_LABELS[normalizedColor] + '・' + MARKER_ICON_LABELS[normalizedIcon];
}

function loadMarkerStylePreference() {
  try {
    lastMarkerShape = normalizeMarkerShape(window.localStorage.getItem('hsMarkerShape'));
    lastMarkerColor = normalizeMarkerColor(window.localStorage.getItem('hsMarkerColor'));
    lastMarkerIcon = normalizeSelectableMarkerIcon(window.localStorage.getItem('hsMarkerIcon'));
  } catch (e) {
    lastMarkerShape = DEFAULT_MARKER_SHAPE;
    lastMarkerColor = DEFAULT_MARKER_COLOR;
    lastMarkerIcon = DEFAULT_MARKER_ICON;
  }
}

function persistMarkerStylePreference(shape, color, icon) {
  var normalizedShape = normalizeMarkerShape(shape);
  var normalizedColor = normalizeMarkerColor(color);
  var normalizedIcon = normalizeSelectableMarkerIcon(icon);
  lastMarkerShape = normalizedShape;
  lastMarkerColor = normalizedColor;
  lastMarkerIcon = normalizedIcon;
  try {
    window.localStorage.setItem('hsMarkerShape', normalizedShape);
    window.localStorage.setItem('hsMarkerColor', normalizedColor);
    window.localStorage.setItem('hsMarkerIcon', normalizedIcon);
  } catch (e) {
    // localStorage が使えない環境でもメモリ上の既定値は維持する
  }
  updateMarkerStyleSummary(normalizedShape, normalizedColor, normalizedIcon);
}

function syncMarkerStyleInputsFromPreference() {
  var shapeInput = document.getElementById('marker-shape');
  var colorInput = document.getElementById('marker-color');
  shapeInput.value = lastMarkerShape;
  colorInput.value = lastMarkerColor;
  setMarkerIconSelectValue(lastMarkerIcon, false);
  updateMarkerStyleSummary(lastMarkerShape, lastMarkerColor, lastMarkerIcon);
}

function syncMarkerStyleSummaryFromInputs() {
  var shapeInput = document.getElementById('marker-shape');
  var colorInput = document.getElementById('marker-color');
  var iconInput = document.getElementById('marker-icon');
  updateMarkerStyleSummary(shapeInput.value, colorInput.value, iconInput.value);
  updateHotspotDraftAppearance();
}

function isHotspotBottomSheetViewport() {
  return window.innerWidth <= 600;
}

function positionHotspotPopup(clientX, clientY) {
  var popup = document.getElementById('hotspot-popup');
  if (!popup || !popup.classList.contains('visible')) return false;
  var visualViewport = window.visualViewport;
  var bounds = visualViewport
    ? {
        left: visualViewport.offsetLeft,
        top: visualViewport.offsetTop,
        width: visualViewport.width,
        height: visualViewport.height
      }
    : { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
  bounds.right = bounds.left + bounds.width;
  bounds.bottom = bounds.top + bounds.height;

  popup.style.setProperty('--hotspot-visual-left', Math.max(0, bounds.left) + 'px');
  popup.style.setProperty('--hotspot-visual-right', Math.max(0, window.innerWidth - bounds.right) + 'px');
  popup.style.setProperty('--hotspot-visual-bottom', Math.max(0, window.innerHeight - bounds.bottom) + 'px');
  popup.style.setProperty('--hotspot-visual-height', Math.max(1, bounds.height) + 'px');

  if (isHotspotBottomSheetViewport()) {
    popup.style.left = '';
    popup.style.right = '';
    popup.style.top = '';
    popup.style.bottom = '';
    return true;
  }

  var width = popup.offsetWidth || 340;
  var height = popup.offsetHeight || Math.min(460, bounds.height - 20);
  var anchorX = isFinite(clientX) ? Number(clientX) : hotspotFormSessionState.anchorClientX;
  var anchorY = isFinite(clientY) ? Number(clientY) : hotspotFormSessionState.anchorClientY;
  var minLeft = bounds.left + 10;
  var minTop = bounds.top + 10;
  var maxLeft = Math.max(minLeft, bounds.right - width - 10);
  var maxTop = Math.max(minTop, bounds.bottom - height - 10);
  var left = Math.min(Math.max(anchorX + 12, minLeft), maxLeft);
  var top = Math.min(Math.max(anchorY - 20, minTop), maxTop);
  popup.style.left = left + 'px';
  popup.style.right = 'auto';
  popup.style.top = top + 'px';
  popup.style.bottom = 'auto';
  return true;
}

function repositionHotspotPopupWithinViewport() {
  return positionHotspotPopup(
    hotspotFormSessionState.anchorClientX,
    hotspotFormSessionState.anchorClientY
  );
}

function scheduleHotspotPopupReposition() {
  if (!isHotspotFormSessionActive() || hotspotPopupLayoutFrame !== null) return;
  hotspotPopupLayoutFrame = requestAnimationFrame(function () {
    hotspotPopupLayoutFrame = null;
    repositionHotspotPopupWithinViewport();
  });
}

function initializeHotspotPopupViewportTracking() {
  if (hotspotPopupViewportTrackingInitialized) return;
  hotspotPopupViewportTrackingInitialized = true;
  window.addEventListener('resize', scheduleHotspotPopupReposition);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', scheduleHotspotPopupReposition);
    window.visualViewport.addEventListener('scroll', scheduleHotspotPopupReposition);
  }
}

function setMarkerStylePanelExpanded(isExpanded) {
  document.getElementById('marker-style-panel').classList.toggle('expanded', isExpanded);
  scheduleHotspotPopupReposition();
}

function toggleMarkerStylePanel() {
  var panel = document.getElementById('marker-style-panel');
  setMarkerStylePanelExpanded(!panel.classList.contains('expanded'));
}

/**
 * ポップアップの表示モードを切り替える
 * @param {string} mode  'type' | 'info' | 'jump'
 */
function setPopupMode(mode) {
  var inFolderMode = !!(allImages && allImages.length > 0);
  currentPopupMode = mode;
  var typeSelector = document.getElementById('hs-type-selector');
  var form         = document.getElementById('hs-form');
  var typeFooter   = document.getElementById('hs-type-footer');
  var formFooter   = document.getElementById('hs-form-footer');
  var infoFields   = document.getElementById('hs-info-fields');
  var jumpFields   = document.getElementById('hs-jump-fields');
  var photoGroup   = document.getElementById('photo-select-group');
  var backBtn      = document.getElementById('hs-back-btn');
  var typeBackBtn  = document.getElementById('hs-type-back-btn');
  var labelGroup   = document.getElementById('input-label-group');
  var labelInput   = document.getElementById('input-label');
  var positionControls = document.getElementById('hs-position-controls');
  if (positionControls) positionControls.style.display = editingHotspot ? 'none' : '';
  if (labelGroup) labelGroup.style.display = mode === 'jump' ? 'none' : '';
  if (labelInput) {
    labelInput.disabled = mode === 'jump';
    labelInput.required = mode !== 'jump';
  }

  if (mode === 'type') {
    typeSelector.style.display = '';
    form.style.display         = 'none';
    typeFooter.style.display   = 'flex';
    formFooter.style.display   = 'none';
    document.getElementById('popup-header-title').textContent = 'ホットスポットを追加';
  } else {
    typeSelector.style.display = 'none';
    form.style.display         = 'flex';
    typeFooter.style.display   = 'none';
    formFooter.style.display   = 'flex';
    infoFields.style.display   = mode === 'info' ? '' : 'none';
    jumpFields.style.display   = mode === 'jump' ? '' : 'none';
    // 写真アップロードは単一画像／フォルダの双方で情報モードに表示する。
    if (photoGroup) photoGroup.style.display = mode === 'info' ? '' : 'none';
    // 新規追加×フォルダモードでは種類選択へ戻る操作も残し、キャンセルは常設する。
    var canGoBack = !editingHotspot && inFolderMode;
    if (typeBackBtn) typeBackBtn.style.display = canGoBack ? '' : 'none';
    backBtn.textContent = 'キャンセル';
    // タイトル・保存ボタンテキスト
    if (!editingHotspot) {
      document.getElementById('popup-header-title').textContent =
        mode === 'jump' ? 'ジャンプスポットを追加' : '情報スポットを追加';
      document.getElementById('save-label').textContent = '保存する';
    }
    setMarkerStylePanelExpanded(false);
    setTimeout(function () {
      var popup = document.getElementById('hotspot-popup');
      if (!popup || !popup.classList.contains('visible')) return;
      if (document.activeElement &&
          popup.contains(document.activeElement) &&
          document.activeElement.offsetParent !== null) return;
      document.getElementById(mode === 'jump' ? 'input-jump-scene' : 'input-label').focus();
    }, 60);
  }
  scheduleHotspotPopupReposition();
}

/**
 * quiz/info の説明欄を切り替える。
 * isQuiz=true → 質問・答えの2欄を表示、通常説明欄を非表示
 */
function setQuizDescMode(isQuiz) {
  document.getElementById('hs-desc-group').style.display      = isQuiz ? 'none' : '';
  document.getElementById('hs-quiz-desc-group').style.display = isQuiz ? '' : 'none';
  scheduleHotspotPopupReposition();
}

/** タイプ選択ボタンクリック */
function selectHotspotType(type) {
  if (type === 'quiz') {
    setPopupMode('info');
    document.getElementById('marker-icon').value = 'quiz';
    syncMarkerStyleSummaryFromInputs();
    document.getElementById('quiz-input-question').value = '';
    document.getElementById('quiz-input-answer').value   = '';
    setQuizDescMode(true);
    document.getElementById('popup-header-title').textContent = 'クイズスポットを追加';
  } else {
    if (type === 'jump' && !editingHotspot) {
      document.getElementById('input-label').value = '';
    }
    setPopupMode(type);
    var markerIconInput = document.getElementById('marker-icon');
    if (normalizeMarkerIcon(markerIconInput.value) === 'quiz') {
      markerIconInput.value = DEFAULT_MARKER_ICON;
      syncMarkerStyleSummaryFromInputs();
    }
    setQuizDescMode(false);
  }
}

/** フォーム画面の「戻る / キャンセル」ボタン */
function onHotspotTypeBackClick() {
  var inFolderMode = !!(allImages && allImages.length > 0);
  if (!editingHotspot && inFolderMode) {
    setPopupMode('type');
  }
}

// =============================================
//  ホットスポットマーカー要素の生成
//  Pannellumの createTooltipFunc として呼ばれる
// =============================================
function buildMarkerElement(container, args) {
  renderMarkerAppearance(
    container,
    args && args.markerShape,
    args && args.markerColor,
    args && args.markerIcon
  );

  // 編集モード: 右クリックでコンテキストメニューを表示
  container.addEventListener('contextmenu', function (evt) {
    if (!canEdit || !isEditMode) return;
    evt.preventDefault();
    evt.stopPropagation();
    openHotspotContextMenu(evt, args, container);
  });

  // ホバーツールチップ
  if (args && args.jumpSceneId) {
    // ジャンプ先がある場合: ジャンプ先シーン名を表示
    container.addEventListener('mouseenter', function () {
      if (isEditMode) return;
      showJumpTooltip(container, args.jumpSceneId, args.label);
    });
    container.addEventListener('mouseleave', function () {
      hideJumpTooltip();
    });
  } else if (args && args.label) {
    // 通常ホットスポット: ラベルを表示
    container.addEventListener('mouseenter', function () {
      if (isEditMode) return;
      showLabelTooltip(container, args.label);
    });
    container.addEventListener('mouseleave', function () {
      hideJumpTooltip();
    });
  }
}

// =============================================
//  閲覧モード: マーカークリックで情報を表示
// =============================================
function onMarkerClick(evt, args) {
  if (isEditMode) return; // 編集モード中は無効

  // ジャンプ機能: jumpSceneId が設定されていればシーン移動
  if (args && args.jumpSceneId) {
    hideJumpTooltip();
    var target = getSceneImageById(args.jumpSceneId);
    if (target) {
      stopGyroIfActive('jump');
      previousSceneId = currentFileId; // 振り返り視点用: 移動前のシーンIDを記憶
      loadScene(target);
    } else {
      showToast('ジャンプ先のシーンが見つかりません。', 'error');
    }
    return;
  }

  // クイズモード: icon が 'quiz' の場合はフリップカードモーダルを表示
  if (args && args.markerIcon === 'quiz') {
    var quizOverlay = document.getElementById('quiz-modal-overlay');
    var quizCard    = document.getElementById('quiz-card');
    var parts       = (args.description || '').split('|');
    var question    = parts[0].trim() || '問題が設定されていません';
    var answer      = parts.length > 1 ? parts[1].trim() : '答えが設定されていません';
    var linkUrl     = normalizeHttpUrl(args.linkUrl);

    document.getElementById('quiz-card-title').textContent    = args.label || 'クイズ';
    document.getElementById('quiz-card-question').innerHTML = escapeHtml(question).replace(/\r?\n|\r/g, '<br>');
    document.getElementById('quiz-card-answer').innerHTML   = escapeHtml(answer).replace(/\r?\n|\r/g, '<br>');

    var linkEl = document.getElementById('quiz-card-link');
    if (linkUrl) {
      linkEl.href = linkUrl;
      linkEl.classList.remove('hidden');
    } else {
      linkEl.href = '#';
      linkEl.classList.add('hidden');
    }

    quizCard.classList.remove('is-flipped');
    quizOverlay.classList.remove('hidden');
    return;
  }

  // 情報表示モード: 既存のポップアップを閉じる
  var existing = document.getElementById('active-info-popup');
  if (existing) existing.remove();

  var popup = document.createElement('div');
  popup.id = 'active-info-popup';
  popup.className = 'info-popup';
  var useMobileInfoSheet = isPublicViewingMode() && isSmallViewport();
  if (useMobileInfoSheet) popup.classList.add('mobile-info-sheet');

  // 画面端からはみ出ないよう位置を補正
  if (!useMobileInfoSheet) {
    var x = Math.min(evt.clientX + 12, window.innerWidth  - 310);
    var y = Math.max(evt.clientY - 110, 68);
    y = Math.min(y, window.innerHeight - 180);
    popup.style.left = x + 'px';
    popup.style.top  = y + 'px';
  }

  var linkUrl = normalizeHttpUrl(args && args.linkUrl);
  var linkHtml = '';
  if (linkUrl) {
    linkHtml =
      '<div style="margin-top:10px">' +
      '  <a href="' + escapeHtml(linkUrl) + '" target="_blank" rel="noopener noreferrer" ' +
      '     style="font-size:13px;font-weight:600;color:#2563eb;text-decoration:underline">' +
      '    リンクを開く' +
      '  </a>' +
      '</div>';
  }

  // 写真プレースホルダー（写真IDがあれば後から差し替え）
  var photoHtml = '';
  if (args && args.photoId) {
    photoHtml = '<div class="info-popup-photo-placeholder" id="popup-photo-area">写真を読み込んでいます...</div>';
  }

  popup.innerHTML =
    '<div class="info-popup-header">' +
    '  <span class="info-popup-title">' + escapeHtml(args.label) + '</span>' +
    '  <button class="info-popup-close" onclick="document.getElementById(\'active-info-popup\').remove()">&times;</button>' +
    '</div>' +
    '<div class="info-popup-divider"></div>' +
    photoHtml +
    (args.description ? '<p class="info-popup-body">' + escapeHtml(args.description).replace(/\r?\n|\r/g, '<br>') + '</p>' : '') +
    linkHtml;

  document.getElementById('ui-overlay').appendChild(popup);

  // 写真の遅延ロード
  if (args && args.photoId) {
    renderPhotoInPopup(popup, args);
  }
}

/**
 * 情報ポップアップに写真を表示する（GASから取得、キャッシュあり）
 */
function renderPhotoInPopup(popup, args) {
  var fileId = String(args && args.fileId || currentFileId || '');
  var hotspotId = String(args && args.id || '');
  var photoId = String(args && args.photoId || '');
  var cacheKey = [fileId, hotspotId, photoId].join('|');
  function showPhotoInArea(dataUri) {
    var area = popup.querySelector('#popup-photo-area');
    if (!area) return;
    var button = document.createElement('button');
    button.type = 'button';
    button.className = 'info-popup-photo-button';
    button.setAttribute('aria-label', '写真を拡大表示');
    button.title = '写真を拡大表示';
    var img = document.createElement('img');
    img.className = 'info-popup-photo';
    img.src = dataUri;
    img.alt = args && args.label ? String(args.label) + 'の写真' : 'ホットスポットの写真';
    button.appendChild(img);
    button.addEventListener('click', function () {
      openPhotoLightbox(dataUri, button, args && args.label);
    });
    area.parentNode.replaceChild(button, area);
  }

  // キャッシュあり
  if (photoCache[cacheKey]) {
    showPhotoInArea(photoCache[cacheKey]);
    return;
  }

  google.script.run
    .withSuccessHandler(function (result) {
      var area = popup.querySelector('#popup-photo-area');
      if (!area) return; // popup が閉じられた場合
      if (result && result.success) {
        photoCache[cacheKey] = result.dataUri;
        showPhotoInArea(result.dataUri);
      } else {
        area.textContent = '写真を読み込めませんでした';
      }
    })
    .withFailureHandler(function () {
      var area = popup.querySelector('#popup-photo-area');
      if (area) area.textContent = '写真を読み込めませんでした';
    })
    .getHotspotPhotoDataUri({
      fileId: fileId,
      hotspotId: hotspotId,
      photoId: photoId
    });
}

function isPhotoLightboxOpen() {
  return !!photoLightboxState.open;
}

function renderPhotoLightboxTransform() {
  var image = document.getElementById('photo-lightbox-image');
  var stage = document.getElementById('photo-lightbox-stage');
  if (!image || !stage) return;
  image.style.transform = 'translate3d(' + photoLightboxState.x + 'px,' + photoLightboxState.y + 'px,0) scale(' + photoLightboxState.scale + ')';
  stage.classList.toggle('can-pan', photoLightboxState.scale > PHOTO_LIGHTBOX_MIN_SCALE);
}

function getPhotoLightboxBaseSize() {
  var image = document.getElementById('photo-lightbox-image');
  var stage = document.getElementById('photo-lightbox-stage');
  if (!image || !stage || !(image.naturalWidth > 0) || !(image.naturalHeight > 0)) return null;
  var width = Math.max(0, stage.clientWidth);
  var height = Math.max(0, stage.clientHeight);
  if (!width || !height) return null;
  var fit = Math.min(1, width / image.naturalWidth, height / image.naturalHeight);
  return {
    stageWidth: width,
    stageHeight: height,
    imageWidth: image.naturalWidth * fit,
    imageHeight: image.naturalHeight * fit
  };
}

/** 拡大画像の端が表示領域より内側へ抜けない範囲にパンを制限する。 */
function clampPhotoLightboxPan() {
  var size = getPhotoLightboxBaseSize();
  if (!size || photoLightboxState.scale <= PHOTO_LIGHTBOX_MIN_SCALE) {
    photoLightboxState.x = 0;
    photoLightboxState.y = 0;
    return;
  }
  var scaledWidth = size.imageWidth * photoLightboxState.scale;
  var scaledHeight = size.imageHeight * photoLightboxState.scale;
  var maxX = Math.max(0, (scaledWidth - size.stageWidth) / 2);
  var maxY = Math.max(0, (scaledHeight - size.stageHeight) / 2);
  photoLightboxState.x = Math.max(-maxX, Math.min(maxX, photoLightboxState.x));
  photoLightboxState.y = Math.max(-maxY, Math.min(maxY, photoLightboxState.y));
}

function resetPhotoLightboxView() {
  photoLightboxState.scale = PHOTO_LIGHTBOX_MIN_SCALE;
  photoLightboxState.x = 0;
  photoLightboxState.y = 0;
  photoLightboxState.pointers = {};
  photoLightboxState.dragStart = null;
  photoLightboxState.pinchStart = null;
  photoLightboxState.pointerMoved = false;
  photoLightboxState.suppressStageClick = false;
  photoLightboxState.stageClickStartedOnImage = false;
  var stage = document.getElementById('photo-lightbox-stage');
  if (stage) stage.classList.remove('is-dragging');
  renderPhotoLightboxTransform();
}

function setPhotoLightboxScale(nextScale, originClientX, originClientY) {
  var previousScale = photoLightboxState.scale;
  var normalized = Math.max(PHOTO_LIGHTBOX_MIN_SCALE, Math.min(PHOTO_LIGHTBOX_MAX_SCALE, Number(nextScale) || PHOTO_LIGHTBOX_MIN_SCALE));
  if (normalized === previousScale) return;

  var stage = document.getElementById('photo-lightbox-stage');
  if (stage && typeof originClientX === 'number' && typeof originClientY === 'number') {
    var rect = stage.getBoundingClientRect();
    var relativeX = originClientX - (rect.left + rect.width / 2);
    var relativeY = originClientY - (rect.top + rect.height / 2);
    var ratio = normalized / previousScale;
    photoLightboxState.x = relativeX - (relativeX - photoLightboxState.x) * ratio;
    photoLightboxState.y = relativeY - (relativeY - photoLightboxState.y) * ratio;
  }
  photoLightboxState.scale = normalized;
  clampPhotoLightboxPan();
  renderPhotoLightboxTransform();
}

function zoomPhotoLightbox(direction) {
  if (!isPhotoLightboxOpen()) return false;
  var factor = direction > 0 ? PHOTO_LIGHTBOX_ZOOM_FACTOR : 1 / PHOTO_LIGHTBOX_ZOOM_FACTOR;
  setPhotoLightboxScale(photoLightboxState.scale * factor);
  return true;
}

function openPhotoLightbox(dataUri, trigger, label) {
  if (isEditMode || !dataUri) return false;
  var dialog = document.getElementById('photo-lightbox');
  var image = document.getElementById('photo-lightbox-image');
  var closeButton = document.getElementById('photo-lightbox-close');
  if (!dialog || !image || !closeButton) return false;

  photoLightboxState.open = true;
  photoLightboxState.returnFocus = trigger && typeof trigger.focus === 'function' ? trigger : null;
  resetPhotoLightboxView();
  image.alt = label ? String(label) + 'の拡大写真' : 'ホットスポットの拡大写真';
  image.src = dataUri;
  dialog.hidden = false;
  document.body.classList.add('photo-lightbox-open');
  closeButton.focus();
  requestAnimationFrame(function () {
    if (!isPhotoLightboxOpen()) return;
    clampPhotoLightboxPan();
    renderPhotoLightboxTransform();
  });
  return true;
}

function closePhotoLightbox(options) {
  var opts = options || {};
  var dialog = document.getElementById('photo-lightbox');
  var image = document.getElementById('photo-lightbox-image');
  if (!dialog || !photoLightboxState.open) return false;
  var returnFocus = photoLightboxState.returnFocus;

  dialog.hidden = true;
  document.body.classList.remove('photo-lightbox-open');
  photoLightboxState.open = false;
  photoLightboxState.returnFocus = null;
  resetPhotoLightboxView();
  if (image) {
    image.removeAttribute('src');
    image.alt = '';
  }
  if (opts.restoreFocus !== false && returnFocus && returnFocus.isConnected && typeof returnFocus.focus === 'function') {
    returnFocus.focus();
  }
  return true;
}

function initializePhotoLightbox() {
  var dialog = document.getElementById('photo-lightbox');
  var stage = document.getElementById('photo-lightbox-stage');
  var image = document.getElementById('photo-lightbox-image');
  if (!dialog || !stage || !image) return;

  function pointerList() {
    return Object.keys(photoLightboxState.pointers).map(function (key) {
      return photoLightboxState.pointers[key];
    });
  }

  function distance(left, right) {
    var dx = right.x - left.x;
    var dy = right.y - left.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function midpoint(left, right) {
    return { x: (left.x + right.x) / 2, y: (left.y + right.y) / 2 };
  }

  stage.addEventListener('wheel', function (evt) {
    if (!isPhotoLightboxOpen()) return;
    evt.preventDefault();
    evt.stopPropagation();
    var factor = evt.deltaY < 0 ? PHOTO_LIGHTBOX_ZOOM_FACTOR : 1 / PHOTO_LIGHTBOX_ZOOM_FACTOR;
    setPhotoLightboxScale(photoLightboxState.scale * factor, evt.clientX, evt.clientY);
  }, { passive: false });

  stage.addEventListener('pointerdown', function (evt) {
    if (!isPhotoLightboxOpen() || (evt.pointerType === 'mouse' && evt.button !== 0)) return;
    evt.preventDefault();
    evt.stopPropagation();
    photoLightboxState.pointers[evt.pointerId] = { id: evt.pointerId, x: evt.clientX, y: evt.clientY };
    if (Object.keys(photoLightboxState.pointers).length === 1) {
      photoLightboxState.pointerMoved = false;
      photoLightboxState.stageClickStartedOnImage = evt.target === image;
    }
    try { stage.setPointerCapture(evt.pointerId); } catch (error) { /* capture is optional */ }
    var pointers = pointerList();
    stage.classList.add('is-dragging');
    if (pointers.length >= 2) {
      var startMidpoint = midpoint(pointers[0], pointers[1]);
      photoLightboxState.pinchStart = {
        distance: Math.max(1, distance(pointers[0], pointers[1])),
        scale: photoLightboxState.scale,
        x: photoLightboxState.x,
        y: photoLightboxState.y,
        midpoint: startMidpoint
      };
      photoLightboxState.dragStart = null;
    } else {
      photoLightboxState.dragStart = {
        pointerX: evt.clientX,
        pointerY: evt.clientY,
        x: photoLightboxState.x,
        y: photoLightboxState.y
      };
    }
  });

  stage.addEventListener('pointermove', function (evt) {
    if (!photoLightboxState.pointers[evt.pointerId]) return;
    evt.preventDefault();
    evt.stopPropagation();
    photoLightboxState.pointers[evt.pointerId].x = evt.clientX;
    photoLightboxState.pointers[evt.pointerId].y = evt.clientY;
    photoLightboxState.pointerMoved = true;
    var pointers = pointerList();
    if (pointers.length >= 2 && photoLightboxState.pinchStart) {
      var currentDistance = Math.max(1, distance(pointers[0], pointers[1]));
      var currentMidpoint = midpoint(pointers[0], pointers[1]);
      photoLightboxState.scale = Math.max(
        PHOTO_LIGHTBOX_MIN_SCALE,
        Math.min(PHOTO_LIGHTBOX_MAX_SCALE, photoLightboxState.pinchStart.scale * currentDistance / photoLightboxState.pinchStart.distance)
      );
      photoLightboxState.x = photoLightboxState.pinchStart.x + currentMidpoint.x - photoLightboxState.pinchStart.midpoint.x;
      photoLightboxState.y = photoLightboxState.pinchStart.y + currentMidpoint.y - photoLightboxState.pinchStart.midpoint.y;
    } else if (pointers.length === 1 && photoLightboxState.dragStart && photoLightboxState.scale > PHOTO_LIGHTBOX_MIN_SCALE) {
      photoLightboxState.x = photoLightboxState.dragStart.x + evt.clientX - photoLightboxState.dragStart.pointerX;
      photoLightboxState.y = photoLightboxState.dragStart.y + evt.clientY - photoLightboxState.dragStart.pointerY;
    }
    clampPhotoLightboxPan();
    renderPhotoLightboxTransform();
  });

  function finishPointer(evt) {
    if (!photoLightboxState.pointers[evt.pointerId]) return;
    delete photoLightboxState.pointers[evt.pointerId];
    try {
      if (stage.hasPointerCapture(evt.pointerId)) stage.releasePointerCapture(evt.pointerId);
    } catch (error) { /* capture is optional */ }
    var pointers = pointerList();
    photoLightboxState.pinchStart = null;
    if (pointers.length === 1) {
      photoLightboxState.dragStart = {
        pointerX: pointers[0].x,
        pointerY: pointers[0].y,
        x: photoLightboxState.x,
        y: photoLightboxState.y
      };
    } else {
      photoLightboxState.dragStart = null;
      stage.classList.remove('is-dragging');
      if (photoLightboxState.pointerMoved) {
        photoLightboxState.suppressStageClick = true;
        setTimeout(function () { photoLightboxState.suppressStageClick = false; }, 0);
      }
      photoLightboxState.pointerMoved = false;
    }
  }

  stage.addEventListener('pointerup', finishPointer);
  stage.addEventListener('pointercancel', finishPointer);
  stage.addEventListener('click', function (evt) {
    var startedOnImage = photoLightboxState.stageClickStartedOnImage;
    photoLightboxState.stageClickStartedOnImage = false;
    if (!isPhotoLightboxOpen() || evt.target !== stage || startedOnImage) return;
    if (photoLightboxState.suppressStageClick) {
      photoLightboxState.suppressStageClick = false;
      return;
    }
    closePhotoLightbox();
  });
  image.addEventListener('load', function () {
    if (!isPhotoLightboxOpen()) return;
    resetPhotoLightboxView();
  });
  window.addEventListener('resize', function () {
    if (!isPhotoLightboxOpen()) return;
    clampPhotoLightboxPan();
    renderPhotoLightboxTransform();
  });
  dialog.addEventListener('keydown', function (evt) {
    if (evt.key !== 'Tab' || !isPhotoLightboxOpen()) return;
    var controls = Array.from(dialog.querySelectorAll('button:not([disabled])'));
    if (!controls.length) return;
    var first = controls[0];
    var last = controls[controls.length - 1];
    if (evt.shiftKey && document.activeElement === first) {
      evt.preventDefault();
      last.focus();
    } else if (!evt.shiftKey && document.activeElement === last) {
      evt.preventDefault();
      first.focus();
    }
  });
}

/**
 * ラベルホバーツールチップを表示する（通常ホットスポット用）
 */
function showLabelTooltip(markerEl, label) {
  hideJumpTooltip();
  var tip = document.createElement('div');
  tip.className = 'jump-hover-tooltip';
  tip.textContent = label;

  var rect = markerEl.getBoundingClientRect();
  tip.style.left = (rect.left + rect.width / 2) + 'px';
  tip.style.top  = (rect.top - 44) + 'px';

  document.getElementById('ui-overlay').appendChild(tip);
  activeJumpTooltip = tip;
}

/**
 * ジャンプ先ホバーツールチップを表示する
 */
function getJumpSceneDisplayName(jumpSceneId, savedLabel) {
  var scene = getSceneImageById(jumpSceneId);
  var currentName = scene ? getSceneDisplayName(scene) : '';
  return currentName || String(savedLabel || '').trim() || String(jumpSceneId || '');
}

function showJumpTooltip(markerEl, jumpSceneId, savedLabel) {
  hideJumpTooltip();
  var sceneName = getJumpSceneDisplayName(jumpSceneId, savedLabel);

  var tip = document.createElement('div');
  tip.className = 'jump-hover-tooltip';
  tip.innerHTML =
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">' +
    '<polyline points="9 18 15 12 9 6"/>' +
    '</svg>' +
    escapeHtml(sceneName) + ' へ';

  var rect = markerEl.getBoundingClientRect();
  tip.style.left = (rect.left + rect.width / 2) + 'px';
  tip.style.top  = (rect.top - 44) + 'px';

  document.getElementById('ui-overlay').appendChild(tip);
  activeJumpTooltip = tip;
}

/**
 * ジャンプ先ホバーツールチップを非表示にする
 */
function hideJumpTooltip() {
  if (activeJumpTooltip) {
    activeJumpTooltip.remove();
    activeJumpTooltip = null;
  }
}

// =============================================
//  モード切り替え
// =============================================
function toggleMode(options) {
  var opts = options || {};
  if (!canEdit) {
    if (isHotspotFormSessionActive()) closePopup({ silent: true });
    isEditMode = false;
    document.body.classList.remove('edit-mode-active');
    scheduleAppLayoutMetrics();
    closePopup();
    closeSceneContextMenu();
    closeHotspotContextMenu();
    closeBulkInputDropdown();
    syncDriveFolderButtons();
    syncSceneActionButtons();
    return;
  }
  if (isHotspotFormSessionActive()) {
    if (opts.forceExit && isEditMode) {
      closePopup({ silent: true });
    } else if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('toggle-mode')) {
      return false;
    }
  }
  if (!isEditMode && !opts.fullscreenExitCompleted && (isFullscreenActive_() || fullscreenEntryPromise)) {
    if (editModeFullscreenExitPending) return false;
    editModeFullscreenExitPending = true;
    fullscreenRequestGeneration += 1;
    return exitFullscreenBeforeEdit_().then(function (exited) {
      editModeFullscreenExitPending = false;
      if (!exited || isEditMode) {
        if (!exited) showToast('全画面表示を終了できないため、編集モードへ切り替えられませんでした。', 'error');
        return false;
      }
      var nextOptions = Object.assign({}, opts, { fullscreenExitCompleted: true });
      return toggleMode(nextOptions);
    });
  }
  isEditMode = !isEditMode;
  document.body.classList.toggle('edit-mode-active', isEditMode);
  if (!isEditMode) {
    finishSceneReorderDrag();
    cancelHotspotMove('編集モードを終了したため移動をキャンセルしました。', { silent: true });
  }

  var topbar     = document.getElementById('topbar');
  var badge      = document.getElementById('mode-badge');
  var modeLabel  = document.getElementById('mode-label');
  var toggleLbl  = document.getElementById('toggle-label');
  var toggleIco  = document.getElementById('toggle-icon');
  var editBanner = document.getElementById('edit-banner');
  var panoramaEl = document.getElementById('panorama');
  var sidebar    = document.getElementById('scene-sidebar');
  var expandTab  = document.getElementById('sidebar-expand-tab');

  var bulkInputGroup = document.getElementById('bulk-input-group');

  var uploadBtn = document.getElementById('upload-btn');
  var openFolderBtn = document.getElementById('open-folder-btn');
  var openHotspotPhotoFolderBtn = document.getElementById('open-hotspot-photo-folder-btn');
  var openHotspotPhotoFolderTopbarBtn = document.getElementById('open-hotspot-photo-folder-topbar-btn');

  if (isEditMode) {
    // --- 編集モードへ ---
    closePhotoLightbox({ restoreFocus: false });
    if (bulkInputGroup) bulkInputGroup.style.display = 'flex';
    if (uploadBtn) uploadBtn.style.display = 'block';
    topbar.classList.add('edit-active');
    badge.classList.add('edit-active');
    modeLabel.textContent = '編集中';
    badge.setAttribute('aria-label', '編集中');
    toggleLbl.textContent = '閲覧モード';
    document.getElementById('mode-toggle').setAttribute('aria-label', '閲覧モードに切り替える');
    document.getElementById('mode-toggle').title = '閲覧モードに切り替える';
    toggleIco.innerHTML =
      '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>' +
      '<circle cx="12" cy="12" r="3"/>';
    editBanner.classList.add('visible');
    sidebar.classList.add('with-banner');
    expandTab.classList.add('with-banner');
    panoramaEl.style.cursor = 'crosshair';
    if (viewer) viewer.stopAutoRotate();

    var infoPop = document.getElementById('active-info-popup');
    if (infoPop) infoPop.remove();

    // 2Dモード: 編集用カーソルとバナーテキスト更新
    if (is2DMode) {
      var flatImg = document.getElementById('flat-map-img');
      if (flatImg) flatImg.style.cursor = 'crosshair';
      var editBannerSpan = editBanner.querySelector('span');
      if (editBannerSpan) editBannerSpan.textContent = '編集モードが有効です。2D画像の任意の場所をクリックしてホットスポットを追加できます。';
      render2DHotspots(current2DHotspots); // コンテキストメニューイベントを付け替え
    } else {
      var editBannerSpan = editBanner.querySelector('span');
      if (editBannerSpan) editBannerSpan.textContent = '編集モードが有効です。360度画像の任意の場所をクリックしてホットスポットを追加できます。';
    }

  } else {
    // --- 閲覧モードへ ---
    if (bulkInputGroup) bulkInputGroup.style.display = 'none';
    if (uploadBtn) uploadBtn.style.display = 'none';
    if (openFolderBtn) openFolderBtn.style.display = 'none';
    if (openHotspotPhotoFolderBtn) openHotspotPhotoFolderBtn.style.display = 'none';
    if (openHotspotPhotoFolderTopbarBtn) openHotspotPhotoFolderTopbarBtn.style.display = 'none';
    topbar.classList.remove('edit-active');
    badge.classList.remove('edit-active');
    modeLabel.textContent = '閲覧中';
    badge.setAttribute('aria-label', '閲覧中');
    toggleLbl.textContent = '編集モード';
    document.getElementById('mode-toggle').setAttribute('aria-label', '編集モードに切り替える');
    document.getElementById('mode-toggle').title = '編集モードに切り替える';
    toggleIco.innerHTML =
      '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>' +
      '<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>';
    editBanner.classList.remove('visible');
    sidebar.classList.remove('with-banner');
    expandTab.classList.remove('with-banner');
    panoramaEl.style.cursor = 'grab';
    closePopup();
    editModeDragStart = null;
    editModeWasDragging = false;
    if (viewer) viewer.startAutoRotate(-1.5);

    // 2Dモード: 閲覧用カーソルに戻す
    if (is2DMode) {
      var flatImg = document.getElementById('flat-map-img');
      if (flatImg) flatImg.style.cursor = 'default';
      render2DHotspots(current2DHotspots); // コンテキストメニューイベントを取り除いて再描画
    }
  }
  setSceneReorderSaving(sceneReorderState.saving);
  syncDriveFolderButtons();
  syncSceneActionButtons();
  scheduleAppLayoutMetrics();
}

function shouldIgnorePanoramaPointer(evt) {
  return !!(evt.target && evt.target.closest('#topbar, #edit-banner, #hotspot-popup, #scene-sidebar, #scene-context-menu, #hotspot-context-menu, #scene-properties-backdrop, #photo-lightbox, .hs-marker, .info-popup, #fullscreen-btn, #gyro-toggle-btn'));
}

function shouldIgnoreGyroStopEvent(evt) {
  return !!(evt && evt.target && evt.target.closest('#gyro-toggle-btn'));
}

function setPanningState(isActive) {
  isPanning = isActive;
  document.body.classList.toggle('is-panning', isActive);
}

function onPanoramaPointerDown(evt) {
  if (!shouldIgnoreGyroStopEvent(evt)) {
    stopGyroIfActive('manual-pointer');
  }
  if (shouldIgnorePanoramaPointer(evt)) return;
  setPanningState(true);
}

function onPanoramaPointerUp() {
  if (!isPanning) return;
  setPanningState(false);
}

// =============================================
//  編集モード: ドラッグとクリックの判別（mousedown/move/up）
// =============================================
function onPanoramaMouseDown(evt) {
  if (!canEdit || !isEditMode) return;
  if (shouldIgnorePanoramaPointer(evt)) return;
  editModeDragStart   = { x: evt.clientX, y: evt.clientY };
  editModeWasDragging = false;
}

function onPanoramaMouseMove(evt) {
  if (!canEdit || !isEditMode || !editModeDragStart) return;
  var dx = evt.clientX - editModeDragStart.x;
  var dy = evt.clientY - editModeDragStart.y;
  if (dx * dx + dy * dy > EDIT_MODE_DRAG_THRESHOLD_PX * EDIT_MODE_DRAG_THRESHOLD_PX) {
    editModeWasDragging = true;
  }
}

function onPanoramaMouseUp() {
  editModeDragStart = null;
}

// =============================================
//  編集モード: パノラマクリックで座標取得
// =============================================
function onPanoramaClick(evt) {
  if (!shouldIgnoreGyroStopEvent(evt)) {
    stopGyroIfActive('manual-click');
  }
  if (!canEdit || !isEditMode) return;
  if (suppressNextPanoramaClick) {
    suppressNextPanoramaClick = false;
    return;
  }
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('add-hotspot', { silent: true })) return;

  // ドラッグ後のクリックは無視（ホットスポット追加を開かない）
  if (editModeWasDragging) {
    editModeWasDragging = false;
    return;
  }
  editModeWasDragging = false;

  // UIコントロールへのクリックは除外
  if (shouldIgnorePanoramaPointer(evt)) return;

  // ── 移動モード ──────────────────────────────────────
  if (isMovingHotspot) {
    commitHotspotMove(evt);
    return;
  }

  // ── 通常モード: 新規ホットスポット追加 ───────────────
  try {
    // Pannellum APIでマウス座標 → パノラマ座標（Pitch/Yaw）に変換
    var coords = viewer.mouseEventToCoords(evt);
    pendingPitch = coords[0];
    pendingYaw   = coords[1];
    openPopup(evt.clientX, evt.clientY);
  } catch (e) {
    showToast('座標の取得に失敗しました。再度クリックしてください。', 'error');
  }
}

// =============================================
//  入力ポップアップの開閉
// =============================================

/**
 * ホットスポット入力ポップアップを開く
 *
 * @param {number} clientX   クリック位置X（画面座標）
 * @param {number} clientY   クリック位置Y（画面座標）
 * @param {Object} [editArgs] 編集時: 既存ホットスポットのargs。未指定なら新規追加
 */
function openPopup(clientX, clientY, editArgs) {
  if (!canEdit) return;
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('open-hotspot-form')) return false;
  if (!canStartHotspotMutation()) return false;
  if ((hotspotMoveState.active || hotspotMoveState.previewElement) &&
      !cancelHotspotMove('編集画面を開いたため移動をキャンセルしました。', { silent: true })) {
    return false;
  }
  if (!editArgs && (pendingPitch === null || pendingYaw === null ||
      !isFinite(pendingPitch) || !isFinite(pendingYaw))) {
    showToast('座標データがありません。再度クリックしてください。', 'error');
    return false;
  }
  var popup = document.getElementById('hotspot-popup');
  var inFolderMode = !!(allImages && allImages.length > 0);

  if (editArgs) {
    // 編集モード: 既存データを入力欄にセット
    editingHotspot = editArgs;
    pendingPitch   = editArgs.pitch;
    pendingYaw     = editArgs.yaw;
    document.getElementById('input-label').value    = editArgs.label || '';
    document.getElementById('input-link-url').value = editArgs.linkUrl || '';
    document.getElementById('marker-shape').value   = normalizeMarkerShape(editArgs.markerShape);
    document.getElementById('marker-color').value   = normalizeMarkerColor(editArgs.markerColor);
    setMarkerIconSelectValue(editArgs.markerIcon, true);
    syncMarkerStyleSummaryFromInputs();
    var isQuizEdit = normalizeMarkerIcon(editArgs.markerIcon) === 'quiz';
    if (isQuizEdit) {
      var parts = (editArgs.description || '').split('|');
      document.getElementById('quiz-input-question').value = parts[0] || '';
      document.getElementById('quiz-input-answer').value   = parts.length > 1 ? parts[1] : '';
      document.getElementById('input-desc').value = '';
    } else {
      document.getElementById('input-desc').value = editArgs.description || '';
    }
    setQuizDescMode(isQuizEdit);
    document.getElementById('popup-header-title').textContent =
      isQuizEdit ? 'クイズスポットを編集' : 'ホットスポットを編集';
    document.getElementById('save-label').textContent = '更新する';
  } else {
    // 新規追加モード
    editingHotspot = null;
    document.getElementById('input-label').value         = '';
    document.getElementById('input-desc').value          = '';
    document.getElementById('quiz-input-question').value = '';
    document.getElementById('quiz-input-answer').value   = '';
    document.getElementById('input-link-url').value      = '';
    setQuizDescMode(false);
    syncMarkerStyleInputsFromPreference();
    document.getElementById('popup-header-title').textContent = 'ホットスポットを追加';
    document.getElementById('save-label').textContent = '保存する';
  }

  // 写真アップロードは全モード、既存シーン／ジャンプ候補はフォルダモードで構築する。
  buildPhotoSelect(editArgs ? (editArgs.photoId || '') : '');
  if (inFolderMode) {
    buildJumpSceneSelect(editArgs ? (editArgs.jumpSceneId || '') : '');
  }

  document.getElementById('input-label').classList.remove('error');
  document.getElementById('input-jump-scene').classList.remove('error');

  beginHotspotFormSession(clientX, clientY, !!editArgs);
  if (editArgs) {
    cleanupHotspotDraft();
  } else {
    startHotspotDraft({ pitch: pendingPitch, yaw: pendingYaw });
  }

  // ポップアップモードを決定
  if (editArgs) {
    // 編集: ジャンプSceneIdがあればジャンプモード、それ以外は情報モード
    setPopupMode(editArgs.jumpSceneId ? 'jump' : 'info');
  } else if (inFolderMode) {
    // 新規×フォルダモード: タイプ選択画面
    setPopupMode('type');
  } else {
    // 新規×シングルファイル: 情報モード直接
    setPopupMode('info');
  }

  popup.style.visibility = 'hidden';
  popup.classList.add('visible');
  positionHotspotPopup(clientX, clientY);
  popup.style.visibility = '';
  scheduleHotspotPopupReposition();
  return true;
}

function closePopup(options) {
  var opts = options || {};
  var popup = document.getElementById('hotspot-popup');
  popup.classList.remove('visible', 'is-repositioning');
  popup.style.visibility = '';
  popup.style.left = '';
  popup.style.right = '';
  popup.style.top = '';
  popup.style.bottom = '';
  if (typeof hotspotPopupLayoutFrame !== 'undefined' && hotspotPopupLayoutFrame !== null) {
    cancelAnimationFrame(hotspotPopupLayoutFrame);
    hotspotPopupLayoutFrame = null;
  }
  if (typeof cleanupHotspotDraft === 'function') cleanupHotspotDraft();
  if (typeof disposeHotspotPhotoUploadState === 'function') disposeHotspotPhotoUploadState();
  if (typeof endHotspotFormSession === 'function') endHotspotFormSession();
  pendingPitch      = null;
  pendingYaw        = null;
  editingHotspot    = null;
  currentPopupMode  = null;
  // タイトル・ボタンテキストをデフォルトに戻す
  document.getElementById('popup-header-title').textContent = 'ホットスポットを追加';
  resetHotspotSaveUi(null, '保存する');
  return !opts.silent;
}

// =============================================
//  ホットスポット保存（GAS呼び出し）
// =============================================
function onSaveClick() {
  if (!canEdit) {
    closePopup();
    return;
  }
  if (!canStartHotspotMutation()) return;
  if (!validateHotspotFormScene()) return;
  if (editingHotspot && hasPendingHotspotMutationForTarget(editingHotspot.id)) {
    showToast('このホットスポットの更新を処理中です。完了までお待ちください。', 'error');
    return;
  }
  if (hotspotPhotoUploadState.processing) {
    setHotspotPhotoError('写真の処理が終わるまでお待ちください。');
    return;
  }

  var label = document.getElementById('input-label').value.trim();
  var markerIconRaw = document.getElementById('marker-icon').value;
  var desc;
  if (normalizeMarkerIcon(markerIconRaw) === 'quiz') {
    var q = document.getElementById('quiz-input-question').value.trim();
    var a = document.getElementById('quiz-input-answer').value.trim();
    desc = q + '|' + a;
  } else {
    desc = document.getElementById('input-desc').value.trim();
  }
  var linkUrlInput = document.getElementById('input-link-url').value.trim();
  var labelInput = document.getElementById('input-label');
  var markerShape = normalizeMarkerShape(document.getElementById('marker-shape').value);
  var markerColor = normalizeMarkerColor(document.getElementById('marker-color').value);
  var markerIcon = normalizeMarkerIcon(document.getElementById('marker-icon').value);
  var inFolderMode = !!(allImages && allImages.length > 0);
  // モードに応じて競合するフィールドをクリア（情報モードはjump、ジャンプモードはphoto/desc/linkを無効化）
  var photoSelectValue = currentPopupMode === 'info'
    ? (document.getElementById('input-photo-id').value || '')
    : '';
  var photoId = photoSelectValue === HOTSPOT_PHOTO_UPLOAD_OPTION ? '' : photoSelectValue;
  var photoUpload = null;
  if (photoSelectValue === HOTSPOT_PHOTO_UPLOAD_OPTION) {
    if (!hotspotPhotoUploadState.blob || !hotspotPhotoUploadState.base64) {
      setHotspotPhotoError('アップロードする写真を選択してください。');
      return;
    }
    photoUpload = {
      fileName: hotspotPhotoUploadState.uploadFileName,
      mimeType: hotspotPhotoUploadState.mimeType,
      originalSizeBytes: hotspotPhotoUploadState.originalSizeBytes,
      sizeBytes: hotspotPhotoUploadState.sizeBytes,
      base64: hotspotPhotoUploadState.base64
    };
  }
  var jumpSceneInput = document.getElementById('input-jump-scene');
  var jumpSceneId = (inFolderMode && currentPopupMode === 'jump') ? (jumpSceneInput.value || '') : '';
  if (currentPopupMode === 'jump') { desc = ''; linkUrlInput = ''; }

  // バリデーション: ジャンプは行き先、通常マーカーはラベルを必須にする。
  if (currentPopupMode === 'jump' && !jumpSceneId) {
    jumpSceneInput.classList.add('error');
    jumpSceneInput.focus();
    setTimeout(function () { jumpSceneInput.classList.remove('error'); }, 1800);
    return;
  }
  if (currentPopupMode !== 'jump' && !label) {
    labelInput.classList.add('error');
    labelInput.focus();
    setTimeout(function () { labelInput.classList.remove('error'); }, 1800);
    return;
  }

  var targetArgs = editingHotspot;
  var saveCoordinates = targetArgs
    ? { pitch: pendingPitch, yaw: pendingYaw }
    : hotspotDraftState.coordinates;
  if (!saveCoordinates || saveCoordinates.pitch === null || saveCoordinates.yaw === null ||
      !isFinite(saveCoordinates.pitch) || !isFinite(saveCoordinates.yaw)) {
    showToast('座標データがありません。再度クリックしてください。', 'error');
    return;
  }

  var saveData = {
    fileId:      hotspotFormSessionState.startSceneId,
    sceneType:   hotspotFormSessionState.sceneType,
    label:       label,
    description: desc,
    linkUrl:     normalizeHttpUrl(linkUrlInput),
    markerShape: markerShape,
    markerColor: markerColor,
    markerIcon:  markerIcon,
    pitch:       saveCoordinates.pitch,
    yaw:         saveCoordinates.yaw,
    photoId:     photoId,
    jumpSceneId: jumpSceneId
  };
  if (photoUpload) saveData.photoUpload = photoUpload;
  // server呼び出し直前にも、フォーム開始時のscene契約を再検証する。
  if (!validateHotspotFormScene()) return;
  var mutationRequest = createHotspotMutationRequest(
    saveData.fileId,
    targetArgs ? 'update' : 'create',
    targetArgs ? targetArgs.id : ''
  );
  hotspotSaveUiRequestId = mutationRequest.id;

  // ボタンをローディング状態に
  var btn       = document.getElementById('btn-save');
  var saveLabel = document.getElementById('save-label');
  btn.disabled  = true;
  btn.classList.add('loading');
  saveLabel.textContent = targetArgs ? '更新中...' : '保存中...';

  if (targetArgs) {
    // ── 更新処理 ──────────────────────────────────────
    google.script.run
      .withSuccessHandler(function (result) {
        finishHotspotMutationRequest(mutationRequest);
        if (result && result.success) clearHotspotCache(mutationRequest.fileId);
        var ownsSaveUi = resetHotspotSaveUi(mutationRequest, '更新する');
        if (!isCurrentHotspotMutationRequest(mutationRequest)) return;

        if (result && result.success) {
          var confirmedHotspot = result.hotspot || Object.assign({}, saveData, {
            id: targetArgs.id,
            photoId: result.photoId != null ? result.photoId : saveData.photoId
          });
          persistMarkerStylePreference(markerShape, markerColor, markerIcon);
          updateSpotInViewer(targetArgs, confirmedHotspot);
          if (ownsSaveUi) closePopup();
          if (result.partialSuccess) {
            showToast('ホットスポットを更新しました。' + (result.warning || '古い写真の整理に失敗しました。'), 'warning');
          } else {
            showToast('ホットスポットを更新しました！', 'success');
          }
        } else {
          showToast(
            '更新に失敗しました: ' + ((result && result.error) || '不明なエラー') +
              (result && result.cleanupRequired && result.warning ? ' ' + result.warning : ''),
            'error'
          );
        }
      })
      .withFailureHandler(function () {
        finishHotspotMutationRequest(mutationRequest);
        resetHotspotSaveUi(mutationRequest, '更新する');
        if (!isCurrentHotspotMutationRequest(mutationRequest)) return;
        showToast('通信エラーが発生しました。再度お試しください。', 'error');
      })
      .updateHotspot(withEditToken(saveData), targetArgs.id);

  } else {
    // ── 新規保存処理 ───────────────────────────────────
    google.script.run
      .withSuccessHandler(function (result) {
        finishHotspotMutationRequest(mutationRequest);
        if (result && result.success) clearHotspotCache(mutationRequest.fileId);
        var ownsSaveUi = resetHotspotSaveUi(mutationRequest, '保存する');
        if (!isCurrentHotspotMutationRequest(mutationRequest)) return;

        if (result && result.success) {
          var confirmedHotspot = result.hotspot || Object.assign({}, saveData, {
            id: result.id,
            photoId: result.photoId != null ? result.photoId : saveData.photoId
          });
          persistMarkerStylePreference(markerShape, markerColor, markerIcon);
          completeHotspotDraftSave();
          addSpotToViewer(confirmedHotspot, confirmedHotspot.id || result.id);
          if (ownsSaveUi) closePopup();
          if (result.partialSuccess) {
            showToast('ホットスポットを保存しました。' + (result.warning || '古い写真の整理に失敗しました。'), 'warning');
          } else {
            showToast('ホットスポットを保存しました！', 'success');
          }
        } else {
          showToast(
            '保存に失敗しました: ' + ((result && result.error) || '不明なエラー') +
              (result && result.cleanupRequired && result.warning ? ' ' + result.warning : ''),
            'error'
          );
        }
      })
      .withFailureHandler(function () {
        finishHotspotMutationRequest(mutationRequest);
        resetHotspotSaveUi(mutationRequest, '保存する');
        if (!isCurrentHotspotMutationRequest(mutationRequest)) return;
        showToast('通信エラーが発生しました。再度お試しください。', 'error');
      })
      .saveHotspot(withEditToken(saveData));
  }
}

/**
 * 保存成功後、Pannellumにホットスポットをリアルタイムで追加する
 *
 * @param {Object} hs     保存データ
 * @param {string} hsId   ホットスポットのUUID
 */
function addSpotToViewer(hs, hsId) {
  var newId = 'hs_' + Date.now();
  var args = {
    _pannellumId: newId,
    id:           hsId,
    fileId:       hs.fileId,
    label:        hs.label,
    description:  hs.description,
    linkUrl:      hs.linkUrl,
    markerShape:  hs.markerShape,
    markerColor:  hs.markerColor,
    markerIcon:   hs.markerIcon,
    pitch:        hs.pitch,
    yaw:          hs.yaw,
    photoId:      hs.photoId     || '',
    jumpSceneId:  hs.jumpSceneId || ''
  };

  if (is2DMode) {
    // 2Dモード: current2DHotspots に追加して再描画
    current2DHotspots.push(args);
    render2DHotspots(current2DHotspots);
    return;
  }

  try {
    viewer.addHotSpot({
      id:               newId,
      pitch:            hs.pitch,
      yaw:              hs.yaw,
      type:             'custom',
      cssClass:         'hs-marker',
      createTooltipFunc: buildMarkerElement,
      createTooltipArgs: args,
      clickHandlerFunc:  onMarkerClick,
      clickHandlerArgs:  args
    });
  } catch (e) {
    // addHotSpot が失敗しても保存自体は成功しているので無視
  }
}

/**
 * 編集後、Pannellum上のホットスポットをリアルタイムで更新する
 *
 * @param {Object} oldArgs  既存ホットスポットのargs（_pannellumId・id含む）
 * @param {Object} newData  更新後の内容
 */
function updateSpotInViewer(oldArgs, newData) {
  // oldArgs を直接書き換えて参照を維持する
  oldArgs.fileId      = newData.fileId || oldArgs.fileId || '';
  oldArgs.label       = newData.label;
  oldArgs.description = newData.description;
  oldArgs.linkUrl     = newData.linkUrl;
  oldArgs.markerShape = newData.markerShape;
  oldArgs.markerColor = newData.markerColor;
  oldArgs.markerIcon  = newData.markerIcon;
  if (typeof newData.pitch === 'number' && isFinite(newData.pitch)) oldArgs.pitch = newData.pitch;
  if (typeof newData.yaw === 'number' && isFinite(newData.yaw)) oldArgs.yaw = newData.yaw;
  oldArgs.photoId     = newData.photoId     || '';
  oldArgs.jumpSceneId = newData.jumpSceneId || '';

  if (is2DMode) {
    // 2Dモード: oldArgs はすでに current2DHotspots 内の参照なので再描画するだけ
    render2DHotspots(current2DHotspots);
    return;
  }

  var pid = oldArgs._pannellumId;
  try { viewer.removeHotSpot(pid); } catch (e) { /* ignore */ }
  try {
    viewer.addHotSpot({
      id:               pid,
      pitch:            oldArgs.pitch,
      yaw:              oldArgs.yaw,
      type:             'custom',
      cssClass:         'hs-marker',
      createTooltipFunc: buildMarkerElement,
      createTooltipArgs: oldArgs,
      clickHandlerFunc:  onMarkerClick,
      clickHandlerArgs:  oldArgs
    });
  } catch (e) { /* ignore */ }
}
