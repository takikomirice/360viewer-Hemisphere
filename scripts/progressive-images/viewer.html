<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hemisphere 画像配信の比較</title><link rel="stylesheet" href="/pannellum.css">
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;color:#dce9f4;background:#101a26}header{padding:16px 20px;background:#182839}h1{font-size:20px;margin:0 0 6px}p{margin:6px 0;font-size:13px;color:#b7c9d9}main{display:flex;height:60vh;min-height:340px}aside{width:260px;min-width:180px;max-width:480px;overflow:auto;padding:12px;flex-shrink:0}#divider{width:8px;flex-shrink:0;cursor:col-resize;background:#385066}#panorama{flex:1;min-width:0}button,select,input{font:inherit}button{background:#29445d;color:white;border:1px solid #49647b;border-radius:6px;padding:9px;margin:3px;cursor:pointer}button:hover{background:#3a607e}button:disabled{opacity:.5;cursor:wait}label{display:inline-block;margin:6px}select{max-width:100%;padding:5px}section{padding:12px 20px}#results{white-space:pre-wrap;font:13px ui-monospace,monospace;background:#0a121a;padding:12px;min-height:65px}#thumbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}#thumbs img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#293b4d}.scene img{width:100%;aspect-ratio:16/9;object-fit:cover}.scene{display:block;width:100%;margin:8px 0}#source{word-break:break-all}input[type=url]{width:min(650px,80vw)}@media(max-width:600px){aside{width:180px;max-width:50vw}h1{font-size:17px}}
</style>
<header><h1>Hemisphere 画像配信の比較</h1><p>ローカル試作。公開アプリには未反映です。Driveプレビューを素材にした場合、原寸写真の速度とは比較できません。</p></header>
<main><aside id="sidebar"><label>比較画像<select id="scene" aria-label="比較画像"></select></label><div id="source"></div><label><input type="checkbox" id="fresh" checked>キャッシュを使わずに比較</label><button id="whole">全体画像を表示</button><button id="reduced">縮小画像を表示</button><button id="tiles">分割画像を表示</button><label>メニュー幅<input id="width" aria-label="メニュー幅" type="range" min="180" max="480" value="260"></label><div id="scene-list"></div></aside><div id="divider" role="separator" aria-label="メニュー幅を調整" aria-orientation="vertical" tabindex="0"></div><div id="panorama"></div></main>
<section><p>下の並列比較は16件を取得します。同じサムネイルを別URLで要求する通信実験で、16種類の写真の画質比較ではありません。人工待ち時間は各リクエストに追加され、実回線速度の再現ではありません。</p>
<label>1件あたりの人工待ち時間<select id="delay" aria-label="人工待ち時間"><option value="0">なし</option><option value="120" selected>120ms</option><option value="300">300ms</option></select></label>
<button id="serial">サムネイルを1枚ずつ取得</button><button id="parallel">サムネイルを4枚並列で取得</button><button id="stop">未開始の取得を中止</button><div id="thumbs"></div>
<p>Drive配信の検証では、この端末で使える認証状態も結果に影響します。</p><label>比較するDrive画像URL<input id="drive-url" aria-label="比較するDrive画像URL" type="url"></label><button id="drive-plain">Drive画像を通常表示で検証</button><button id="drive-cors">Drive画像をパノラマ用条件で検証</button>
<h2 style="font-size:16px">測定結果</h2><pre id="results" aria-live="polite">画像情報を取得中</pre></section>
<script src="/pannellum.js"></script><script src="/queue.js?v=4"></script><script src="/viewer.js?v=4"></script></html>
