function normalizeTheme(value) {
  value = String(value || '').trim().toLowerCase();
  return value === 'light' || value === 'dark' ? value : '';
}

function getCurrentTheme() {
  return normalizeTheme(document.documentElement.getAttribute('data-theme')) || 'light';
}

function syncThemeToggleButtons(theme) {
  theme = normalizeTheme(theme) || getCurrentTheme();
  var isDark = theme === 'dark';
  var label = isDark ? 'ライトテーマに切り替える' : 'ダークテーマに切り替える';
  ['toolbar-theme-toggle', 'floating-theme-toggle'].forEach(function (id) {
    var button = document.getElementById(id);
    if (!button) return;
    button.setAttribute('aria-label', label);
    button.setAttribute('title', label);
    button.setAttribute('aria-pressed', isDark ? 'true' : 'false');
  });
}

function applyTheme(theme, persist) {
  var normalized = normalizeTheme(theme) || 'light';
  document.documentElement.setAttribute('data-theme', normalized);
  window.__APP_THEME__ = normalized;
  if (persist) {
    try {
      if (window.localStorage) window.localStorage.setItem(THEME_STORAGE_KEY, normalized);
    } catch (e) {
      // 埋め込み先でストレージが無効でも、現在のページにはテーマを適用する。
    }
  }
  syncThemeToggleButtons(normalized);
  return normalized;
}

function toggleTheme() {
  var nextTheme = getCurrentTheme() === 'dark' ? 'light' : 'dark';
  applyTheme(nextTheme, true);
}

function withEditToken(payload) {

  }
  return window.innerWidth <= 700;

function updateViewingModeClasses() {
  var publicView = isPublicViewingMode();
  var mobileView = isSmallViewport();
  var topbarHiddenView = appMode === 'public' || appMode === 'internal' || (publicView && mobileView);
  var initialMode = appMode === 'public' || appMode === 'internal' || appMode === 'edit' ? appMode : '';
  document.body.setAttribute('data-app-mode', initialMode);
  document.body.classList.toggle('public-view', publicView);
  document.body.classList.toggle('mobile-view', mobileView);
  document.body.classList.toggle('mobile-public-view', publicView && mobileView);
  document.body.classList.toggle('topbar-hidden-view', topbarHiddenView);

function getVisibleAppLayoutHeight(element) {

  return Math.ceil(element.getBoundingClientRect().height);

function updateAppLayoutMetrics() {

  var root = document.documentElement;
  var toolbarHeight = getVisibleAppLayoutHeight(document.getElementById('topbar'));
  var editBannerHeight = getVisibleAppLayoutHeight(document.getElementById('edit-banner'));
  root.style.setProperty('--app-toolbar-height', toolbarHeight + 'px');
  root.style.setProperty('--app-edit-banner-height', editBannerHeight + 'px');

  if (appLayoutMetricsFrame != null) return;
  var requestFrame = window.requestAnimationFrame || function (callback) { return window.setTimeout(callback, 0); };
  appLayoutMetricsFrame = requestFrame(updateAppLayoutMetrics);
}

function initializeAppLayoutMetrics() {
  updateAppLayoutMetrics();

    appLayoutResizeObserver = new ResizeObserver(scheduleAppLayoutMetrics);
    var topbar = document.getElementById('topbar');
    var editBanner = document.getElementById('edit-banner');

function parseNumberParam(value) {
  if (value === null || typeof value === 'undefined') return null;
  if (String(value).trim() === '') return null;
  var num = Number(value);
  return isFinite(num) ? num : null;
}

  var num = parseNumberParam(value);
  if (num === null) return '';
  return String(Math.round(num * 100) / 100);

function buildPublicShareUrl(options) {
  options = options || {};
  var baseUrl = String(options.baseUrl || '').split('#')[0].split('?')[0];
  var params = [
    'mode=public',
    'delivery=' + encodeURIComponent(normalizeDeliveryMode(options.delivery))
  ];

  if (options.includeQuality === true) {
    params.push('quality=' + encodeURIComponent(normalizeShareQualityMode(options.quality)));
  }

  var sceneId = String(options.sceneId || '').trim();
  if (sceneId) {
    params.push('scene=' + encodeURIComponent(sceneId));
  }

  var yaw = parseNumberParam(options.yaw);
  if (yaw !== null) {
    params.push('yaw=' + encodeURIComponent(formatShareNumber(yaw)));
  }

  var pitch = parseNumberParam(options.pitch);
  if (pitch !== null) {
    params.push('pitch=' + encodeURIComponent(formatShareNumber(pitch)));
  }

  return baseUrl + '?' + params.join('&');
}

        (dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4));
      qrSetFunctionModule(modules, isFunction, xx, yy, dark);
    }
  }
}

function qrDrawAlignmentPattern(modules, isFunction, x, y) {
  for (var dy = -2; dy <= 2; dy++) {
    for (var dx = -2; dx <= 2; dx++) {
      qrSetFunctionModule(modules, isFunction, x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
  }
}

function qrDrawFormatBits(modules, isFunction, mask) {
  var size = modules.length;
  var data = mask; // Error correction level M uses format bits 00.
  var rem = data;
  for (var i = 0; i < 10; i++) rem = (rem << 1) ^ (((rem >>> 9) & 1) ? 0x537 : 0);
  var bits = ((data << 10) | rem) ^ 0x5412;

  function getBit(index) {
    return ((bits >>> index) & 1) !== 0;
  }

  for (var a = 0; a <= 5; a++) qrSetFunctionModule(modules, isFunction, 8, a, getBit(a));
  qrSetFunctionModule(modules, isFunction, 8, 7, getBit(6));
  qrSetFunctionModule(modules, isFunction, 8, 8, getBit(7));
  qrSetFunctionModule(modules, isFunction, 7, 8, getBit(8));
  for (var b = 9; b < 15; b++) qrSetFunctionModule(modules, isFunction, 14 - b, 8, getBit(b));

  for (var c = 0; c < 8; c++) qrSetFunctionModule(modules, isFunction, size - 1 - c, 8, getBit(c));
  for (var d = 8; d < 15; d++) qrSetFunctionModule(modules, isFunction, 8, size - 15 + d, getBit(d));
  qrSetFunctionModule(modules, isFunction, 8, size - 8, true);
}

function qrDrawVersionBits(modules, isFunction, version) {
  if (version < 7) return;
  var size = modules.length;
  var rem = version;
  for (var i = 0; i < 12; i++) rem = (rem << 1) ^ (((rem >>> 11) & 1) ? 0x1F25 : 0);
  var bits = (version << 12) | rem;
  for (var j = 0; j < 18; j++) {
    var bit = ((bits >>> j) & 1) !== 0;
    var x = size - 11 + (j % 3);
    var y = Math.floor(j / 3);
    qrSetFunctionModule(modules, isFunction, x, y, bit);
    qrSetFunctionModule(modules, isFunction, y, x, bit);
  }
}

function qrDrawFunctionPatterns(modules, isFunction, version) {
  var size = modules.length;
  qrDrawFinderPattern(modules, isFunction, 0, 0);
  qrDrawFinderPattern(modules, isFunction, size - 7, 0);
  qrDrawFinderPattern(modules, isFunction, 0, size - 7);

  for (var i = 8; i < size - 8; i++) {
    qrSetFunctionModule(modules, isFunction, i, 6, i % 2 === 0);
    qrSetFunctionModule(modules, isFunction, 6, i, i % 2 === 0);
  }

  var positions = QR_ALIGNMENT_POSITIONS[version];
  for (var yIndex = 0; yIndex < positions.length; yIndex++) {
    for (var xIndex = 0; xIndex < positions.length; xIndex++) {
      var x = positions[xIndex];
      var y = positions[yIndex];
      var overlapsFinder = (x === 6 && y === 6) || (x === 6 && y === size - 7) || (x === size - 7 && y === 6);
      if (!overlapsFinder) qrDrawAlignmentPattern(modules, isFunction, x, y);
    }
  }

  qrDrawFormatBits(modules, isFunction, 0);
  qrDrawVersionBits(modules, isFunction, version);
}

function qrDrawCodewords(modules, isFunction, codewords) {
  var size = modules.length;
  var bits = [];
  for (var i = 0; i < codewords.length; i++) {
    for (var j = 7; j >= 0; j--) bits.push(((codewords[i] >>> j) & 1) !== 0);
  }

  var bitIndex = 0;
  var upward = true;
  for (var right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right--;
    for (var vert = 0; vert < size; vert++) {
      var y = upward ? size - 1 - vert : vert;
      for (var dx = 0; dx < 2; dx++) {
        var x = right - dx;
        if (!isFunction[y][x]) {
          modules[y][x] = bitIndex < bits.length ? bits[bitIndex] : false;
          bitIndex++;
        }
      }
    }
    upward = !upward;
  }
}

function qrCloneMatrix(matrix) {
  var copy = [];
  for (var y = 0; y < matrix.length; y++) copy[y] = matrix[y].slice();
  return copy;
}

function qrMaskBit(mask, x, y) {
  if (mask === 0) return (x + y) % 2 === 0;
  if (mask === 1) return y % 2 === 0;
  if (mask === 2) return x % 3 === 0;
  if (mask === 3) return (x + y) % 3 === 0;
  if (mask === 4) return (Math.floor(y / 2) + Math.floor(x / 3)) % 2 === 0;
  if (mask === 5) return ((x * y) % 2 + (x * y) % 3) === 0;
  if (mask === 6) return (((x * y) % 2 + (x * y) % 3) % 2) === 0;
  return (((x + y) % 2 + (x * y) % 3) % 2) === 0;
}

function qrApplyMask(modules, isFunction, mask) {
  var size = modules.length;
  for (var y = 0; y < size; y++) {
    for (var x = 0; x < size; x++) {
      if (!isFunction[y][x] && qrMaskBit(mask, x, y)) modules[y][x] = !modules[y][x];
    }
  }
}

function qrPenaltyForLine(getBit, size) {
  var score = 0;
  var runColor = getBit(0);
  var runLength = 1;
  for (var i = 1; i <= size; i++) {
    if (i < size && getBit(i) === runColor) {
      runLength++;
    } else {
      if (runLength >= 5) score += 3 + runLength - 5;
      if (i < size) {
        runColor = getBit(i);
        runLength = 1;
      }
    }
  }

  var patternA = [true, false, true, true, true, false, true, false, false, false, false];
  var patternB = [false, false, false, false, true, false, true, true, true, false, true];
  for (var start = 0; start <= size - 11; start++) {
    var matchA = true;
    var matchB = true;
    for (var j = 0; j < 11; j++) {
      if (getBit(start + j) !== patternA[j]) matchA = false;
      if (getBit(start + j) !== patternB[j]) matchB = false;
    }
    if (matchA || matchB) score += 40;
  }
  return score;
}

function qrPenaltyScore(modules) {
  var size = modules.length;
  var score = 0;
  var dark = 0;

  for (var y = 0; y < size; y++) {
    score += qrPenaltyForLine(function (x) { return modules[y][x]; }, size);
  }
  for (var x = 0; x < size; x++) {
    score += qrPenaltyForLine(function (y) { return modules[y][x]; }, size);
  }

  for (var yy = 0; yy < size - 1; yy++) {
    for (var xx = 0; xx < size - 1; xx++) {
      var color = modules[yy][xx];
      if (color === modules[yy][xx + 1] && color === modules[yy + 1][xx] && color === modules[yy + 1][xx + 1]) {
        score += 3;
      }
    }
  }

  for (var row = 0; row < size; row++) {
    for (var col = 0; col < size; col++) {
      if (modules[row][col]) dark++;
    }
  }
  var total = size * size;
  score += Math.floor(Math.abs(dark * 20 - total * 10) / total) * 10;
  return score;
}

function createQrMatrix(text) {
  var bytes = qrEncodeUtf8(text);
  var version = qrChooseVersion(bytes);
  var size = 21 + (version - 1) * 4;
  var dataCodewords = qrMakeDataCodewords(bytes, version);
  var allCodewords = qrInterleaveCodewords(dataCodewords, version);
  var base = qrCreateEmptyMatrix(size);
  qrDrawFunctionPatterns(base.modules, base.isFunction, version);
  qrDrawCodewords(base.modules, base.isFunction, allCodewords);

  var bestModules = null;
  var bestScore = Infinity;
  for (var mask = 0; mask < 8; mask++) {
    var candidate = qrCloneMatrix(base.modules);
    qrApplyMask(candidate, base.isFunction, mask);
    qrDrawFormatBits(candidate, base.isFunction, mask);
    var score = qrPenaltyScore(candidate);
    if (score < bestScore) {
      bestScore = score;
      bestModules = candidate;
    }
  }
  return { modules: bestModules, size: size, version: version };
}

function renderShareQrCode(url) {
  var container = document.getElementById('share-qr-code');
  if (!container) return false;
  container.innerHTML = '';

  try {
    var qr = createQrMatrix(String(url || ''));
    var quietZone = 4;
    var viewSize = qr.size + quietZone * 2;
    var svgNs = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNs, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + viewSize + ' ' + viewSize);
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', '閲覧用リンクのQRコード');
    svg.setAttribute('shape-rendering', 'crispEdges');

    var background = document.createElementNS(svgNs, 'rect');
    background.setAttribute('width', String(viewSize));
    background.setAttribute('height', String(viewSize));
    background.setAttribute('fill', '#FFFFFF');
    svg.appendChild(background);

    var segments = [];
    for (var y = 0; y < qr.size; y++) {
      for (var x = 0; x < qr.size; x++) {
        if (qr.modules[y][x]) {
          segments.push('M' + (x + quietZone) + ' ' + (y + quietZone) + 'h1v1h-1z');
        }
      }
    }
    var path = document.createElementNS(svgNs, 'path');
    path.setAttribute('d', segments.join(' '));
    path.setAttribute('fill', '#000000');
    svg.appendChild(path);
    container.appendChild(svg);
    return true;
  } catch (e) {
    container.textContent = e && e.message ? e.message : 'QRコードを生成できませんでした。';
    return false;
  }
}

function updateShareQrPanel(url, format) {
  var panel = document.getElementById('share-qr-panel');
  if (!panel) return;
  var isQr = format === 'qr';
  panel.hidden = !isQr;
  if (!isQr) {
    var qrCode = document.getElementById('share-qr-code');
    if (qrCode) qrCode.innerHTML = '';
    return;
  }

  renderShareQrCode(url);
}

/**
 * 設定取得後: フォルダモードと単一画像モードを振り分ける
 */
function loadSingleImageScene(config) {
  closeQuizModal({ restoreFocus: false });
  var sceneStartedAt = scenePerformanceNow_();
  var loadGeneration = ++sceneLoadGeneration;
  currentFileId = null;
  isSwitching = true;
  showSceneLoading();
  var directImageUrl = config.imageUrl;
  var autoFallbackController = null;
  var pannellumSession = null;
  var performanceRecord = createScenePerformanceRecord(loadGeneration, '360', sceneStartedAt);
  if (config.fileId) {
    directImageUrl = getDirectImageUrl({ id: config.fileId, imageUrl: config.imageUrl });
  }

  function isCurrentSingleLoad() {
    return isSwitching && loadGeneration === sceneLoadGeneration && !currentFileId;
  }

  var singleLoadTimer = setTimeout(function () {
    if (!isCurrentSingleLoad()) return;
    isSwitching = false;
    finishScenePerformanceRecord(performanceRecord, 'timeout');
    showLoadError('画像の読み込みがタイムアウトしました。再度お試しください。');
  }, IMAGE_LOAD_TIMEOUT_MS);
  if (deliveryMode === 'auto') {
    autoFallbackController = createAutoFallbackController(
      isCurrentSingleLoad,
      performanceRecord,
      beginSingleImageBase64Fallback,
      sceneStartedAt
    );
  }
  var hotspotPreparation = startHotspotPreparation('', config.fileId || '', isCurrentSingleLoad, performanceRecord);
  var directImagePreparation = null;
  var base64Preparation = null;
  if (deliveryMode === 'base64' && config.fileId) {
    base64Preparation = startBase64ImagePreparation(config.fileId, isCurrentSingleLoad, performanceRecord);
  } else if (deliveryMode !== 'base64') {
    directImagePreparation = preloadSceneImage(
      directImageUrl,
      isCurrentSingleLoad,
      performanceRecord,
      autoFallbackController ? autoFallbackController.getRemainingMs() : DIRECT_IMAGE_PRELOAD_TIMEOUT_MS
    );
  }
  if (autoFallbackController && directImagePreparation) {
    directImagePreparation.then(function (preparedImage) {
      if (!isCurrentSingleLoad() || autoFallbackController.hasFallbackStarted()) return;
      if (!preparedImage || preparedImage.status === 'loaded') return;
      autoFallbackController.startFallback(
        preparedImage.status === 'timeout'
          ? 'preload-timeout'
          : 'preload-failed'
      );
    });
  }

  function showSingleImageDeliveryError(message) {
    if (!isCurrentSingleLoad()) return;
    clearTimeout(singleLoadTimer);
    if (autoFallbackController) autoFallbackController.cancel();
    isSwitching = false;
    finishScenePerformanceRecord(performanceRecord, 'error');
    showLoadError(message, deliveryMode === 'direct' && config.fileId ? function () {
      deliveryMode = 'base64';
      loadSingleImageScene(config);
    } : null);
  }

  function beginSingleImageBase64Fallback() {
    if (!isCurrentSingleLoad() || !autoFallbackController || !autoFallbackController.hasFallbackStarted()) return;
    if (!config.fileId) {
      showSingleImageDeliveryError('直リンクで画像を読み込めず、Base64 fallback用のファイルIDも見つかりませんでした。');
      return;
    }
    showSceneLoading();
    var fallbackImagePreparation = startBase64ImagePreparation(config.fileId, isCurrentSingleLoad, performanceRecord);
    Promise.all([hotspotPreparation, fallbackImagePreparation]).then(function (prepared) {
      if (!isCurrentSingleLoad() || autoFallbackController.hasDirectDisplaySucceeded()) return;
      if (prepared[1].status !== 'loaded') {
        showSingleImageDeliveryError('直リンクで画像を読み込めず、Base64 fallbackも取得できませんでした。Driveの共有設定を確認してください。');
        return;
      }
      startSingleImageViewer(prepared[1].imageUrl, prepared[0], 'fallback', function () {
        showSingleImageDeliveryError('直リンクとBase64 fallbackの両方で画像を読み込めませんでした。Driveの共有設定を確認してください。');
      });
    });
  }

  function startSingleImageViewer(imageUrl, preparedHotspots, imageRoute, onDisplayError) {
    var isDirectAttempt = imageRoute === 'direct';
    function isCurrentImageAttempt() {
      return isCurrentSingleLoad() && !(
        autoFallbackController && autoFallbackController.hasFallbackStarted() && isDirectAttempt
      );
    }
    if (!isCurrentImageAttempt() && isDirectAttempt) return;
    var isAutoDirectImage = !!autoFallbackController && isDirectAttempt && !autoFallbackController.hasFallbackStarted();
    var canReusePannellum = pannellumSession && viewer === pannellumSession.viewer;
    if (viewer && !canReusePannellum) {
      clearInterval(loadPollInterval);
      try { viewer.destroy(); } catch (e) { /* ignore */ }
      viewer = null;
    }
    hide2DView();
    if (isAutoDirectImage) autoFallbackController.markDirectDisplayStart();
    var normalizedNorth = typeof preparedHotspots.northOffset === 'number' && isFinite(preparedHotspots.northOffset)
      ? preparedHotspots.northOffset
      : null;
    function handleDisplayError() {
      if (!isCurrentImageAttempt()) return;
      if (typeof onDisplayError === 'function') onDisplayError();
    }
    function handleDisplayLoaded() {
      if (!isCurrentImageAttempt()) return;
      if (isAutoDirectImage) autoFallbackController.markDirectDisplaySucceeded();
      clearTimeout(singleLoadTimer);
      if (autoFallbackController) autoFallbackController.cancel();
      markScenePerformanceRecord(performanceRecord, 'pannellumLoad');
      isSwitching = false;
      finishScenePerformanceRecord(performanceRecord, 'loaded');
    }
    if (canReusePannellum) {
      var reused = pannellumSession.loadImage(
        imageUrl,
        preparedHotspots.hotspots || [],
        normalizedNorth,
        initialYaw,
        initialPitch,
        handleDisplayError,
        handleDisplayLoaded,
        isCurrentImageAttempt
      );
      if (!reused) handleDisplayError();
    } else {
      markScenePerformanceRecord(performanceRecord, 'pannellumCreateStart');
      pannellumSession = initViewer(
        imageUrl,
        preparedHotspots.hotspots || [],
        normalizedNorth,
        initialYaw,
        initialPitch,
        handleDisplayError,
        handleDisplayLoaded,
        isCurrentImageAttempt
      );
    }
  }

  if (deliveryMode === 'base64') {
    if (!config.fileId) {
      showSingleImageDeliveryError('Base64画像を取得するためのファイルIDが見つかりませんでした。');
      return;
    }
    Promise.all([hotspotPreparation, base64Preparation]).then(function (prepared) {
      if (!isCurrentSingleLoad()) return;
      if (prepared[1].status !== 'loaded') {
        showSingleImageDeliveryError(prepared[1].message || 'Base64画像を取得できませんでした。画像ファイルまたは権限を確認してください。');
        return;
      }
      startSingleImageViewer(prepared[1].imageUrl, prepared[0], 'base64', function () {
        showSingleImageDeliveryError('Base64画像の読み込みに失敗しました。画像ファイルまたは権限を確認してください。');
      });
    });
    return;
  }

  Promise.all([hotspotPreparation, directImagePreparation]).then(function (prepared) {
    if (!isCurrentSingleLoad() || (autoFallbackController && autoFallbackController.hasFallbackStarted())) return;
    if (autoFallbackController && prepared[1].status !== 'loaded') {
      autoFallbackController.startFallback(
        prepared[1].status === 'timeout'
          ? 'preload-timeout'
          : 'preload-failed'
      );
      return;
    }
    startSingleImageViewer(directImageUrl, prepared[0], 'direct', function () {
      if (autoFallbackController) {
        autoFallbackController.startFallback('direct-display-failed');
      } else {
        showSingleImageDeliveryError('画像を読み込めませんでした。互換表示で再試行するか、画像の共有設定を確認してください。');
      }
    });
  });
}

function getRootSceneImageById(images, sceneId) {

}

/**
 * scenes の明示種別を優先し、空の旧データだけファイル名タグへフォールバックする。
 */
function getExplicitSceneType(image) {
  var explicitType = String(
    image && (image.sceneType || image.type) || ''
  ).trim().toUpperCase();
  if (explicitType === '2D') return '2D';
  if (explicitType === '360') return '360';
  var legacyName = String(image && (image.driveName || image.name) || '');
  return legacyName.indexOf('[2D]') !== -1 ? '2D' : '360';
}

/** Drive/scenes名から、表示時だけ最後の対応画像拡張子を取り除く。 */
function getSceneDisplayName(sceneOrName) {
  var storedName = sceneOrName;
  if (sceneOrName && typeof sceneOrName === 'object') {
    storedName = sceneOrName.name || sceneOrName.displayName || sceneOrName.driveName || '';
  }
  return String(storedName == null ? '' : storedName).replace(/\.(?:jpe?g|png|gif|webp)$/i, '');
}

/** scenes から返されたホーム値だけを真偽値へ正規化する。 */
function isSceneHome(image) {
  if (!image) return false;
  if (image.isHome === true || image.isHome === 1) return true;
  var value = String(image.isHome == null ? '' : image.isHome).trim().toLowerCase();
  return value === 'true' || value === '1' || value === 'yes';
}

/** 対象シーンが設定済みルートフォルダ直下か判定する。 */
function isRootSceneItem(image) {
  if (!image || image.type === 'folder') return false;
  if (image.isRootScene === true) return true;
  return !!rootFolderId && String(image.parentFolderId || '') === String(rootFolderId);
}

/** scenesのホームを優先し、未設定時だけ現在の安定順で最初の画像を返す。 */
function findHomeSceneImage(images) {
  if (!Array.isArray(images)) return null;
  var firstImage = null;
  for (var i = 0; i < images.length; i++) {
    var image = images[i];
    if (!image || image.type === 'folder') continue;
    if (!firstImage) firstImage = image;
    if (isSceneHome(image)) return image;
  }
  return firstImage;
}

/** ルート一覧の更新・削除・アップロード後にホームIDとボタン表示を揃える。 */
function updateRootHomeImageId() {
  if (folderStack.length > 0) return getSceneImageById(homeImageId);
  var homeImage = findHomeSceneImage(allImages);
  homeImageId = homeImage ? homeImage.id : null;
  syncSceneActionButtons();
  return homeImage;
}

/** フォルダを先頭に保ち、画像は scenes 表示順と安定フォールバックで比較する。 */
function compareSceneListItems(left, right) {
  var leftIsFolder = !!(left && left.type === 'folder');
  var rightIsFolder = !!(right && right.type === 'folder');
  if (leftIsFolder !== rightIsFolder) return leftIsFolder ? -1 : 1;

  function text(value) { return String(value == null ? '' : value); }
  function compareText(a, b) { return text(a).localeCompare(text(b), 'ja'); }
  if (leftIsFolder && rightIsFolder) {
    var folderNameCompare = compareText(left.name, right.name);
    return folderNameCompare !== 0 ? folderNameCompare : compareText(left.id, right.id);
  }

  function finiteOrder(item) {
    var raw = item && (item.displayOrder != null ? item.displayOrder : item.order);
    if (raw === '' || raw == null || typeof raw === 'boolean') return null;
    var value = typeof raw === 'number' ? raw : Number(String(raw).trim());
    return typeof value === 'number' && isFinite(value) ? value : null;
  }
  var leftOrder = finiteOrder(left);
  var rightOrder = finiteOrder(right);
  if (leftOrder != null && rightOrder != null && leftOrder !== rightOrder) {
    return leftOrder - rightOrder;
  }
  if (leftOrder != null && rightOrder == null) return -1;
  if (leftOrder == null && rightOrder != null) return 1;

  var displayCompare = compareText(
    left && (left.displayName || left.name || left.driveName),
    right && (right.displayName || right.name || right.driveName)
  );
  if (displayCompare !== 0) return displayCompare;
  var driveCompare = compareText(left && left.driveName, right && right.driveName);
  return driveCompare !== 0 ? driveCompare : compareText(left && left.id, right && right.id);
}

function sortSceneListItems(images) {
  return Array.isArray(images) ? images.sort(compareSceneListItems) : [];
}

function getCurrentSceneFolderId() {
  if (folderStack.length > 0) {
    return String(folderStack[folderStack.length - 1].id || '');
  }
  return String(rootFolderId || '');
}

function getOrderedSceneImageIds(images) {
  return (Array.isArray(images) ? images : []).filter(function (item) {
    return item && item.type !== 'folder';
  }).map(function (item) {
    return String(item.id || '');
  });
}

function reorderSceneImageItems(images, draggedId, dropIndex) {
  var source = Array.isArray(images) ? images : [];
  var folders = source.filter(function (item) { return item && item.type === 'folder'; });
  var photos = source.filter(function (item) { return item && item.type !== 'folder'; });
  var sourceIndex = photos.findIndex(function (item) { return String(item.id || '') === String(draggedId || ''); });
  if (sourceIndex < 0) return source.slice();
  var targetIndex = Math.max(0, Math.min(Number(dropIndex), photos.length));
  var moved = photos.splice(sourceIndex, 1)[0];
  if (sourceIndex < targetIndex) targetIndex -= 1;
  photos.splice(targetIndex, 0, moved);
  return folders.concat(photos.map(function (item, index) {
    var next = Object.assign({}, item);
    next.displayOrder = index + 1;
    next.order = index + 1;
    return next;
  }));
}

function shouldSuppressSceneItemInteraction() {
  return !!sceneReorderState.draggedId || Date.now() < sceneReorderState.suppressInteractionUntil;
}

function createSceneDropZone(dropIndex) {
  var zone = document.createElement('div');
  zone.className = 'scene-drop-zone';
  zone.dataset.dropIndex = String(dropIndex);
  zone.setAttribute('aria-hidden', 'true');
  zone.addEventListener('dragover', function (evt) {
    if (!sceneReorderState.draggedId || sceneReorderState.saving) return;
    evt.preventDefault();
    if (evt.dataTransfer) evt.dataTransfer.dropEffect = 'move';
    zone.classList.add('active');
  });
  zone.addEventListener('dragleave', function () {
    zone.classList.remove('active');
  });
  zone.addEventListener('drop', function (evt) {
    evt.preventDefault();
    evt.stopPropagation();
    zone.classList.remove('active');
    applySceneDrop(dropIndex);
  });
  return zone;
}

function arrangeSceneItemsInDom(orderedFileIds) {
  var list = document.getElementById('scene-list');
  if (!list) return;
  list.querySelectorAll('.scene-drop-zone').forEach(function (zone) { zone.remove(); });
  var elementsById = {};
  list.querySelectorAll('.scene-item').forEach(function (item) {
    elementsById[String(item.dataset.id || '')] = item;
  });
  (orderedFileIds || []).forEach(function (fileId, index) {
    if (canEdit) list.appendChild(createSceneDropZone(index));
    if (elementsById[fileId]) list.appendChild(elementsById[fileId]);
  });
  if (canEdit && orderedFileIds && orderedFileIds.length > 0) {
    list.appendChild(createSceneDropZone(orderedFileIds.length));
  }
  syncActiveSceneItem(currentFileId);
}

function setSceneReorderSaving(isSaving) {
  sceneReorderState.saving = !!isSaving;
  var list = document.getElementById('scene-list');
  if (list) list.classList.toggle('scene-reorder-saving', sceneReorderState.saving);
  document.querySelectorAll('.scene-drag-handle').forEach(function (handle) {
    var disabled = sceneReorderState.saving || !canEdit || !isEditMode;
    handle.draggable = !disabled;
    handle.setAttribute('aria-disabled', disabled ? 'true' : 'false');
  });
}

function finishSceneReorderDrag() {
  var list = document.getElementById('scene-list');
  if (list) {
    list.classList.remove('scene-list-reordering');
    list.querySelectorAll('.scene-drop-zone.active').forEach(function (zone) { zone.classList.remove('active'); });
    list.querySelectorAll('.scene-item.dragging').forEach(function (item) { item.classList.remove('dragging'); });
  }
  sceneReorderState.draggedId = '';
  sceneReorderState.originalItems = null;
}

function beginSceneReorderDrag(evt, img, item) {
  evt.stopPropagation();
  if (!canEdit || !isEditMode || sceneReorderState.saving) {
    evt.preventDefault();
    return false;
  }
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('reorder-scenes')) {
    evt.preventDefault();
    return false;
  }
  sceneReorderState.draggedId = String(img.id || '');
  sceneReorderState.originalItems = allImages.slice();
  sceneReorderState.suppressInteractionUntil = Date.now() + 800;
  item.classList.add('dragging');
  document.getElementById('scene-list').classList.add('scene-list-reordering');
  closeSceneContextMenu();
  if (evt.dataTransfer) {
    evt.dataTransfer.effectAllowed = 'move';
    evt.dataTransfer.setData('text/plain', sceneReorderState.draggedId);
  }
  return true;
}

function saveSceneOrder(previousItems, folderId, orderedFileIds) {
  var requestGeneration = ++sceneReorderState.requestGeneration;
  setSceneReorderSaving(true);

  function isCurrentRequest() {
    return requestGeneration === sceneReorderState.requestGeneration;
  }
  function finishSaving() {
    if (!isCurrentRequest()) return;
    setSceneReorderSaving(false);
  }
  function rollback(message) {
    if (!isCurrentRequest()) return;
    allImages = previousItems;
    arrangeSceneItemsInDom(getOrderedSceneImageIds(allImages));
    finishSaving();
    showToast(message, 'error');
  }

  google.script.run
    .withSuccessHandler(function (result) {
      if (!isCurrentRequest()) return;
      if (!result || result.success !== true) {
        rollback('シーンの並び順を保存できませんでした: ' + ((result && result.error) || '不明なエラー'));
        return;
      }
      finishSaving();
      showToast(
        result.partialSuccess ? (result.warning || '並び順は保存しましたが、キャッシュ更新に失敗しました。') : 'シーンの並び順を保存しました。',
        result.partialSuccess ? 'error' : 'success'
      );
    })
    .withFailureHandler(function () {
      rollback('シーンの並び順の保存中に通信エラーが発生しました。元の順序へ戻しました。');
    })
    .reorderScenes(withEditToken({
      folderId: folderId,
      orderedFileIds: orderedFileIds
    }));
}

function applySceneDrop(dropIndex) {
  if (!sceneReorderState.draggedId || sceneReorderState.saving) return false;
  var draggedId = sceneReorderState.draggedId;
  var previousItems = sceneReorderState.originalItems || allImages.slice();
  var beforeOrder = getOrderedSceneImageIds(allImages);
  var nextItems = reorderSceneImageItems(allImages, draggedId, dropIndex);
  var nextOrder = getOrderedSceneImageIds(nextItems);
  finishSceneReorderDrag();
  if (beforeOrder.join('\n') === nextOrder.join('\n')) return false;

  allImages = nextItems;
  arrangeSceneItemsInDom(nextOrder);
  sceneReorderState.suppressInteractionUntil = Date.now() + 800;
  saveSceneOrder(previousItems, getCurrentSceneFolderId(), nextOrder);
  return true;
}

function onConfigLoaded(config) {
  if (config.error) {
    showLoadError(config.error);
    return;
  }
  appBaseUrl = config.execUrl || '';
  rootFolderId = config.rootFolderId || null;

  if (config.images) {
    // フォルダモード: サイドバーを構築し、ホーム画像を初期ロード
    allImages = sortSceneListItems(config.images);
    currentFileId = null;
    buildSceneSidebar(allImages);

    // scenesのホームを優先し、未設定時だけ先頭画像へフォールバック
    var homeImg = updateRootHomeImageId();

    var hasImageItems = !!homeImg;
    if (!hasImageItems) {
      syncActiveSceneItem(null);
      if (allImages.length === 0) {
        showSceneEmptyState('写真がありません。アップロードボタンから追加してください。');
      } else {
        showSceneEmptyState('フォルダをクリックして中の写真を選択してください。');
      }
    } else {
      var requestedImg = getRootSceneImageById(allImages, initialSceneId);
      var startImg = requestedImg || homeImg;
      var initialViewYaw = initialYaw;
      var initialViewPitch = initialPitch;
      if (initialSceneId && !requestedImg) {
        initialViewYaw = null;
        initialViewPitch = null;
      }
      loadScene(startImg, initialViewYaw, initialViewPitch);
    }
  } else if (config.imageUrl) {
    // 単一画像モード（後方互換）
    loadSingleImageScene(config);
  } else {
    showLoadError('画像の設定が見つかりませんでした。');
  }
}

/**
 * 画像リストからサイドバーのシーン一覧を生成し表示する
 *
 * @param {Array} images  {id, name, imageUrl} の配列
 */
function normalizeSceneSidebarWidth(value, viewportWidth) {
  var width = Number(value);
  if (!isFinite(width)) width = 160;
  return Math.round(Math.max(140, Math.min(480, Math.floor(viewportWidth / 2), width)));
}

function applySceneSidebarWidth(value, persist) {
  var width = normalizeSceneSidebarWidth(value, window.innerWidth);
  document.documentElement.style.setProperty('--scene-sidebar-width', width + 'px');
  var handle = document.getElementById('scene-sidebar-resize');
  if (handle) {
    handle.setAttribute('aria-valuenow', String(width));
    handle.setAttribute('aria-valuemax', String(Math.min(480, Math.floor(window.innerWidth / 2))));
  }
  if (persist) {
    sceneSidebarPreferredWidth = width;
    try { localStorage.setItem('hemisphere.sceneSidebarWidth', String(width)); } catch (error) { /* Storage can be disabled. */ }
  }
  if (viewer && typeof viewer.resize === 'function') viewer.resize();
}

function initSceneSidebarResize() {
  if (sceneSidebarResizeInitialized) return;
  var handle = document.getElementById('scene-sidebar-resize');
  if (!handle) return;
  sceneSidebarResizeInitialized = true;
  try {
    var saved = localStorage.getItem('hemisphere.sceneSidebarWidth');
    if (saved !== null && isFinite(Number(saved))) sceneSidebarPreferredWidth = Number(saved);
  } catch (error) { /* Keep the default width. */ }
  applySceneSidebarWidth(sceneSidebarPreferredWidth, false);
  handle.addEventListener('pointerdown', function (event) {
    if (event.button !== 0 || window.innerWidth <= 600) return;
    event.preventDefault();
    handle.setPointerCapture(event.pointerId);
  });
  handle.addEventListener('pointermove', function (event) {
    if (handle.hasPointerCapture(event.pointerId)) applySceneSidebarWidth(event.clientX, false);
  });
  handle.addEventListener('pointerup', function (event) {
    if (!handle.hasPointerCapture(event.pointerId)) return;
    handle.releasePointerCapture(event.pointerId);
    applySceneSidebarWidth(event.clientX, true);
  });
  handle.addEventListener('keydown', function (event) {
    var width = Number(handle.getAttribute('aria-valuenow'));
    if (event.key === 'ArrowLeft') width -= 10;
    else if (event.key === 'ArrowRight') width += 10;
    else if (event.key === 'Home') width = 140;
    else if (event.key === 'End') width = 480;
    else return;
    event.preventDefault();
    applySceneSidebarWidth(width, true);
  });
  window.addEventListener('resize', function () { applySceneSidebarWidth(sceneSidebarPreferredWidth, false); });
}

/** Public images can skip GAS; private images retain the authorized server path. */
function requestSceneThumbnail(fileId, complete) {
  function viaGas() {
    var request = google.script.run.withSuccessHandler(function (result) {
      complete(result && result.success && /^data:image\/jpeg;base64,/.test(result.imageUrl || '') ? result.imageUrl : null, 'gas');
    }).withFailureHandler(function () { complete(null, 'gas'); });
    if (canEdit) request.prepareSceneThumbnail(withEditToken({ fileId: fileId }));
    else request.getSceneThumbnail(fileId);
  }
  // Editors keep preparing the stored derivative used by the private fallback.
  if (!sceneThumbnailDirectEnabled || canEdit) { viaGas(); return; }
  var url = 'https://lh3.googleusercontent.com/d/' + encodeURIComponent(fileId) + '=w320';
  var image = new Image(), settled = false;
  var timer = setTimeout(function () { finish(false); }, 2500);
  function finish(success) {
    if (settled) return;
    settled = true;
    clearTimeout(timer);
    image.onload = image.onerror = null;
    if (success) complete(url, 'direct');
    else viaGas();
  }
  image.onload = function () { finish(true); };
  image.onerror = function () { finish(false); };
  image.crossOrigin = 'anonymous';
  image.src = url;
}

/** At most two background reads; scene changes pause new work and folder changes invalidate callbacks. */
function startSceneThumbnailQueue() {
  var generation = ++sceneThumbnailGeneration;
  clearTimeout(sceneThumbnailTimer);
  var nodes = Array.prototype.slice.call(document.querySelectorAll('.scene-thumbnail'));
  var next = 0;
  var started = Date.now(), completed = 0;
  var stats = { generation: generation, total: nodes.length, loaded: 0, failed: 0, direct: 0, gas: 0, cache: 0, firstReady: null };
  sceneThumbnailResume = pump;
  function pump() {
    if (generation !== sceneThumbnailGeneration) return;
    clearTimeout(sceneThumbnailTimer);
    if (isSwitching || !sceneDisplayReady || scenePrefetchActive) {
      sceneThumbnailTimer = setTimeout(pump, 250);
      return;
    }
    while (sceneThumbnailActive < 2 && next < nodes.length) start(nodes[next++]);
  }
  function start(node) {
    var key = node.dataset.fileId;
    var cached = sceneThumbnailCache.get(key);
    sceneThumbnailActive++;
    var settled = false;
    function finish(url, source) {
      if (settled) return;
      settled = true;
      sceneThumbnailActive--;
      if (generation !== sceneThumbnailGeneration) {
        if (sceneThumbnailResume) sceneThumbnailResume();
        return;
      }
      if (node.isConnected && url) {
        sceneThumbnailCache.set(key, url);
        while (sceneThumbnailCache.size > 100) sceneThumbnailCache.delete(sceneThumbnailCache.keys().next().value);
        node.crossOrigin = 'anonymous';
        node.src = url;
        node.classList.add('loaded');
        stats.loaded++;
        if (stats.firstReady === null) stats.firstReady = Date.now() - started;
      } else {
        stats.failed++;
      }
      stats[source]++;
      if (++completed === nodes.length && scenePerformanceEnabled) {
        stats.duration = Date.now() - started;
        console.info('[thumbnail-perf]', JSON.stringify(stats));
      }
      pump();
    }
    if (cached) finish(cached, 'cache');
    else requestSceneThumbnail(key, finish);
  }
  sceneThumbnailTimer = setTimeout(pump, 350);
}

        item.appendChild(menuButton);
      }
      var dragHandle = item.querySelector('.scene-drag-handle');
      if (dragHandle) {
        ['click', 'mousedown', 'pointerdown', 'contextmenu'].forEach(function (eventName) {
          dragHandle.addEventListener(eventName, function (evt) {
            evt.stopPropagation();
            if (eventName === 'contextmenu') evt.preventDefault();
          });
        });
        dragHandle.addEventListener('dragstart', function (evt) {
          beginSceneReorderDrag(evt, img, item);
        });
        dragHandle.addEventListener('dragend', function () {
          finishSceneReorderDrag();
        });
      }
      item.addEventListener('click', function (evt) {
        if (shouldSuppressSceneItemInteraction()) {
          evt.preventDefault();
          return;
        }
        if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('select-scene')) return;
        if (isSwitching) return;
        previousSceneId = null; // サイドバーからの移動は振り返り演出なし
        loadScene(img);
        setMobileSceneSheetExpanded(false);
      });
      item.addEventListener('mouseenter', function () { scheduleSceneImagePrefetch(img.id); });
      item.addEventListener('focusin', function () { scheduleSceneImagePrefetch(img.id); });
      item.addEventListener('mouseleave', function () { clearTimeout(scenePrefetchTimer); });
      item.addEventListener('focusout', function () { clearTimeout(scenePrefetchTimer); });
      item.addEventListener('contextmenu', function (evt) {
        if (shouldSuppressSceneItemInteraction()) {
          evt.preventDefault();
          return;
        }
        if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('scene-context-menu')) {
          evt.preventDefault();
          return;
        }
        openSceneContextMenu(evt, img);
      });
      list.appendChild(item);
    }
  });

  arrangeSceneItemsInDom(getOrderedSceneImageIds(images));
  setSceneReorderSaving(sceneReorderState.saving);

  sidebar.classList.remove('hidden');
  initSceneSidebarResize();
  startSceneThumbnailQueue();
  startSceneMetadataPrefetchQueue(images);
  panorama.classList.add('with-sidebar');
  document.getElementById('flat-map-container').classList.add('with-sidebar');
  if (isPublicViewingMode() && isSmallViewport()) {
    setMobileSceneSheetExpanded(false);
  }
}

/**
 * サブフォルダを開く：現在の一覧をスタックに保存し、指定フォルダの中身を表示する
 * @param {{ id:string, name:string, type:'folder' }} folderItem
 */
function openSubfolder(folderItem) {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('open-subfolder')) return false;
  cancelHotspotMove('フォルダ移動のため移動をキャンセルしました。', { silent: true });
  // 現在の状態をスタックに積む
  folderStack.push({ id: folderItem.id, name: folderItem.name, items: allImages });

  setSceneRefreshButtonState(true);
  google.script.run
    .withSuccessHandler(function (res) {
      setSceneRefreshButtonState(false);
      if (!res || res.error) {
        showToast('フォルダを開けませんでした: ' + ((res && res.error) || '不明なエラー'), 'error');
        folderStack.pop();
        return;
      }
      allImages = res.images || [];
      buildSceneSidebar(allImages);
      syncActiveSceneItem(null);
    })
    .withFailureHandler(function () {
      setSceneRefreshButtonState(false);
      showToast('フォルダの読み込みに失敗しました。', 'error');
      folderStack.pop();
    })
    .navigateToFolder(folderItem.id, true);
}

/**
 * 一つ上のフォルダに戻る
 */
function goBackFolder() {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('go-back-folder')) return false;
  if (folderStack.length === 0) return;
  cancelHotspotMove('フォルダ移動のため移動をキャンセルしました。', { silent: true });
  var prev = folderStack.pop();
  allImages = prev.items;
  buildSceneSidebar(allImages);
  syncActiveSceneItem(currentFileId);
}

function revealActiveSceneCard() {
  requestAnimationFrame(function () {
    var list = document.getElementById('scene-list');
    var card = list && list.querySelector('.scene-item.active');
    if (!card || !list.clientWidth || !list.clientHeight) return;
    var bounds = list.getBoundingClientRect();
    var item = card.getBoundingClientRect();
    if (item.bottom > bounds.bottom) list.scrollTop += item.bottom - bounds.bottom;
    else if (item.top < bounds.top) list.scrollTop += item.top - bounds.top;
    if (item.right > bounds.right) list.scrollLeft += item.right - bounds.right;
    else if (item.left < bounds.left) list.scrollLeft += item.left - bounds.left;
  });
}

function syncActiveSceneItem(activeId) {
  var items = document.querySelectorAll('.scene-item');
  items.forEach(function (el) {
    el.classList.toggle('active', !!activeId && el.dataset.id === activeId);
    var selectButton = el.querySelector('.scene-item-name');
    if (selectButton) selectButton.setAttribute('aria-current', el.classList.contains('active') ? 'true' : 'false');
  });
  var toggle = document.getElementById('mobile-scene-sheet-toggle');
  if (toggle && isPublicViewingMode() && isSmallViewport()) {
    toggle.textContent = 'シーンを選ぶ';
  }
  revealActiveSceneCard();
}

function setSceneRefreshButtonState(isLoading) {
  var button = document.getElementById('scene-refresh-btn');
  if (!button) return;
  button.disabled = !!isLoading;
  button.classList.toggle('loading', !!isLoading);
}

function refreshSceneList() {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('refresh-scene-list')) return false;
  if (isRefreshingSceneList || !allImages) return;
  clearBase64ImageCache();
  clearHotspotCache();
  startSceneMetadataPrefetchQueue([]);
  cancelHotspotMove('一覧更新のため移動をキャンセルしました。', { silent: true });

  isRefreshingSceneList = true;
  setSceneRefreshButtonState(true);
  closeSceneContextMenu();

  google.script.run
    .withSuccessHandler(function (config) {
      isRefreshingSceneList = false;
      setSceneRefreshButtonState(false);

      if (!config || config.error) {
        showToast('シーン一覧の更新に失敗しました: ' + ((config && config.error) || '不明なエラー'), 'error');
        return;
      }
      if (!config.images) {
        showToast('フォルダ内の画像一覧を取得できませんでした。', 'error');
        return;
      }

      allImages = sortSceneListItems(config.images);
      folderStack = []; // ルートに戻るためスタックをクリア
      buildSceneSidebar(allImages);
      updateRootHomeImageId();

      var hasImgItems = allImages.some(function (i) { return i.type !== 'folder'; });
      if (!hasImgItems) {
        syncActiveSceneItem(null);
        var emptyMsg = allImages.length === 0
          ? '写真がありません。アップロードボタンから追加してください。'
          : 'フォルダをクリックして中の写真を選択してください。';
        showSceneEmptyState(emptyMsg);
        showToast('シーン一覧を更新しました。', 'success');
        return;
      }

      if (!currentFileId) {
        syncActiveSceneItem(null);
        showSceneEmptyState('シーン一覧から写真を選択してください。');
        showToast('シーン一覧を更新しました。', 'success');
        return;
      }

      var nextCurrent = getSceneImageById(currentFileId);
      if (nextCurrent) {
        syncActiveSceneItem(currentFileId);
        showToast('シーン一覧を更新しました。', 'success');
        return;
      }

      currentFileId = null;
      showToast('現在の写真が見つからなかったため、先頭の写真を表示します。', 'success');
      previousSceneId = null;
      var firstImage = allImages.filter(function (item) { return item.type !== 'folder'; })[0];
      loadScene(firstImage);
    })
    .withFailureHandler(function () {
      isRefreshingSceneList = false;
      setSceneRefreshButtonState(false);
      showToast('通信エラーが発生しました。再度お試しください。', 'error');
    })
    .getConfig(appMode, true);
}

function getSceneImageById(fileId) {
  if (!allImages || !fileId) return null;
  for (var i = 0; i < allImages.length; i++) {
    if (allImages[i].id === fileId) return allImages[i];
  }
  return null;
}

function isCurrentSceneSettingsRequest(generation, fileId) {
  return generation === sceneSettingsRequestGeneration &&
    String(fileId || '') === String(sceneSettingsTargetId || '');
}

function isCurrentSceneLoadRequest(generation, fileId) {
  return generation === sceneLoadGeneration &&
    String(fileId || '') === String(currentFileId || '');
}

function createHotspotMutationRequest(fileId, operation, targetId) {
  hotspotMutationGeneration += 1;
  var request = {
    id: hotspotMutationGeneration,
    generation: hotspotMutationGeneration,
    sceneGeneration: sceneLoadGeneration,
    fileId: String(fileId || ''),
    operation: String(operation || ''),
    targetId: String(targetId || '')
  };
  pendingHotspotMutationRequests[request.id] = request;
  return request;
}

function isCurrentHotspotMutationRequest(request) {
  return !!request &&
    request.sceneGeneration === sceneLoadGeneration &&
    request.fileId === String(currentFileId || '');
}

function finishHotspotMutationRequest(request) {
  if (!request || !request.id) return;
  delete pendingHotspotMutationRequests[request.id];
}

function hasPendingHotspotMutationForTarget(targetId) {
  var normalizedId = String(targetId || '');
  if (!normalizedId) return false;
  var requestIds = Object.keys(pendingHotspotMutationRequests);
  for (var i = 0; i < requestIds.length; i++) {
    var request = pendingHotspotMutationRequests[requestIds[i]];
    if (request && request.targetId === normalizedId) return true;
  }
  return false;
}

function hasPendingHotspotMutationForScene(fileId) {
  var normalizedId = String(fileId || '');
  if (!normalizedId) return false;
  var requestIds = Object.keys(pendingHotspotMutationRequests);
  for (var i = 0; i < requestIds.length; i++) {
    var request = pendingHotspotMutationRequests[requestIds[i]];
    if (request && request.fileId === normalizedId) return true;
  }
  return false;
}

function canStartHotspotMutation() {
  if (hotspotMoveState.active && hotspotMoveState.saving) {
    showToast('ホットスポットの移動を保存中です。完了までお待ちください。', 'error');
    return false;
  }
  return true;
}

function isHotspotFormSessionActive() {
  return !!hotspotFormSessionState.active;
}

function guardHotspotFormOperation(operation, options) {
  if (!isHotspotFormSessionActive()) return true;
  var opts = options || {};
  if (opts.allowWhileForm) return true;
  if (String(currentFileId || '') !== hotspotFormSessionState.startSceneId) {
    handleUnexpectedHotspotSceneChange();
    return false;
  }
  if (!opts.silent) {
    showToast(HOTSPOT_FORM_GUARD_MESSAGE, 'error');
  }
  return false;
}

function getHotspotFormLockControls() {
  var selector = [
    '#mode-toggle',
    '#embed-btn',
    '#bulk-input-trigger',
    '#bulk-input-dropdown .bulk-input-item',
    '#scene-refresh-btn',
    '#sidebar-collapse-btn',
    '#sidebar-expand-tab',
    '#sidebar-back-btn',
    '#upload-btn',
    '#open-folder-btn',
    '#open-hotspot-folder-btn',
    '#open-hotspot-folder-topbar-btn',
    '#mobile-scene-sheet-toggle',
    '#scene-list .scene-item',
    '#scene-list .scene-folder-item',
    '#scene-context-menu [data-action]',
    '#hotspot-context-menu .hs-context-btn',
    '#btn-home',
    '#quality-toggle-btn',
    '#gyro-toggle-btn'
  ].join(',');
  return Array.from(document.querySelectorAll(selector));
}

function syncHotspotFormInteractionLock(locked) {
  if (locked) {
    getHotspotFormLockControls().forEach(function (control) {
      var alreadyLocked = hotspotFormSessionState.lockedControls.some(function (record) {
        return record.control === control;
      });
      if (alreadyLocked) return;
      var record = {
        control: control,
        previousDisabled: ('disabled' in control) ? !!control.disabled : null,
        previousAriaDisabled: control.getAttribute('aria-disabled')
      };
      hotspotFormSessionState.lockedControls.push(record);
      if ('disabled' in control) control.disabled = true;
      control.setAttribute('aria-disabled', 'true');
    });
    return;
  }

  hotspotFormSessionState.lockedControls.forEach(function (record) {
    var control = record.control;
    if (!control) return;
    if (record.previousDisabled !== null && 'disabled' in control) {
      control.disabled = record.previousDisabled;
    }
    if (record.previousAriaDisabled === null) {
      control.removeAttribute('aria-disabled');
    } else {
      control.setAttribute('aria-disabled', record.previousAriaDisabled);
    }
  });
  hotspotFormSessionState.lockedControls = [];
}

function beginHotspotFormSession(clientX, clientY, editing) {
  hotspotFormSessionState.active = true;
  hotspotFormSessionState.startSceneId = String(currentFileId || '');
  hotspotFormSessionState.sceneType = is2DMode ? '2D' : '360';
  hotspotFormSessionState.editing = !!editing;
  hotspotFormSessionState.anchorClientX = Number(clientX) || window.innerWidth / 2;
  hotspotFormSessionState.anchorClientY = Number(clientY) || window.innerHeight / 2;
  hotspotFormSessionState.lockedControls = [];
  document.body.classList.add('hotspot-form-active');
  syncHotspotFormInteractionLock(true);
}

function endHotspotFormSession() {
  syncHotspotFormInteractionLock(false);
  hotspotFormSessionState.active = false;
  hotspotFormSessionState.startSceneId = '';
  hotspotFormSessionState.sceneType = '';
  hotspotFormSessionState.editing = false;
  hotspotFormSessionState.anchorClientX = 0;
  hotspotFormSessionState.anchorClientY = 0;
  document.body.classList.remove('hotspot-form-active');
  syncDriveFolderButtons();
}

function validateHotspotFormScene() {
  if (!isHotspotFormSessionActive()) return false;
  var currentSceneId = String(currentFileId || '');
  var currentSceneType = is2DMode ? '2D' : '360';
  var draftMatches = !hotspotDraftState.active ||
    (hotspotDraftState.startSceneId === hotspotFormSessionState.startSceneId &&
      hotspotDraftState.sceneType === hotspotFormSessionState.sceneType);
  if (currentSceneId !== hotspotFormSessionState.startSceneId ||
      currentSceneType !== hotspotFormSessionState.sceneType ||
      !draftMatches) {
    handleUnexpectedHotspotSceneChange();
    return false;
  }
  return true;
}

function handleUnexpectedHotspotSceneChange() {
  if (!isHotspotFormSessionActive()) return false;
  closePopup({ silent: true });
  showToast('表示中のシーンが変更されたため、ホットスポットの編集を終了しました。', 'error');
  return true;
}

function resetHotspotSaveUi(request, labelText) {
  if (request && request.id !== hotspotSaveUiRequestId) return false;
  var btn = document.getElementById('btn-save');
  var saveLabel = document.getElementById('save-label');
  if (btn) {
    btn.disabled = false;
    btn.classList.remove('loading');
  }
  if (saveLabel) saveLabel.textContent = labelText || '保存する';
  hotspotSaveUiRequestId = 0;
  return true;
}

function openSceneContextMenu(evt, img) {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('scene-context-menu')) return false;
  if (!canEdit) return;
  if (!img || !img.id) return;
  evt.preventDefault();
  evt.stopPropagation();

  var menu = document.getElementById('scene-context-menu');
  sceneContextReturnFocus = evt.currentTarget || document.activeElement;
  var settingsButton = menu.querySelector('[data-action="settings"]');
  if (settingsButton) {
    settingsButton.disabled = !isEditMode;
    settingsButton.title = !isEditMode ? '編集モードで利用できます' : '';
  }
  var homeButton = menu.querySelector('[data-action="set-home"]');
  if (homeButton) {
    homeButton.disabled = !isEditMode || !isRootSceneItem(img) || isSceneHome(img);
    homeButton.title = !isEditMode
      ? '編集モードで利用できます'
      : (!isRootSceneItem(img) ? 'サブフォルダの画像はホームに設定できません' : '');
  }
  var deleteButton = menu.querySelector('[data-action="delete"]');
  if (deleteButton) {
    deleteButton.disabled = !isEditMode;
    deleteButton.title = !isEditMode ? '編集モードで利用できます' : '';
  }
  sceneContextTargetId = img.id;
  menu.classList.add('visible');

  var menuWidth = menu.offsetWidth || 168;
  var menuHeight = menu.offsetHeight || 212;
  var anchor = sceneContextReturnFocus && sceneContextReturnFocus.getBoundingClientRect
    ? sceneContextReturnFocus.getBoundingClientRect() : { right: 10, bottom: 70 };
  var x = Math.min(evt.clientX || anchor.right, window.innerWidth - menuWidth - 10);
  var y = Math.min(evt.clientY || anchor.bottom, window.innerHeight - menuHeight - 10);
  menu.style.left = Math.max(10, x) + 'px';
  menu.style.top = Math.max(70, y) + 'px';
  var firstAction = menu.querySelector('button:not(:disabled)');
  if (firstAction) firstAction.focus();
}

function closeSceneContextMenu() {
  var menu = document.getElementById('scene-context-menu');
  var restoreFocus = menu.contains(document.activeElement) && sceneContextReturnFocus;
  menu.classList.remove('visible');
  menu.style.left = '';
  menu.style.top = '';
  sceneContextTargetId = null;
  sceneContextReturnFocus = null;
  if (restoreFocus && restoreFocus.isConnected) restoreFocus.focus();
}

function onSceneContextMenuClick(evt) {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('scene-context-action')) {
    closeSceneContextMenu();
    return false;
  }
  if (!canEdit) {
    closeSceneContextMenu();
    return;
  }
  var actionButton = evt.target && evt.target.closest ? evt.target.closest('[data-action]') : evt.target;
  var action = actionButton && actionButton.dataset ? actionButton.dataset.action : '';
  if (!action) return;
  if (actionButton.disabled) return;

  var targetId = sceneContextTargetId;
  closeSceneContextMenu();

  var img = getSceneImageById(targetId);
  if (!img) return;

  if (action === 'settings') {
    openSceneSettingsModal(img);
  } else if (action === 'set-home') {
    requestSetHomeScene(img);
  } else if (action === 'properties') {
    openSceneProperties(img);
  } else if (action === 'delete') {
    requestSceneDelete(img);
  }
}

function closeBulkInputDropdown() {
  var group = document.getElementById('bulk-input-group');
  var trigger = document.getElementById('bulk-input-trigger');
  if (group) group.classList.remove('open');
  if (trigger) trigger.setAttribute('aria-expanded', 'false');
}

function toggleBulkInputDropdown() {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('bulk-input-menu')) return false;
  if (!canEdit) return;
  var group = document.getElementById('bulk-input-group');
  var trigger = document.getElementById('bulk-input-trigger');
  if (!group || !trigger) return;
  var isOpen = group.classList.toggle('open');
  if (isOpen) cancelHotspotMove('一括入力メニューを開いたため移動をキャンセルしました。', { silent: true });
  trigger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
}

function onDocumentClickForContextMenus(evt) {
  if (!evt.target.closest('#scene-context-menu')) {
    closeSceneContextMenu();
  }
  if (!evt.target.closest('#hotspot-context-menu')) {
    closeHotspotContextMenu();
  }
  if (!evt.target.closest('#bulk-input-group')) {
    closeBulkInputDropdown();
  }
}

function onGlobalKeyDown(evt) {
  if (evt.key !== 'Escape') return;
  var audioEditorDialog = document.getElementById('hotspot-audio-editor-dialog');
  var audioHelpDialog = audioEditorDialog && audioEditorDialog.querySelector('[data-hae-help-dialog]');
  if (audioHelpDialog && audioHelpDialog.open) return;
  if (audioEditorDialog && audioEditorDialog.open) {
    evt.preventDefault();
    evt.stopPropagation();
    closeHotspotAudioEditor();
    return;
  }
  if (isPhotoLightboxOpen()) {
    evt.preventDefault();
    evt.stopPropagation();
    closePhotoLightbox();
    return;
  }
  closeSceneContextMenu();
  closeSceneSettingsModal();
  closeScenePropertiesDialog();
  closeHotspotContextMenu();
  closeBulkInputDropdown();
  if (hotspotDraftState.repositioning) {
    evt.preventDefault();
    cancelHotspotDraftReposition();
    return;
  }
  if (isHotspotFormSessionActive()) {
    evt.preventDefault();
    closePopup();
    return;
  }
  cancelHotspotMove('移動をキャンセルしました。', { type: 'error' });
}

function onHotspotEditClick() {

function openDeleteConfirmation(message, onConfirm) {
  if (document.getElementById('delete-confirmation')) return;
  var returnFocus = document.activeElement;
  var dialog = document.createElement('dialog');
  dialog.id = 'delete-confirmation';
  dialog.className = 'delete-confirmation';
  dialog.setAttribute('role', 'alertdialog');
  dialog.setAttribute('aria-labelledby', 'delete-confirmation-title');
  dialog.setAttribute('aria-describedby', 'delete-confirmation-message');
  var title = document.createElement('h2');
  title.id = 'delete-confirmation-title';
  title.textContent = '削除の確認';
  var description = document.createElement('p');
  description.id = 'delete-confirmation-message';
  description.textContent = message;
  var actions = document.createElement('div');
  actions.className = 'delete-confirmation-actions';
  var cancel = document.createElement('button');
  cancel.type = 'button';
  cancel.textContent = 'キャンセル';
  var confirm = document.createElement('button');
  confirm.type = 'button';
  confirm.className = 'delete-confirmation-submit';
  confirm.textContent = '削除する';
  actions.append(cancel, confirm);
  dialog.append(title, description, actions);
  var settled = false;
  function finish(accepted) {
    if (settled) return;
    settled = true;
    dialog.close();
    dialog.remove();
    if (returnFocus && returnFocus.isConnected) returnFocus.focus();
    if (accepted) onConfirm();
  }
  cancel.addEventListener('click', function () { finish(false); });
  confirm.addEventListener('click', function () { finish(true); });
  dialog.addEventListener('cancel', function (evt) { evt.preventDefault(); finish(false); });
  dialog.addEventListener('keydown', function (evt) { evt.stopPropagation(); });
  dialog.addEventListener('click', function (evt) { evt.stopPropagation(); });
  document.body.appendChild(dialog);
  dialog.showModal();
  cancel.focus();
}

function onHotspotDeleteClick() {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('delete-other-hotspot')) {
    closeHotspotContextMenu();
    return false;
  }
  if (!canEdit) {
    closeHotspotContextMenu();
    return;
  }
  suppressNextPanoramaClick = true;
  setTimeout(function () { suppressNextPanoramaClick = false; }, 120);
  var target = hotspotContextTarget;
  closeHotspotContextMenu();
  if (!target) return;
  if (!canStartHotspotMutation()) return;
  if ((hotspotMoveState.active || hotspotMoveState.previewElement) &&
      !cancelHotspotMove('削除操作のため移動をキャンセルしました。', { silent: true })) {
    return;
  }
  if (hasPendingHotspotMutationForTarget(target.id)) {
    showToast('このホットスポットの更新を処理中です。完了までお待ちください。', 'error');
    return;
  }
  if (!isEditMode) return;
  var confirmedSceneId = currentFileId;
  var confirmedSceneGeneration = sceneLoadGeneration;
  openDeleteConfirmation('「' + String(target.label || 'ホットスポット') + '」を削除しますか？\n説明・リンクと添付の関連付けも削除されます。', function () {
  if (!canEdit || !isEditMode || currentFileId !== confirmedSceneId || sceneLoadGeneration !== confirmedSceneGeneration ||
      !canStartHotspotMutation() || hasPendingHotspotMutationForTarget(target.id)) {
    showToast('状態が変わったため削除を中止しました。対象を確認してもう一度操作してください。', 'warning');
    return;
  }
  var mutationRequest = createHotspotMutationRequest(currentFileId || '', 'delete', target.id);

  google.script.run
    .withSuccessHandler(function (result) {
      finishHotspotMutationRequest(mutationRequest);
      if (result && result.success) clearHotspotCache(mutationRequest.fileId);
      if (!isCurrentHotspotMutationRequest(mutationRequest)) return;
      if (result && result.success) {
        if (is2DMode) {
          // 2Dモード: current2DHotspots から削除して再描画
          current2DHotspots = current2DHotspots.filter(function (hs) { return hs !== target; });
          render2DHotspots(current2DHotspots);
        } else {
          try { viewer.removeHotSpot(target._pannellumId); } catch (e) { /* ignore */ }
        }
        if (result.partialSuccess) {
          showToast(
            'ホットスポットを削除しました。' + (result.warning || '古い添付写真の整理に失敗しました。'),
            'warning'
          );
        } else {
          showToast('ホットスポットを削除しました。', 'success');
        }
      } else {
        showToast('削除に失敗しました: ' + ((result && result.error) || '不明なエラー'), 'error');
      }
    })
    .withFailureHandler(function () {
      finishHotspotMutationRequest(mutationRequest);
      if (!isCurrentHotspotMutationRequest(mutationRequest)) return;
      showToast('通信エラーが発生しました。再度お試しください。', 'error');
    })
    .deleteHotspot(withEditToken({
      id: target.id,
      fileId: mutationRequest.fileId
    }));
  });
}

function requestSceneDelete(img) {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('delete-scene')) return false;
  if (!canEdit || !isEditMode || !img || !img.id) return;
  var sceneName = String((img && img.name) || '');
  openDeleteConfirmation(
    '「' + sceneName + '」を削除しますか？\n' +
    '削除した写真はGoogleドライブのゴミ箱に移動され、\n' +
    'このシーンに紐づくホットスポットも削除されます。', function () {
  if (!canEdit || !isEditMode || !getSceneImageById(img.id)) {
    showToast('状態が変わったため削除を中止しました。', 'warning');
    return;
  }

  google.script.run
    .withSuccessHandler(function (result) {
      if (!result || !result.success) {
        showToast('写真の削除に失敗しました: ' + ((result && result.error) || '不明なエラー'), 'error');
        return;
      }
      applySceneDeleteLocally(img.id);
      var deletedHotspots = Number(result.deletedHotspots || 0);
      var detail = deletedHotspots > 0 ? '（ホットスポット ' + deletedHotspots + ' 件も削除）' : '';
      if (result.partialSuccess) {
        showToast('写真は削除しました。' + detail + ' ' + (result.warning || '関連データの一部を削除できませんでした。'), 'error');
      } else {
        showToast('写真を削除しました。' + detail, 'success');
      }
    })
    .withFailureHandler(function () {
      showToast('通信エラーが発生しました。再度お試しください。', 'error');
    })
    .deleteImageFile(withEditToken({
      fileId: img.id
    }));
  });
}

function applySceneDeleteLocally(fileId) {
  if (!allImages || !fileId) return;
  var removedIndex = -1;
  var nextImages = allImages.filter(function (img, index) {
    var keep = img.id !== fileId;
    if (!keep) removedIndex = index;
    return keep;
  });
  if (removedIndex < 0) return;

  allImages = nextImages;
  updateRootHomeImageId();
  closeScenePropertiesDialog();
  closeSceneContextMenu();
  buildSceneSidebar(allImages);

  // 削除対象が現在表示中でない場合は表示中シーンを維持する
  if (currentFileId && currentFileId !== fileId) {
    syncActiveSceneItem(currentFileId);
    return;
  }

  // 現在表示中シーンを削除した場合
  if (viewer) {
    try { viewer.destroy(); } catch (e) { /* ignore */ }
    viewer = null;
  }
  hide2DView();
  hideJumpTooltip();
  current2DHotspots = [];
  is2DMode = false;

  // 画像アイテム（フォルダを除く）の中から次に表示するシーンを選ぶ
  var imageItems = allImages.filter(function (i) { return i.type !== 'folder'; });
  if (imageItems.length === 0) {
    currentFileId = null;
    showSceneEmptyState('シーンがありません。写真をアップロードしてください。');
    return;
  }

  var nextIndex = Math.min(Math.max(removedIndex, 0), imageItems.length - 1);
  previousSceneId = null;
  loadScene(imageItems[nextIndex]);
}

/** サーバーの正規化済みsceneを、画像URLなどのクライアント専用値を保ったまま結合する。 */
function mergeNormalizedSceneIntoImage(image, scene) {
  var merged = Object.assign({}, image || {});
  Object.keys(scene || {}).forEach(function (key) {
    merged[key] = scene[key];
  });
  merged.id = String((scene && (scene.id || scene.fileId)) || merged.id || '');
  var normalizedType = String((scene && (scene.sceneType || scene.type)) || '').toUpperCase();
  if (normalizedType === '360' || normalizedType === '2D') {
    merged.type = normalizedType;
    merged.sceneType = normalizedType;
  }
  if (scene && scene.displayName) merged.name = scene.displayName;
  return merged;
}

/** 正規化済みsceneを現在の一覧へ反映し、表示順とアクティブ状態を再描画する。 */
function applyNormalizedSceneLocally(scene) {
  if (!Array.isArray(allImages) || !scene) return null;
  var targetId = String(scene.id || scene.fileId || '');
  var mergedScene = null;
  allImages = allImages.map(function (image) {
    if (!image || String(image.id || '') !== targetId) return image;
    mergedScene = mergeNormalizedSceneIntoImage(image, scene);
    return mergedScene;
  });
  if (!mergedScene) return null;
  allImages = sortSceneListItems(allImages);
  updateRootHomeImageId();
  buildSceneSidebar(allImages);
  syncActiveSceneItem(currentFileId);
  return mergedScene;
}

function getSceneSettingsRadioValue(name, fallback) {
  var selected = document.querySelector('input[name="' + name + '"]:checked');
  return selected ? selected.value : fallback;
}

function setSceneSettingsRadioValue(name, value) {
  var inputs = document.querySelectorAll('input[name="' + name + '"]');
  inputs.forEach(function (input) {
    input.checked = input.value === value;
  });
}

function focusSceneListItem(fileId) {
  if (!fileId) return;
  var items = document.querySelectorAll('.scene-item');
  for (var i = 0; i < items.length; i++) {
    if (String(items[i].dataset.id || '') === String(fileId)) {
      (items[i].querySelector('.scene-item-name') || items[i]).focus();
      return;
    }
  }
}

/** シーン設定をモーダルへ反映する。 */
function renderSceneSettings(scene) {
  sceneSettingsOriginal = scene;
  document.getElementById('scene-settings-name').value = getSceneDisplayName(scene);
  setSceneSettingsRadioValue('scene-settings-type', scene.sceneType || scene.type || '360');
  setSceneSettingsRadioValue('scene-settings-north-mode', scene.northOffsetMode || 'auto');
  document.getElementById('scene-settings-north-value').value = scene.northOffset == null
    ? ''
    : String(scene.northOffset);
  document.getElementById('scene-settings-error').textContent = '';
  document.getElementById('scene-settings-dialog').setAttribute('aria-busy', 'false');
  document.getElementById('scene-settings-save-btn').disabled = false;
  syncSceneSettingsControls();
  document.getElementById('scene-settings-name').focus();
}

/** 種別とnorthOffsetモードに応じて入力可否と説明を同期する。 */
function syncSceneSettingsControls() {
  var type = getSceneSettingsRadioValue('scene-settings-type', '360');
  var northMode = getSceneSettingsRadioValue('scene-settings-north-mode', 'auto');
  var is2D = type === '2D';
  var northFieldset = document.getElementById('scene-settings-north-fieldset');
  var manualInput = document.getElementById('scene-settings-north-value');
  var note = document.getElementById('scene-settings-note');
  northFieldset.disabled = is2D;
  manualInput.disabled = is2D || northMode !== 'manual';
  if (is2D) {
    note.textContent = '2D画像では北方向補正を使用しません。XMP解析やコンパス表示も行いません。';
  } else if (northMode === 'manual') {
    note.textContent = '0以上360未満の数値を指定してください。0も有効です。';
  } else if (northMode === 'none') {
    note.textContent = '補正を無効にし、次回以降もXMPを解析しません。';
  } else {
    note.textContent = '次回の360画像表示時にJPEGのXMPから自動取得します。';
  }
}

/** 編集トークン付きで設定を取得し、モーダルを開く。 */
function openSceneSettingsModal(img) {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('scene-settings')) return false;
  if (!canEdit || !isEditMode || !img || !img.id) return;
  if (hasPendingHotspotMutationForScene(img.id)) {
    showToast('このシーンのホットスポットを処理中です。完了までお待ちください。', 'error');
    return;
  }
  if ((hotspotMoveState.active || hotspotMoveState.previewElement) &&
      !cancelHotspotMove('設定の変更を開いたため移動をキャンセルしました。', { silent: true })) {
    return;
  }
  var requestedFileId = String(img.id || '');
  var requestGeneration = ++sceneSettingsRequestGeneration;
  sceneSettingsTargetId = requestedFileId;
  sceneSettingsReturnFocusId = requestedFileId;
  sceneSettingsOriginal = null;
  isSavingSceneSettings = false;

  var backdrop = document.getElementById('scene-settings-backdrop');
  var dialog = document.getElementById('scene-settings-dialog');
  var saveButton = document.getElementById('scene-settings-save-btn');
  document.getElementById('scene-settings-name').value = getSceneDisplayName(img);
  document.getElementById('scene-settings-error').textContent = '設定を読み込んでいます…';
  saveButton.disabled = true;
  saveButton.textContent = '保存';
  dialog.setAttribute('aria-busy', 'true');
  backdrop.classList.add('visible');
  dialog.focus();

  google.script.run
    .withSuccessHandler(function (result) {
      if (!isCurrentSceneSettingsRequest(requestGeneration, requestedFileId)) return;
      if (!result || !result.success || !result.scene) {
        dialog.setAttribute('aria-busy', 'false');
        document.getElementById('scene-settings-error').textContent =
          '設定の取得に失敗しました: ' + ((result && result.error) || '不明なエラー');
        return;
      }
      renderSceneSettings(result.scene);
    })
    .withFailureHandler(function () {
      if (!isCurrentSceneSettingsRequest(requestGeneration, requestedFileId)) return;
      dialog.setAttribute('aria-busy', 'false');
      document.getElementById('scene-settings-error').textContent =
        '通信エラーが発生しました。モーダルを閉じずに再度お試しください。';
    })
    .getSceneSettings(withEditToken({ fileId: requestedFileId }));
}

/** 保存中でなければ設定モーダルを閉じ、対象シーンへフォーカスを戻す。 */
function closeSceneSettingsModal(forceClose) {
  if (isSavingSceneSettings && !forceClose) return;
  var focusId = sceneSettingsReturnFocusId;
  sceneSettingsRequestGeneration += 1;
  document.getElementById('scene-settings-backdrop').classList.remove('visible');
  document.getElementById('scene-settings-dialog').setAttribute('aria-busy', 'false');
  sceneSettingsTargetId = null;
  sceneSettingsOriginal = null;
  sceneSettingsReturnFocusId = null;
  isSavingSceneSettings = false;
  setTimeout(function () { focusSceneListItem(focusId); }, 0);
}

function onSceneSettingsBackdropClick(evt) {
  if (evt.target.id === 'scene-settings-backdrop') {
    closeSceneSettingsModal();
  }
}

/** 現在表示中のsceneだけ、安全な視点を保持して新設定で再読込する。 */
function reloadCurrentSceneAfterSettings(previousScene, nextScene) {
  if (!nextScene || String(nextScene.id || nextScene.fileId || '') !== String(currentFileId || '')) return;
  var fileId = String(nextScene.id || nextScene.fileId || '');
  clearHotspotCache(fileId);
  preloadedScenes.delete(fileId);

  var previousType = getExplicitSceneType(previousScene || {});
  var nextType = getExplicitSceneType(nextScene);
  var preservePanoramaView = previousType === '360' && nextType === '360';
  var savedYaw = null;
  var savedPitch = null;
  if (preservePanoramaView && viewer) {
    try {
      if (typeof viewer.getYaw === 'function') savedYaw = viewer.getYaw();
      if (typeof viewer.getPitch === 'function') savedPitch = viewer.getPitch();
    } catch (e) {
      savedYaw = null;
      savedPitch = null;
    }
  }

  previousSceneId = null;
  hide2DView();
  loadScene(nextScene, savedYaw, savedPitch);
}

/** 設定モーダルの入力値を編集トークン付きで保存する。 */
function saveSceneSettings() {
  if (!canEdit || !isEditMode || !sceneSettingsTargetId || !sceneSettingsOriginal) return;
  if (isSavingSceneSettings) return;

  var type = getSceneSettingsRadioValue('scene-settings-type', '360');
  var northMode = getSceneSettingsRadioValue('scene-settings-north-mode', 'auto');
  var sceneName = String(document.getElementById('scene-settings-name').value || '').trim();
  var manualValue = String(document.getElementById('scene-settings-north-value').value || '').trim();
  var errorElement = document.getElementById('scene-settings-error');
  var saveButton = document.getElementById('scene-settings-save-btn');
  var payload = { fileId: sceneSettingsTargetId, name: sceneName, type: type };

  errorElement.textContent = '';
  if (!sceneName) {
    errorElement.textContent = '名前を入力してください。';
    document.getElementById('scene-settings-name').focus();
    return;
  }
  if (/[\u0000-\u001F\u007F]/.test(sceneName)) {
    errorElement.textContent = '名前に制御文字は使用できません。';
    document.getElementById('scene-settings-name').focus();
    return;
  }
  if (type === '360') {
    payload.northOffsetMode = northMode;
    if (northMode === 'manual') {
      var numericValue = manualValue === '' ? NaN : Number(manualValue);
      if (!isFinite(numericValue) || numericValue < 0 || numericValue >= 360) {
        errorElement.textContent = '手動northOffsetは0以上360未満の数値を入力してください。';
        return;
      }
      payload.northOffset = numericValue;
    }
  }

  isSavingSceneSettings = true;
  saveButton.disabled = true;
  saveButton.textContent = '保存中…';
  document.getElementById('scene-settings-dialog').setAttribute('aria-busy', 'true');

  function finishSaving() {
    isSavingSceneSettings = false;
    saveButton.disabled = false;
    saveButton.textContent = '保存';
    document.getElementById('scene-settings-dialog').setAttribute('aria-busy', 'false');
  }

  google.script.run
    .withSuccessHandler(function (result) {
      if (!result || !result.success || !result.scene) {
        finishSaving();
        errorElement.textContent = '保存に失敗しました: ' + ((result && result.error) || '不明なエラー');
        return;
      }
      var previousScene = sceneSettingsOriginal;
      var updatedScene = applyNormalizedSceneLocally(result.scene) || result.scene;
      finishSaving();
      closeSceneSettingsModal(true);
      reloadCurrentSceneAfterSettings(previousScene, updatedScene);
      showToast(
        result.partialSuccess ? (result.warning || '設定は保存しましたが、キャッシュ更新に失敗しました。') : '設定の変更を保存しました。',
        result.partialSuccess ? 'error' : 'success'
      );
    })
    .withFailureHandler(function () {
      finishSaving();
      errorElement.textContent = '通信エラーが発生しました。入力内容を保持したまま再度お試しください。';
    })
    .updateSceneSettings(withEditToken(payload));
}

function applyHomeSelectionToImages(images, nextHomeId, normalizedScene) {
  return (images || []).map(function (image) {
    if (!image || image.type === 'folder') return image;
    var next = String(image.id || '') === String(nextHomeId || '') && normalizedScene
      ? mergeNormalizedSceneIntoImage(image, normalizedScene)
      : Object.assign({}, image);
    next.isHome = String(next.id || '') === String(nextHomeId || '');
    return next;
  });
}

/** 編集モードのルート画像を、表示シーンを変えずにホームへ設定する。 */
function requestSetHomeScene(img) {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('set-home')) return false;
  if (!canEdit || !isEditMode || !isRootSceneItem(img) || isSceneHome(img)) return;
  google.script.run
    .withSuccessHandler(function (result) {

      );
    })
    .withFailureHandler(function () {
      showToast('通信エラーが発生しました。再度お試しください。', 'error');

function openSceneProperties(img) {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('scene-properties')) return false;
  cancelHotspotMove('プロパティを開いたため移動をキャンセルしました。', { silent: true });

    .withSuccessHandler(function (result) {

      }
      renderSceneProperties(result.properties);
    })
    .withFailureHandler(function () {

    .getImageFileProperties(withEditToken({ fileId: img.id }));
