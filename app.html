<script>
// =============================================
//  状態変数
// =============================================
var viewer          = null;   // Pannellumビューアインスタンス
var isEditMode      = false;  // 現在編集モードかどうか
var appMode         = '';     // URLパラメータ: 'public' | 'internal' | ''
var editToken       = String(window.__EDIT_TOKEN__ || '');
var canEdit         = !!editToken;
var deliveryMode    = 'direct'; // 画像配信方式: 'direct' | 'auto' | 'base64'
var initialSceneId  = '';     // URLパラメータ scene の初期表示シーンID
var initialYaw      = null;   // URLパラメータ yaw の初期視点
var initialPitch    = null;   // URLパラメータ pitch の初期視点
var isGyroActive    = false;  // ジャイロ（DeviceOrientation）ON/OFF状態
var appBaseUrl      = '';     // WebアプリのベースURL（共有URL生成用）
var pendingPitch    = null;   // クリック地点のPitch（保存待ち）
// 編集モード: ドラッグとクリックの判別用（ドラッグ後のclickでホットスポットを開かない）
var EDIT_MODE_DRAG_THRESHOLD_PX = 5;
var editModeDragStart   = null;   // mousedown時の { x, y } または null
var editModeWasDragging = false;  // 直前にドラッグだった場合 true
var pendingYaw      = null;   // クリック地点のYaw（保存待ち）
var toastTimer      = null;   // トーストの自動非表示タイマー
var allImages       = null;   // フォルダモード時の全画像リスト {id, name, imageUrl}
var homeImageId     = null;   // ホーム画像のファイルID（[HOME]タグで指定）
var folderStack     = [];     // サブフォルダナビゲーション用スタック [{id, name, items}]
var rootFolderId    = null;   // ルートフォルダのDrive ID
var currentFileId   = null;   // 現在表示中の画像ファイルID
var previousSceneId = null;   // ジャンプ前のシーンID（振り返り視点計算用）
var preloadedScenes = new Set(); // プリロード済みシーンIDのセット（先読みキャッシュ管理）
var isSwitching     = false;  // シーン切替中フラグ（二重クリック防止）
var imageQualityMode = 'fast'; // 画質モード: 'fast'(=w4096) | 'high'(=s0)
var loadPollInterval = null;  // Pannellum loadイベントのポーリングインターバル
var isRefreshingSceneList = false; // シーン一覧の再取得中かどうか
var sidebarCollapsed = false; // サイドバー折りたたみ状態
var sceneContextTargetId = null; // 右クリック対象のシーンID
var isPanning       = false;  // 視点移動中かどうか
var editingHotspot       = null;  // 編集中のホットスポットargs（nullなら新規）
var currentPopupMode     = null;  // 'type' | 'info' | 'jump'
var hotspotContextTarget = null;  // 右クリック対象のホットスポットargs
var suppressNextPanoramaClick = false; // メニュー操作直後のクリック貫通を抑止
var isMovingHotspot = false;      // ホットスポット移動モード中かどうか
var movingHotspotTarget = null;   // 移動対象のホットスポットargs
var photoCache           = {};    // 写真データURIのキャッシュ {photoId: dataUri}
var hotspotCacheByFileId = {};
var activeJumpTooltip    = null;  // 表示中のジャンプツールチップ要素
var DEFAULT_MARKER_SHAPE = 'circle';
var DEFAULT_MARKER_COLOR = 'blue';
var DEFAULT_MARKER_ICON = 'info';
var MARKER_SHAPE_LABELS = {
  circle: '丸',
  square: '四角',
  diamond: '菱形',
  star: '星'
};
var MARKER_COLOR_LABELS = {
  blue: '水色',
  green: '緑',
  orange: 'オレンジ',
  purple: '紫',
  white: '白',
  gray: '灰色',
  yellow: '黄色',
  red: '赤色'
};
var MARKER_ICON_LABELS = {
  info: '情報',
  photo: '写真',
  wifi: 'Wi-Fi',
  quiz: 'クイズ'
};
var lastMarkerShape = DEFAULT_MARKER_SHAPE;
var lastMarkerColor = DEFAULT_MARKER_COLOR;
var lastMarkerIcon = DEFAULT_MARKER_ICON;
var is2DMode = false;          // 現在2D平面マップモードかどうか
var current2DHotspots = [];    // 2Dモード時の現在のホットスポット一覧
var IMAGE_LOAD_TIMEOUT_MS = 30000;
var DIRECT_FALLBACK_TIMEOUT_MS = 8000;
var MOBILE_PUBLIC_HINT_STORAGE_KEY = 'mobilePublicGyroHintShown';

function withEditToken(payload) {
  var next = {};
  if (payload && typeof payload === 'object') {
    Object.keys(payload).forEach(function (key) {
      next[key] = payload[key];
    });
  }
  next.__editToken = editToken;
  return next;
}

function normalizeDeliveryMode(value) {
  value = String(value || '').trim().toLowerCase();
  return (value === 'auto' || value === 'base64' || value === 'direct') ? value : 'direct';
}

function isPublicViewingMode() {
  return appMode === 'public' || appMode === 'internal' || !canEdit;
}

function isSmallViewport() {
  if (window.matchMedia) {
    return window.matchMedia('(max-width: 700px)').matches;
  }
  return window.innerWidth <= 700;
}

function updateViewingModeClasses() {
  var publicView = isPublicViewingMode();
  var mobileView = isSmallViewport();
  var topbarHiddenView = appMode === 'public' || appMode === 'internal' || (publicView && mobileView);
  document.body.classList.toggle('public-view', publicView);
  document.body.classList.toggle('mobile-view', mobileView);
  document.body.classList.toggle('mobile-public-view', publicView && mobileView);
  document.body.classList.toggle('topbar-hidden-view', topbarHiddenView);
  if (!(publicView && mobileView)) {
    setMobileSceneSheetExpanded(false);
  }
}

function updateAccessNotice() {
  var viewOnlyNotice = document.getElementById('view-only-notice');
  var editKeyWarning = document.getElementById('edit-key-warning');
  var showViewOnly = !appMode && !canEdit && appMode !== 'public' && appMode !== 'internal';
  var showEditWarning = appMode === 'edit' && !canEdit && appMode !== 'public' && appMode !== 'internal';

  if (viewOnlyNotice) viewOnlyNotice.classList.toggle('visible', showViewOnly);
  if (editKeyWarning) editKeyWarning.classList.toggle('visible', showEditWarning);
}

function maybeShowMobilePublicHint() {
  if (!isPublicViewingMode() || !isSmallViewport()) return;
  try {
    if (window.localStorage && localStorage.getItem(MOBILE_PUBLIC_HINT_STORAGE_KEY) === '1') return;
    showToast('ドラッグで見回せます。ジャイロONで傾き操作もできます。', 'success');
    if (window.localStorage) localStorage.setItem(MOBILE_PUBLIC_HINT_STORAGE_KEY, '1');
  } catch (e) {
    showToast('ドラッグで見回せます。ジャイロONで傾き操作もできます。', 'success');
  }
}

function normalizeShareQualityMode(value) {
  value = String(value || '').trim().toLowerCase();
  return (value === 'high' || value === 'fast') ? value : 'fast';
}

function parseNumberParam(value) {
  if (value === null || typeof value === 'undefined') return null;
  if (String(value).trim() === '') return null;
  var num = Number(value);
  return isFinite(num) ? num : null;
}

function formatShareNumber(value) {
  var num = parseNumberParam(value);
  if (num === null) return '';
  return String(Math.round(num * 100) / 100);
}

function buildPublicShareUrl(options) {
  options = options || {};
  var baseUrl = String(options.baseUrl || '').split('#')[0].split('?')[0];
  var params = [
    'mode=public',
    'delivery=' + encodeURIComponent(normalizeDeliveryMode(options.delivery))
  ];

  if (options.includeQuality === true) {
    params.push('quality=' + encodeURIComponent(normalizeShareQualityMode(options.quality)));
  }

  var sceneId = String(options.sceneId || '').trim();
  if (sceneId) {
    params.push('scene=' + encodeURIComponent(sceneId));
  }

  var yaw = parseNumberParam(options.yaw);
  if (yaw !== null) {
    params.push('yaw=' + encodeURIComponent(formatShareNumber(yaw)));
  }

  var pitch = parseNumberParam(options.pitch);
  if (pitch !== null) {
    params.push('pitch=' + encodeURIComponent(formatShareNumber(pitch)));
  }

  return baseUrl + '?' + params.join('&');
}

function buildIframeCode(url) {
  var src = String(url || '').replace(/"/g, '&quot;');
  return '<iframe src="' + src + '" width="100%" height="600px" frameborder="0" allowfullscreen allow="fullscreen *"></iframe>';
}

// QR Code Model 2 / error correction level M, byte mode only.
// External QR image APIs are intentionally not used; the public URL stays in the browser.
var QR_RS_BLOCK_TABLE_M = [
  null,
  [{ count: 1, data: 16, ec: 10 }],
  [{ count: 1, data: 28, ec: 16 }],
  [{ count: 1, data: 44, ec: 26 }],
  [{ count: 2, data: 32, ec: 18 }],
  [{ count: 2, data: 43, ec: 24 }],
  [{ count: 4, data: 27, ec: 16 }],
  [{ count: 4, data: 31, ec: 18 }],
  [{ count: 2, data: 38, ec: 22 }, { count: 2, data: 39, ec: 22 }],
  [{ count: 3, data: 36, ec: 22 }, { count: 2, data: 37, ec: 22 }],
  [{ count: 4, data: 43, ec: 26 }, { count: 1, data: 44, ec: 26 }],
  [{ count: 1, data: 50, ec: 30 }, { count: 4, data: 51, ec: 30 }]
];

var QR_ALIGNMENT_POSITIONS = [
  [],
  [],
  [6, 18],
  [6, 22],
  [6, 26],
  [6, 30],
  [6, 34],
  [6, 22, 38],
  [6, 24, 42],
  [6, 26, 46],
  [6, 28, 50],
  [6, 30, 54]
];

var QR_GF_EXP = null;
var QR_GF_LOG = null;
var QR_RS_GENERATOR_CACHE = {};

function qrFilledArray(length, value) {
  var arr = [];
  for (var i = 0; i < length; i++) arr.push(value);
  return arr;
}

function qrEncodeUtf8(text) {
  text = String(text || '');
  if (window.TextEncoder) {
    return Array.prototype.slice.call(new TextEncoder().encode(text));
  }
  var encoded = unescape(encodeURIComponent(text));
  var bytes = [];
  for (var i = 0; i < encoded.length; i++) {
    bytes.push(encoded.charCodeAt(i));
  }
  return bytes;
}

function qrGetBlocks(version) {
  var groups = QR_RS_BLOCK_TABLE_M[version];
  var blocks = [];
  for (var i = 0; i < groups.length; i++) {
    for (var j = 0; j < groups[i].count; j++) {
      blocks.push({ dataCount: groups[i].data, ecCount: groups[i].ec });
    }
  }
  return blocks;
}

function qrGetDataCodewordCount(version) {
  var blocks = qrGetBlocks(version);
  var total = 0;
  for (var i = 0; i < blocks.length; i++) total += blocks[i].dataCount;
  return total;
}

function qrChooseVersion(bytes) {
  for (var version = 1; version < QR_RS_BLOCK_TABLE_M.length; version++) {
    var charCountBits = version < 10 ? 8 : 16;
    if (bytes.length >= (1 << charCountBits)) continue;
    if (4 + charCountBits + bytes.length * 8 <= qrGetDataCodewordCount(version) * 8) {
      return version;
    }
  }
  throw new Error('QRコードにするURLが長すぎます。');
}

function QrBitBuffer() {
  this.bits = [];
}

QrBitBuffer.prototype.appendBits = function (value, length) {
  for (var i = length - 1; i >= 0; i--) {
    this.bits.push(((value >>> i) & 1) !== 0);
  }
};

function qrMakeDataCodewords(bytes, version) {
  var dataCodewordCount = qrGetDataCodewordCount(version);
  var capacityBits = dataCodewordCount * 8;
  var buffer = new QrBitBuffer();
  buffer.appendBits(4, 4); // byte mode
  buffer.appendBits(bytes.length, version < 10 ? 8 : 16);
  for (var i = 0; i < bytes.length; i++) buffer.appendBits(bytes[i], 8);

  var terminatorBits = Math.min(4, capacityBits - buffer.bits.length);
  buffer.appendBits(0, terminatorBits);
  while (buffer.bits.length % 8 !== 0) buffer.bits.push(false);

  var codewords = [];
  for (var j = 0; j < buffer.bits.length; j += 8) {
    var value = 0;
    for (var k = 0; k < 8; k++) value = (value << 1) | (buffer.bits[j + k] ? 1 : 0);
    codewords.push(value);
  }

  var pad = 0xEC;
  while (codewords.length < dataCodewordCount) {
    codewords.push(pad);
    pad = pad === 0xEC ? 0x11 : 0xEC;
  }
  return codewords;
}

function qrInitGaloisField() {
  if (QR_GF_EXP && QR_GF_LOG) return;
  QR_GF_EXP = [];
  QR_GF_LOG = [];
  var x = 1;
  for (var i = 0; i < 255; i++) {
    QR_GF_EXP[i] = x;
    QR_GF_LOG[x] = i;
    x <<= 1;
    if (x & 0x100) x ^= 0x11D;
  }
  for (var j = 255; j < 512; j++) QR_GF_EXP[j] = QR_GF_EXP[j - 255];
}

function qrGfMultiply(a, b) {
  if (a === 0 || b === 0) return 0;
  qrInitGaloisField();
  return QR_GF_EXP[QR_GF_LOG[a] + QR_GF_LOG[b]];
}

function qrMultiplyPolynomials(a, b) {
  var result = qrFilledArray(a.length + b.length - 1, 0);
  for (var i = 0; i < a.length; i++) {
    for (var j = 0; j < b.length; j++) {
      result[i + j] ^= qrGfMultiply(a[i], b[j]);
    }
  }
  return result;
}

function qrGetGeneratorPolynomial(degree) {
  if (QR_RS_GENERATOR_CACHE[degree]) return QR_RS_GENERATOR_CACHE[degree];
  qrInitGaloisField();
  var poly = [1];
  for (var i = 0; i < degree; i++) {
    poly = qrMultiplyPolynomials(poly, [1, QR_GF_EXP[i]]);
  }
  QR_RS_GENERATOR_CACHE[degree] = poly;
  return poly;
}

function qrComputeErrorCorrection(data, degree) {
  var generator = qrGetGeneratorPolynomial(degree);
  var result = qrFilledArray(degree, 0);
  for (var i = 0; i < data.length; i++) {
    var factor = data[i] ^ result[0];
    result.shift();
    result.push(0);
    for (var j = 0; j < degree; j++) {
      result[j] ^= qrGfMultiply(generator[j + 1], factor);
    }
  }
  return result;
}

function qrInterleaveCodewords(dataCodewords, version) {
  var specs = qrGetBlocks(version);
  var blocks = [];
  var offset = 0;
  var maxDataLength = 0;
  var maxEcLength = 0;
  for (var i = 0; i < specs.length; i++) {
    var data = dataCodewords.slice(offset, offset + specs[i].dataCount);
    offset += specs[i].dataCount;
    var ec = qrComputeErrorCorrection(data, specs[i].ecCount);
    blocks.push({ data: data, ec: ec });
    maxDataLength = Math.max(maxDataLength, data.length);
    maxEcLength = Math.max(maxEcLength, ec.length);
  }

  var result = [];
  for (var dataIndex = 0; dataIndex < maxDataLength; dataIndex++) {
    for (var b = 0; b < blocks.length; b++) {
      if (dataIndex < blocks[b].data.length) result.push(blocks[b].data[dataIndex]);
    }
  }
  for (var ecIndex = 0; ecIndex < maxEcLength; ecIndex++) {
    for (var c = 0; c < blocks.length; c++) {
      if (ecIndex < blocks[c].ec.length) result.push(blocks[c].ec[ecIndex]);
    }
  }
  return result;
}

function qrCreateEmptyMatrix(size) {
  var modules = [];
  var isFunction = [];
  for (var y = 0; y < size; y++) {
    modules[y] = [];
    isFunction[y] = [];
    for (var x = 0; x < size; x++) {
      modules[y][x] = false;
      isFunction[y][x] = false;
    }
  }
  return { modules: modules, isFunction: isFunction };
}

function qrSetFunctionModule(modules, isFunction, x, y, isDark) {
  var size = modules.length;
  if (x < 0 || y < 0 || x >= size || y >= size) return;
  modules[y][x] = !!isDark;
  isFunction[y][x] = true;
}

function qrDrawFinderPattern(modules, isFunction, x, y) {
  for (var dy = -1; dy <= 7; dy++) {
    for (var dx = -1; dx <= 7; dx++) {
      var xx = x + dx;
      var yy = y + dy;
      var dark = dx >= 0 && dx <= 6 && dy >= 0 && dy <= 6 &&
        (dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4));
      qrSetFunctionModule(modules, isFunction, xx, yy, dark);
    }
  }
}

function qrDrawAlignmentPattern(modules, isFunction, x, y) {
  for (var dy = -2; dy <= 2; dy++) {
    for (var dx = -2; dx <= 2; dx++) {
      qrSetFunctionModule(modules, isFunction, x + dx, y + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
  }
}

function qrDrawFormatBits(modules, isFunction, mask) {
  var size = modules.length;
  var data = mask; // Error correction level M uses format bits 00.
  var rem = data;
  for (var i = 0; i < 10; i++) rem = (rem << 1) ^ (((rem >>> 9) & 1) ? 0x537 : 0);
  var bits = ((data << 10) | rem) ^ 0x5412;

  function getBit(index) {
    return ((bits >>> index) & 1) !== 0;
  }

  for (var a = 0; a <= 5; a++) qrSetFunctionModule(modules, isFunction, 8, a, getBit(a));
  qrSetFunctionModule(modules, isFunction, 8, 7, getBit(6));
  qrSetFunctionModule(modules, isFunction, 8, 8, getBit(7));
  qrSetFunctionModule(modules, isFunction, 7, 8, getBit(8));
  for (var b = 9; b < 15; b++) qrSetFunctionModule(modules, isFunction, 14 - b, 8, getBit(b));

  for (var c = 0; c < 8; c++) qrSetFunctionModule(modules, isFunction, size - 1 - c, 8, getBit(c));
  for (var d = 8; d < 15; d++) qrSetFunctionModule(modules, isFunction, 8, size - 15 + d, getBit(d));
  qrSetFunctionModule(modules, isFunction, 8, size - 8, true);
}

function qrDrawVersionBits(modules, isFunction, version) {
  if (version < 7) return;
  var size = modules.length;
  var rem = version;
  for (var i = 0; i < 12; i++) rem = (rem << 1) ^ (((rem >>> 11) & 1) ? 0x1F25 : 0);
  var bits = (version << 12) | rem;
  for (var j = 0; j < 18; j++) {
    var bit = ((bits >>> j) & 1) !== 0;
    var x = size - 11 + (j % 3);
    var y = Math.floor(j / 3);
    qrSetFunctionModule(modules, isFunction, x, y, bit);
    qrSetFunctionModule(modules, isFunction, y, x, bit);
  }
}

function qrDrawFunctionPatterns(modules, isFunction, version) {
  var size = modules.length;
  qrDrawFinderPattern(modules, isFunction, 0, 0);
  qrDrawFinderPattern(modules, isFunction, size - 7, 0);
  qrDrawFinderPattern(modules, isFunction, 0, size - 7);

  for (var i = 8; i < size - 8; i++) {
    qrSetFunctionModule(modules, isFunction, i, 6, i % 2 === 0);
    qrSetFunctionModule(modules, isFunction, 6, i, i % 2 === 0);
  }

  var positions = QR_ALIGNMENT_POSITIONS[version];
  for (var yIndex = 0; yIndex < positions.length; yIndex++) {
    for (var xIndex = 0; xIndex < positions.length; xIndex++) {
      var x = positions[xIndex];
      var y = positions[yIndex];
      var overlapsFinder = (x === 6 && y === 6) || (x === 6 && y === size - 7) || (x === size - 7 && y === 6);
      if (!overlapsFinder) qrDrawAlignmentPattern(modules, isFunction, x, y);
    }
  }

  qrDrawFormatBits(modules, isFunction, 0);
  qrDrawVersionBits(modules, isFunction, version);
}

function qrDrawCodewords(modules, isFunction, codewords) {
  var size = modules.length;
  var bits = [];
  for (var i = 0; i < codewords.length; i++) {
    for (var j = 7; j >= 0; j--) bits.push(((codewords[i] >>> j) & 1) !== 0);
  }

  var bitIndex = 0;
  var upward = true;
  for (var right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right--;
    for (var vert = 0; vert < size; vert++) {
      var y = upward ? size - 1 - vert : vert;
      for (var dx = 0; dx < 2; dx++) {
        var x = right - dx;
        if (!isFunction[y][x]) {
          modules[y][x] = bitIndex < bits.length ? bits[bitIndex] : false;
          bitIndex++;
        }
      }
    }
    upward = !upward;
  }
}

function qrCloneMatrix(matrix) {
  var copy = [];
  for (var y = 0; y < matrix.length; y++) copy[y] = matrix[y].slice();
  return copy;
}

function qrMaskBit(mask, x, y) {
  if (mask === 0) return (x + y) % 2 === 0;
  if (mask === 1) return y % 2 === 0;
  if (mask === 2) return x % 3 === 0;
  if (mask === 3) return (x + y) % 3 === 0;
  if (mask === 4) return (Math.floor(y / 2) + Math.floor(x / 3)) % 2 === 0;
  if (mask === 5) return ((x * y) % 2 + (x * y) % 3) === 0;
  if (mask === 6) return (((x * y) % 2 + (x * y) % 3) % 2) === 0;
  return (((x + y) % 2 + (x * y) % 3) % 2) === 0;
}

function qrApplyMask(modules, isFunction, mask) {
  var size = modules.length;
  for (var y = 0; y < size; y++) {
    for (var x = 0; x < size; x++) {
      if (!isFunction[y][x] && qrMaskBit(mask, x, y)) modules[y][x] = !modules[y][x];
    }
  }
}

function qrPenaltyForLine(getBit, size) {
  var score = 0;
  var runColor = getBit(0);
  var runLength = 1;
  for (var i = 1; i <= size; i++) {
    if (i < size && getBit(i) === runColor) {
      runLength++;
    } else {
      if (runLength >= 5) score += 3 + runLength - 5;
      if (i < size) {
        runColor = getBit(i);
        runLength = 1;
      }
    }
  }

  var patternA = [true, false, true, true, true, false, true, false, false, false, false];
  var patternB = [false, false, false, false, true, false, true, true, true, false, true];
  for (var start = 0; start <= size - 11; start++) {
    var matchA = true;
    var matchB = true;
    for (var j = 0; j < 11; j++) {
      if (getBit(start + j) !== patternA[j]) matchA = false;
      if (getBit(start + j) !== patternB[j]) matchB = false;
    }
    if (matchA || matchB) score += 40;
  }
  return score;
}

function qrPenaltyScore(modules) {
  var size = modules.length;
  var score = 0;
  var dark = 0;

  for (var y = 0; y < size; y++) {
    score += qrPenaltyForLine(function (x) { return modules[y][x]; }, size);
  }
  for (var x = 0; x < size; x++) {
    score += qrPenaltyForLine(function (y) { return modules[y][x]; }, size);
  }

  for (var yy = 0; yy < size - 1; yy++) {
    for (var xx = 0; xx < size - 1; xx++) {
      var color = modules[yy][xx];
      if (color === modules[yy][xx + 1] && color === modules[yy + 1][xx] && color === modules[yy + 1][xx + 1]) {
        score += 3;
      }
    }
  }

  for (var row = 0; row < size; row++) {
    for (var col = 0; col < size; col++) {
      if (modules[row][col]) dark++;
    }
  }
  var total = size * size;
  score += Math.floor(Math.abs(dark * 20 - total * 10) / total) * 10;
  return score;
}

function createQrMatrix(text) {
  var bytes = qrEncodeUtf8(text);
  var version = qrChooseVersion(bytes);
  var size = 21 + (version - 1) * 4;
  var dataCodewords = qrMakeDataCodewords(bytes, version);
  var allCodewords = qrInterleaveCodewords(dataCodewords, version);
  var base = qrCreateEmptyMatrix(size);
  qrDrawFunctionPatterns(base.modules, base.isFunction, version);
  qrDrawCodewords(base.modules, base.isFunction, allCodewords);

  var bestModules = null;
  var bestScore = Infinity;
  for (var mask = 0; mask < 8; mask++) {
    var candidate = qrCloneMatrix(base.modules);
    qrApplyMask(candidate, base.isFunction, mask);
    qrDrawFormatBits(candidate, base.isFunction, mask);
    var score = qrPenaltyScore(candidate);
    if (score < bestScore) {
      bestScore = score;
      bestModules = candidate;
    }
  }
  return { modules: bestModules, size: size, version: version };
}

function renderShareQrCode(url) {
  var container = document.getElementById('share-qr-code');
  if (!container) return false;
  container.innerHTML = '';

  try {
    var qr = createQrMatrix(String(url || ''));
    var quietZone = 4;
    var viewSize = qr.size + quietZone * 2;
    var svgNs = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgNs, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + viewSize + ' ' + viewSize);
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'public共有URLのQRコード');
    svg.setAttribute('shape-rendering', 'crispEdges');

    var background = document.createElementNS(svgNs, 'rect');
    background.setAttribute('width', String(viewSize));
    background.setAttribute('height', String(viewSize));
    background.setAttribute('fill', '#FFFFFF');
    svg.appendChild(background);

    var segments = [];
    for (var y = 0; y < qr.size; y++) {
      for (var x = 0; x < qr.size; x++) {
        if (qr.modules[y][x]) {
          segments.push('M' + (x + quietZone) + ' ' + (y + quietZone) + 'h1v1h-1z');
        }
      }
    }
    var path = document.createElementNS(svgNs, 'path');
    path.setAttribute('d', segments.join(' '));
    path.setAttribute('fill', '#000000');
    svg.appendChild(path);
    container.appendChild(svg);
    return true;
  } catch (e) {
    container.textContent = e && e.message ? e.message : 'QRコードを生成できませんでした。';
    return false;
  }
}

function updateShareQrPanel(url, format) {
  var panel = document.getElementById('share-qr-panel');
  if (!panel) return;
  var isQr = format === 'qr';
  panel.hidden = !isQr;
  if (!isQr) {
    var qrCode = document.getElementById('share-qr-code');
    if (qrCode) qrCode.innerHTML = '';
    return;
  }

  renderShareQrCode(url);
}

/**
 * 設定取得後: フォルダモードと単一画像モードを振り分ける
 */
function loadSingleImageScene(config) {
  currentFileId = null;
  var directImageUrl = config.imageUrl;
  var singleAutoFallbackTimer = null;
  var singleFallbackStarted = false;
  var singleDirectImageLoaded = false;
  if (config.fileId) {
    directImageUrl = getDirectImageUrl({ id: config.fileId, imageUrl: config.imageUrl });
  }

  function showSingleImageDeliveryError(message) {
    clearSingleImageAutoFallbackTimer();
    showLoadError(message);
  }

  function clearSingleImageAutoFallbackTimer() {
    if (singleAutoFallbackTimer) {
      clearTimeout(singleAutoFallbackTimer);
      singleAutoFallbackTimer = null;
    }
  }

  function startSingleImageBase64Fallback(message) {
    if (singleFallbackStarted) return;
    singleFallbackStarted = true;
    clearSingleImageAutoFallbackTimer();
    if (!config.fileId) {
      showSingleImageDeliveryError(message || '直リンクで画像を読み込めず、Base64 fallback用のファイルIDも見つかりませんでした。');
      return;
    }
    showSceneLoading();
    fallbackToBase64(config.fileId, function (base64Url) {
      if (singleDirectImageLoaded) return;
      loadSingleImageWithHotspots(base64Url, function () {
        showSingleImageDeliveryError('直リンクとBase64 fallbackの両方で画像を読み込めませんでした。Driveの共有設定を確認してください。');
      });
    }, function () {
      showSingleImageDeliveryError('直リンクで画像を読み込めず、Base64 fallbackも取得できませんでした。Driveの共有設定を確認してください。');
    });
  }

  function startSingleImageAutoFallbackTimer() {
    clearSingleImageAutoFallbackTimer();
    singleAutoFallbackTimer = setTimeout(function () {
      startSingleImageBase64Fallback('直リンクの読み込みに時間がかかっているため、Base64 fallbackを試します。');
    }, DIRECT_FALLBACK_TIMEOUT_MS);
  }

  function startSingleImageViewer(imageUrl, spots, north, onDisplayError) {
    var isFallbackImage = singleFallbackStarted && imageUrl !== directImageUrl;
    var isAutoDirectImage = deliveryMode === 'auto' && imageUrl === directImageUrl && !singleFallbackStarted;
    if (viewer) {
      clearInterval(loadPollInterval);
      try { viewer.destroy(); } catch (e) { /* ignore */ }
      viewer = null;
    }
    hide2DView();
    if (isAutoDirectImage) startSingleImageAutoFallbackTimer();
    initViewer(imageUrl, spots || [], north || null, initialYaw, initialPitch, onDisplayError, function () {
      if (isAutoDirectImage) singleDirectImageLoaded = true;
      if (singleFallbackStarted && !isFallbackImage) return;
      clearSingleImageAutoFallbackTimer();
    });
  }

  function loadSingleImageWithHotspots(imageUrl, onDisplayError) {
    loadHotspotsCached('', function (res) {
      if (singleFallbackStarted && imageUrl === directImageUrl) return;
      var north = (res && typeof res.northOffset === 'number') ? res.northOffset : null;
      startSingleImageViewer(imageUrl, res.hotspots || [], north, onDisplayError);
    }, function () {
      if (singleFallbackStarted && imageUrl === directImageUrl) return;
      startSingleImageViewer(imageUrl, [], null, onDisplayError);
    });
  }

  if (deliveryMode === 'base64') {
    if (!config.fileId) {
      showSingleImageDeliveryError('Base64画像を取得するためのファイルIDが見つかりませんでした。');
      return;
    }
    loadBase64ImageForScene(config.fileId, function (base64Url) {
      loadSingleImageWithHotspots(base64Url, function () {
        showSingleImageDeliveryError('Base64画像の読み込みに失敗しました。画像ファイルまたは権限を確認してください。');
      });
    }, function (message) {
      showSingleImageDeliveryError(message || 'Base64画像を取得できませんでした。画像ファイルまたは権限を確認してください。');
    });
    return;
  }

  if (deliveryMode === 'auto') {
    loadSingleImageWithHotspots(directImageUrl, function () {
      startSingleImageBase64Fallback('直リンクで画像を読み込めず、Base64 fallback用のファイルIDも見つかりませんでした。');
    });
    return;
  }

  loadSingleImageWithHotspots(directImageUrl, function () {
    showSingleImageDeliveryError('画像の読み込みに失敗しました。Driveの共有設定を確認するか、delivery=auto を試してください。');
  });
}

function getRootSceneImageById(images, sceneId) {
  if (!Array.isArray(images) || !sceneId) return null;
  for (var i = 0; i < images.length; i++) {
    if (images[i].type === 'folder') continue;
    if (String(images[i].id) === String(sceneId)) return images[i];
  }
  return null;
}

function setMobileSceneSheetExpanded(expanded) {
  var sidebar = document.getElementById('scene-sidebar');
  if (!sidebar) return;
  expanded = !!expanded && isPublicViewingMode() && isSmallViewport();
  sidebar.classList.toggle('mobile-expanded', expanded);
  document.body.classList.toggle('mobile-scene-sheet-expanded', expanded);

  var toggle = document.getElementById('mobile-scene-sheet-toggle');
  if (toggle) {
    toggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    if (!expanded) toggle.textContent = currentFileId ? 'シーンを選ぶ' : 'シーン';
  }
}

function toggleMobileSceneSheet() {
  if (!isPublicViewingMode() || !isSmallViewport()) return;
  var sidebar = document.getElementById('scene-sidebar');
  if (!sidebar) return;
  setMobileSceneSheetExpanded(!sidebar.classList.contains('mobile-expanded'));
}

function onConfigLoaded(config) {
  if (config.error) {
    showLoadError(config.error);
    return;
  }
  appBaseUrl = config.execUrl || '';
  rootFolderId = config.rootFolderId || null;

  if (config.images) {
    // フォルダモード: サイドバーを構築し、ホーム画像を初期ロード
    allImages = config.images;
    currentFileId = null;
    buildSceneSidebar(allImages);

    // ホーム画像を特定（フォルダアイテムを除外して検索）
    var homeImg = null;
    for (var i = 0; i < allImages.length; i++) {
      if (allImages[i].type === 'folder') continue;
      if (allImages[i].isHome) { homeImg = allImages[i]; break; }
    }
    if (!homeImg) {
      for (var j = 0; j < allImages.length; j++) {
        if (allImages[j].type !== 'folder') { homeImg = allImages[j]; break; }
      }
    }
    homeImageId = homeImg ? homeImg.id : null;

    var hasImageItems = !!homeImg;
    if (!hasImageItems) {
      syncActiveSceneItem(null);
      if (allImages.length === 0) {
        showSceneEmptyState('写真がありません。アップロードボタンから追加してください。');
      } else {
        showSceneEmptyState('フォルダをクリックして中の写真を選択してください。');
      }
    } else {
      var homeBtnEl = document.getElementById('btn-home');
      if (homeBtnEl) homeBtnEl.classList.add('visible');
      var requestedImg = getRootSceneImageById(allImages, initialSceneId);
      var startImg = requestedImg || homeImg;
      var initialViewYaw = initialYaw;
      var initialViewPitch = initialPitch;
      if (initialSceneId && !requestedImg) {
        initialViewYaw = null;
        initialViewPitch = null;
      }
      loadScene(startImg, initialViewYaw, initialViewPitch);
    }
  } else if (config.imageUrl) {
    // 単一画像モード（後方互換）
    loadSingleImageScene(config);
  } else {
    showLoadError('画像の設定が見つかりませんでした。');
  }
}

/**
 * 画像リストからサイドバーのシーン一覧を生成し表示する
 *
 * @param {Array} images  {id, name, imageUrl} の配列
 */
function buildSceneSidebar(images) {
  var sidebar  = document.getElementById('scene-sidebar');
  var list     = document.getElementById('scene-list');
  var panorama = document.getElementById('panorama');

  closeSceneContextMenu();
  list.innerHTML = '';

  // 「戻る」ボタンの表示切替
  var backBtn = document.getElementById('sidebar-back-btn');
  if (backBtn) {
    if (folderStack.length > 0) {
      backBtn.classList.add('visible');
    } else {
      backBtn.classList.remove('visible');
    }
  }

  images.forEach(function (img) {
    if (img.type === 'folder') {
      // ---- サブフォルダアイテム ----
      var folderEl = document.createElement('div');
      folderEl.className = 'scene-folder-item';
      folderEl.dataset.folderId = img.id;
      folderEl.innerHTML =
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>' +
        '</svg>' +
        '<span class="scene-folder-item-name">' + escapeHtml(img.name) + '</span>';
      folderEl.addEventListener('click', function () {
        openSubfolder(img);
      });
      list.appendChild(folderEl);
    } else {
      // ---- 画像アイテム ----
      var item = document.createElement('div');
      item.className = 'scene-item';
      item.dataset.id = img.id;
      item.innerHTML =
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
        '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/>' +
        '<path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>' +
        '</svg>' +
        '<span class="scene-item-name">' + escapeHtml(img.name) + '</span>';
      item.addEventListener('click', function () {
        if (isSwitching) return;
        previousSceneId = null; // サイドバーからの移動は振り返り演出なし
        loadScene(img);
        setMobileSceneSheetExpanded(false);
      });
      item.addEventListener('contextmenu', function (evt) {
        openSceneContextMenu(evt, img);
      });
      list.appendChild(item);
    }
  });

  sidebar.classList.remove('hidden');
  panorama.classList.add('with-sidebar');
  document.getElementById('flat-map-container').classList.add('with-sidebar');
  if (isPublicViewingMode() && isSmallViewport()) {
    setMobileSceneSheetExpanded(false);
  }
}

/**
 * サブフォルダを開く：現在の一覧をスタックに保存し、指定フォルダの中身を表示する
 * @param {{ id:string, name:string, type:'folder' }} folderItem
 */
function openSubfolder(folderItem) {
  // 現在の状態をスタックに積む
  folderStack.push({ id: folderItem.id, name: folderItem.name, items: allImages });

  setSceneRefreshButtonState(true);
  google.script.run
    .withSuccessHandler(function (res) {
      setSceneRefreshButtonState(false);
      if (!res || res.error) {
        showToast('フォルダを開けませんでした: ' + ((res && res.error) || '不明なエラー'), 'error');
        folderStack.pop();
        return;
      }
      allImages = res.images || [];
      buildSceneSidebar(allImages);
      syncActiveSceneItem(null);
    })
    .withFailureHandler(function () {
      setSceneRefreshButtonState(false);
      showToast('フォルダの読み込みに失敗しました。', 'error');
      folderStack.pop();
    })
    .navigateToFolder(folderItem.id);
}

/**
 * 一つ上のフォルダに戻る
 */
function goBackFolder() {
  if (folderStack.length === 0) return;
  var prev = folderStack.pop();
  allImages = prev.items;
  buildSceneSidebar(allImages);
  syncActiveSceneItem(currentFileId);
}

function syncActiveSceneItem(activeId) {
  var items = document.querySelectorAll('.scene-item');
  items.forEach(function (el) {
    el.classList.toggle('active', !!activeId && el.dataset.id === activeId);
  });
  var toggle = document.getElementById('mobile-scene-sheet-toggle');
  if (toggle && isPublicViewingMode() && isSmallViewport()) {
    toggle.textContent = 'シーンを選ぶ';
  }
}

function setSceneRefreshButtonState(isLoading) {
  var button = document.getElementById('scene-refresh-btn');
  if (!button) return;
  button.disabled = !!isLoading;
  button.classList.toggle('loading', !!isLoading);
}

function refreshSceneList() {
  if (isRefreshingSceneList || !allImages) return;

  isRefreshingSceneList = true;
  setSceneRefreshButtonState(true);
  closeSceneContextMenu();

  google.script.run
    .withSuccessHandler(function (config) {
      isRefreshingSceneList = false;
      setSceneRefreshButtonState(false);

      if (!config || config.error) {
        showToast('シーン一覧の更新に失敗しました: ' + ((config && config.error) || '不明なエラー'), 'error');
        return;
      }
      if (!config.images) {
        showToast('フォルダ内の画像一覧を取得できませんでした。', 'error');
        return;
      }

      allImages = config.images;
      folderStack = []; // ルートに戻るためスタックをクリア
      buildSceneSidebar(allImages);

      var hasImgItems = allImages.some(function (i) { return i.type !== 'folder'; });
      if (!hasImgItems) {
        syncActiveSceneItem(null);
        var emptyMsg = allImages.length === 0
          ? '写真がありません。アップロードボタンから追加してください。'
          : 'フォルダをクリックして中の写真を選択してください。';
        showSceneEmptyState(emptyMsg);
        showToast('シーン一覧を更新しました。', 'success');
        return;
      }

      if (!currentFileId) {
        syncActiveSceneItem(null);
        showSceneEmptyState('シーン一覧から写真を選択してください。');
        showToast('シーン一覧を更新しました。', 'success');
        return;
      }

      var nextCurrent = getSceneImageById(currentFileId);
      if (nextCurrent) {
        syncActiveSceneItem(currentFileId);
        showToast('シーン一覧を更新しました。', 'success');
        return;
      }

      currentFileId = null;
      showToast('現在の写真が見つからなかったため、先頭の写真を表示します。', 'success');
      previousSceneId = null;
      loadScene(allImages[0]);
    })
    .withFailureHandler(function () {
      isRefreshingSceneList = false;
      setSceneRefreshButtonState(false);
      showToast('通信エラーが発生しました。再度お試しください。', 'error');
    })
    .getConfig(appMode);
}

function getSceneImageById(fileId) {
  if (!allImages || !fileId) return null;
  for (var i = 0; i < allImages.length; i++) {
    if (allImages[i].id === fileId) return allImages[i];
  }
  return null;
}

function openSceneContextMenu(evt, img) {
  if (!canEdit) return;
  if (!img || !img.id) return;
  evt.preventDefault();
  evt.stopPropagation();

  var menu = document.getElementById('scene-context-menu');
  sceneContextTargetId = img.id;
  menu.classList.add('visible');

  var menuWidth = menu.offsetWidth || 168;
  var menuHeight = menu.offsetHeight || 132;
  var x = Math.min(evt.clientX, window.innerWidth - menuWidth - 10);
  var y = Math.min(evt.clientY, window.innerHeight - menuHeight - 10);
  menu.style.left = Math.max(10, x) + 'px';
  menu.style.top = Math.max(70, y) + 'px';
}

function closeSceneContextMenu() {
  var menu = document.getElementById('scene-context-menu');
  menu.classList.remove('visible');
  menu.style.left = '';
  menu.style.top = '';
  sceneContextTargetId = null;
}

function onSceneContextMenuClick(evt) {
  if (!canEdit) {
    closeSceneContextMenu();
    return;
  }
  var action = evt.target && evt.target.dataset ? evt.target.dataset.action : '';
  if (!action) return;

  var targetId = sceneContextTargetId;
  closeSceneContextMenu();

  var img = getSceneImageById(targetId);
  if (!img) return;

  if (action === 'rename') {
    requestSceneRename(img);
  } else if (action === 'properties') {
    openSceneProperties(img);
  } else if (action === 'delete') {
    requestSceneDelete(img);
  }
}

function closeBulkInputDropdown() {
  var group = document.getElementById('bulk-input-group');
  var trigger = document.getElementById('bulk-input-trigger');
  if (group) group.classList.remove('open');
  if (trigger) trigger.setAttribute('aria-expanded', 'false');
}

function toggleBulkInputDropdown() {
  if (!canEdit) return;
  var group = document.getElementById('bulk-input-group');
  var trigger = document.getElementById('bulk-input-trigger');
  if (!group || !trigger) return;
  var isOpen = group.classList.toggle('open');
  trigger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
}

function onDocumentClickForContextMenus(evt) {
  if (!evt.target.closest('#scene-context-menu')) {
    closeSceneContextMenu();
  }
  if (!evt.target.closest('#hotspot-context-menu')) {
    closeHotspotContextMenu();
  }
  if (!evt.target.closest('#bulk-input-group')) {
    closeBulkInputDropdown();
  }
}

function onGlobalKeyDown(evt) {
  if (evt.key !== 'Escape') return;
  closeSceneContextMenu();
  closeScenePropertiesDialog();
  closeHotspotContextMenu();
  closeBulkInputDropdown();
  if (isMovingHotspot) {
    isMovingHotspot = false;
    movingHotspotTarget = null;
    showToast('移動をキャンセルしました。', 'error');
  }
}

// =============================================
//  ホットスポット右クリックメニュー（編集モード）
// =============================================
function openHotspotContextMenu(evt, args) {
  if (!canEdit || !isEditMode) return;
  closeHotspotContextMenu();
  hotspotContextTarget = args;

  var menu = document.getElementById('hotspot-context-menu');
  menu.classList.add('visible');

  var menuWidth  = menu.offsetWidth  || 152;
  var menuHeight = menu.offsetHeight || 88;
  var x = Math.min(evt.clientX, window.innerWidth  - menuWidth  - 10);
  var y = Math.min(evt.clientY, window.innerHeight - menuHeight - 10);
  menu.style.left = Math.max(10, x) + 'px';
  menu.style.top  = Math.max(70, y) + 'px';
}

function closeHotspotContextMenu() {
  var menu = document.getElementById('hotspot-context-menu');
  menu.classList.remove('visible');
  menu.style.left = '';
  menu.style.top  = '';
  hotspotContextTarget = null;
}

function onHotspotEditClick() {
  if (!canEdit) {
    closeHotspotContextMenu();
    return;
  }
  suppressNextPanoramaClick = true;
  setTimeout(function () { suppressNextPanoramaClick = false; }, 120);
  var target = hotspotContextTarget;
  closeHotspotContextMenu();
  if (!target) return;

  // マーカー位置からポップアップを表示（画面中央に近い位置）
  var cx = window.innerWidth  / 2;
  var cy = window.innerHeight / 2;
  openPopup(cx, cy, target);
}

function onHotspotDeleteClick() {
  if (!canEdit) {
    closeHotspotContextMenu();
    return;
  }
  suppressNextPanoramaClick = true;
  setTimeout(function () { suppressNextPanoramaClick = false; }, 120);
  var target = hotspotContextTarget;
  closeHotspotContextMenu();
  if (!target) return;

  google.script.run
    .withSuccessHandler(function (result) {
      if (result.success) {
        clearHotspotCache(currentFileId || '');
        if (is2DMode) {
          // 2Dモード: current2DHotspots から削除して再描画
          current2DHotspots = current2DHotspots.filter(function (hs) { return hs !== target; });
          render2DHotspots(current2DHotspots);
        } else {
          try { viewer.removeHotSpot(target._pannellumId); } catch (e) { /* ignore */ }
        }
        showToast('ホットスポットを削除しました。', 'success');
      } else {
        showToast('削除に失敗しました: ' + (result.error || '不明なエラー'), 'error');
      }
    })
    .withFailureHandler(function () {
      showToast('通信エラーが発生しました。再度お試しください。', 'error');
    })
    .deleteHotspot(withEditToken({
      id: target.id,
      fileId: currentFileId || ''
    }));
}

function onHotspotMoveClick() {
  if (!canEdit) {
    closeHotspotContextMenu();
    return;
  }
  suppressNextPanoramaClick = true;
  setTimeout(function () { suppressNextPanoramaClick = false; }, 120);
  var target = hotspotContextTarget;
  closeHotspotContextMenu();
  if (!target) return;

  isMovingHotspot = true;
  movingHotspotTarget = target;
  showToast('移動先の場所をクリックしてください。(Escキーでキャンセル)', 'success');
}

function requestSceneRename(img) {
  if (!canEdit) return;
  var currentName = String(img.name || '');
  var nextName = window.prompt('新しい写真名を入力してください。', currentName);
  if (nextName === null) return;

  nextName = nextName.trim();
  if (!nextName) {
    showToast('名前を空にはできません。', 'error');
    return;
  }
  if (nextName === currentName) return;

  google.script.run
    .withSuccessHandler(function (result) {
      if (!result || !result.success) {
        showToast('名前の変更に失敗しました: ' + ((result && result.error) || '不明なエラー'), 'error');
        return;
      }
      applySceneRenameLocally(img.id, result.name || nextName);
      showToast('写真名を変更しました。', 'success');
    })
    .withFailureHandler(function () {
      showToast('通信エラーが発生しました。再度お試しください。', 'error');
    })
    .renameImageFile(withEditToken({
      fileId: img.id,
      newName: nextName
    }));
}

function requestSceneDelete(img) {
  if (!canEdit) return;
  var sceneName = String((img && img.name) || '');
  var ok = window.confirm(
    '「' + sceneName + '」を削除しますか？\n' +
    '削除した写真はGoogleドライブのゴミ箱に移動され、\n' +
    'このシーンに紐づくホットスポットも削除されます。'
  );
  if (!ok) return;

  google.script.run
    .withSuccessHandler(function (result) {
      if (!result || !result.success) {
        showToast('写真の削除に失敗しました: ' + ((result && result.error) || '不明なエラー'), 'error');
        return;
      }
      applySceneDeleteLocally(img.id);
      var deletedHotspots = Number(result.deletedHotspots || 0);
      var detail = deletedHotspots > 0 ? '（ホットスポット ' + deletedHotspots + ' 件も削除）' : '';
      showToast('写真を削除しました。' + detail, 'success');
    })
    .withFailureHandler(function () {
      showToast('通信エラーが発生しました。再度お試しください。', 'error');
    })
    .deleteImageFile(withEditToken({
      fileId: img.id
    }));
}

function applySceneDeleteLocally(fileId) {
  if (!allImages || !fileId) return;
  var removedIndex = -1;
  var nextImages = allImages.filter(function (img, index) {
    var keep = img.id !== fileId;
    if (!keep) removedIndex = index;
    return keep;
  });
  if (removedIndex < 0) return;

  allImages = nextImages;
  closeScenePropertiesDialog();
  closeSceneContextMenu();
  buildSceneSidebar(allImages);

  // 削除対象が現在表示中でない場合は表示中シーンを維持する
  if (currentFileId && currentFileId !== fileId) {
    syncActiveSceneItem(currentFileId);
    return;
  }

  // 現在表示中シーンを削除した場合
  if (viewer) {
    try { viewer.destroy(); } catch (e) { /* ignore */ }
    viewer = null;
  }
  hide2DView();
  hideJumpTooltip();
  current2DHotspots = [];
  is2DMode = false;

  // 画像アイテム（フォルダを除く）の中から次に表示するシーンを選ぶ
  var imageItems = allImages.filter(function (i) { return i.type !== 'folder'; });
  if (imageItems.length === 0) {
    currentFileId = null;
    showSceneEmptyState('シーンがありません。写真をアップロードしてください。');
    return;
  }

  var nextIndex = Math.min(Math.max(removedIndex, 0), imageItems.length - 1);
  previousSceneId = null;
  loadScene(imageItems[nextIndex]);
}

function applySceneRenameLocally(fileId, newName) {
  var target = getSceneImageById(fileId);
  if (!target) return;

  target.name = newName;
  allImages.sort(function(a, b) { return a.name.localeCompare(b.name, 'ja'); });
  buildSceneSidebar(allImages);
  syncActiveSceneItem(currentFileId);
}

function openSceneProperties(img) {
  google.script.run
    .withSuccessHandler(function (result) {
      if (!result || !result.success || !result.properties) {
        showToast('プロパティの取得に失敗しました: ' + ((result && result.error) || '不明なエラー'), 'error');
        return;
      }
      renderSceneProperties(result.properties);
    })
    .withFailureHandler(function () {
      showToast('通信エラーが発生しました。再度お試しください。', 'error');
    })
    .getImageFileProperties(img.id);
}

function renderSceneProperties(props) {
  var content = document.getElementById('scene-properties-content');
  var shotDate = props.exifDate
    ? escapeHtml(formatDateTime(props.exifDate))
    : escapeHtml(formatDateTime(props.lastUpdated));
  var cameraLabel = (props.cameraMake || props.cameraModel)
    ? escapeHtml([props.cameraMake, props.cameraModel].filter(Boolean).join(' '))
    : '不明';
  var resolutionLabel = (props.width != null && props.height != null)
    ? escapeHtml(props.width + ' × ' + props.height + ' px')
    : '不明';
  var northLabel = (props.northOffset != null)
    ? escapeHtml(props.northOffset + '度 (北基準)')
    : '情報なし';

  var rows = [
    { key: '名前',       value: escapeHtml(props.name || '') },
    { key: '撮影日時',   value: shotDate },
    { key: 'カメラ機種', value: cameraLabel },
    { key: '解像度',     value: resolutionLabel },
    { key: '撮影方位',   value: northLabel },
    { key: 'ファイルサイズ', value: escapeHtml(formatFileSize(props.sizeBytes)) },
    { key: 'Drive URL',  value: props.url ? '<a href="' + escapeHtml(props.url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(props.url) + '</a>' : 'なし' }
  ];

  content.innerHTML = rows.map(function (row) {
    return '' +
      '<div class="scene-properties-row">' +
      '  <div class="scene-properties-key">' + row.key + '</div>' +
      '  <div class="scene-properties-value">' + row.value + '</div>' +
      '</div>';
  }).join('');

  document.getElementById('scene-properties-backdrop').classList.add('visible');
}

function closeScenePropertiesDialog() {
  document.getElementById('scene-properties-backdrop').classList.remove('visible');
}

function onScenePropertiesBackdropClick(evt) {
  if (evt.target.id === 'scene-properties-backdrop') {
    closeScenePropertiesDialog();
  }
}

function formatFileSize(bytes) {
  var size = Number(bytes);
  if (!isFinite(size) || size < 0) return '不明';
  if (size < 1024) return size + ' B';
  if (size < 1024 * 1024) return (size / 1024).toFixed(1) + ' KB';
  if (size < 1024 * 1024 * 1024) return (size / (1024 * 1024)).toFixed(1) + ' MB';
  return (size / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
}

function formatDateTime(value) {
  if (!value) return '不明';
  var date = new Date(value);
  if (isNaN(date.getTime())) return String(value);
  return date.toLocaleString('ja-JP');
}

/**
 * ホームボタン押下時: homeImageId のシーンへ遷移する
 */
function goHome() {
  if (!homeImageId) return;
  stopGyroIfActive('home');
  var homeImg = getSceneImageById(homeImageId);
  if (homeImg) {
    previousSceneId = null; // ホームへの移動は振り返り演出なし
    loadScene(homeImg);
  }
}

/**
 * 現在の画質モードに応じたGoogleusercontent URLサフィックスを返す。
 * @returns {string} '=w4096' または '=s0'
 */
function getQualitySuffix() {
  return imageQualityMode === 'high' ? '=s0' : '=w4096';
}

function getDirectImageUrl(imgData) {
  if (imgData && imgData.imageUrl) {
    return String(imgData.imageUrl).replace(/=(s0|w\d+)$/, getQualitySuffix());
  }
  return 'https://lh3.googleusercontent.com/d/' + imgData.id + getQualitySuffix();
}

function fallbackToBase64(fileId, onSuccess, onFailure) {
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.success && res.imageUrl) {
        onSuccess(res.imageUrl);
      } else {
        onFailure((res && res.error) || 'Base64画像を取得できませんでした。');
      }
    })
    .withFailureHandler(function () {
      onFailure('Base64画像の取得中に通信エラーが発生しました。');
    })
    .getImageDataUri(fileId, 'public');
}

function loadBase64ImageForScene(fileId, onSuccess, onFailure) {
  fallbackToBase64(fileId, onSuccess, onFailure);
}

function getHotspotCacheKey(fileId) {
  return String(fileId || '');
}

function cloneHotspotResult(result) {
  try {
    return JSON.parse(JSON.stringify(result || { hotspots: [], northOffset: null }));
  } catch (e) {
    return { hotspots: [], northOffset: null };
  }
}

function normalizeHotspotResult(res) {
  return {
    hotspots: (res && res.hotspots) ? res.hotspots : (Array.isArray(res) ? res : []),
    northOffset: (res && typeof res.northOffset === 'number') ? res.northOffset : null
  };
}

function clearHotspotCache(fileId) {
  if (typeof fileId === 'undefined') {
    hotspotCacheByFileId = {};
    return;
  }
  delete hotspotCacheByFileId[getHotspotCacheKey(fileId)];
}

function loadHotspotsCached(fileId, onSuccess, onFailure) {
  var cacheKey = getHotspotCacheKey(fileId);
  var useCache = isPublicViewingMode() && !isEditMode;
  if (useCache && hotspotCacheByFileId[cacheKey]) {
    setTimeout(function () {
      onSuccess(cloneHotspotResult(hotspotCacheByFileId[cacheKey]));
    }, 0);
    return;
  }

  google.script.run
    .withSuccessHandler(function (res) {
      var normalized = normalizeHotspotResult(res);
      if (useCache) hotspotCacheByFileId[cacheKey] = cloneHotspotResult(normalized);
      onSuccess(cloneHotspotResult(normalized));
    })
    .withFailureHandler(function () {
      if (typeof onFailure === 'function') onFailure();
    })
    .loadHotspots(fileId || '');
}

/**
 * ホットスポットのジャンプ先シーン画像を先読み（プリロード）してブラウザキャッシュに乗せる。
 * @param {Array} hotspots ホットスポット配列
 */
function preloadJumpScenes(hotspots) {
  if (!Array.isArray(hotspots)) return;
  hotspots.forEach(function (hs) {
    var sceneId = hs.jumpSceneId;
    if (!sceneId || preloadedScenes.has(sceneId)) return;
    preloadedScenes.add(sceneId);
    var url = 'https://lh3.googleusercontent.com/d/' + sceneId + getQualitySuffix();
    var img = new Image();
    img.src = url;
  });
}

/**
 * 指定した画像シーンを読み込む。
 * viewer を破棄して再生成し、その画像専用のホットスポットを取得する。
 *
 * @param {{ id:string, name:string, imageUrl:string }} imgData
 * @param {number=} preferredYaw
 * @param {number=} preferredPitch
 */
function loadScene(imgData, preferredYaw, preferredPitch) {
  stopGyroIfActive('load-scene');
  isSwitching   = true;
  currentFileId = imgData.id;

  // 暗転オーバーレイをパノラマ領域に合わせて表示（フェードアウト開始）
  var _transOverlay = document.getElementById('scene-transition-overlay');
  if (_transOverlay) {
    var _tSidebar = document.getElementById('scene-sidebar');
    var _tHasSidebar = _tSidebar &&
                       !_tSidebar.classList.contains('hidden') &&
                       !sidebarCollapsed &&
                       window.innerWidth > 600;
    _transOverlay.style.left = _tHasSidebar ? '200px' : '0';
    _transOverlay.classList.add('active');
  }

  // ホバーツールチップ・情報ポップアップを閉じる
  hideJumpTooltip();
  var infoPop = document.getElementById('active-info-popup');
  if (infoPop) infoPop.remove();

  // ローディング表示（写真エリアのみカバー）
  showSceneLoading();

  // アクティブ状態を更新
  syncActiveSceneItem(imgData.id);
  closeSceneContextMenu();

  // 既存ビューアを破棄
  if (viewer) {
    clearInterval(loadPollInterval);
    try { viewer.destroy(); } catch (e) { /* ignore */ }
    viewer = null;
  }

  // ファイル名に [2D] が含まれているか判定
  var sceneIs2D = !!(imgData.name && imgData.name.indexOf('[2D]') !== -1);
  is2DMode = sceneIs2D;

  // GASコールが返ってこない場合のタイムアウト（30秒）
  var sceneLoadTimer = setTimeout(function () {
    if (isSwitching) {
      isSwitching = false;
      showLoadError('画像の読み込みがタイムアウトしました。再度お試しください。');
    }
  }, 30000);

  var directImageUrl = getDirectImageUrl(imgData);
  var autoFallbackTimer = null;
  var fallbackStarted = false;
  var directImageLoaded = false;

  function clearSceneTransitionOverlay() {
    var ov = document.getElementById('scene-transition-overlay');
    if (ov) ov.classList.remove('active');
  }

  function clearAutoFallbackTimer() {
    if (autoFallbackTimer) {
      clearTimeout(autoFallbackTimer);
      autoFallbackTimer = null;
    }
  }

  function finishSceneDisplay() {
    clearAutoFallbackTimer();
    isSwitching = false;
  }

  function showDeliveryError(message) {
    clearTimeout(sceneLoadTimer);
    clearAutoFallbackTimer();
    isSwitching = false;
    clearSceneTransitionOverlay();
    showLoadError(message);
  }

  function startAutoFallbackTimer(onFallback) {
    clearAutoFallbackTimer();
    autoFallbackTimer = setTimeout(function () {
      if (fallbackStarted || currentFileId !== imgData.id) return;
      onFallback();
    }, DIRECT_FALLBACK_TIMEOUT_MS);
  }

  function startBase64Fallback() {
    if (fallbackStarted || currentFileId !== imgData.id) return;
    fallbackStarted = true;
    clearAutoFallbackTimer();
    showSceneLoading();
    fallbackToBase64(imgData.id, function (base64Url) {
      if (directImageLoaded || currentFileId !== imgData.id) return;
      loadHotspotsForImage(base64Url, function () {
        showDeliveryError('直リンクとBase64 fallbackの両方で画像を読み込めませんでした。Driveの共有設定を確認してください。');
      });
    }, function () {
      showDeliveryError('直リンクで画像を読み込めず、Base64 fallbackも取得できませんでした。Driveの共有設定を確認してください。');
    });
  }

  /**
   * 取得した imageUrl・hotspots・northOffset でビューアを起動するヘルパー
   * @param {string} imageUrl
   * @param {Array}  spots
   * @param {number|null} northOffset
   */
  function startViewer(imageUrl, spots, northOffset, initialYaw, initialPitch, onDisplayError) {
    clearTimeout(sceneLoadTimer);
    spots = spots || [];
    var isAutoDirectImage = deliveryMode === 'auto' && imageUrl === directImageUrl && !fallbackStarted;
    if (viewer) {
      clearInterval(loadPollInterval);
      try { viewer.destroy(); } catch (e) { /* ignore */ }
      viewer = null;
    }

    function handleDisplayError() {
      if (typeof onDisplayError === 'function') {
        onDisplayError();
      } else {
        showDeliveryError('画像の読み込みに失敗しました。Driveの共有設定またはURLを確認してください。');
      }
    }

    function handleDisplayLoaded() {
      if (isAutoDirectImage) directImageLoaded = true;
      finishSceneDisplay();
    }

    if (sceneIs2D) {
      if (isAutoDirectImage) startAutoFallbackTimer(startBase64Fallback);
      show2DView(imageUrl, handleDisplayError, function () {
        render2DHotspots(spots);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('fullscreen-btn').classList.add('visible');
        document.getElementById('quality-toggle-btn').classList.add('visible');
        document.getElementById('gyro-toggle-btn').classList.add('visible');
        clearSceneTransitionOverlay();
        handleDisplayLoaded();
      });
    } else {
      hide2DView();
      if (isAutoDirectImage) startAutoFallbackTimer(startBase64Fallback);
      initViewer(
        imageUrl,
        spots,
        northOffset || null,
        initialYaw,
        initialPitch,
        handleDisplayError,
        handleDisplayLoaded
      );
    }
  }

  function getInitialView(spots) {
    var initialYaw = null;
    var initialPitch = null;
    if (typeof preferredYaw === 'number' && isFinite(preferredYaw)) {
      initialYaw = preferredYaw;
    }
    if (typeof preferredPitch === 'number' && isFinite(preferredPitch)) {
      initialPitch = preferredPitch;
    }
    if (initialYaw == null && previousSceneId) {
      for (var _i = 0; _i < spots.length; _i++) {
        if (spots[_i].jumpSceneId === previousSceneId) {
          initialYaw = spots[_i].yaw + 180;
          if (initialYaw > 180) initialYaw -= 360;
          break;
        }
      }
    }
    return { yaw: initialYaw, pitch: initialPitch };
  }

  /** loadHotspots の戻り値 { hotspots, northOffset } を分解して startViewer を呼ぶ */
  function loadHotspotsForImage(imageUrl, onDisplayError) {
    loadHotspotsCached(imgData.id, function (res) {
      if (fallbackStarted && imageUrl === directImageUrl) return;
      var spots = res.hotspots || [];
      var north = (res && typeof res.northOffset === 'number') ? res.northOffset : null;
      var initialView = getInitialView(spots);

// ジャンプ先シーンを非同期でプリロード（次のシーン移動を高速化）
      setTimeout(function () { preloadJumpScenes(spots); }, 0);

      startViewer(imageUrl, spots, north, initialView.yaw, initialView.pitch, onDisplayError);
    }, function () {
      if (fallbackStarted && imageUrl === directImageUrl) return;
      startViewer(imageUrl, [], null, preferredYaw, preferredPitch, onDisplayError);
    });
  }

  if (deliveryMode === 'base64') {
    loadBase64ImageForScene(imgData.id, function (base64Url) {
      loadHotspotsForImage(base64Url, function () {
        showDeliveryError('Base64画像の読み込みに失敗しました。画像ファイルまたは権限を確認してください。');
      });
    }, function (message) {
      showDeliveryError(message || 'Base64画像を取得できませんでした。画像ファイルまたは権限を確認してください。');
    });
    return;
  }

  if (deliveryMode === 'auto') {
    loadHotspotsForImage(directImageUrl, function () {
      startBase64Fallback();
    });
    return;
  }

  loadHotspotsForImage(directImageUrl, function () {
    showDeliveryError('画像の読み込みに失敗しました。Driveの共有設定を確認するか、delivery=auto を試してください。');
  });
}

/**
 * ローディング表示をパノラマエリアに合わせて表示する
 */
function showSceneLoading() {
  var loading = document.getElementById('loading');
  var sidebar = document.getElementById('scene-sidebar');
  var hasSidebar = sidebar &&
                   !sidebar.classList.contains('hidden') &&
                   !sidebarCollapsed &&
                   window.innerWidth > 600;
  loading.style.left = hasSidebar ? '200px' : '0';
  loading.innerHTML = '<div class="loading-ring"></div><p>読み込んでいます...</p>';
  loading.classList.remove('hidden');
}

function showSceneEmptyState(message) {
  var loading = document.getElementById('loading');
  var sidebar = document.getElementById('scene-sidebar');
  var hasSidebar = sidebar &&
                   !sidebar.classList.contains('hidden') &&
                   !sidebarCollapsed &&
                   window.innerWidth > 600;
  loading.style.left = hasSidebar ? '200px' : '0';
  loading.innerHTML =
    '<p style="font-size:14px;color:#71717A;text-align:center;padding:0 20px">' +
    escapeHtml(message || 'シーン一覧から写真を選択してください。') +
    '</p>';
  loading.classList.remove('hidden');
  document.getElementById('fullscreen-btn').classList.remove('visible');
  document.getElementById('quality-toggle-btn').classList.remove('visible');
  document.getElementById('gyro-toggle-btn').classList.remove('visible');
  stopGyroIfActive('empty-state');
}

/**
 * Pannellumビューアを初期化し、ホットスポットを展開する
 *
 * @param {string} imageUrl  パノラマ画像URL
 * @param {Array}  spots     ホットスポット配列
 */
function initViewer(imageUrl, spots, northOffset, initialYaw, initialPitch, onLoadError, onLoaded) {
  // Pannellum用にホットスポット設定を変換
  var pannellumSpots = spots.map(function (hs, i) {
    var pid = 'hs_' + i;
    hs._pannellumId = pid;
    return {
      id: pid,
      pitch: hs.pitch,
      yaw:   hs.yaw,
      type:  'custom',
      cssClass: 'hs-marker',
      createTooltipFunc: buildMarkerElement,
      createTooltipArgs: hs,
      clickHandlerFunc:  onMarkerClick,
      clickHandlerArgs:  hs
    };
  });

  var viewerConfig = {
    type:           'equirectangular',
    panorama:        imageUrl,
    crossOrigin:    'anonymous',
    autoLoad:        true,
    autoRotate:     -1.5,
    showControls:    false,
    hotSpots:        pannellumSpots
  };

  // 振り返り視点: 前シーンのホットスポット方向の真反対を初期yawとして設定
  if (typeof initialYaw === 'number' && isFinite(initialYaw)) {
    viewerConfig.yaw = initialYaw;
  }
  if (typeof initialPitch === 'number' && isFinite(initialPitch)) {
    viewerConfig.pitch = initialPitch;
  }

  // 有効な方位情報があればコンパスを有効化する
  if (typeof northOffset === 'number' && isFinite(northOffset)) {
    viewerConfig.compass = true;
    viewerConfig.northOffset = northOffset;
  }

  viewer = pannellum.viewer('panorama', viewerConfig);

  // パノラマ読み込み完了 → ローディング非表示・全画面ボタン表示
  var loadHandled = false;
  function onPanoramaLoaded() {
    if (loadHandled) return;
    loadHandled = true;
    clearInterval(loadPollInterval);
    clearTimeout(loadErrorTimer);
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('fullscreen-btn').classList.add('visible');
    document.getElementById('quality-toggle-btn').classList.add('visible');
    document.getElementById('gyro-toggle-btn').classList.add('visible');
    // 暗転オーバーレイを解除（フェードイン）
    var ov = document.getElementById('scene-transition-overlay');
    if (ov) ov.classList.remove('active');
    if (typeof onLoaded === 'function') onLoaded();
  }

  function onPanoramaFailed() {
    if (loadHandled) return;
    loadHandled = true;
    clearInterval(loadPollInterval);
    clearTimeout(loadErrorTimer);
    var ov = document.getElementById('scene-transition-overlay');
    if (ov) ov.classList.remove('active');
    if (typeof onLoadError === 'function') {
      onLoadError();
    } else {
      showLoadError('パノラマ画像の読み込みに失敗しました。');
    }
  }

  viewer.on('load', onPanoramaLoaded);

  var loadErrorTimer = setTimeout(onPanoramaFailed, IMAGE_LOAD_TIMEOUT_MS);

  // フォールバック: isLoaded()を0.5秒ごとにポーリング（最大60秒）
  // loadイベントが発火しない場合でも確実にローディングを解除する
  loadPollInterval = setInterval(function () {
    if (viewer && viewer.isLoaded()) onPanoramaLoaded();
  }, 500);
  setTimeout(function () { clearInterval(loadPollInterval); }, 60000);

  // エラー発生時
  viewer.on('error', function () {
    onPanoramaFailed();
  });
}

/**
 * 画質トグルボタンの表示を現在の imageQualityMode に合わせて更新する。

  var lbl = document.getElementById('quality-toggle-label');
  if (!btn || !lbl) return;
  if (imageQualityMode === 'high') {
    btn.classList.remove('mode-fast');

/**
 * 画質モードをトグルし、現在の視点を保持したまま現在シーンを再ロードする。
 */
function toggleQuality() {
  if (!currentFileId || isSwitching) return;
  stopGyroIfActive('quality');

  // 現在の視点を退避
  var savedPitch = (viewer && typeof viewer.getPitch === 'function') ? viewer.getPitch() : null;
  var savedYaw   = (viewer && typeof viewer.getYaw   === 'function') ? viewer.getYaw()   : null;

  // モード反転
  imageQualityMode = imageQualityMode === 'high' ? 'fast' : 'high';
  updateQualityToggleBtn();

  // プリロードキャッシュをクリア（品質変更後は古いキャッシュ不要）
  preloadedScenes.clear();

  // 現在表示中のシーン画像データを取得して再ロード
  var imgData = getSceneImageById(currentFileId);
  if (!imgData) return;

  var newImgData = Object.assign({}, imgData);
  previousSceneId = null; // 画質切り替え時は振り返り視点ではなく退避した視点を使う
  loadScene(newImgData, savedYaw, savedPitch);
}

/**
 * ジャイロボタンの表示状態を isGyroActive に合わせて更新する。
 */
function updateGyroBtn() {
  var btn = document.getElementById('gyro-toggle-btn');
  if (!btn) return;
  btn.classList.toggle('gyro-active', isGyroActive);
  btn.title = isGyroActive ? 'ジャイロOFF' : 'ジャイロON';
  btn.setAttribute('aria-pressed', isGyroActive ? 'true' : 'false');
}

function stopGyroIfActive(reason) {
  if (!isGyroActive) return;
  if (viewer) {
    try { viewer.stopOrientation(); } catch (e) { /* ignore */ }
  }
  isGyroActive = false;
  updateGyroBtn();
}

/**
 * ジャイロ操作をON/OFFする。
 * iOS 13+ では DeviceOrientationEvent.requestPermission() を呼び出して
 * ユーザーの許可を得てから startOrientation() を実行する。
 */
function toggleGyro() {
  if (isGyroActive) {
    // ---- OFF ----
    stopGyroIfActive('toggle');
    return;
  }

  // ---- ON ----
  function startGyro() {
    if (!viewer) return;
    try {
      viewer.startOrientation();
      isGyroActive = true;
      updateGyroBtn();
    } catch (e) {
      showToast('ジャイロの起動に失敗しました', 'error');
    }
  }

  // iOS 13+ Safari: requestPermission が必要
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(function (permission) {
        if (permission === 'granted') {
          startGyro();
        } else {
          showToast('ジャイロの許可が得られませんでした', 'error');
        }
      })
      .catch(function () {
        showToast('ジャイロの許可リクエストに失敗しました', 'error');
      });
  } else {
    // Android / デスクトップ等: 許可不要でそのまま開始
    startGyro();
  }
}
