// =============================================
//  写真セレクト / ジャンプ先セレクト構築
// =============================================

function detectHotspotPhotoMime(bytes) {
  var data = bytes || [];
  if (data.length >= 3 && data[0] === 0xff && data[1] === 0xd8 && data[2] === 0xff) {
    return 'image/jpeg';
  }
  if (data.length >= 8 &&
      data[0] === 0x89 && data[1] === 0x50 && data[2] === 0x4e && data[3] === 0x47 &&
      data[4] === 0x0d && data[5] === 0x0a && data[6] === 0x1a && data[7] === 0x0a) {
    return 'image/png';
  }
  if (data.length >= 12 &&
      data[0] === 0x52 && data[1] === 0x49 && data[2] === 0x46 && data[3] === 0x46 &&
      data[8] === 0x57 && data[9] === 0x45 && data[10] === 0x42 && data[11] === 0x50) {
    return 'image/webp';
  }
  return '';
}

function readHotspotPhotoBlobAsArrayBuffer(blob) {
  if (blob && typeof blob.arrayBuffer === 'function') return blob.arrayBuffer();
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () { resolve(reader.result); };
    reader.onerror = function () { reject(new Error('写真データを読み込めませんでした。')); };
    reader.readAsArrayBuffer(blob);
  });
}

function readHotspotPhotoBlobAsBase64(blob) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () {
      var dataUrl = String(reader.result || '');
      var commaIndex = dataUrl.indexOf(',');
      if (commaIndex < 0) {
        reject(new Error('写真データを変換できませんでした。'));
        return;
      }
      resolve(dataUrl.slice(commaIndex + 1));
    };
    reader.onerror = function () { reject(new Error('写真データを変換できませんでした。')); };
    reader.readAsDataURL(blob);
  });
}

function releaseHotspotPhotoDecodeUrl(objectUrl) {
  var index = hotspotPhotoUploadState.decodeObjectUrls.indexOf(objectUrl);
  if (index === -1) return false;
  hotspotPhotoUploadState.decodeObjectUrls.splice(index, 1);
  URL.revokeObjectURL(objectUrl);
  return true;
}

function loadHotspotPhotoImage(blob) {
  return new Promise(function (resolve, reject) {
    var objectUrl = URL.createObjectURL(blob);
    hotspotPhotoUploadState.decodeObjectUrls.push(objectUrl);
    var image = new Image();
    image.onload = function () {
      releaseHotspotPhotoDecodeUrl(objectUrl);
      if (!(image.naturalWidth > 0) || !(image.naturalHeight > 0)) {
        reject(new Error('写真の大きさを取得できませんでした。'));
        return;
      }
      resolve(image);
    };
    image.onerror = function () {
      releaseHotspotPhotoDecodeUrl(objectUrl);
      reject(new Error('写真を画像として読み込めませんでした。'));
    };
    image.src = objectUrl;
  });
}

function hotspotPhotoCanvasToBlob(canvas, mimeType, quality) {
  return new Promise(function (resolve, reject) {
    canvas.toBlob(function (blob) {
      if (!blob) {
        reject(new Error('写真の圧縮に失敗しました。'));
        return;
      }
      resolve(blob);
    }, mimeType, quality);
  });
}

function resizeAndEncodeHotspotPhoto(file, sourceMimeType) {
  return loadHotspotPhotoImage(file).then(function (image) {
    var sourceWidth = image.naturalWidth;
    var sourceHeight = image.naturalHeight;
    var initialScale = Math.min(1, HOTSPOT_PHOTO_MAX_EDGE / Math.max(sourceWidth, sourceHeight));

    if (sourceMimeType === 'image/png' && initialScale === 1 && file.size <= HOTSPOT_PHOTO_FINAL_MAX_BYTES) {
      return file;
    }

    var outputMimeType = sourceMimeType === 'image/png' ? 'image/webp' : sourceMimeType;
    var scale = initialScale;
    var quality = HOTSPOT_PHOTO_INITIAL_QUALITY;
    var attemptCount = 0;

    function encodeAttempt() {
      var canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(sourceWidth * scale));
      canvas.height = Math.max(1, Math.round(sourceHeight * scale));
      var context = canvas.getContext('2d');
      if (!context) return Promise.reject(new Error('写真処理を開始できませんでした。'));
      context.drawImage(image, 0, 0, canvas.width, canvas.height);

      return hotspotPhotoCanvasToBlob(canvas, outputMimeType, quality).then(function (blob) {
        if (blob.type !== outputMimeType) {
          if (outputMimeType === 'image/webp') {
            outputMimeType = 'image/jpeg';
            return encodeAttempt();
          }
          throw new Error('ブラウザが対応する写真形式へ変換できませんでした。');
        }
        if (blob.size <= HOTSPOT_PHOTO_FINAL_MAX_BYTES) return blob;

        attemptCount += 1;
        if (attemptCount >= 7) {
          throw new Error('写真を6MB以下に圧縮できませんでした。別の写真を選択してください。');
        }
        quality = Math.max(0.62, HOTSPOT_PHOTO_INITIAL_QUALITY - attemptCount * 0.06);
        if (attemptCount % 2 === 0) scale *= 0.82;
        return encodeAttempt();
      });
    }

    return encodeAttempt();
  });
}

function getHotspotPhotoExtensionForMime(mimeType) {
  if (mimeType === 'image/png') return 'png';
  if (mimeType === 'image/webp') return 'webp';
  return 'jpg';
}

function replaceHotspotPhotoFileExtension(fileName, mimeType) {
  var baseName = String(fileName || 'photo').replace(/\.[^.]*$/, '') || 'photo';
  return baseName + '.' + getHotspotPhotoExtensionForMime(mimeType);
}

function processHotspotPhotoFile(file) {
  if (!file) return Promise.reject(new Error('写真が選択されていません。'));
  if (!(file.size > 0)) return Promise.reject(new Error('空の写真ファイルは選択できません。'));
  if (file.size > HOTSPOT_PHOTO_ORIGINAL_MAX_BYTES) {
    return Promise.reject(new Error('元写真は20MB以下を選択してください。'));
  }

  var mimeType = String(file.type || '').trim().toLowerCase();
  var allowedExtensions = {
    'image/jpeg': ['jpg', 'jpeg'],
    'image/png': ['png'],
    'image/webp': ['webp']
  }[mimeType];
  if (!allowedExtensions) {
    return Promise.reject(new Error('JPEG、PNG、WebP形式の写真を選択してください。'));
  }
  var extensionMatch = String(file.name || '').match(/\.([A-Za-z0-9]+)$/);
  var extension = extensionMatch ? String(extensionMatch[1] || '').toLowerCase() : '';
  if (allowedExtensions.indexOf(extension) === -1) {
    return Promise.reject(new Error('写真のMIMEと拡張子が一致しません。'));
  }

  return readHotspotPhotoBlobAsArrayBuffer(file.slice(0, 12)).then(function (signatureBuffer) {
    var detectedMimeType = detectHotspotPhotoMime(new Uint8Array(signatureBuffer));
    if (!detectedMimeType || detectedMimeType !== mimeType) {
      throw new Error('写真の拡張子、MIME、実データの形式が一致しません。');
    }
    return resizeAndEncodeHotspotPhoto(file, mimeType);
  }).then(function (processedBlob) {
    if (!processedBlob || processedBlob.size > HOTSPOT_PHOTO_FINAL_MAX_BYTES) {
      throw new Error('処理後写真は6MB以下にしてください。');
    }
    if (['image/jpeg', 'image/png', 'image/webp'].indexOf(processedBlob.type) === -1) {
      throw new Error('写真を対応形式へ変換できませんでした。');
    }
    return readHotspotPhotoBlobAsBase64(processedBlob).then(function (base64) {
      return {
        blob: processedBlob,
        base64: base64,
        mimeType: processedBlob.type,
        uploadFileName: replaceHotspotPhotoFileExtension(file.name, processedBlob.type),
        originalFileName: String(file.name || 'photo'),
        originalSizeBytes: file.size,
        sizeBytes: processedBlob.size
      };
    });
  });
}

function formatHotspotPhotoBytes(sizeBytes) {
  var size = Number(sizeBytes) || 0;
  if (size >= 1024 * 1024) return (size / (1024 * 1024)).toFixed(1) + ' MB';
  if (size >= 1024) return Math.round(size / 1024) + ' KB';
  return size + ' B';
}

function setHotspotPhotoError(message) {
  var errorElement = document.getElementById('hotspot-photo-error');
  if (!errorElement) return;
  errorElement.textContent = String(message || '');
  errorElement.hidden = !message;
}

function releaseHotspotPhotoProcessedData() {
  if (hotspotPhotoUploadState.previewUrl) {
    URL.revokeObjectURL(hotspotPhotoUploadState.previewUrl);
  }
  hotspotPhotoUploadState.blob = null;
  hotspotPhotoUploadState.base64 = '';
  hotspotPhotoUploadState.mimeType = '';
  hotspotPhotoUploadState.uploadFileName = '';
  hotspotPhotoUploadState.originalFileName = '';
  hotspotPhotoUploadState.originalSizeBytes = 0;
  hotspotPhotoUploadState.sizeBytes = 0;
  hotspotPhotoUploadState.previewUrl = '';
}

function renderHotspotPhotoUploadState() {
  var card = document.getElementById('hotspot-photo-upload-card');
  if (!card) return;
  var hasUpload = !!hotspotPhotoUploadState.blob;
  card.hidden = !hasUpload;
  if (hasUpload) {
    document.getElementById('hotspot-photo-preview').src = hotspotPhotoUploadState.previewUrl;
    document.getElementById('hotspot-photo-file-name').textContent = hotspotPhotoUploadState.originalFileName;
    document.getElementById('hotspot-photo-file-size').textContent =
      '元 ' + formatHotspotPhotoBytes(hotspotPhotoUploadState.originalSizeBytes) +
      ' / 処理後 ' + formatHotspotPhotoBytes(hotspotPhotoUploadState.sizeBytes);
  }
  var disabled = !!hotspotPhotoUploadState.processing;
  var select = document.getElementById('input-photo-id');
  var changeButton = document.getElementById('hotspot-photo-change-btn');
  var clearButton = document.getElementById('hotspot-photo-clear-btn');
  if (select) select.disabled = disabled;
  if (changeButton) changeButton.disabled = disabled;
  if (clearButton) clearButton.disabled = disabled;
  scheduleHotspotPopupReposition();
}

function disposeHotspotPhotoUploadState() {
  hotspotPhotoUploadState.pickerGeneration += 1;
  hotspotPhotoUploadState.pickerOpen = false;
  hotspotPhotoUploadState.processing = false;
  if (hotspotPhotoUploadState.focusFallbackTimer !== null) {
    clearTimeout(hotspotPhotoUploadState.focusFallbackTimer);
    hotspotPhotoUploadState.focusFallbackTimer = null;
  }
  hotspotPhotoUploadState.decodeObjectUrls.slice().forEach(function(objectUrl) {
    releaseHotspotPhotoDecodeUrl(objectUrl);
  });
  releaseHotspotPhotoProcessedData();
  hotspotPhotoUploadState.selectedValue = '';
  hotspotPhotoUploadState.selectValueBeforePicker = '';
  var input = document.getElementById('hotspot-photo-file-input');
  if (input) input.value = '';
  setHotspotPhotoError('');
  renderHotspotPhotoUploadState();
}

function cancelHotspotPhotoPicker(expectedGeneration) {
  if (typeof expectedGeneration === 'number' &&
      expectedGeneration !== hotspotPhotoUploadState.pickerGeneration) return;
  if (!hotspotPhotoUploadState.pickerOpen) return;
  hotspotPhotoUploadState.pickerOpen = false;
  if (hotspotPhotoUploadState.focusFallbackTimer !== null) {
    clearTimeout(hotspotPhotoUploadState.focusFallbackTimer);
    hotspotPhotoUploadState.focusFallbackTimer = null;
  }
  hotspotPhotoUploadState.selectedValue = hotspotPhotoUploadState.selectValueBeforePicker ||
    hotspotPhotoUploadState.selectedValue;
  var select = document.getElementById('input-photo-id');
  var input = document.getElementById('hotspot-photo-file-input');
  if (select) select.value = hotspotPhotoUploadState.selectedValue;
  if (input) input.value = '';
  renderHotspotPhotoUploadState();
}

function openHotspotPhotoPicker() {
  if (hotspotPhotoUploadState.processing) return;
  var input = document.getElementById('hotspot-photo-file-input');
  if (!input) return;
  hotspotPhotoUploadState.selectValueBeforePicker = hotspotPhotoUploadState.selectedValue;
  hotspotPhotoUploadState.pickerOpen = true;
  hotspotPhotoUploadState.pickerGeneration += 1;
  var generation = hotspotPhotoUploadState.pickerGeneration;
  input.value = '';

  window.addEventListener('focus', function () {
    hotspotPhotoUploadState.focusFallbackTimer = setTimeout(function () {
      var hasFile = input.files && input.files.length > 0;
      if (!hasFile) cancelHotspotPhotoPicker(generation);
    }, 250);
  }, { once: true });
  input.click();
}

function onHotspotPhotoSelectChange() {
  var select = document.getElementById('input-photo-id');
  if (!select) return;
  if (select.value === HOTSPOT_PHOTO_UPLOAD_OPTION) {
    openHotspotPhotoPicker();
    return;
  }
  hotspotPhotoUploadState.pickerGeneration += 1;
  hotspotPhotoUploadState.pickerOpen = false;
  releaseHotspotPhotoProcessedData();
  hotspotPhotoUploadState.selectedValue = String(select.value || '');
  hotspotPhotoUploadState.selectValueBeforePicker = hotspotPhotoUploadState.selectedValue;
  setHotspotPhotoError('');
  renderHotspotPhotoUploadState();
}

function handleHotspotPhotoFileChange(event) {
  var input = event && event.target ? event.target : document.getElementById('hotspot-photo-file-input');
  var file = input && input.files && input.files[0];
  if (!file) {
    cancelHotspotPhotoPicker();
    return;
  }
  var generation = hotspotPhotoUploadState.pickerGeneration;
  hotspotPhotoUploadState.pickerOpen = false;
  hotspotPhotoUploadState.processing = true;
  setHotspotPhotoError('');
  renderHotspotPhotoUploadState();

  processHotspotPhotoFile(file).then(function (processed) {
    if (generation !== hotspotPhotoUploadState.pickerGeneration) return;
    releaseHotspotPhotoProcessedData();
    hotspotPhotoUploadState.blob = processed.blob;
    hotspotPhotoUploadState.base64 = processed.base64;
    hotspotPhotoUploadState.mimeType = processed.mimeType;
    hotspotPhotoUploadState.uploadFileName = processed.uploadFileName;
    hotspotPhotoUploadState.originalFileName = processed.originalFileName;
    hotspotPhotoUploadState.originalSizeBytes = processed.originalSizeBytes;
    hotspotPhotoUploadState.sizeBytes = processed.sizeBytes;
    hotspotPhotoUploadState.previewUrl = URL.createObjectURL(processed.blob);
    hotspotPhotoUploadState.selectedValue = HOTSPOT_PHOTO_UPLOAD_OPTION;
    hotspotPhotoUploadState.selectValueBeforePicker = HOTSPOT_PHOTO_UPLOAD_OPTION;
    var select = document.getElementById('input-photo-id');
    if (select) select.value = HOTSPOT_PHOTO_UPLOAD_OPTION;
  }).catch(function (error) {
    if (generation !== hotspotPhotoUploadState.pickerGeneration) return;
    var select = document.getElementById('input-photo-id');
    if (select) select.value = hotspotPhotoUploadState.selectedValue;
    setHotspotPhotoError(error && error.message ? error.message : '写真の処理に失敗しました。');
  }).then(function () {
    if (generation !== hotspotPhotoUploadState.pickerGeneration) return;
    hotspotPhotoUploadState.processing = false;
    if (input) input.value = '';
    renderHotspotPhotoUploadState();
  });
}

function clearHotspotPhotoUpload() {
  hotspotPhotoUploadState.pickerGeneration += 1;
  hotspotPhotoUploadState.pickerOpen = false;
  hotspotPhotoUploadState.processing = false;
  releaseHotspotPhotoProcessedData();
  hotspotPhotoUploadState.selectedValue = '';
  hotspotPhotoUploadState.selectValueBeforePicker = '';
  var select = document.getElementById('input-photo-id');
  var input = document.getElementById('hotspot-photo-file-input');
  if (select) select.value = '';
  if (input) input.value = '';
  setHotspotPhotoError('');
  renderHotspotPhotoUploadState();
}

/**
 * 写真セレクトに allImages の一覧をセットする
 * @param {string} currentPhotoId  現在選択中のファイルID（編集時）
 */
function buildPhotoSelect(currentPhotoId) {
  disposeHotspotPhotoUploadState();
  var sel = document.getElementById('input-photo-id');
  sel.innerHTML = '';
  var uploadOpt = document.createElement('option');
  uploadOpt.value = HOTSPOT_PHOTO_UPLOAD_OPTION;
  uploadOpt.textContent = '写真をアップロード…';
  sel.appendChild(uploadOpt);
  var noneOpt = document.createElement('option');
  noneOpt.value = '';
  noneOpt.textContent = '（なし）';
  sel.appendChild(noneOpt);

  var normalizedCurrentPhotoId = String(currentPhotoId || '');
  var currentIsScenePhoto = !!(allImages && allImages.some(function (img) {
    return img && img.type !== 'folder' && String(img.id || '') === normalizedCurrentPhotoId;
  }));
  if (normalizedCurrentPhotoId && !currentIsScenePhoto) {
    var currentUploadOpt = document.createElement('option');
    currentUploadOpt.value = normalizedCurrentPhotoId;
    currentUploadOpt.textContent = '現在のアップロード写真';
    sel.appendChild(currentUploadOpt);
  }

  if (allImages) {
  allImages.forEach(function (img) {
    if (img.type === 'folder') return; // フォルダは除外
    var opt = document.createElement('option');
    opt.value = img.id;
    opt.textContent = getSceneDisplayName(img);
    if (String(img.id || '') === normalizedCurrentPhotoId) opt.selected = true;
    sel.appendChild(opt);
  });
  }
  hotspotPhotoUploadState.selectedValue = normalizedCurrentPhotoId;
  hotspotPhotoUploadState.selectValueBeforePicker = normalizedCurrentPhotoId;
  sel.value = normalizedCurrentPhotoId;
  renderHotspotPhotoUploadState();
}

/**
 * ジャンプ先セレクトに allImages の一覧をセットする（現在のシーンは除外）
 * @param {string} currentJumpSceneId  現在選択中のシーンID（編集時）
 */
function buildJumpSceneSelect(currentJumpSceneId) {
  var sel = document.getElementById('input-jump-scene');
  sel.innerHTML = '';
  var noneOpt = document.createElement('option');
  noneOpt.value = '';
  noneOpt.textContent = '（なし）';
  sel.appendChild(noneOpt);

  if (!allImages) return;
  allImages.forEach(function (img) {
    if (img.type === 'folder') return; // フォルダは除外
    if (img.id === currentFileId) return; // 自分自身は除外
    var opt = document.createElement('option');
    opt.value = img.id;
    opt.textContent = getSceneDisplayName(img);
    if (img.id === currentJumpSceneId) opt.selected = true;
    sel.appendChild(opt);
  });
}

// =============================================
//  XSS対策: HTMLエスケープ
// =============================================
function normalizeHttpUrl(value) {
  var url = String(value || '').trim();
  if (!url) return '';
  return /^https?:\/\//i.test(url) ? url : '';
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,  '&amp;')
    .replace(/</g,  '&lt;')
    .replace(/>/g,  '&gt;')
    .replace(/"/g,  '&quot;')
    .replace(/'/g,  '&#039;');
}

// =============================================
//  2D平面マップ表示・非表示
// =============================================

/**
 * 2D平面マップ表示モードに切り替える
 * @param {string} imageUrl  表示する画像のURL
 */
function show2DView(imageUrl, onLoadError, onLoaded, shouldHandle) {
  var canHandle = typeof shouldHandle === 'function' ? shouldHandle : function () { return true; };
  if (!canHandle()) return;
  document.getElementById('panorama').style.display = 'none';
  var container = document.getElementById('flat-map-container');
  container.style.display = 'flex';
  var inner = document.getElementById('flat-map-inner');
  inner.innerHTML = '';

  var img = document.createElement('img');
  img.id = 'flat-map-img';
  img.alt = '';
  img.draggable = false;
  img.style.cursor = isEditMode ? 'crosshair' : 'default';
  img.onload = function () {
    if (!canHandle()) return;
    if (typeof onLoaded === 'function') onLoaded();
  };
  img.onerror = function () {
    if (!canHandle()) return;
    if (typeof onLoadError === 'function') {
      onLoadError();
    } else {
      showLoadError('2D画像の読み込みに失敗しました。');
    }
  };
  img.addEventListener('click', onFlatMapClick);
  inner.appendChild(img);
  img.crossOrigin = 'anonymous';
  img.src = imageUrl;
}

/**
 * 2D表示を非表示にしてPannellumコンテナを復元する
 */
function hide2DView() {
  var container = document.getElementById('flat-map-container');
  container.style.display = 'none';
  document.getElementById('flat-map-inner').innerHTML = '';
  document.getElementById('panorama').style.display = '';
  current2DHotspots = [];
}

/**
 * 2D画像クリック: 編集モード時にクリック位置のX%/Y%を取得してポップアップを開く
 */
function onFlatMapClick(evt) {
  if (!canEdit || !isEditMode) return;
  if (suppressNextPanoramaClick) {
    suppressNextPanoramaClick = false;
    return;
  }
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('add-hotspot', { silent: true })) return;
  if (isMovingHotspot) {
    commitHotspotMove(evt);
    return;
  }
  var img = evt.currentTarget;
  var coordinates = get2DHotspotCoordinates(evt.clientX, evt.clientY, img);
  if (!coordinates) return;
  pendingYaw = coordinates.yaw;       // X% → Yaw 列に保存
  pendingPitch = coordinates.pitch;   // Y% → Pitch 列に保存
  openPopup(evt.clientX, evt.clientY);
}

/**
 * 2Dモード用ホットスポットを画像上にオーバーレイ描画する
 * @param {Array} hotspots  ホットスポット配列（pitch=Y%, yaw=X%）
 */
function render2DHotspots(hotspots) {
  current2DHotspots = hotspots;
  var inner = document.getElementById('flat-map-inner');
  if (!inner) return;

  // 既存オーバーレイを削除
  var old = inner.querySelectorAll('.flat-hs-marker:not(.flat-hs-draft)');
  for (var i = 0; i < old.length; i++) {
    old[i].parentNode.removeChild(old[i]);
  }

  hotspots.forEach(function (hs) {
    var el = document.createElement('div');
    el.className = 'flat-hs-marker';
    el.style.left = hs.yaw + '%';
    el.style.top  = hs.pitch + '%';

    var marker = createStandaloneMarkerElement(hs);
    el.appendChild(marker);

    // ホバーツールチップ
    if (hs.jumpSceneId) {
      // ジャンプ先がある場合: ジャンプ先シーン名を表示
      el.addEventListener('mouseenter', function () {
        if (isEditMode) return;
        showJumpTooltip(marker, hs.jumpSceneId, hs.label);
      });
      el.addEventListener('mouseleave', function () {
        hideJumpTooltip();
      });
    } else if (hs.label) {
      // 通常ホットスポット: ラベルを表示
      el.addEventListener('mouseenter', function () {
        if (isEditMode) return;
        showLabelTooltip(marker, hs.label);
      });
      el.addEventListener('mouseleave', function () {
        hideJumpTooltip();
      });
    }

    marker.addEventListener('click', function (e) {
      e.stopPropagation();
      onMarkerClick(e, hs);
    });

    if (canEdit && isEditMode) {
      marker.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        e.stopPropagation();
        openHotspotContextMenu(e, hs, marker);
      });
    }

    inner.appendChild(el);
  });
}

// =============================================
//  アップロードモーダル
// =============================================

/**
 * 現在表示中のフォルダID を返す。
 * サブフォルダ内ならそのID、ルートならルートフォルダID。
 * @returns {string|null}
 */
function getCurrentFolderId() {
  if (folderStack.length > 0) {
    return folderStack[folderStack.length - 1].id;
  }
  return rootFolderId;
}

/**
 * 現在のフォルダを Google Drive で別タブ開く。
 */
function openCurrentFolderInDrive() {
  if (!canEdit || !isEditMode) return false;
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('open-drive-folder')) return false;
  var folderId = getCurrentFolderId();
  if (!folderId) {
    showToast('フォルダIDが取得できません。', 'error');
    return false;
  }
  window.open('https://drive.google.com/drive/folders/' + folderId, '_blank');
  return true;
}

/** 正式なホットスポット写真フォルダを、popup blockerを避けて別タブで開く。 */
function openHotspotPhotoFolderInDrive() {
  if (!canEdit || !isEditMode) return false;
  if (hotspotPhotoFolderOpenPending) return false;
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('open-hotspot-photo-folder')) return false;

  var popupTab = window.open('', '_blank');
  if (!popupTab) {
    showToast('ポップアップがブロックされました。ブラウザでポップアップを許可してから再度お試しください。', 'error');
    return false;
  }
  try { popupTab.opener = null; } catch (openerError) { /* ignore */ }

  hotspotPhotoFolderOpenPending = true;
  setHotspotPhotoFolderButtonBusy(true);

  function closePopupTab() {
    try {
      if (!popupTab.closed) popupTab.close();
    } catch (closeError) { /* ignore */ }
  }

  function finishRequest() {
    hotspotPhotoFolderOpenPending = false;
    setHotspotPhotoFolderButtonBusy(false);
  }

  google.script.run
    .withSuccessHandler(function (result) {
      if (!result || !result.success ||
          !/^https:\/\/drive\.google\.com\/drive\/folders\/[A-Za-z0-9_-]+$/.test(String(result.url || ''))) {
        closePopupTab();
        finishRequest();
        showToast((result && result.error) || '写真フォルダを開けませんでした。再度お試しください。', 'error');
        return;
      }
      try {
        if (popupTab.closed) throw new Error('popup closed');
        popupTab.location.replace(result.url);
      } catch (navigationError) {
        closePopupTab();
        finishRequest();
        showToast('写真フォルダを開くタブを更新できませんでした。再度お試しください。', 'error');
        return;
      }
      finishRequest();
      if (result.partialSuccess) {
        showToast(result.warning || '写真フォルダは開きましたが、config URLを同期できませんでした。', 'warning');
      }
    })
    .withFailureHandler(function () {
      closePopupTab();
      finishRequest();
      showToast('写真フォルダの取得中に通信エラーが発生しました。再度お試しください。', 'error');
    })
    .getHotspotPhotoFolderUrlForEdit(withEditToken({}));
  return true;
}

function openUploadModal() {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('upload-image')) return false;
  if (!canEdit) return;
  if (!allImages) return; // フォルダモードのみ対応
  cancelHotspotMove('アップロード画面を開いたため移動をキャンセルしました。', { silent: true });
  document.getElementById('upload-modal').style.display = 'flex';
  document.getElementById('upload-status').textContent = '';
  document.getElementById('upload-file-input').value = '';
  document.getElementById('upload-set-home').checked = false;
  // ラジオボタンを初期値に戻す
  var radios = document.querySelectorAll('input[name="upload-type"]');
  if (radios.length) radios[0].checked = true;
  syncUploadHomeOption();
}

function closeUploadModal() {
  document.getElementById('upload-modal').style.display = 'none';
  document.getElementById('upload-confirm-btn').disabled = false;
  document.getElementById('upload-set-home').checked = false;
}

/** ホーム指定は設定済みルートフォルダへのアップロード時だけ許可する。 */
function syncUploadHomeOption() {
  var homeCheckbox = document.getElementById('upload-set-home');
  var help = document.getElementById('upload-home-help');
  if (!homeCheckbox || !help) return;
  var isRootUpload = folderStack.length === 0 && getCurrentFolderId() === rootFolderId;
  homeCheckbox.disabled = !isRootUpload;
  if (!isRootUpload) homeCheckbox.checked = false;
  help.textContent = isRootUpload
    ? 'すでにホームがある場合は、この画像へ切り替わります。複数選択時は最後の画像がホームになります。'
    : 'サブフォルダへのアップロードではホームに設定できません。';
}

function sanitizeFileName(fileName) {
  var name = String(fileName || 'image').trim();
  if (!name) return 'image.jpg';
  return name;
}

function readFileAsDataUrl(file, onSuccess, onError) {
  var reader = new FileReader();
  reader.onload = function () {
    onSuccess(String(reader.result || ''));
  };
  reader.onerror = function () {
    onError('ファイルの読み込みに失敗');
  };
  reader.readAsDataURL(file);
}

function convertDataUrlToJpeg(dataUrl, quality, onSuccess, onError) {
  var img = new Image();
  img.onload = function () {
    try {
      var canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth || img.width;
      canvas.height = img.naturalHeight || img.height;
      var ctx = canvas.getContext('2d');
      if (!ctx) {
        onError('画像変換コンテキストの取得に失敗');
        return;
      }
      ctx.drawImage(img, 0, 0);
      var jpegDataUrl = canvas.toDataURL('image/jpeg', quality || 0.92);
      onSuccess(jpegDataUrl);
    } catch (e) {
      onError(e && e.message ? e.message : 'JPEG変換に失敗');
    }
  };
  img.onerror = function () {
    onError('画像のデコードに失敗');
  };
  img.src = dataUrl;
}

function onUploadConfirm() {
  if (!canEdit) {
    closeUploadModal();
    return;
  }

  var fileInput = document.getElementById('upload-file-input');
  if (!fileInput.files || !fileInput.files.length) {
    document.getElementById('upload-status').textContent = 'ファイルを選択してください。';
    return;
  }
  var files = Array.prototype.slice.call(fileInput.files);
  var selectedType = document.querySelector('input[name="upload-type"]:checked');
  var is2D = selectedType && selectedType.value === '2d';
  var homeCheckbox = document.getElementById('upload-set-home');
  var setAsHome = !!(homeCheckbox && !homeCheckbox.disabled && homeCheckbox.checked);

  var statusEl = document.getElementById('upload-status');
  var confirmBtn = document.getElementById('upload-confirm-btn');
  statusEl.textContent = files.length + ' 件のファイルを読み込んでいます...';
  confirmBtn.disabled = true;

  var uploadedFiles = [];
  var errors = [];
  var warnings = [];
  var newHomeImageId = null;
  var index = 0;

  function uploadNext() {
    if (index >= files.length) {
      confirmBtn.disabled = false;
      if (uploadedFiles.length) {
        if (newHomeImageId) {
          allImages = applyHomeSelectionToImages(allImages, newHomeImageId, null);
          uploadedFiles = applyHomeSelectionToImages(uploadedFiles, newHomeImageId, null);
          homeImageId = newHomeImageId;
        }
        uploadedFiles.forEach(function (f) { allImages.push(f); });
        allImages = sortSceneListItems(allImages);
        updateRootHomeImageId();
        buildSceneSidebar(allImages);
        syncActiveSceneItem(currentFileId);
        var msg = uploadedFiles.length + ' 件アップロード完了';
        if (errors.length) msg += '（' + errors.length + ' 件失敗）';
        if (warnings.length) msg += '（' + warnings.length + ' 件は後処理が部分成功）';
        if (warnings.length) msg += ': ' + warnings[0];
        showToast(msg, warnings.length ? 'error' : 'success');
        closeUploadModal();
      } else {
        statusEl.textContent = 'エラー: すべてのアップロードに失敗しました。' + (errors[0] || '');
      }
      return;
    }

    var file = files[index];
    var currentIndex = index + 1;
    statusEl.textContent = currentIndex + '/' + files.length + ' アップロード中...';

    readFileAsDataUrl(file, function (dataUrl) {
      // Canvas変換をスキップして、方位情報入りのオリジナルデータをそのまま送る
      var uploadName = sanitizeFileName(file.name);
      google.script.run
        .withSuccessHandler(function (result) {
          if (result.success) {
            uploadedFiles.push(result.file);
            if (result.homeSet && result.file && result.file.id) {
              newHomeImageId = result.file.id;
            }
            if (result.partialSuccess) {
              warnings.push(file.name + ': ' + (result.warning || 'Drive保存後のscenes同期に失敗しました。'));
            }
          } else {
            errors.push(file.name + ': ' + (result.error || '不明なエラー'));
          }
          index++;
          uploadNext();
        })
        .withFailureHandler(function (err) {
          errors.push(file.name + ': ' + (err && err.message ? err.message : '通信エラー'));
          index++;
          uploadNext();
        })
        .uploadImageToDrive(withEditToken({
          base64:          dataUrl,
          fileName:        uploadName,
          mimeType:        file.type || 'image/jpeg',
          is2D:            !!is2D,
          setAsHome:       !!setAsHome,
          targetFolderId:  getCurrentFolderId() || ''
        }));
    }, function (message) {
      errors.push(file.name + ': ' + (message || 'ファイルの読み込みに失敗'));
      index++;
      uploadNext();
    });
  }

  uploadNext();
}

function getCheckedRadioValue(name, fallback) {
  var selected = document.querySelector('input[name="' + name + '"]:checked');
  return selected ? selected.value : fallback;
}

function setCheckedRadioValue(name, value) {
  var radios = document.querySelectorAll('input[name="' + name + '"]');
  for (var i = 0; i < radios.length; i++) {
    radios[i].checked = radios[i].value === value;
  }
}

function getCurrentViewForShare(target) {
  var sceneId = '';
  var yaw = null;
  var pitch = null;

  if ((target === 'scene' || target === 'view') && currentFileId) {
    sceneId = currentFileId;
  }

  if (target === 'view' && sceneId && !is2DMode && viewer) {
    try {
      if (typeof viewer.getYaw === 'function') yaw = viewer.getYaw();
      if (typeof viewer.getPitch === 'function') pitch = viewer.getPitch();
    } catch (e) {
      yaw = null;
      pitch = null;
    }
  }

  return { sceneId: sceneId, yaw: yaw, pitch: pitch };
}

function getShareOptionsFromModal() {
  var target = getCheckedRadioValue('share-target', 'home');
  var currentView = getCurrentViewForShare(target);
  var baseUrl = appBaseUrl || (window.location && window.location.href) || '';
  return {
    format: getCheckedRadioValue('share-format', 'url'),
    baseUrl: baseUrl,
    delivery: getCheckedRadioValue('share-delivery', 'direct'),
    sceneId: currentView.sceneId,
    yaw: currentView.yaw,
    pitch: currentView.pitch
  };
}

function updateShareOutput() {
  var options = getShareOptionsFromModal();
  var url = buildPublicShareUrl(options);
  var isIframe = options.format === 'iframe';
  var isQr = options.format === 'qr';
  var text = isIframe ? buildIframeCode(url) : url;
  var output = document.getElementById('share-output');
  if (output) output.value = text;
  var outputRow = document.getElementById('share-output-row');
  if (outputRow) outputRow.hidden = isQr;

  var label = document.getElementById('share-output-label');
  if (label) label.textContent = isIframe ? 'iframeコード' : (isQr ? 'QRコード用URL' : '共有URL');
  updateShareQrPanel(url, options.format);
  return text;
}

function openShareModal() {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('open-share')) return false;
  cancelHotspotMove('共有画面を開いたため移動をキャンセルしました。', { silent: true });
  stopGyroIfActive('share');
  setCheckedRadioValue('share-format', 'url');
  setCheckedRadioValue('share-delivery', 'direct');
  setCheckedRadioValue('share-target', 'home');
  updateShareOutput();
  document.getElementById('embed-modal-backdrop').classList.add('visible');
  document.getElementById('embed-modal').classList.add('visible');
}

/**
 * 旧名称の互換ラッパー。
 */
function openEmbedModal() {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('open-share')) return false;
  return openShareModal();
}

function closeShareModal() {
  document.getElementById('embed-modal-backdrop').classList.remove('visible');
  document.getElementById('embed-modal').classList.remove('visible');
}

/**
 * 旧名称の互換ラッパー。
 */
function closeEmbedModal() {
  closeShareModal();
}

function copyShareOutput() {
  updateShareOutput();
  var textarea = document.getElementById('share-output');
  if (!textarea) return;
  var text = textarea.value;
  if (!text) return;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      showToast('コピーしました。', 'success');
    }).catch(function () {
      fallbackCopy_(textarea);
    });
  } else {
    fallbackCopy_(textarea);
  }
}

/**
 * 旧名称の互換ラッパー。
 */
function copyEmbedCode() {
  copyShareOutput();
}

/**
 * 現在表示中のシーンを再読み込みする（ホットスポット更新反映用）。
 */
function reloadCurrentScene() {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('reload-current-scene')) return false;
  if (!currentFileId || !allImages) return;
  var currentImg = null;
  for (var i = 0; i < allImages.length; i++) {
    if (allImages[i].id === currentFileId) { currentImg = allImages[i]; break; }
  }
  if (currentImg) loadScene(currentImg);
}

function onBulkInputDropdownClick(evt) {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('bulk-input-action')) {
    closeBulkInputDropdown();
    return false;
  }
  if (!canEdit) {
    closeBulkInputDropdown();
    return;
  }

  var btn = evt.target.closest('.bulk-input-item');
  if (!btn || btn.disabled) return;
  var action = btn.getAttribute('data-action');
  if (!action) return;

  closeBulkInputDropdown();
  var origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '処理中...';

  if (action === 'update-dropdowns') {
    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.textContent = origText;
        if (result && result.success) {
          showToast('入力リストを最新化しました。', 'success');
        } else {
          showToast('更新に失敗しました: ' + ((result && result.error) || '不明なエラー'), 'error');
        }
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = origText;
        showToast('通信エラーが発生しました: ' + (err.message || '不明なエラー'), 'error');
      })
      .updateStudentSheetDropdowns(withEditToken({}));
  } else if (action === 'import-student-data') {
    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.textContent = origText;
        if (result && result.success) {
          var msg = result.count > 0
            ? result.count + '件のデータを取り込みました。'
            : '取り込み対象のデータがありませんでした。';
          if (result.skipped > 0) {
            msg += ' ' + result.skipped + '件は参照先・同名重複・ラベルを確認するため未処理のまま残しました。';
          }
          showToast(msg, result.skipped > 0 ? 'error' : 'success');
          if (result.count > 0) {
            clearHotspotCache(currentFileId || '');
            reloadCurrentScene();
          }
        } else {
          showToast('取り込みに失敗しました: ' + ((result && result.error) || '不明なエラー'), 'error');
        }
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = origText;
        showToast('通信エラーが発生しました: ' + (err.message || '不明なエラー'), 'error');
      })
      .bulkImportStudentSheet(withEditToken({}));
  }
}

/**
 * Clipboard API が使えない場合のフォールバックコピー。
 *
 * @param {HTMLTextAreaElement} textarea
 */
function fallbackCopy_(textarea) {
  textarea.select();
  try {
    document.execCommand('copy');
    showToast('コピーしました。', 'success');
  } catch (e) {
    showToast('コピーに失敗しました。手動でコピーしてください。', 'error');
  }
  window.getSelection().removeAllRanges();
}
