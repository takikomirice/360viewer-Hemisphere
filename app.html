function onHotspotEditClick() {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('edit-other-hotspot')) {
    closeHotspotContextMenu();
    return false;
  }
  if (!canEdit) {
    closeHotspotContextMenu();
    return;
  }
  suppressNextPanoramaClick = true;
  setTimeout(function () { suppressNextPanoramaClick = false; }, 120);
  var target = hotspotContextTarget;
  closeHotspotContextMenu();
  if (!target) return;
  if (!canStartHotspotMutation()) return;
  if (hasPendingHotspotMutationForTarget(target.id)) {
    showToast('このホットスポットの更新を処理中です。完了までお待ちください。', 'error');
    return;
  }

  // マーカー位置からポップアップを表示（画面中央に近い位置）
  var cx = window.innerWidth  / 2;
  var cy = window.innerHeight / 2;
  openPopup(cx, cy, target);
}

function onHotspotDeleteClick() {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('delete-other-hotspot')) {
    closeHotspotContextMenu();
    return false;
  }
  if (!canEdit) {
    closeHotspotContextMenu();
    return;
  }
  suppressNextPanoramaClick = true;
  setTimeout(function () { suppressNextPanoramaClick = false; }, 120);
  var target = hotspotContextTarget;
  closeHotspotContextMenu();
  if (!target) return;
  if (!canStartHotspotMutation()) return;
  if ((hotspotMoveState.active || hotspotMoveState.previewElement) &&
      !cancelHotspotMove('削除操作のため移動をキャンセルしました。', { silent: true })) {
    return;
  }
  if (hasPendingHotspotMutationForTarget(target.id)) {
    showToast('このホットスポットの更新を処理中です。完了までお待ちください。', 'error');
    return;
  }
  var mutationRequest = createHotspotMutationRequest(currentFileId || '', 'delete', target.id);

  google.script.run
    .withSuccessHandler(function (result) {
      finishHotspotMutationRequest(mutationRequest);
      if (result && result.success) clearHotspotCache(mutationRequest.fileId);
      if (!isCurrentHotspotMutationRequest(mutationRequest)) return;
      if (result && result.success) {
        if (is2DMode) {
          // 2Dモード: current2DHotspots から削除して再描画
          current2DHotspots = current2DHotspots.filter(function (hs) { return hs !== target; });
          render2DHotspots(current2DHotspots);
        } else {
          try { viewer.removeHotSpot(target._pannellumId); } catch (e) { /* ignore */ }
        }
        if (result.partialSuccess) {
          showToast(
            'ホットスポットを削除しました。' + (result.warning || '古い添付写真の整理に失敗しました。'),
            'warning'
          );
        } else {
          showToast('ホットスポットを削除しました。', 'success');
        }
      } else {
        showToast('削除に失敗しました: ' + ((result && result.error) || '不明なエラー'), 'error');
      }
    })
    .withFailureHandler(function () {
      finishHotspotMutationRequest(mutationRequest);
      if (!isCurrentHotspotMutationRequest(mutationRequest)) return;
      showToast('通信エラーが発生しました。再度お試しください。', 'error');
    })
    .deleteHotspot(withEditToken({
      id: target.id,
      fileId: mutationRequest.fileId
    }));
}

function onHotspotMoveClick() {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('move-other-hotspot')) {
    closeHotspotContextMenu();
    return false;
  }
  if (!canEdit) {
    closeHotspotContextMenu();
    return;
  }
  suppressNextPanoramaClick = true;
  setTimeout(function () { suppressNextPanoramaClick = false; }, 120);
  var target = hotspotContextTarget;
  var sourceElement = hotspotContextTargetElement;
  closeHotspotContextMenu();
  if (!target) return;

  startHotspotMovePreview(target, sourceElement);
}

function requestSceneDelete(img) {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('delete-scene')) return false;
  if (!canEdit) return;
  var sceneName = String((img && img.name) || '');
  var ok = window.confirm(
    '「' + sceneName + '」を削除しますか？\n' +
    '削除した写真はGoogleドライブのゴミ箱に移動され、\n' +
    'このシーンに紐づくホットスポットも削除されます。'
  );
  if (!ok) return;

  google.script.run
    .withSuccessHandler(function (result) {
      if (!result || !result.success) {
        showToast('写真の削除に失敗しました: ' + ((result && result.error) || '不明なエラー'), 'error');
        return;
      }
      applySceneDeleteLocally(img.id);
      var deletedHotspots = Number(result.deletedHotspots || 0);
      var detail = deletedHotspots > 0 ? '（ホットスポット ' + deletedHotspots + ' 件も削除）' : '';
      if (result.partialSuccess) {
        showToast('写真は削除しました。' + detail + ' ' + (result.warning || '関連データの一部を削除できませんでした。'), 'error');
      } else {
        showToast('写真を削除しました。' + detail, 'success');
      }
    })
    .withFailureHandler(function () {
      showToast('通信エラーが発生しました。再度お試しください。', 'error');
    })
    .deleteImageFile(withEditToken({
      fileId: img.id
    }));
}

function applySceneDeleteLocally(fileId) {
  if (!allImages || !fileId) return;
  var removedIndex = -1;
  var nextImages = allImages.filter(function (img, index) {
    var keep = img.id !== fileId;
    if (!keep) removedIndex = index;
    return keep;
  });
  if (removedIndex < 0) return;

  allImages = nextImages;
  updateRootHomeImageId();
  closeScenePropertiesDialog();
  closeSceneContextMenu();
  buildSceneSidebar(allImages);

  // 削除対象が現在表示中でない場合は表示中シーンを維持する
  if (currentFileId && currentFileId !== fileId) {
    syncActiveSceneItem(currentFileId);
    return;
  }

  // 現在表示中シーンを削除した場合
  if (viewer) {
    try { viewer.destroy(); } catch (e) { /* ignore */ }
    viewer = null;
  }
  hide2DView();
  hideJumpTooltip();
  current2DHotspots = [];
  is2DMode = false;

  // 画像アイテム（フォルダを除く）の中から次に表示するシーンを選ぶ
  var imageItems = allImages.filter(function (i) { return i.type !== 'folder'; });
  if (imageItems.length === 0) {
    currentFileId = null;
    showSceneEmptyState('シーンがありません。写真をアップロードしてください。');
    return;
  }

  var nextIndex = Math.min(Math.max(removedIndex, 0), imageItems.length - 1);
  previousSceneId = null;
  loadScene(imageItems[nextIndex]);
}

/** サーバーの正規化済みsceneを、画像URLなどのクライアント専用値を保ったまま結合する。 */
function mergeNormalizedSceneIntoImage(image, scene) {
  var merged = Object.assign({}, image || {});
  Object.keys(scene || {}).forEach(function (key) {
    merged[key] = scene[key];
  });
  merged.id = String((scene && (scene.id || scene.fileId)) || merged.id || '');
  var normalizedType = String((scene && (scene.sceneType || scene.type)) || '').toUpperCase();
  if (normalizedType === '360' || normalizedType === '2D') {
    merged.type = normalizedType;
    merged.sceneType = normalizedType;
  }
  if (scene && scene.displayName) merged.name = scene.displayName;
  return merged;
}

/** 正規化済みsceneを現在の一覧へ反映し、表示順とアクティブ状態を再描画する。 */
function applyNormalizedSceneLocally(scene) {
  if (!Array.isArray(allImages) || !scene) return null;
  var targetId = String(scene.id || scene.fileId || '');
  var mergedScene = null;
  allImages = allImages.map(function (image) {
    if (!image || String(image.id || '') !== targetId) return image;
    mergedScene = mergeNormalizedSceneIntoImage(image, scene);
    return mergedScene;
  });
  if (!mergedScene) return null;
  allImages = sortSceneListItems(allImages);
  updateRootHomeImageId();
  buildSceneSidebar(allImages);
  syncActiveSceneItem(currentFileId);
  return mergedScene;
}

function getSceneSettingsRadioValue(name, fallback) {
  var selected = document.querySelector('input[name="' + name + '"]:checked');
  return selected ? selected.value : fallback;
}

function setSceneSettingsRadioValue(name, value) {
  var inputs = document.querySelectorAll('input[name="' + name + '"]');
  inputs.forEach(function (input) {
    input.checked = input.value === value;
  });
}

function focusSceneListItem(fileId) {
  if (!fileId) return;
  var items = document.querySelectorAll('.scene-item');
  for (var i = 0; i < items.length; i++) {
    if (String(items[i].dataset.id || '') === String(fileId)) {
      items[i].focus();
      return;
    }
  }
}

/** シーン設定をモーダルへ反映する。 */
function renderSceneSettings(scene) {
  sceneSettingsOriginal = scene;
  document.getElementById('scene-settings-name').value = getSceneDisplayName(scene);
  setSceneSettingsRadioValue('scene-settings-type', scene.sceneType || scene.type || '360');
  setSceneSettingsRadioValue('scene-settings-north-mode', scene.northOffsetMode || 'auto');
  document.getElementById('scene-settings-north-value').value = scene.northOffset == null
    ? ''
    : String(scene.northOffset);
  document.getElementById('scene-settings-error').textContent = '';
  document.getElementById('scene-settings-dialog').setAttribute('aria-busy', 'false');
  document.getElementById('scene-settings-save-btn').disabled = false;
  syncSceneSettingsControls();
  document.getElementById('scene-settings-name').focus();
}

/** 種別とnorthOffsetモードに応じて入力可否と説明を同期する。 */
function syncSceneSettingsControls() {
  var type = getSceneSettingsRadioValue('scene-settings-type', '360');
  var northMode = getSceneSettingsRadioValue('scene-settings-north-mode', 'auto');
  var is2D = type === '2D';
  var northFieldset = document.getElementById('scene-settings-north-fieldset');
  var manualInput = document.getElementById('scene-settings-north-value');
  var note = document.getElementById('scene-settings-note');
  northFieldset.disabled = is2D;
  manualInput.disabled = is2D || northMode !== 'manual';
  if (is2D) {
    note.textContent = '2D画像では北方向補正を使用しません。XMP解析やコンパス表示も行いません。';
  } else if (northMode === 'manual') {
    note.textContent = '0以上360未満の数値を指定してください。0も有効です。';
  } else if (northMode === 'none') {
    note.textContent = '補正を無効にし、次回以降もXMPを解析しません。';
  } else {
    note.textContent = '次回の360画像表示時にJPEGのXMPから自動取得します。';
  }
}

/** 編集トークン付きで設定を取得し、モーダルを開く。 */
function openSceneSettingsModal(img) {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('scene-settings')) return false;
  if (!canEdit || !isEditMode || !img || !img.id) return;
  if (hasPendingHotspotMutationForScene(img.id)) {
    showToast('このシーンのホットスポットを処理中です。完了までお待ちください。', 'error');
    return;
  }
  if ((hotspotMoveState.active || hotspotMoveState.previewElement) &&
      !cancelHotspotMove('設定の変更を開いたため移動をキャンセルしました。', { silent: true })) {
    return;
  }
  var requestedFileId = String(img.id || '');
  var requestGeneration = ++sceneSettingsRequestGeneration;
  sceneSettingsTargetId = requestedFileId;
  sceneSettingsReturnFocusId = requestedFileId;
  sceneSettingsOriginal = null;
  isSavingSceneSettings = false;

  var backdrop = document.getElementById('scene-settings-backdrop');
  var dialog = document.getElementById('scene-settings-dialog');
  var saveButton = document.getElementById('scene-settings-save-btn');
  document.getElementById('scene-settings-name').value = getSceneDisplayName(img);
  document.getElementById('scene-settings-error').textContent = '設定を読み込んでいます…';
  saveButton.disabled = true;
  saveButton.textContent = '保存';
  dialog.setAttribute('aria-busy', 'true');
  backdrop.classList.add('visible');
  dialog.focus();

  google.script.run
    .withSuccessHandler(function (result) {
      if (!isCurrentSceneSettingsRequest(requestGeneration, requestedFileId)) return;
      if (!result || !result.success || !result.scene) {
        dialog.setAttribute('aria-busy', 'false');
        document.getElementById('scene-settings-error').textContent =
          '設定の取得に失敗しました: ' + ((result && result.error) || '不明なエラー');
        return;
      }
      renderSceneSettings(result.scene);
    })
    .withFailureHandler(function () {
      if (!isCurrentSceneSettingsRequest(requestGeneration, requestedFileId)) return;
      dialog.setAttribute('aria-busy', 'false');
      document.getElementById('scene-settings-error').textContent =
        '通信エラーが発生しました。モーダルを閉じずに再度お試しください。';
    })
    .getSceneSettings(withEditToken({ fileId: requestedFileId }));
}

/** 保存中でなければ設定モーダルを閉じ、対象シーンへフォーカスを戻す。 */
function closeSceneSettingsModal(forceClose) {
  if (isSavingSceneSettings && !forceClose) return;
  var focusId = sceneSettingsReturnFocusId;
  sceneSettingsRequestGeneration += 1;
  document.getElementById('scene-settings-backdrop').classList.remove('visible');
  document.getElementById('scene-settings-dialog').setAttribute('aria-busy', 'false');
  sceneSettingsTargetId = null;
  sceneSettingsOriginal = null;
  sceneSettingsReturnFocusId = null;
  isSavingSceneSettings = false;
  setTimeout(function () { focusSceneListItem(focusId); }, 0);
}

function onSceneSettingsBackdropClick(evt) {
  if (evt.target.id === 'scene-settings-backdrop') {
    closeSceneSettingsModal();
  }
}

/** 現在表示中のsceneだけ、安全な視点を保持して新設定で再読込する。 */
function reloadCurrentSceneAfterSettings(previousScene, nextScene) {
  if (!nextScene || String(nextScene.id || nextScene.fileId || '') !== String(currentFileId || '')) return;
  var fileId = String(nextScene.id || nextScene.fileId || '');
  delete hotspotCacheByFileId[fileId];
  preloadedScenes.delete(fileId);

  var previousType = getExplicitSceneType(previousScene || {});
  var nextType = getExplicitSceneType(nextScene);
  var preservePanoramaView = previousType === '360' && nextType === '360';
  var savedYaw = null;
  var savedPitch = null;
  if (preservePanoramaView && viewer) {
    try {
      if (typeof viewer.getYaw === 'function') savedYaw = viewer.getYaw();
      if (typeof viewer.getPitch === 'function') savedPitch = viewer.getPitch();
    } catch (e) {
      savedYaw = null;
      savedPitch = null;
    }
  }

  previousSceneId = null;
  hide2DView();
  loadScene(nextScene, savedYaw, savedPitch);
}

/** 設定モーダルの入力値を編集トークン付きで保存する。 */
function saveSceneSettings() {
  if (!canEdit || !isEditMode || !sceneSettingsTargetId || !sceneSettingsOriginal) return;
  if (isSavingSceneSettings) return;

  var type = getSceneSettingsRadioValue('scene-settings-type', '360');
  var northMode = getSceneSettingsRadioValue('scene-settings-north-mode', 'auto');
  var sceneName = String(document.getElementById('scene-settings-name').value || '').trim();
  var manualValue = String(document.getElementById('scene-settings-north-value').value || '').trim();
  var errorElement = document.getElementById('scene-settings-error');
  var saveButton = document.getElementById('scene-settings-save-btn');
  var payload = { fileId: sceneSettingsTargetId, name: sceneName, type: type };

  errorElement.textContent = '';
  if (!sceneName) {
    errorElement.textContent = '名前を入力してください。';
    document.getElementById('scene-settings-name').focus();
    return;
  }
  if (/[\u0000-\u001F\u007F]/.test(sceneName)) {
    errorElement.textContent = '名前に制御文字は使用できません。';
    document.getElementById('scene-settings-name').focus();
    return;
  }
  if (type === '360') {
    payload.northOffsetMode = northMode;
    if (northMode === 'manual') {
      var numericValue = manualValue === '' ? NaN : Number(manualValue);
      if (!isFinite(numericValue) || numericValue < 0 || numericValue >= 360) {
        errorElement.textContent = '手動northOffsetは0以上360未満の数値を入力してください。';
        return;
      }
      payload.northOffset = numericValue;
    }
  }

  isSavingSceneSettings = true;
  saveButton.disabled = true;
  saveButton.textContent = '保存中…';
  document.getElementById('scene-settings-dialog').setAttribute('aria-busy', 'true');

  function finishSaving() {
    isSavingSceneSettings = false;
    saveButton.disabled = false;
    saveButton.textContent = '保存';
    document.getElementById('scene-settings-dialog').setAttribute('aria-busy', 'false');
  }

  google.script.run
    .withSuccessHandler(function (result) {
      if (!result || !result.success || !result.scene) {
        finishSaving();
        errorElement.textContent = '保存に失敗しました: ' + ((result && result.error) || '不明なエラー');
        return;
      }
      var previousScene = sceneSettingsOriginal;
      var updatedScene = applyNormalizedSceneLocally(result.scene) || result.scene;
      finishSaving();
      closeSceneSettingsModal(true);
      reloadCurrentSceneAfterSettings(previousScene, updatedScene);
      showToast(
        result.partialSuccess ? (result.warning || '設定は保存しましたが、キャッシュ更新に失敗しました。') : '設定の変更を保存しました。',
        result.partialSuccess ? 'error' : 'success'
      );
    })
    .withFailureHandler(function () {
      finishSaving();
      errorElement.textContent = '通信エラーが発生しました。入力内容を保持したまま再度お試しください。';
    })
    .updateSceneSettings(withEditToken(payload));
}

function applyHomeSelectionToImages(images, nextHomeId, normalizedScene) {
  return (images || []).map(function (image) {
    if (!image || image.type === 'folder') return image;
    var next = String(image.id || '') === String(nextHomeId || '') && normalizedScene
      ? mergeNormalizedSceneIntoImage(image, normalizedScene)
      : Object.assign({}, image);
    next.isHome = String(next.id || '') === String(nextHomeId || '');
    return next;
  });
}

/** 編集モードのルート画像を、表示シーンを変えずにホームへ設定する。 */
function requestSetHomeScene(img) {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('set-home')) return false;

  google.script.run

      );
    })

      showToast('通信エラーが発生しました。再度お試しください。', 'error');

function openSceneProperties(img) {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('scene-properties')) return false;

      }
      renderSceneProperties(result.properties);

function renderSceneProperties(props) {
  var content = document.getElementById('scene-properties-content');
  var shotDate = props.exifDate
    ? escapeHtml(formatDateTime(props.exifDate))
    : escapeHtml(formatDateTime(props.lastUpdated));
  var cameraLabel = (props.cameraMake || props.cameraModel)
    ? escapeHtml([props.cameraMake, props.cameraModel].filter(Boolean).join(' '))
    : '不明';
  var resolutionLabel = (props.width != null && props.height != null)
    ? escapeHtml(props.width + ' × ' + props.height + ' px')
    : '不明';
  var northLabel = (props.northOffset != null)
    ? escapeHtml(props.northOffset + '度 (北基準)')
    : '情報なし';

  var rows = [
    { key: '名前',       value: escapeHtml(props.name || '') },
    { key: '撮影日時',   value: shotDate },
    { key: 'カメラ機種', value: cameraLabel },
    { key: '解像度',     value: resolutionLabel },
    { key: '撮影方位',   value: northLabel },
    { key: 'ファイルサイズ', value: escapeHtml(formatFileSize(props.sizeBytes)) },
    { key: 'Drive URL',  value: props.url ? '<a href="' + escapeHtml(props.url) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(props.url) + '</a>' : 'なし' }
  ];

  content.innerHTML = rows.map(function (row) {
    return '' +
      '<div class="scene-properties-row">' +
      '  <div class="scene-properties-key">' + row.key + '</div>' +
      '  <div class="scene-properties-value">' + row.value + '</div>' +
      '</div>';
  }).join('');

  document.getElementById('scene-properties-backdrop').classList.add('visible');

function closeScenePropertiesDialog() {
  document.getElementById('scene-properties-backdrop').classList.remove('visible');
}

function onScenePropertiesBackdropClick(evt) {
  if (evt.target.id === 'scene-properties-backdrop') {
    closeScenePropertiesDialog();
  }
}

function formatFileSize(bytes) {
  var size = Number(bytes);
  if (!isFinite(size) || size < 0) return '不明';
  if (size < 1024) return size + ' B';
  if (size < 1024 * 1024) return (size / 1024).toFixed(1) + ' KB';
  if (size < 1024 * 1024 * 1024) return (size / (1024 * 1024)).toFixed(1) + ' MB';
  return (size / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
}

function formatDateTime(value) {
  if (!value) return '不明';
  var date = new Date(value);
  if (isNaN(date.getTime())) return String(value);
  return date.toLocaleString('ja-JP');
}

/**
 * ホームボタン押下時: homeImageId のシーンへ遷移する

function goHome() {

/**
 * 現在の画質モードに応じたGoogleusercontent URLサフィックスを返す。
 * @returns {string} '=w4096' または '=s0'
 */
function getQualitySuffix() {
  return imageQualityMode === 'high' ? '=s0' : '=w4096';
}

function getDirectImageUrl(imgData) {
  if (imgData && imgData.imageUrl) {
    return String(imgData.imageUrl).replace(/=(s0|w\d+)$/, getQualitySuffix());
  }
  return 'https://lh3.googleusercontent.com/d/' + imgData.id + getQualitySuffix();
}

function scenePerformanceNow_() {
  return window.performance && typeof window.performance.now === 'function'
    ? window.performance.now()
    : Date.now();
}

function createScenePerformanceRecord(generation, sceneType, sceneStartedAt) {
  if (!scenePerformanceEnabled) return null;
  if (activeScenePerformanceRecord && !activeScenePerformanceRecord.finished) {
    finishScenePerformanceRecord(activeScenePerformanceRecord, 'superseded');
  }
  var startedAt = Number(sceneStartedAt);
  if (!isFinite(startedAt)) startedAt = scenePerformanceNow_();
  var record = {
    generation: Number(generation) || 0,
    delivery: deliveryMode,
    type: sceneType === '2D' ? '2D' : '360',
    status: 'loading',
    marks: { sceneStart: startedAt }
  };
  scenePerformanceRecords.push(record);
  if (scenePerformanceRecords.length > 20) scenePerformanceRecords.shift();
  activeScenePerformanceRecord = record;
  return record;
}

function markScenePerformanceRecord(record, name) {
  if (!record || record.finished || !name) return;
  if (Object.prototype.hasOwnProperty.call(record.marks, name)) return;
  record.marks[name] = scenePerformanceNow_();
}

function markScenePerformanceRecordAt(record, name, timestamp) {
  if (!record || record.finished || !name) return;
  if (Object.prototype.hasOwnProperty.call(record.marks, name)) return;
  record.marks[name] = Number(timestamp);
}

function createAutoFallbackController(shouldHandle, performanceRecord, onFallback, sceneStartedAt) {
  var canHandle = typeof shouldHandle === 'function' ? shouldHandle : function () { return true; };
  var startedAt = Number(sceneStartedAt);
  if (!isFinite(startedAt)) {
    startedAt = performanceRecord && performanceRecord.marks
      ? Number(performanceRecord.marks.sceneStart)
      : NaN;
  }
  if (!isFinite(startedAt)) startedAt = scenePerformanceNow_();
  var deadlineAt = startedAt + DIRECT_FALLBACK_TIMEOUT_MS;
  var timer = null;
  var fallbackStarted = false;
  var directDisplaySucceeded = false;

  markScenePerformanceRecordAt(performanceRecord, 'autoFallbackDeadline', deadlineAt);

  function clearTimer() {
    if (timer !== null) {
      clearTimeout(timer);
      timer = null;
    }
  }

  function startFallback(reason) {
    if (!canHandle() || fallbackStarted || directDisplaySucceeded) return false;
    fallbackStarted = true;
    clearTimer();
    markScenePerformanceRecord(performanceRecord, 'autoFallbackStart');
    if (typeof onFallback === 'function') onFallback(reason || 'deadline');
    return true;
  }

  timer = setTimeout(function () {
    timer = null;
    startFallback('deadline');
  }, Math.max(1, deadlineAt - scenePerformanceNow_()));

  return {
    cancel: clearTimer,
    getRemainingMs: function () {
      return Math.max(1, deadlineAt - scenePerformanceNow_());
    },
    hasFallbackStarted: function () {
      return fallbackStarted;
    },
    hasDirectDisplaySucceeded: function () {
      return directDisplaySucceeded;
    },
    markDirectDisplayStart: function () {
      if (!canHandle() || fallbackStarted) return false;
      markScenePerformanceRecord(performanceRecord, 'directDisplayStart');
      return true;
    },
    markDirectDisplaySucceeded: function () {
      if (!canHandle() || fallbackStarted) return false;
      directDisplaySucceeded = true;
      clearTimer();
      return true;
    },
    startFallback: startFallback
  };
}

function finishScenePerformanceRecord(record, status) {
  if (!record || record.finished) return;
  var finishedAt = scenePerformanceNow_();
  record.finished = true;
  record.status = String(status || 'loaded');
  record.marks.total = finishedAt;
  record.duration = finishedAt - record.marks.sceneStart;
  if (activeScenePerformanceRecord === record) activeScenePerformanceRecord = null;
  var relativeMarks = {};
  Object.keys(record.marks).forEach(function (name) {
    relativeMarks[name] = record.marks[name] - record.marks.sceneStart;
  });
  console.info('[scene-perf]', {
    generation: record.generation,
    delivery: record.delivery,
    type: record.type,
    status: record.status,
    duration: record.duration,
    marks: relativeMarks
  });
}

function preloadSceneImage(imageUrl, shouldHandle, performanceRecord, timeoutMs) {
  markScenePerformanceRecord(performanceRecord, 'imagePreparationStart');
  return new Promise(function (resolve) {
    var image = new Image();
    var settled = false;
    var timer = null;
    var canHandle = typeof shouldHandle === 'function' ? shouldHandle : function () { return true; };

    function finish(status) {
      if (settled) return;
      settled = true;
      if (timer) clearTimeout(timer);
      image.onload = null;
      image.onerror = null;
      if (!canHandle()) return;
      if (status === 'loaded') {
        markScenePerformanceRecord(performanceRecord, 'imagePreloadComplete');
      } else {
        markScenePerformanceRecord(performanceRecord, 'imagePreloadFailure');
      }
      resolve({ status: status, image: image });
    }

    image.onload = function () { finish('loaded'); };
    image.onerror = function () { finish('failed'); };
    image.crossOrigin = 'anonymous';
    image.src = imageUrl;
    timer = setTimeout(function () { finish('timeout'); }, Math.max(1, Number(timeoutMs) || DIRECT_IMAGE_PRELOAD_TIMEOUT_MS));
  });
}

function startBase64ImagePreparation(fileId, shouldHandle, performanceRecord) {
  markScenePerformanceRecord(performanceRecord, 'imagePreparationStart');
  return new Promise(function (resolve) {
    var canHandle = typeof shouldHandle === 'function' ? shouldHandle : function () { return true; };
    loadBase64ImageForScene(fileId, function (imageUrl) {
      if (!canHandle()) return;
      markScenePerformanceRecord(performanceRecord, 'imagePreparationComplete');
      resolve({ status: 'loaded', imageUrl: imageUrl });
    }, function (message) {
      if (!canHandle()) return;
      markScenePerformanceRecord(performanceRecord, 'imagePreparationFailure');
      resolve({ status: 'failed', message: message || '' });
    });
  });
}

function startHotspotPreparation(fileId, northFileId, shouldHandle, performanceRecord) {
  markScenePerformanceRecord(performanceRecord, 'hotspotsStart');
  return new Promise(function (resolve) {
    var canHandle = typeof shouldHandle === 'function' ? shouldHandle : function () { return true; };
    loadHotspotsCached(fileId, function (result) {
      if (!canHandle()) return;
      markScenePerformanceRecord(performanceRecord, 'hotspotsEnd');
      resolve({
        status: 'loaded',
        hotspots: result.hotspots || [],
        northOffset: result && typeof result.northOffset === 'number' ? result.northOffset : null
      });
    }, function () {
      if (!canHandle()) return;
      markScenePerformanceRecord(performanceRecord, 'hotspotsEnd');
      resolve({ status: 'failed', hotspots: [], northOffset: null });
    }, northFileId, shouldHandle);
  });
}

function fallbackToBase64(fileId, onSuccess, onFailure) {
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.success && res.imageUrl) {
        onSuccess(res.imageUrl);
      } else {
        onFailure((res && res.error) || 'Base64画像を取得できませんでした。');
      }
    })
    .withFailureHandler(function () {
      onFailure('Base64画像の取得中に通信エラーが発生しました。');
    })
    .getImageDataUri(fileId, 'public');
}

function loadBase64ImageForScene(fileId, onSuccess, onFailure) {
  fallbackToBase64(fileId, onSuccess, onFailure);
}

function getHotspotCacheKey(fileId) {
  return String(fileId || '');
}

function cloneHotspotResult(result) {
  try {
    return JSON.parse(JSON.stringify(result || { hotspots: [], northOffset: null }));
  } catch (e) {
    return { hotspots: [], northOffset: null };
  }
}

function normalizeHotspotResult(res) {
  return {
    hotspots: (res && res.hotspots) ? res.hotspots : (Array.isArray(res) ? res : []),
    northOffset: (res && typeof res.northOffset === 'number') ? res.northOffset : null
  };
}

function clearHotspotCache(fileId) {
  if (typeof fileId === 'undefined') {
    hotspotCacheByFileId = {};
    return;
  }
  delete hotspotCacheByFileId[getHotspotCacheKey(fileId)];
}

function loadHotspotsCached(fileId, onSuccess, onFailure, northFileId, shouldHandle) {
  var hotspotFileId = String(fileId || '');
  northFileId = String(northFileId || hotspotFileId);
  var canHandle = typeof shouldHandle === 'function' ? shouldHandle : function () { return true; };
  var cacheKey = getHotspotCacheKey(northFileId || hotspotFileId);
  var useCache = isPublicViewingMode() && !isEditMode;
  if (useCache && hotspotCacheByFileId[cacheKey]) {
    setTimeout(function () {
      if (!canHandle()) return;
      onSuccess(cloneHotspotResult(hotspotCacheByFileId[cacheKey]));
    }, 0);
    return;
  }

  var request = northFileId && northFileId !== hotspotFileId
    ? { fileId: northFileId, hotspotFileId: hotspotFileId }
    : hotspotFileId;

  google.script.run
    .withSuccessHandler(function (res) {
      if (!canHandle()) return;
      var normalized = normalizeHotspotResult(res);
      if (useCache) hotspotCacheByFileId[cacheKey] = cloneHotspotResult(normalized);
      onSuccess(cloneHotspotResult(normalized));
    })
    .withFailureHandler(function () {
      if (!canHandle()) return;
      if (typeof onFailure === 'function') onFailure();
    })
    .loadHotspots(request);
}

/**
 * ホットスポットのジャンプ先シーン画像を先読み（プリロード）してブラウザキャッシュに乗せる。
 * @param {Array} hotspots ホットスポット配列
 */
function preloadJumpScenes(hotspots) {
  if (!Array.isArray(hotspots)) return;
  hotspots.forEach(function (hs) {
    var sceneId = hs.jumpSceneId;
    if (!sceneId || preloadedScenes.has(sceneId)) return;
    preloadedScenes.add(sceneId);
    var url = 'https://lh3.googleusercontent.com/d/' + sceneId + getQualitySuffix();
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = url;
  });
}

/**
 * 指定した画像シーンを読み込む。
 * viewer を破棄して再生成し、その画像専用のホットスポットを取得する。
 *
 * @param {{ id:string, name:string, imageUrl:string }} imgData
 * @param {number=} preferredYaw
 * @param {number=} preferredPitch

    loadGeneration,

  closeSceneContextMenu();

  if (viewer) {
    clearInterval(loadPollInterval);
    try { viewer.destroy(); } catch (e) { /* ignore */ }

  }

      isCurrentLoad,
      performanceRecord,
      beginBase64Fallback,
      sceneStartedAt

  var directImagePreparation = null;
  var base64Preparation = null;

  } else {

      directImageUrl,
      isCurrentLoad,
      performanceRecord,

        preparedImage.status === 'timeout'

    var ov = document.getElementById('scene-transition-overlay');
    if (ov) ov.classList.remove('active');
  }

  function finishSceneDisplay() {

    clearTimeout(sceneLoadTimer);

    }

    if (sceneIs2D) {
      show2DView(imageUrl, handleDisplayError, function () {
        if (!isCurrentImageAttempt()) return;
        render2DHotspots(spots);
        document.getElementById('loading').classList.add('hidden');
        setSceneDisplayReady(true);
        clearSceneTransitionOverlay();
        handleDisplayLoaded();

    } else {
      hide2DView();

          spots,
          normalizedNorthOffset,
          initialYaw,
          initialPitch,
          handleDisplayError,
          handleDisplayLoaded,
          isCurrentImageAttempt
        );
        if (!reused) handleDisplayError();
      } else {
        markScenePerformanceRecord(performanceRecord, 'pannellumCreateStart');
        pannellumSession = initViewer(
          imageUrl,
          spots,
          normalizedNorthOffset,
          initialYaw,
          initialPitch,
          handleDisplayError,
          handleDisplayLoaded,
          isCurrentImageAttempt
        );
      }
    }
  }

  function getInitialView(spots) {
    var initialYaw = null;
    var initialPitch = null;
    if (typeof preferredYaw === 'number' && isFinite(preferredYaw)) {
      initialYaw = preferredYaw;
    }
    if (typeof preferredPitch === 'number' && isFinite(preferredPitch)) {
      initialPitch = preferredPitch;
    }

      if (prepared[1].status !== 'loaded') {

  Promise.all([hotspotPreparation, directImagePreparation]).then(function (prepared) {

/**
 * Pannellumビューアを初期化し、ホットスポットを展開する
 *
 * @param {string} imageUrl  パノラマ画像URL
 * @param {Array}  spots     ホットスポット配列
 */
function createPannellumViewerConfig(imageUrl, spots, northOffset, initialYaw, initialPitch) {
  // Pannellum用にホットスポット設定を変換
  var pannellumSpots = (spots || []).map(function (hs, i) {
    var pid = 'hs_' + i;
    hs._pannellumId = pid;
    return {
      id: pid,
      pitch: hs.pitch,
      yaw:   hs.yaw,
      type:  'custom',
      cssClass: 'hs-marker',
      createTooltipFunc: buildMarkerElement,
      createTooltipArgs: hs,
      clickHandlerFunc:  onMarkerClick,
      clickHandlerArgs:  hs
    };
  });

  var viewerConfig = {
    type:           'equirectangular',
    panorama:        imageUrl,
    crossOrigin:    'anonymous',
    autoLoad:        true,
    autoRotate:     -1.5,
    showControls:    false,
    hotSpots:        pannellumSpots
  };

  // 振り返り視点: 前シーンのホットスポット方向の真反対を初期yawとして設定
  if (typeof initialYaw === 'number' && isFinite(initialYaw)) {
    viewerConfig.yaw = initialYaw;
  }
  if (typeof initialPitch === 'number' && isFinite(initialPitch)) {
    viewerConfig.pitch = initialPitch;
  }

  // 有効な方位情報があればコンパスを有効化する
  if (typeof northOffset === 'number' && isFinite(northOffset)) {
    viewerConfig.compass = true;
    viewerConfig.northOffset = northOffset;
  }

  return viewerConfig;
}

function initViewer(imageUrl, spots, northOffset, initialYaw, initialPitch, onLoadError, onLoaded, shouldHandle) {
  // Pannellum 2.5.6はloadScene時にトップレベル設定をscene設定へ上書きする。
  // 初回からtour形式にして、fallback先のpanoramaが初回URLで上書きされないようにする。
  var initialSceneKey = '__delivery_initial';
  var initialSceneConfig = createPannellumViewerConfig(imageUrl, spots, northOffset, initialYaw, initialPitch);
  var viewerConfig = {
    default: { firstScene: initialSceneKey },
    scenes: {}
  };
  viewerConfig.scenes[initialSceneKey] = initialSceneConfig;

  var viewerInstance = pannellum.viewer('panorama', viewerConfig);
  viewer = viewerInstance;
  var localPollInterval = null;
  var loadErrorTimer = null;
  var watcherTimeout = null;
  var loadHandled = false;
  var activeOnLoadError = onLoadError;
  var activeOnLoaded = onLoaded;
  var canHandle = typeof shouldHandle === 'function' ? shouldHandle : function () { return true; };

  var attemptNumber = 0;

  function clearViewerLoadWatchers() {
    if (localPollInterval) clearInterval(localPollInterval);
    if (loadPollInterval === localPollInterval) loadPollInterval = null;
    if (loadErrorTimer) clearTimeout(loadErrorTimer);
    if (watcherTimeout) clearTimeout(watcherTimeout);
    localPollInterval = null;
    loadErrorTimer = null;
    watcherTimeout = null;

  /** Pannellum 2.5.6が読込中に無視したloadSceneを、現在のload/error後に再試行する。 */

    if (!pendingSceneSwitch) return false;
    var pending = pendingSceneSwitch;
    if (typeof pending.shouldHandle === 'function' && !pending.shouldHandle()) {
      pendingSceneSwitch = null;
      loadHandled = true;
      clearViewerLoadWatchers();
      return true;
    }
    try {
      viewerInstance.loadScene(pending.sceneKey, pending.pitch, pending.yaw);
      if (typeof viewerInstance.getScene === 'function' && viewerInstance.getScene() === pending.sceneKey) {
        pendingSceneSwitch = null;
      }
    } catch (error) {
      pendingSceneSwitch = null;
      loadHandled = true;
      clearViewerLoadWatchers();
      if (typeof activeOnLoadError === 'function') activeOnLoadError();

  }

  function onPanoramaLoaded() {
    if (loadHandled) return;
    if (tryPendingSceneSwitch()) return;
    if (expectedSceneId && typeof viewerInstance.getScene === 'function' && viewerInstance.getScene() !== expectedSceneId) return;
    if (!canHandle()) {
      loadHandled = true;
      clearViewerLoadWatchers();
      return;
    }
    loadHandled = true;
    clearViewerLoadWatchers();
    document.getElementById('loading').classList.add('hidden');
    setSceneDisplayReady(true);
    // 暗転オーバーレイを解除（フェードイン）
    var ov = document.getElementById('scene-transition-overlay');
    if (ov) ov.classList.remove('active');

  function onPanoramaFailed() {
    if (loadHandled) return;
    if (tryPendingSceneSwitch()) return;
    if (expectedSceneId && typeof viewerInstance.getScene === 'function' && viewerInstance.getScene() !== expectedSceneId) return;
    if (!canHandle()) {
      loadHandled = true;
      clearViewerLoadWatchers();
      return;
    }
    loadHandled = true;
    clearViewerLoadWatchers();
    var ov = document.getElementById('scene-transition-overlay');
    if (ov) ov.classList.remove('active');
    if (typeof activeOnLoadError === 'function') {
      activeOnLoadError();

      showLoadError('パノラマ画像の読み込みに失敗しました。');
    }

  viewerInstance.on('load', onPanoramaLoaded);
  viewerInstance.on('error', onPanoramaFailed);

        return;

    viewer: viewerInstance,
    loadImage: function (nextImageUrl, nextSpots, nextNorthOffset, nextYaw, nextPitch, nextOnLoadError, nextOnLoaded, nextShouldHandle) {
      if (typeof viewerInstance.addScene !== 'function' || typeof viewerInstance.loadScene !== 'function') return false;
      var sceneKey = '__delivery_' + (attemptNumber + 1);
      var config = createPannellumViewerConfig(nextImageUrl, nextSpots, nextNorthOffset, nextYaw, nextPitch);
      armViewerAttempt(nextOnLoadError, nextOnLoaded, nextShouldHandle, sceneKey);
      try {
        viewerInstance.addScene(sceneKey, config);
        pendingSceneSwitch = {
          sceneKey: sceneKey,
          pitch: nextPitch,
          yaw: nextYaw,
          shouldHandle: nextShouldHandle
        };
        viewerInstance.loadScene(sceneKey, nextPitch, nextYaw);
        if (typeof viewerInstance.getScene === 'function' && viewerInstance.getScene() === sceneKey) {
          pendingSceneSwitch = null;
        }
        return true;
      } catch (error) {
        pendingSceneSwitch = null;
        loadHandled = true;
        clearViewerLoadWatchers();
        return false;
      }
    },
    destroy: function () {
      pendingSceneSwitch = null;
      clearViewerLoadWatchers();
      try { viewerInstance.destroy(); } catch (error) { /* ignore */ }
    }
  };

  armViewerAttempt(onLoadError, onLoaded, shouldHandle, initialSceneKey);
  return session;
}

//  画質切り替えトグル
// =============================================

/**
 * 画質トグルボタンの表示を現在の imageQualityMode に合わせて更新する。
 */
function updateQualityToggleBtn() {
  var btn = document.getElementById('quality-toggle-btn');
  var lbl = document.getElementById('quality-toggle-label');
  if (!btn || !lbl) return;
  if (imageQualityMode === 'high') {
    btn.classList.remove('mode-fast');
    btn.classList.add('mode-high');
    lbl.textContent = '高画質';
  } else {
    btn.classList.remove('mode-high');
    btn.classList.add('mode-fast');
    lbl.textContent = '速度優先';
  }
}

/**
 * 画質モードをトグルし、現在の視点を保持したまま現在シーンを再ロードする。
 */
function toggleQuality() {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('toggle-quality')) return false;
  if (!currentFileId || isSwitching) return;
  stopGyroIfActive('quality');

  // 現在の視点を退避
  var savedPitch = (viewer && typeof viewer.getPitch === 'function') ? viewer.getPitch() : null;
  var savedYaw   = (viewer && typeof viewer.getYaw   === 'function') ? viewer.getYaw()   : null;

  // モード反転
  imageQualityMode = imageQualityMode === 'high' ? 'fast' : 'high';
  updateQualityToggleBtn();

  // プリロードキャッシュをクリア（品質変更後は古いキャッシュ不要）
  preloadedScenes.clear();

  // 現在表示中のシーン画像データを取得して再ロード
  var imgData = getSceneImageById(currentFileId);
  if (!imgData) return;

  var newImgData = Object.assign({}, imgData);
  previousSceneId = null; // 画質切り替え時は振り返り視点ではなく退避した視点を使う
  loadScene(newImgData, savedYaw, savedPitch);
}

// =============================================
//  ジャイロ（DeviceOrientation）トグル
// =============================================

/**
 * ジャイロボタンの表示状態を isGyroActive に合わせて更新する。
 */
function updateGyroBtn() {
  var btn = document.getElementById('gyro-toggle-btn');
  if (!btn) return;
  btn.classList.toggle('gyro-active', isGyroActive);
  btn.title = isGyroActive ? 'ジャイロOFF' : 'ジャイロON';
  btn.setAttribute('aria-pressed', isGyroActive ? 'true' : 'false');
}

function stopGyroIfActive(reason) {
  if (!isGyroActive) return;
  if (viewer) {
    try { viewer.stopOrientation(); } catch (e) { /* ignore */ }
  }
  isGyroActive = false;
  updateGyroBtn();
}

/**
 * ジャイロ操作をON/OFFする。
 * iOS 13+ では DeviceOrientationEvent.requestPermission() を呼び出して
 * ユーザーの許可を得てから startOrientation() を実行する。
 */
function toggleGyro() {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('toggle-gyro')) return false;
  if (isGyroActive) {
    // ---- OFF ----
    stopGyroIfActive('toggle');
    return;
  }

  // ---- ON ----
  function startGyro() {
    if (!viewer) return;
    try {
      viewer.startOrientation();
      isGyroActive = true;
      updateGyroBtn();
    } catch (e) {
      showToast('ジャイロの起動に失敗しました', 'error');
    }
  }

  // iOS 13+ Safari: requestPermission が必要
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(function (permission) {
        if (permission === 'granted') {
          startGyro();
        } else {
          showToast('ジャイロの許可が得られませんでした', 'error');
        }
      })
      .catch(function () {
        showToast('ジャイロの許可リクエストに失敗しました', 'error');
      });
  } else {
    // Android / デスクトップ等: 許可不要でそのまま開始
    startGyro();
  }
}

// =============================================
//  サイドバー折りたたみ / 展開
// =============================================

/**
 * サイドバーの折りたたみ状態をトグルする（フォルダモード専用）
 */
function toggleSidebar() {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('toggle-sidebar')) return false;
  if (!allImages) return;

  var sidebar   = document.getElementById('scene-sidebar');
  var expandTab = document.getElementById('sidebar-expand-tab');
  var panorama  = document.getElementById('panorama');

  sidebarCollapsed = !sidebarCollapsed;

  var flatMap = document.getElementById('flat-map-container');
  if (sidebarCollapsed) {
    // 折りたたみ: panorama を先に広げてからサイドバーをスライドアウト
    panorama.classList.remove('with-sidebar');
    flatMap.classList.remove('with-sidebar');
    sidebar.classList.add('collapsed');
    expandTab.classList.remove('hidden');
    // Pannellumのリサイズ通知（アニメーション完了後）
    setTimeout(function () {
      window.dispatchEvent(new Event('resize'));
    }, 320);
  } else {
    // 展開: サイドバーをスライドインしてから panorama を縮める
    sidebar.classList.remove('collapsed');
    expandTab.classList.add('hidden');
    setTimeout(function () {
      panorama.classList.add('with-sidebar');
      flatMap.classList.add('with-sidebar');
      window.dispatchEvent(new Event('resize'));
    }, 280);
  }
}

// =============================================
//  全画面表示切り替え (確実なハイブリッド版)
// =============================================

var isCssFullscreen = false;
var fullscreenRequestGeneration = 0;
var fullscreenEntryPromise = null;
var editModeFullscreenExitPending = false;
var FULLSCREEN_REQUEST_SETTLE_TIMEOUT_MS = 1500;

function getNativeFullscreenElement_() {
  return document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement || null;
}

function isFullscreenActive_() {
  return !!(isCssFullscreen || getNativeFullscreenElement_());
}

/** native fullscreen要求を1件だけ追跡し、Promiseを返さない旧APIも状態変化まで待つ。 */
function beginFullscreenRequest_(requestFS, doc) {
  var requestGeneration = ++fullscreenRequestGeneration;
  var events = ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'];
  var settled = false;
  var timeoutId = null;
  var resolveTracker = null;
  var trackedPromise = new Promise(function (resolve) { resolveTracker = resolve; });
  fullscreenEntryPromise = trackedPromise;

  function cleanup() {
    if (timeoutId) clearTimeout(timeoutId);
    events.forEach(function (eventName) {
      document.removeEventListener(eventName, onFullscreenChange);
    });
  }

  function finish(success, allowFallback) {
    if (settled) return;
    settled = true;
    cleanup();
    if (fullscreenEntryPromise === trackedPromise) fullscreenEntryPromise = null;
    if (
      !success &&
      allowFallback &&
      requestGeneration === fullscreenRequestGeneration &&
      !isEditMode &&
      !editModeFullscreenExitPending &&
      sceneDisplayReady
    ) {
      openInNewTab_();
    }
    resolveTracker(!!success);
  }

  function onFullscreenChange() {
    if (getNativeFullscreenElement_()) finish(true, false);
  }

  events.forEach(function (eventName) {
    document.addEventListener(eventName, onFullscreenChange);
  });

  try {
    // Promiseを返す実装でも未解決のままになる場合があるため、常に上限を設ける。
    timeoutId = setTimeout(function () {
      var entered = !!getNativeFullscreenElement_();
      finish(entered, !entered);
    }, FULLSCREEN_REQUEST_SETTLE_TIMEOUT_MS);
    var requestResult = requestFS.call(doc);
    if (requestResult && typeof requestResult.then === 'function') {
      Promise.resolve(requestResult).then(function () {
        finish(true, false);
      }, function () {
        finish(false, true);
      });
    }
  } catch (error) {
    finish(false, true);
  }

  return trackedPromise;
}

function toggleFullscreen() {
  if (isEditMode || editModeFullscreenExitPending || !sceneDisplayReady || fullscreenEntryPromise) return false;
  stopGyroIfActive('fullscreen');
  // すでにCSS全画面状態（古いフォールバック）なら解除
  if (isCssFullscreen) {
    exitCssFullscreen_();
    return;
  }

  var doc = document.documentElement;
  var requestFS = doc.requestFullscreen || doc.webkitRequestFullscreen || doc.mozRequestFullScreen || doc.msRequestFullscreen;
  var isFS = getNativeFullscreenElement_();

  if (!isFS) {
    if (requestFS) {
      // 1. まずはネイティブ全画面を試み、連打や編集遷移と競合しないよう単一要求として追跡する
      beginFullscreenRequest_(requestFS, doc);
    } else {
      // API自体が存在しない古いブラウザ等でも別タブへ
      openInNewTab_();
    }
  } else {
    // 全画面解除
    var exitFS = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if (exitFS) {
      exitFS.call(document);
    }
  }
  return true;
}

// 別タブで開き直す処理
function openInNewTab_() {
  if (isEditMode || editModeFullscreenExitPending || !sceneDisplayReady) return false;
  var targetUrl = appBaseUrl || window.location.href;
  if (appMode && targetUrl.indexOf('mode=') === -1) {
    var separator = targetUrl.indexOf('?') !== -1 ? '&' : '?';
    targetUrl += separator + 'mode=' + appMode;
  }
  window.open(targetUrl, '_blank', 'noopener,noreferrer');
  return true;
}

function enterCssFullscreen_() {
  if (isEditMode || editModeFullscreenExitPending || !sceneDisplayReady) return false;
  isCssFullscreen = true;
  document.body.classList.add('is-fullscreen', 'css-fullscreen');
  updateFullscreenIcon_(true);
  return true;
}

function exitCssFullscreen_() {
  isCssFullscreen = false;
  document.body.classList.remove('is-fullscreen', 'css-fullscreen');
  updateFullscreenIcon_(false);
}

/** ネイティブ／CSS全画面を終了し、終了確認後に true を返す。 */
function exitFullscreenBeforeEdit_() {
  if (isCssFullscreen) exitCssFullscreen_();

  if (fullscreenEntryPromise) {
    return fullscreenEntryPromise.then(function () {
      return exitFullscreenBeforeEdit_();
    });
  }

  if (!getNativeFullscreenElement_()) return Promise.resolve(true);
  var exitFS = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
  if (!exitFS) return Promise.resolve(false);

  return new Promise(function (resolve) {
    var settled = false;
    var timeoutId = null;
    var events = ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'];

    function cleanup() {
      if (timeoutId) clearTimeout(timeoutId);
      events.forEach(function (eventName) {
        document.removeEventListener(eventName, onFullscreenChange);
      });
    }

    function finish(success) {
      if (settled) return;
      settled = true;
      cleanup();
      resolve(!!success);
    }

    function onFullscreenChange() {
      if (!getNativeFullscreenElement_()) finish(true);
    }

    events.forEach(function (eventName) {
      document.addEventListener(eventName, onFullscreenChange);
    });
    timeoutId = setTimeout(function () {
      finish(!getNativeFullscreenElement_());
    }, 1200);

    try {
      var result = exitFS.call(document);
      if (result && typeof result.then === 'function') {
        result.then(function () {
          finish(!getNativeFullscreenElement_());
        }, function () {
          finish(false);
        });
      } else if (!getNativeFullscreenElement_()) {
        finish(true);
      }
    } catch (error) {
      finish(false);
    }
  });
}

function updateFullscreenIcon_(isFullscreen) {
  var icon = document.getElementById('fullscreen-icon');
  var btn = document.getElementById('fullscreen-btn');
  if (isFullscreen) {
    icon.innerHTML =
      '<polyline points="4 14 10 14 10 20"/>' +
      '<polyline points="20 10 14 10 14 4"/>' +
      '<line x1="10" y1="14" x2="3" y2="21"/>' +
      '<line x1="21" y1="3" x2="14" y2="10"/>';
    btn.title = '全画面を終了';
    btn.setAttribute('aria-label', '全画面を終了');
  } else {
    icon.innerHTML =
      '<polyline points="15 3 21 3 21 9"/>' +
      '<polyline points="9 21 3 21 3 15"/>' +
      '<line x1="21" y1="3" x2="14" y2="10"/>' +
      '<line x1="3" y1="21" x2="10" y2="14"/>';
    btn.title = '全画面表示';
    btn.setAttribute('aria-label', '全画面表示');
  }
}

// 全画面状態変化でアイコンを切り替える
['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function(evtName) {
  document.addEventListener(evtName, function () {
    var isFullscreen = !!getNativeFullscreenElement_();
    if (isEditMode && isFullscreen) {
      exitFullscreenBeforeEdit_();
      return;
    }
    document.body.classList.toggle('is-fullscreen', isFullscreen);
    updateFullscreenIcon_(isFullscreen);
  });
});

function normalizeMarkerShape(value) {
  var normalized = String(value || '').trim().toLowerCase();
  return MARKER_SHAPE_LABELS[normalized] ? normalized : DEFAULT_MARKER_SHAPE;
}

function normalizeMarkerColor(value) {
  var normalized = String(value || '').trim().toLowerCase();
  return MARKER_COLOR_LABELS[normalized] ? normalized : DEFAULT_MARKER_COLOR;
}

function normalizeMarkerIcon(value) {
  var normalized = String(value || '').trim().toLowerCase();
  return SUPPORTED_MARKER_ICONS.indexOf(normalized) >= 0 ? normalized : DEFAULT_MARKER_ICON;
}

function normalizeSelectableMarkerIcon(value) {
  var normalized = normalizeMarkerIcon(value);
  return SELECTABLE_MARKER_ICONS.indexOf(normalized) >= 0 ? normalized : DEFAULT_MARKER_ICON;
}

function setMarkerIconSelectValue(icon, allowLegacy) {
  var iconInput = document.getElementById('marker-icon');
  var legacyGroup = document.getElementById('marker-icon-legacy-group');
  if (!iconInput) return DEFAULT_MARKER_ICON;

  if (legacyGroup) {
    while (legacyGroup.firstChild) legacyGroup.removeChild(legacyGroup.firstChild);
    legacyGroup.hidden = true;
  }

  var normalized = normalizeMarkerIcon(icon);
  if (allowLegacy && LEGACY_MARKER_ICONS.indexOf(normalized) >= 0 && legacyGroup) {
    var option = document.createElement('option');
    option.value = normalized;
    option.textContent = MARKER_ICON_LABELS[normalized] + '（旧アイコン）';
    legacyGroup.appendChild(option);
    legacyGroup.hidden = false;
    iconInput.value = normalized;
    return normalized;
  }

  normalized = normalizeSelectableMarkerIcon(normalized);
  iconInput.value = normalized;
  return normalized;
}

function removeMarkerClassesByPrefix(target, prefix) {
  if (!target || !target.classList) return;
  Array.from(target.classList).forEach(function (className) {
    if (className.indexOf(prefix) === 0) target.classList.remove(className);
  });
}

function createMarkerIconSvg(icon) {
  var normalizedIcon = normalizeMarkerIcon(icon);
  return '<svg class="marker-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' +
    MARKER_ICON_SVGS[normalizedIcon] + '</svg>';
}

function applyMarkerClasses(target, shape, color) {
  if (!target) return;
  var normalizedShape = normalizeMarkerShape(shape);
  var normalizedColor = normalizeMarkerColor(color);
  removeMarkerClassesByPrefix(target, 'marker-shape-');
  removeMarkerClassesByPrefix(target, 'marker-color-');
  target.classList.add('marker-shape-' + normalizedShape, 'marker-color-' + normalizedColor);
}

function applyMarkerIconClass(target, icon) {
  if (!target) return;
  var normalizedIcon = normalizeMarkerIcon(icon);
  removeMarkerClassesByPrefix(target, 'marker-icon-');
  target.classList.add('marker-icon-' + normalizedIcon);
  target.innerHTML = createMarkerIconSvg(normalizedIcon);
}

function renderMarkerAppearance(container, shape, color, icon) {
  if (!container) return null;
  container.textContent = '';
  applyMarkerClasses(container, shape, color);
  var core = document.createElement('span');
  core.className = 'hs-marker-core';
  applyMarkerIconClass(core, icon);
  container.appendChild(core);
  return core;
}

function createStandaloneMarkerElement(args) {
  var marker = document.createElement('div');
  marker.className = 'hs-marker';
  renderMarkerAppearance(
    marker,
    args && args.markerShape,
    args && args.markerColor,
    args && args.markerIcon
  );
  return marker;
}

function getHotspotDraftAppearance() {
  return {
    markerShape: normalizeMarkerShape(document.getElementById('marker-shape').value),
    markerColor: normalizeMarkerColor(document.getElementById('marker-color').value),
    markerIcon: normalizeMarkerIcon(document.getElementById('marker-icon').value)
  };
}

function buildHotspotDraftMarkerElement(container, args) {
  renderMarkerAppearance(container, args.markerShape, args.markerColor, args.markerIcon);
  container.classList.add('hs-marker-draft');
  container.style.pointerEvents = 'none';
  hotspotDraftState.draftElement = container;
}

function renderHotspotDraftAtCoordinates() {
  if (!hotspotDraftState.active || !hotspotDraftState.coordinates) return false;
  var coordinates = hotspotDraftState.coordinates;
  var appearance = getHotspotDraftAppearance();

  if (hotspotDraftState.mode2D) {
    var inner = document.getElementById('flat-map-inner');
    if (!inner) return false;
    var positioner = hotspotDraftState.draftElement && hotspotDraftState.draftElement.parentNode;
    if (!positioner || !positioner.classList || !positioner.classList.contains('flat-hs-draft')) {
      positioner = document.createElement('div');
      positioner.className = 'flat-hs-marker flat-hs-draft';
      positioner.style.pointerEvents = 'none';
      var marker = createStandaloneMarkerElement(appearance);
      marker.classList.add('hs-marker-draft');
      marker.style.pointerEvents = 'none';
      positioner.appendChild(marker);
      inner.appendChild(positioner);
      hotspotDraftState.draftElement = marker;
    }
    positioner.style.left = coordinates.yaw + '%';
    positioner.style.top = coordinates.pitch + '%';
    updateHotspotDraftAppearance();
    return true;
  }

  if (!viewer || typeof viewer.addHotSpot !== 'function') return false;
  if (hotspotDraftState.pannellumHotspotId && typeof viewer.removeHotSpot === 'function') {
    try { viewer.removeHotSpot(hotspotDraftState.pannellumHotspotId); } catch (e) { /* ignore */ }
  }
  hotspotDraftState.draftElement = null;
  try {
    viewer.addHotSpot({
      id: hotspotDraftState.pannellumHotspotId,
      pitch: coordinates.pitch,
      yaw: coordinates.yaw,
      type: 'custom',
      cssClass: 'hs-marker hs-marker-draft',
      createTooltipFunc: buildHotspotDraftMarkerElement,
      createTooltipArgs: appearance
    });
    return true;
  } catch (e) {
    return false;
  }
}

function updateHotspotDraftAppearance() {
  if (!hotspotDraftState.active || !hotspotDraftState.draftElement) return false;
  var appearance = getHotspotDraftAppearance();
  renderMarkerAppearance(
    hotspotDraftState.draftElement,
    appearance.markerShape,
    appearance.markerColor,
    appearance.markerIcon
  );
  hotspotDraftState.draftElement.classList.add('hs-marker-draft');
  hotspotDraftState.draftElement.style.pointerEvents = 'none';
  return true;
}

function startHotspotDraft(coordinates) {
  cleanupHotspotDraft();
  if (!coordinates || !isFinite(coordinates.pitch) || !isFinite(coordinates.yaw)) return false;
  hotspotDraftState.active = true;
  hotspotDraftState.startSceneId = String(currentFileId || '');
  hotspotDraftState.sceneType = is2DMode ? '2D' : '360';
  hotspotDraftState.coordinates = { pitch: Number(coordinates.pitch), yaw: Number(coordinates.yaw) };
  hotspotDraftState.initialCoordinates = { pitch: Number(coordinates.pitch), yaw: Number(coordinates.yaw) };
  hotspotDraftState.draftElement = null;
  hotspotDraftState.pannellumHotspotId = 'hs_draft_' + Date.now();
  hotspotDraftState.repositioning = false;
  hotspotDraftState.positionBeforeChange = null;
  hotspotDraftState.pointerPosition = null;
  hotspotDraftState.pointerDown = null;
  hotspotDraftState.rafId = null;
  hotspotDraftState.mode2D = !!is2DMode;
  hotspotDraftState.listenersAttached = false;
  pendingPitch = hotspotDraftState.coordinates.pitch;
  pendingYaw = hotspotDraftState.coordinates.yaw;
  return renderHotspotDraftAtCoordinates();
}

function setHotspotDraftCoordinates(coordinates) {
  if (!hotspotDraftState.active || !coordinates) return false;
  if (!isFinite(coordinates.pitch) || !isFinite(coordinates.yaw)) return false;
  hotspotDraftState.coordinates = {
    pitch: Number(coordinates.pitch),
    yaw: Number(coordinates.yaw)
  };
  pendingPitch = hotspotDraftState.coordinates.pitch;
  pendingYaw = hotspotDraftState.coordinates.yaw;
  return renderHotspotDraftAtCoordinates();
}

function getHotspotDraftCoordinatesFromPointer(evt) {
  if (!hotspotDraftState.active || !evt || !isFinite(evt.clientX) || !isFinite(evt.clientY)) return null;
  if (String(currentFileId || '') !== hotspotDraftState.startSceneId ||
      (is2DMode ? '2D' : '360') !== hotspotDraftState.sceneType) {
    handleUnexpectedHotspotSceneChange();
    return null;
  }
  if (hotspotDraftState.mode2D) {
    return get2DHotspotCoordinates(
      evt.clientX,
      evt.clientY,
      document.getElementById('flat-map-img')
    );
  }
  var panorama = document.getElementById('panorama');
  if (!panorama || !isPointInsideRect(evt.clientX, evt.clientY, panorama.getBoundingClientRect())) return null;
  if (shouldIgnorePanoramaPointer(evt)) return null;
  try {
    var converted = viewer.mouseEventToCoords(evt);
    var coordinates = { pitch: Number(converted[0]), yaw: Number(converted[1]) };
    return isFinite(coordinates.pitch) && isFinite(coordinates.yaw) ? coordinates : null;
  } catch (e) {
    return null;
  }
}

function renderHotspotDraftFromPointer() {
  if (!hotspotDraftState.active || !hotspotDraftState.repositioning || !hotspotDraftState.pointerPosition) return;
  var coordinates = getHotspotDraftCoordinatesFromPointer(hotspotDraftState.pointerPosition);
  if (coordinates) setHotspotDraftCoordinates(coordinates);
}

function scheduleHotspotDraftRender() {
  if (!hotspotDraftState.active || !hotspotDraftState.repositioning) return;
  if (hotspotDraftState.rafId !== null) return;
  hotspotDraftState.rafId = requestAnimationFrame(function () {
    hotspotDraftState.rafId = null;
    renderHotspotDraftFromPointer();
  });
}

function attachHotspotDraftListeners() {
  if (hotspotDraftState.listenersAttached) return;
  document.addEventListener('pointerdown', onHotspotDraftPointerDown, true);
  document.addEventListener('pointermove', onHotspotDraftPointerMove, { passive: true, capture: true });
  document.addEventListener('pointerup', onHotspotDraftPointerUp, true);
  document.addEventListener('pointercancel', onHotspotDraftPointerCancel, true);
  hotspotDraftState.listenersAttached = true;
}

function detachHotspotDraftListeners() {
  if (!hotspotDraftState.listenersAttached) return;
  document.removeEventListener('pointerdown', onHotspotDraftPointerDown, true);
  document.removeEventListener('pointermove', onHotspotDraftPointerMove, true);
  document.removeEventListener('pointerup', onHotspotDraftPointerUp, true);
  document.removeEventListener('pointercancel', onHotspotDraftPointerCancel, true);
  hotspotDraftState.listenersAttached = false;
}

function isHotspotDraftPointerDrag(start, evt) {
  if (!start || !evt) return false;
  var dx = evt.clientX - start.clientX;
  var dy = evt.clientY - start.clientY;
  return dx * dx + dy * dy > EDIT_MODE_DRAG_THRESHOLD_PX * EDIT_MODE_DRAG_THRESHOLD_PX;
}

function onHotspotDraftPointerDown(evt) {
  if (!hotspotDraftState.active || !hotspotDraftState.repositioning) return;
  if (evt.button != null && evt.button !== 0) return;
  var coordinates = getHotspotDraftCoordinatesFromPointer(evt);
  if (!coordinates) return;
  hotspotDraftState.pointerDown = {
    pointerId: evt.pointerId,
    clientX: evt.clientX,
    clientY: evt.clientY
  };
  hotspotDraftState.pointerPosition = { clientX: evt.clientX, clientY: evt.clientY };
  setHotspotDraftCoordinates(coordinates);
}

function onHotspotDraftPointerMove(evt) {
  if (!hotspotDraftState.active || !hotspotDraftState.repositioning) return;
  if (!isFinite(evt.clientX) || !isFinite(evt.clientY)) return;
  hotspotDraftState.pointerPosition = { clientX: evt.clientX, clientY: evt.clientY };
  scheduleHotspotDraftRender();
}

function onHotspotDraftPointerUp(evt) {
  if (!hotspotDraftState.active || !hotspotDraftState.repositioning) return;
  var start = hotspotDraftState.pointerDown;
  if (!start) return;
  if (start.pointerId != null && evt.pointerId != null && start.pointerId !== evt.pointerId) return;
  hotspotDraftState.pointerDown = null;
  var coordinates = getHotspotDraftCoordinatesFromPointer(evt);
  if (coordinates) setHotspotDraftCoordinates(coordinates);
  if (isHotspotDraftPointerDrag(start, evt)) {
    suppressHotspotMoveFollowupClick();
    return;
  }
  if (!coordinates) return;
  suppressHotspotMoveFollowupClick();
  finishHotspotDraftReposition();
}

function onHotspotDraftPointerCancel() {
  cancelHotspotDraftReposition();
}

function updateHotspotDraftPositionStatus(message) {
  var status = document.getElementById('hs-position-status');
  if (status) status.textContent = message || '';
}

function startHotspotDraftReposition() {
  if (!hotspotDraftState.active || editingHotspot) return false;
  if (hotspotDraftState.repositioning) return true;
  hotspotDraftState.positionBeforeChange = {
    pitch: hotspotDraftState.coordinates.pitch,
    yaw: hotspotDraftState.coordinates.yaw
  };
  hotspotDraftState.repositioning = true;
  hotspotDraftState.pointerDown = null;
  hotspotDraftState.pointerPosition = null;
  document.getElementById('hotspot-popup').classList.add('is-repositioning');
  document.getElementById('hs-change-position-btn').setAttribute('aria-pressed', 'true');
  updateHotspotDraftPositionStatus('画像上で位置を選んでください。ドラッグは視点移動、Escは元の位置へ戻します。');
  attachHotspotDraftListeners();
  return true;
}

function finishHotspotDraftReposition() {
  if (!hotspotDraftState.repositioning) return false;
  hotspotDraftState.repositioning = false;
  hotspotDraftState.positionBeforeChange = null;
  hotspotDraftState.pointerDown = null;
  hotspotDraftState.pointerPosition = null;
  detachHotspotDraftListeners();
  document.getElementById('hotspot-popup').classList.remove('is-repositioning');
  document.getElementById('hs-change-position-btn').setAttribute('aria-pressed', 'false');
  updateHotspotDraftPositionStatus('新しい位置を確定しました。');
  return true;
}

function cancelHotspotDraftReposition() {
  if (!hotspotDraftState.active || !hotspotDraftState.repositioning) return false;
  var previous = hotspotDraftState.positionBeforeChange;
  hotspotDraftState.repositioning = false;
  hotspotDraftState.positionBeforeChange = null;
  hotspotDraftState.pointerDown = null;
  hotspotDraftState.pointerPosition = null;
  if (hotspotDraftState.rafId !== null) {
    cancelAnimationFrame(hotspotDraftState.rafId);
    hotspotDraftState.rafId = null;
  }
  detachHotspotDraftListeners();
  if (previous) setHotspotDraftCoordinates(previous);
  document.getElementById('hotspot-popup').classList.remove('is-repositioning');
  document.getElementById('hs-change-position-btn').setAttribute('aria-pressed', 'false');
  updateHotspotDraftPositionStatus('位置の変更を取り消しました。');
  return true;
}

function cleanupHotspotDraft() {
  if (hotspotDraftState.rafId !== null) {
    cancelAnimationFrame(hotspotDraftState.rafId);
  }
  detachHotspotDraftListeners();
  if (hotspotDraftState.mode2D) {
    var positioner = hotspotDraftState.draftElement && hotspotDraftState.draftElement.parentNode;
    if (positioner && positioner.classList && positioner.classList.contains('flat-hs-draft')) {
      positioner.remove();
    }
  } else if (hotspotDraftState.pannellumHotspotId && viewer && typeof viewer.removeHotSpot === 'function') {
    try { viewer.removeHotSpot(hotspotDraftState.pannellumHotspotId); } catch (e) { /* ignore */ }
  }
  if (hotspotDraftState.draftElement && hotspotDraftState.draftElement.parentNode) {
    hotspotDraftState.draftElement.remove();
  }
  hotspotDraftState.active = false;
  hotspotDraftState.startSceneId = '';
  hotspotDraftState.sceneType = '';
  hotspotDraftState.coordinates = null;
  hotspotDraftState.initialCoordinates = null;
  hotspotDraftState.draftElement = null;
  hotspotDraftState.pannellumHotspotId = '';
  hotspotDraftState.repositioning = false;
  hotspotDraftState.positionBeforeChange = null;
  hotspotDraftState.pointerPosition = null;
  hotspotDraftState.pointerDown = null;
  hotspotDraftState.rafId = null;
  hotspotDraftState.mode2D = false;
  hotspotDraftState.listenersAttached = false;
  var popup = document.getElementById('hotspot-popup');
  if (popup) popup.classList.remove('is-repositioning');
  var changeButton = document.getElementById('hs-change-position-btn');
  if (changeButton) changeButton.setAttribute('aria-pressed', 'false');
  updateHotspotDraftPositionStatus('');
}

function completeHotspotDraftSave() {
  cleanupHotspotDraft();
}

function createHotspotMovePreviewElement(args) {
  var positioner = document.createElement('div');
  positioner.className = 'hs-move-preview-positioner ' + (is2DMode ? 'is-2d' : 'is-360');
  positioner.style.pointerEvents = 'none';
  var marker = createStandaloneMarkerElement(args);
  marker.classList.add('hs-marker-move-preview');
  positioner.appendChild(marker);
  return positioner;
}

function clampHotspotPercent(value) {
  var number = Number(value);
  if (!isFinite(number)) return 0;
  return Math.min(100, Math.max(0, number));
}

function get2DHotspotCoordinates(clientX, clientY, image) {
  if (!image) return null;
  var rect = typeof image.getBoundingClientRect === 'function'
    ? image.getBoundingClientRect()
    : image;
  if (!rect || !(rect.width > 0) || !(rect.height > 0)) return null;
  var right = typeof rect.right === 'number' ? rect.right : rect.left + rect.width;
  var bottom = typeof rect.bottom === 'number' ? rect.bottom : rect.top + rect.height;
  if (clientX < rect.left || clientX > right || clientY < rect.top || clientY > bottom) return null;
  var yaw = clampHotspotPercent(((clientX - rect.left) / rect.width) * 100);
  var pitch = clampHotspotPercent(((clientY - rect.top) / rect.height) * 100);
  return {
    pitch: parseFloat(pitch.toFixed(4)),
    yaw: parseFloat(yaw.toFixed(4))
  };
}

function buildHotspotMoveSaveData(target, coordinates, fileId, sceneType) {
  return {
    fileId: String(fileId || ''),
    sceneType: sceneType === '2D' ? '2D' : '360',
    label: target && target.label || '',
    description: target && target.description || '',
    linkUrl: target && target.linkUrl || '',
    markerShape: target && target.markerShape || '',
    markerColor: target && target.markerColor || '',
    markerIcon: target && target.markerIcon || '',
    pitch: coordinates.pitch,
    yaw: coordinates.yaw,
    photoId: target && target.photoId || '',
    jumpSceneId: target && target.jumpSceneId || ''
  };
}

function getHotspotMovePreviewParent() {
  if (hotspotMoveState.mode2D) return document.getElementById('flat-map-inner');
  return document.body;
}

function isPointInsideRect(clientX, clientY, rect) {
  if (!rect || !(rect.width > 0) || !(rect.height > 0)) return false;
  var right = typeof rect.right === 'number' ? rect.right : rect.left + rect.width;
  var bottom = typeof rect.bottom === 'number' ? rect.bottom : rect.top + rect.height;
  return clientX >= rect.left && clientX <= right && clientY >= rect.top && clientY <= bottom;
}

function isHotspotMovePointAllowed(evt) {
  if (!evt || !isFinite(evt.clientX) || !isFinite(evt.clientY)) return false;
  if (hotspotMoveState.mode2D) {
    return !!get2DHotspotCoordinates(
      evt.clientX,
      evt.clientY,
      document.getElementById('flat-map-img')
    );
  }
  var panorama = document.getElementById('panorama');
  if (!panorama || !isPointInsideRect(evt.clientX, evt.clientY, panorama.getBoundingClientRect())) return false;
  return !shouldIgnorePanoramaPointer(evt);
}

function renderHotspotMovePreview() {
  if (!hotspotMoveState.active || !hotspotMoveState.previewElement || !hotspotMoveState.pointerPosition) return;
  var preview = hotspotMoveState.previewElement;
  var point = hotspotMoveState.pointerPosition;
  if (hotspotMoveState.mode2D) {
    var image = document.getElementById('flat-map-img');
    var inner = document.getElementById('flat-map-inner');
    var coordinates = get2DHotspotCoordinates(point.clientX, point.clientY, image);
    if (!coordinates || !inner) {
      preview.style.display = 'none';
      return;
    }
    var innerRect = inner.getBoundingClientRect();
    preview.style.display = '';
    preview.style.left = (point.clientX - innerRect.left) + 'px';
    preview.style.top = (point.clientY - innerRect.top) + 'px';
    return;
  }

  var panorama = document.getElementById('panorama');
  if (!panorama || !isPointInsideRect(point.clientX, point.clientY, panorama.getBoundingClientRect())) {
    preview.style.display = 'none';
    return;
  }
  preview.style.display = '';
  preview.style.left = point.clientX + 'px';
  preview.style.top = point.clientY + 'px';
}

function updateHotspotMovePreview(evt) {
  if (!hotspotMoveState.active || hotspotMoveState.saving || !evt) return;
  if (!isFinite(evt.clientX) || !isFinite(evt.clientY)) return;
  hotspotMoveState.pointerPosition = { clientX: evt.clientX, clientY: evt.clientY };
  scheduleHotspotMovePreviewRender();
}

function scheduleHotspotMovePreviewRender() {
  if (!hotspotMoveState.active || !hotspotMoveState.previewElement) return;
  if (hotspotMoveState.rafId !== null) return;
  hotspotMoveState.rafId = requestAnimationFrame(function () {
    hotspotMoveState.rafId = null;
    renderHotspotMovePreview();
  });
}

function attachHotspotMoveListeners() {
  if (hotspotMoveState.listenersAttached) return;
  document.addEventListener('pointerdown', onHotspotMovePointerDown);
  document.addEventListener('pointermove', onHotspotMovePointerMove, { passive: true });
  document.addEventListener('pointerup', onHotspotMovePointerUp);
  document.addEventListener('pointercancel', onHotspotMovePointerCancel);
  window.addEventListener('resize', scheduleHotspotMovePreviewRender);
  window.addEventListener('scroll', scheduleHotspotMovePreviewRender, true);
  hotspotMoveState.listenersAttached = true;
}

function detachHotspotMoveListeners() {
  if (!hotspotMoveState.listenersAttached) return;
  document.removeEventListener('pointerdown', onHotspotMovePointerDown);
  document.removeEventListener('pointermove', onHotspotMovePointerMove);
  document.removeEventListener('pointerup', onHotspotMovePointerUp);
  document.removeEventListener('pointercancel', onHotspotMovePointerCancel);
  window.removeEventListener('resize', scheduleHotspotMovePreviewRender);
  window.removeEventListener('scroll', scheduleHotspotMovePreviewRender, true);
  hotspotMoveState.listenersAttached = false;
}

function cleanupHotspotMovePreview() {
  if (hotspotMoveState.rafId !== null) {
    cancelAnimationFrame(hotspotMoveState.rafId);
  }
  detachHotspotMoveListeners();
  if (hotspotMoveState.previewElement && hotspotMoveState.previewElement.parentNode) {
    hotspotMoveState.previewElement.parentNode.removeChild(hotspotMoveState.previewElement);
  }
  if (hotspotMoveState.sourceElement && hotspotMoveState.sourceElement.classList) {
    hotspotMoveState.sourceElement.classList.remove('hs-marker-moving-source');
  }
  hotspotMoveState.active = false;
  hotspotMoveState.target = null;
  hotspotMoveState.sourceElement = null;
  hotspotMoveState.previewElement = null;
  hotspotMoveState.pointerPosition = null;
  hotspotMoveState.rafId = null;
  hotspotMoveState.startSceneId = '';
  hotspotMoveState.saving = false;
  hotspotMoveState.pointerDown = null;
  hotspotMoveState.mode2D = false;
  hotspotMoveState.listenersAttached = false;
  isMovingHotspot = false;
  movingHotspotTarget = null;
}

function cancelHotspotMove(message, options) {
  if (!hotspotMoveState.active && !hotspotMoveState.previewElement) return false;
  var opts = options || {};
  if (hotspotMoveState.saving && !opts.allowDuringSave) {
    if (!opts.silent) showToast('移動を保存中です。完了までお待ちください。', 'error');
    return false;
  }
  hotspotMoveState.generation += 1;
  cleanupHotspotMovePreview();
  if (message && !opts.silent) showToast(message, opts.type || 'error');
  return true;
}

function startHotspotMovePreview(target, sourceElement) {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('move-other-hotspot')) return false;
  if (!canEdit || !isEditMode || !target) return false;
  if (hotspotMoveState.active && hotspotMoveState.saving) {
    showToast('別の移動を保存中です。完了までお待ちください。', 'error');
    return false;
  }
  if (hasPendingHotspotMutationForTarget(target.id)) {
    showToast('このホットスポットの更新を処理中です。完了までお待ちください。', 'error');
    return false;
  }
  if (hotspotMoveState.active) cancelHotspotMove('', { silent: true });

  hotspotMoveState.mode2D = !!is2DMode;
  var preview = createHotspotMovePreviewElement(target);
  var parent = getHotspotMovePreviewParent();
  if (!preview || !parent) {
    hotspotMoveState.mode2D = false;
    return false;
  }

  hotspotMoveState.generation += 1;
  hotspotMoveState.active = true;
  hotspotMoveState.target = target;
  hotspotMoveState.sourceElement = sourceElement || null;
  hotspotMoveState.previewElement = preview;
  hotspotMoveState.startSceneId = String(currentFileId || '');
  hotspotMoveState.saving = false;
  hotspotMoveState.pointerDown = null;
  isMovingHotspot = true;
  movingHotspotTarget = target;

  stopGyroIfActive('hotspot-move');
  if (sourceElement && sourceElement.classList) {
    sourceElement.classList.add('hs-marker-moving-source');
  }
  parent.appendChild(preview);

  if (sourceElement && typeof sourceElement.getBoundingClientRect === 'function') {
    var sourceRect = sourceElement.getBoundingClientRect();
    hotspotMoveState.pointerPosition = {
      clientX: sourceRect.left + (sourceRect.width || 0) / 2,
      clientY: sourceRect.top + (sourceRect.height || 0) / 2
    };
    renderHotspotMovePreview();
  }

  attachHotspotMoveListeners();
  showToast('移動先をクリックまたはタップしてください。(Escキーでキャンセル)', 'success');
  return true;
}

function isHotspotMovePointerDrag(start, evt) {
  if (!start || !evt) return false;
  var dx = evt.clientX - start.clientX;
  var dy = evt.clientY - start.clientY;
  return dx * dx + dy * dy > EDIT_MODE_DRAG_THRESHOLD_PX * EDIT_MODE_DRAG_THRESHOLD_PX;
}

function suppressHotspotMoveFollowupClick() {
  suppressNextPanoramaClick = true;
  setTimeout(function () {
    suppressNextPanoramaClick = false;
  }, 250);
}

function onHotspotMovePointerDown(evt) {
  if (!hotspotMoveState.active || hotspotMoveState.saving) return;
  if (evt.button != null && evt.button !== 0) return;
  if (!isHotspotMovePointAllowed(evt)) return;
  hotspotMoveState.pointerDown = {
    pointerId: evt.pointerId,
    clientX: evt.clientX,
    clientY: evt.clientY
  };
  updateHotspotMovePreview(evt);
}

function onHotspotMovePointerMove(evt) {
  if (!hotspotMoveState.active || hotspotMoveState.saving) return;
  updateHotspotMovePreview(evt);
}

function onHotspotMovePointerUp(evt) {
  if (!hotspotMoveState.active || hotspotMoveState.saving) return;
  updateHotspotMovePreview(evt);
  var start = hotspotMoveState.pointerDown;
  if (!start) return;
  if (start.pointerId != null && evt.pointerId != null && start.pointerId !== evt.pointerId) return;
  hotspotMoveState.pointerDown = null;
  if (isHotspotMovePointerDrag(start, evt)) {
    suppressHotspotMoveFollowupClick();
    return;
  }
  if (!isHotspotMovePointAllowed(evt)) return;
  suppressHotspotMoveFollowupClick();
  commitHotspotMove(evt);
}

function onHotspotMovePointerCancel() {
  cancelHotspotMove('移動をキャンセルしました。', { type: 'error' });
}

function isCurrentHotspotMoveRequest(generation, startSceneId, target) {
  return isPendingHotspotMoveRequest(generation, startSceneId, target) &&
    String(currentFileId || '') === startSceneId;
}

function isPendingHotspotMoveRequest(generation, startSceneId, target) {
  return hotspotMoveState.active &&
    hotspotMoveState.generation === generation &&
    hotspotMoveState.startSceneId === startSceneId &&
    hotspotMoveState.target === target;
}

function commitHotspotMove(evt) {
  if (!hotspotMoveState.active || hotspotMoveState.saving || !hotspotMoveState.target) return false;
  var target = hotspotMoveState.target;
  var startSceneId = hotspotMoveState.startSceneId;
  var generation = hotspotMoveState.generation;
  if (String(currentFileId || '') !== startSceneId) {
    cancelHotspotMove('シーンが変更されたため移動をキャンセルしました。', { type: 'error' });
    return false;
  }

  var coordinates = null;
  if (hotspotMoveState.mode2D) {
    coordinates = get2DHotspotCoordinates(
      evt.clientX,
      evt.clientY,
      document.getElementById('flat-map-img')
    );
    if (!coordinates) {
      showToast('画像の範囲内をクリックしてください。', 'error');
      return false;
    }
  } else {
    try {
      var converted = viewer.mouseEventToCoords(evt);
      coordinates = { pitch: Number(converted[0]), yaw: Number(converted[1]) };
    } catch (e) {
      showToast('座標の取得に失敗しました。再度クリックしてください。', 'error');
      return false;
    }
    if (!isFinite(coordinates.pitch) || !isFinite(coordinates.yaw)) {
      showToast('座標の取得に失敗しました。再度クリックしてください。', 'error');
      return false;
    }
  }

  var saveData = buildHotspotMoveSaveData(
    target,
    coordinates,
    startSceneId,
    hotspotMoveState.mode2D ? '2D' : '360'
  );
  hotspotMoveState.saving = true;
  hotspotMoveState.pointerDown = null;
  showToast('移動中...', 'success');

  google.script.run
    .withSuccessHandler(function (result) {
      if (!isPendingHotspotMoveRequest(generation, startSceneId, target)) {
        if (result && result.success) clearHotspotCache(startSceneId);
        return;
      }
      if (!isCurrentHotspotMoveRequest(generation, startSceneId, target)) {
        if (result && result.success) clearHotspotCache(startSceneId);
        cleanupHotspotMovePreview();
        return;
      }
      if (!result || !result.success) {
        cancelHotspotMove(
          '移動に失敗しました: ' + ((result && result.error) || '不明なエラー'),
          { type: 'error', allowDuringSave: true }
        );
        return;
      }

      clearHotspotCache(startSceneId);
