var isCssFullscreen = false;

function toggleFullscreen() {
  stopGyroIfActive('fullscreen');
  // すでにCSS全画面状態（古いフォールバック）なら解除
  if (isCssFullscreen) {
    exitCssFullscreen_();
    return;
  }

  var doc = document.documentElement;
  var requestFS = doc.requestFullscreen || doc.webkitRequestFullscreen || doc.mozRequestFullScreen || doc.msRequestFullscreen;
  var isFS = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;

  if (!isFS) {
    if (requestFS) {
      try {
        // 1. まずはネイティブ全画面を試みる
        var promise = requestFS.call(doc);
        if (promise && promise.catch) {
          promise.catch(function (err) {
            console.warn("Fullscreen API error:", err);
            // 2. ブロックされた場合は別タブで開き直す
            openInNewTab_();
          });
        }
      } catch (err) {
        console.warn("Fullscreen API try-catch error:", err);
        openInNewTab_();
      }
    } else {
      // API自体が存在しない古いブラウザ等でも別タブへ
      openInNewTab_();
    }
  } else {
    // 全画面解除
    var exitFS = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if (exitFS) {
      exitFS.call(document);
    }
  }
}

// 別タブで開き直す処理
function openInNewTab_() {
  var targetUrl = appBaseUrl || window.location.href;
  if (appMode && targetUrl.indexOf('mode=') === -1) {
    var separator = targetUrl.indexOf('?') !== -1 ? '&' : '?';
    targetUrl += separator + 'mode=' + appMode;
  }
  window.open(targetUrl, '_blank', 'noopener,noreferrer');
}

function enterCssFullscreen_() {
  isCssFullscreen = true;
  document.body.classList.add('is-fullscreen', 'css-fullscreen');
  updateFullscreenIcon_(true);
}

function exitCssFullscreen_() {
  isCssFullscreen = false;
  document.body.classList.remove('is-fullscreen', 'css-fullscreen');
  updateFullscreenIcon_(false);
}

function updateFullscreenIcon_(isFullscreen) {
  var icon = document.getElementById('fullscreen-icon');
  var btn = document.getElementById('fullscreen-btn');
  if (isFullscreen) {
    icon.innerHTML =
      '<polyline points="4 14 10 14 10 20"/>' +
      '<polyline points="20 10 14 10 14 4"/>' +
      '<line x1="10" y1="14" x2="3" y2="21"/>' +
      '<line x1="21" y1="3" x2="14" y2="10"/>';
    btn.title = '全画面を終了';
  } else {
    icon.innerHTML =
      '<polyline points="15 3 21 3 21 9"/>' +
      '<polyline points="9 21 3 21 3 15"/>' +
      '<line x1="21" y1="3" x2="14" y2="10"/>' +
      '<line x1="3" y1="21" x2="10" y2="14"/>';
    btn.title = '全画面表示';
  }
}

// 全画面状態変化でアイコンを切り替える
['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function(evtName) {
  document.addEventListener(evtName, function () {
    var isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
    document.body.classList.toggle('is-fullscreen', isFullscreen);
    updateFullscreenIcon_(isFullscreen);
  });
});

function normalizeMarkerShape(value) {
  var normalized = String(value || '').trim().toLowerCase();
  return MARKER_SHAPE_LABELS[normalized] ? normalized : DEFAULT_MARKER_SHAPE;
}

function normalizeMarkerColor(value) {
  var normalized = String(value || '').trim().toLowerCase();
  return MARKER_COLOR_LABELS[normalized] ? normalized : DEFAULT_MARKER_COLOR;
}

function normalizeMarkerIcon(value) {
  var normalized = String(value || '').trim().toLowerCase();
  return MARKER_ICON_LABELS[normalized] ? normalized : DEFAULT_MARKER_ICON;
}

function applyMarkerClasses(target, shape, color) {
  if (!target) return;
  var normalizedShape = normalizeMarkerShape(shape);
  var normalizedColor = normalizeMarkerColor(color);
  target.classList.remove('marker-shape-circle', 'marker-shape-square', 'marker-shape-diamond', 'marker-shape-star');
  target.classList.remove('marker-color-blue', 'marker-color-green', 'marker-color-orange', 'marker-color-purple', 'marker-color-white', 'marker-color-gray', 'marker-color-yellow', 'marker-color-red');
  target.classList.add('marker-shape-' + normalizedShape, 'marker-color-' + normalizedColor);
}

function applyMarkerIconClass(target, icon) {
  if (!target) return;
  var normalizedIcon = normalizeMarkerIcon(icon);
  target.classList.remove('marker-icon-info', 'marker-icon-photo', 'marker-icon-wifi', 'marker-icon-quiz');
  target.classList.add('marker-icon-' + normalizedIcon);
}

function updateMarkerStyleSummary(shape, color, icon) {
  var normalizedShape = normalizeMarkerShape(shape);
  var normalizedColor = normalizeMarkerColor(color);
  var normalizedIcon = normalizeMarkerIcon(icon);
  var preview = document.getElementById('marker-style-preview');
  var previewIcon = preview.querySelector('.hs-marker-core');
  var summary = document.getElementById('marker-style-summary-text');
  applyMarkerClasses(preview, normalizedShape, normalizedColor);
  applyMarkerIconClass(previewIcon, normalizedIcon);
  summary.textContent = MARKER_SHAPE_LABELS[normalizedShape] + '・' + MARKER_COLOR_LABELS[normalizedColor] + '・' + MARKER_ICON_LABELS[normalizedIcon];
}

function loadMarkerStylePreference() {
  try {
    lastMarkerShape = normalizeMarkerShape(window.localStorage.getItem('hsMarkerShape'));
    lastMarkerColor = normalizeMarkerColor(window.localStorage.getItem('hsMarkerColor'));
    lastMarkerIcon = normalizeMarkerIcon(window.localStorage.getItem('hsMarkerIcon'));
  } catch (e) {
    lastMarkerShape = DEFAULT_MARKER_SHAPE;
    lastMarkerColor = DEFAULT_MARKER_COLOR;
    lastMarkerIcon = DEFAULT_MARKER_ICON;
  }
}

function persistMarkerStylePreference(shape, color, icon) {
  var normalizedShape = normalizeMarkerShape(shape);
  var normalizedColor = normalizeMarkerColor(color);
  var normalizedIcon = normalizeMarkerIcon(icon);
  lastMarkerShape = normalizedShape;
  lastMarkerColor = normalizedColor;
  lastMarkerIcon = normalizedIcon;
  try {
    window.localStorage.setItem('hsMarkerShape', normalizedShape);
    window.localStorage.setItem('hsMarkerColor', normalizedColor);
    window.localStorage.setItem('hsMarkerIcon', normalizedIcon);
  } catch (e) {
    // localStorage が使えない環境でもメモリ上の既定値は維持する
  }
  updateMarkerStyleSummary(normalizedShape, normalizedColor, normalizedIcon);
}

function syncMarkerStyleInputsFromPreference() {
  var shapeInput = document.getElementById('marker-shape');
  var colorInput = document.getElementById('marker-color');
  var iconInput = document.getElementById('marker-icon');
  shapeInput.value = lastMarkerShape;
  colorInput.value = lastMarkerColor;
  iconInput.value = lastMarkerIcon;
  updateMarkerStyleSummary(lastMarkerShape, lastMarkerColor, lastMarkerIcon);
}

function syncMarkerStyleSummaryFromInputs() {
  var shapeInput = document.getElementById('marker-shape');
  var colorInput = document.getElementById('marker-color');
  var iconInput = document.getElementById('marker-icon');
  updateMarkerStyleSummary(shapeInput.value, colorInput.value, iconInput.value);
}

function repositionHotspotPopupWithinViewport() {
  var popup = document.getElementById('hotspot-popup');
  if (!popup.classList.contains('visible')) return;
  var left = parseFloat(popup.style.left || '0');
  var top = parseFloat(popup.style.top || '0');
  var maxLeft = Math.max(10, window.innerWidth - popup.offsetWidth - 10);
  var maxTop = Math.max(10, window.innerHeight - popup.offsetHeight - 10);
  popup.style.left = Math.min(Math.max(left, 10), maxLeft) + 'px';
  popup.style.top = Math.min(Math.max(top, 70), maxTop) + 'px';
}

function setMarkerStylePanelExpanded(isExpanded) {
  document.getElementById('marker-style-panel').classList.toggle('expanded', isExpanded);
  repositionHotspotPopupWithinViewport();
}

function toggleMarkerStylePanel() {
  var panel = document.getElementById('marker-style-panel');
  setMarkerStylePanelExpanded(!panel.classList.contains('expanded'));
}

/**
 * ポップアップの表示モードを切り替える
 * @param {string} mode  'type' | 'info' | 'jump'
 */
function setPopupMode(mode) {
  var inFolderMode = !!(allImages && allImages.length > 0);
  currentPopupMode = mode;
  var typeSelector = document.getElementById('hs-type-selector');
  var form         = document.getElementById('hs-form');
  var infoFields   = document.getElementById('hs-info-fields');
  var jumpFields   = document.getElementById('hs-jump-fields');
  var photoGroup   = document.getElementById('photo-select-group');
  var backBtn      = document.getElementById('hs-back-btn');

  if (mode === 'type') {
    typeSelector.style.display = '';
    form.style.display         = 'none';
    document.getElementById('popup-header-title').textContent = 'ホットスポットを追加';
  } else {
    typeSelector.style.display = 'none';
    form.style.display         = '';
    infoFields.style.display   = mode === 'info' ? '' : 'none';
    jumpFields.style.display   = mode === 'jump' ? '' : 'none';
    // 写真セレクトはフォルダモード×情報モードのみ
    if (photoGroup) photoGroup.style.display = (inFolderMode && mode === 'info') ? '' : 'none';
    // 戻るボタン: 新規追加×フォルダモードなら「← 戻る」、それ以外は「キャンセル」
    var canGoBack = !editingHotspot && inFolderMode;
    backBtn.textContent = canGoBack ? '← 戻る' : 'キャンセル';
    // タイトル・保存ボタンテキスト
    if (!editingHotspot) {
      document.getElementById('popup-header-title').textContent =
        mode === 'jump' ? 'ジャンプスポットを追加' : '情報スポットを追加';
      document.getElementById('save-label').textContent = '保存する';
    }
    setMarkerStylePanelExpanded(false);
    setTimeout(function () { document.getElementById('input-label').focus(); }, 60);
  }
  repositionHotspotPopupWithinViewport();
}

/**
 * quiz/info の説明欄を切り替える。
 * isQuiz=true → 質問・答えの2欄を表示、通常説明欄を非表示
 */
function setQuizDescMode(isQuiz) {
  document.getElementById('hs-desc-group').style.display      = isQuiz ? 'none' : '';
  document.getElementById('hs-quiz-desc-group').style.display = isQuiz ? '' : 'none';
}

/** タイプ選択ボタンクリック */
function selectHotspotType(type) {
  if (type === 'quiz') {
    setPopupMode('info');
    document.getElementById('marker-icon').value = 'quiz';
    syncMarkerStyleSummaryFromInputs();
    document.getElementById('quiz-input-question').value = '';
    document.getElementById('quiz-input-answer').value   = '';
    setQuizDescMode(true);
    document.getElementById('popup-header-title').textContent = 'クイズスポットを追加';
  } else {
    setPopupMode(type);
    setQuizDescMode(false);
  }
}

/** フォーム画面の「戻る / キャンセル」ボタン */
function onBackOrCancelClick() {
  var inFolderMode = !!(allImages && allImages.length > 0);
  if (!editingHotspot && inFolderMode) {
    setPopupMode('type');
  } else {
    closePopup();
  }
}

// =============================================
//  ホットスポットマーカー要素の生成
//  Pannellumの createTooltipFunc として呼ばれる
// =============================================
function buildMarkerElement(container, args) {
  var core = document.createElement('span');
  core.className = 'hs-marker-core';
  container.textContent = '';
  applyMarkerClasses(container, args && args.markerShape, args && args.markerColor);
  applyMarkerIconClass(core, args && args.markerIcon);
  container.appendChild(core);

  // 編集モード: 右クリックでコンテキストメニューを表示
  container.addEventListener('contextmenu', function (evt) {
    if (!canEdit || !isEditMode) return;
    evt.preventDefault();
    evt.stopPropagation();
    openHotspotContextMenu(evt, args);
  });

  // ホバーツールチップ
  if (args && args.jumpSceneId) {
    // ジャンプ先がある場合: ジャンプ先シーン名を表示
    container.addEventListener('mouseenter', function () {
      if (isEditMode) return;
      showJumpTooltip(container, args.jumpSceneId);
    });
    container.addEventListener('mouseleave', function () {
      hideJumpTooltip();
    });
  } else if (args && args.label) {
    // 通常ホットスポット: ラベルを表示
    container.addEventListener('mouseenter', function () {
      if (isEditMode) return;
      showLabelTooltip(container, args.label);
    });
    container.addEventListener('mouseleave', function () {
      hideJumpTooltip();
    });
  }
}

// =============================================
//  閲覧モード: マーカークリックで情報を表示
// =============================================
function onMarkerClick(evt, args) {
  if (isEditMode) return; // 編集モード中は無効

  // ジャンプ機能: jumpSceneId が設定されていればシーン移動
  if (args && args.jumpSceneId) {
    hideJumpTooltip();
    var target = getSceneImageById(args.jumpSceneId);
    if (target) {
      stopGyroIfActive('jump');
      previousSceneId = currentFileId; // 振り返り視点用: 移動前のシーンIDを記憶
      loadScene(target);
    } else {
      showToast('ジャンプ先のシーンが見つかりません。', 'error');
    }
    return;
  }

  // クイズモード: icon が 'quiz' の場合はフリップカードモーダルを表示
  if (args && args.markerIcon === 'quiz') {
    var quizOverlay = document.getElementById('quiz-modal-overlay');
    var quizCard    = document.getElementById('quiz-card');
    var parts       = (args.description || '').split('|');
    var question    = parts[0].trim() || '問題が設定されていません';
    var answer      = parts.length > 1 ? parts[1].trim() : '答えが設定されていません';
    var linkUrl     = normalizeHttpUrl(args.linkUrl);

    document.getElementById('quiz-card-title').textContent    = args.label || 'クイズ';
    document.getElementById('quiz-card-question').innerHTML = escapeHtml(question).replace(/\r?\n|\r/g, '<br>');
    document.getElementById('quiz-card-answer').innerHTML   = escapeHtml(answer).replace(/\r?\n|\r/g, '<br>');

    var linkEl = document.getElementById('quiz-card-link');
    if (linkUrl) {
      linkEl.href = linkUrl;
      linkEl.classList.remove('hidden');
    } else {
      linkEl.href = '#';
      linkEl.classList.add('hidden');
    }

    quizCard.classList.remove('is-flipped');
    quizOverlay.classList.remove('hidden');
    return;
  }

  // 情報表示モード: 既存のポップアップを閉じる
  var existing = document.getElementById('active-info-popup');
  if (existing) existing.remove();

  var popup = document.createElement('div');
  popup.id = 'active-info-popup';
  popup.className = 'info-popup';
  var useMobileInfoSheet = isPublicViewingMode() && isSmallViewport();
  if (useMobileInfoSheet) popup.classList.add('mobile-info-sheet');

  // 画面端からはみ出ないよう位置を補正
  if (!useMobileInfoSheet) {
    var x = Math.min(evt.clientX + 12, window.innerWidth  - 310);
    var y = Math.max(evt.clientY - 110, 68);
    y = Math.min(y, window.innerHeight - 180);
    popup.style.left = x + 'px';
    popup.style.top  = y + 'px';
  }

  var linkUrl = normalizeHttpUrl(args && args.linkUrl);
  var linkHtml = '';
  if (linkUrl) {
    linkHtml =
      '<div style="margin-top:10px">' +
      '  <a href="' + escapeHtml(linkUrl) + '" target="_blank" rel="noopener noreferrer" ' +
      '     style="font-size:13px;font-weight:600;color:#2563eb;text-decoration:underline">' +
      '    リンクを開く' +
      '  </a>' +
      '</div>';
  }

  // 写真プレースホルダー（写真IDがあれば後から差し替え）
  var photoHtml = '';
  if (args && args.photoId) {
    photoHtml = '<div class="info-popup-photo-placeholder" id="popup-photo-area">写真を読み込んでいます...</div>';
  }

  popup.innerHTML =
    '<div class="info-popup-header">' +
    '  <span class="info-popup-title">' + escapeHtml(args.label) + '</span>' +
    '  <button class="info-popup-close" onclick="document.getElementById(\'active-info-popup\').remove()">&times;</button>' +
    '</div>' +
    '<div class="info-popup-divider"></div>' +
    photoHtml +
    (args.description ? '<p class="info-popup-body">' + escapeHtml(args.description).replace(/\r?\n|\r/g, '<br>') + '</p>' : '') +
    linkHtml;

  document.getElementById('ui-overlay').appendChild(popup);

  // 写真の遅延ロード
  if (args && args.photoId) {
    renderPhotoInPopup(popup, args.photoId);
  }
}

/**
 * 情報ポップアップに写真を表示する（GASから取得、キャッシュあり）
 */
function renderPhotoInPopup(popup, photoId) {
  function showPhotoInArea(dataUri) {
    var area = popup.querySelector('#popup-photo-area');
    if (!area) return;
    var img = document.createElement('img');
    img.className = 'info-popup-photo';
    img.src = dataUri;
    img.alt = '';
    area.parentNode.replaceChild(img, area);
  }

  // キャッシュあり
  if (photoCache[photoId]) {
    showPhotoInArea(photoCache[photoId]);
    return;
  }

  google.script.run
    .withSuccessHandler(function (result) {
      var area = popup.querySelector('#popup-photo-area');
      if (!area) return; // popup が閉じられた場合
      if (result && result.success) {
        photoCache[photoId] = result.dataUri;
        showPhotoInArea(result.dataUri);
      } else {
        area.textContent = '写真を読み込めませんでした';
      }
    })
    .withFailureHandler(function () {
      var area = popup.querySelector('#popup-photo-area');
      if (area) area.textContent = '写真を読み込めませんでした';
    })
    .getHotspotPhotoDataUri(photoId);
}

/**
 * ラベルホバーツールチップを表示する（通常ホットスポット用）
 */
function showLabelTooltip(markerEl, label) {
  hideJumpTooltip();

/**

 */
function showJumpTooltip(markerEl, jumpSceneId) {

  document.getElementById('ui-overlay').appendChild(tip);

/**
 * ジャンプ先ホバーツールチップを非表示にする
 */
function hideJumpTooltip() {

    activeJumpTooltip.remove();

}

// =============================================
//  モード切り替え
// =============================================
function toggleMode() {
  if (!canEdit) {
    isEditMode = false;
    closePopup();
    closeSceneContextMenu();
    closeHotspotContextMenu();
    closeBulkInputDropdown();
    return;
  }

  isEditMode = !isEditMode;

  var topbar     = document.getElementById('topbar');
  var badge      = document.getElementById('mode-badge');
  var modeLabel  = document.getElementById('mode-label');
  var toggleLbl  = document.getElementById('toggle-label');
  var toggleIco  = document.getElementById('toggle-icon');
  var editBanner = document.getElementById('edit-banner');
  var panoramaEl = document.getElementById('panorama');
  var sidebar    = document.getElementById('scene-sidebar');
  var expandTab  = document.getElementById('sidebar-expand-tab');

  var bulkInputGroup = document.getElementById('bulk-input-group');

  var uploadBtn = document.getElementById('upload-btn');
  var openFolderBtn = document.getElementById('open-folder-btn');

  if (isEditMode) {
    // --- 編集モードへ ---
    if (bulkInputGroup) bulkInputGroup.style.display = 'flex';
    if (uploadBtn) uploadBtn.style.display = 'block';
    if (openFolderBtn && rootFolderId) openFolderBtn.style.display = 'block';
    topbar.classList.add('edit-active');
    badge.classList.add('edit-active');
    modeLabel.textContent = '編集中';
    toggleLbl.textContent = '閲覧モード';
    toggleIco.innerHTML =
      '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>' +
      '<circle cx="12" cy="12" r="3"/>';
    editBanner.classList.add('visible');
    sidebar.classList.add('with-banner');
    expandTab.classList.add('with-banner');
    panoramaEl.style.cursor = 'crosshair';
    if (viewer) viewer.stopAutoRotate();

    var infoPop = document.getElementById('active-info-popup');
    if (infoPop) infoPop.remove();

    // 2Dモード: 編集用カーソルとバナーテキスト更新
    if (is2DMode) {
      var flatImg = document.getElementById('flat-map-img');
      if (flatImg) flatImg.style.cursor = 'crosshair';
      var editBannerSpan = editBanner.querySelector('span');
      if (editBannerSpan) editBannerSpan.textContent = '編集モードが有効です。2D画像の任意の場所をクリックしてホットスポットを追加できます。';
      render2DHotspots(current2DHotspots); // コンテキストメニューイベントを付け替え
    } else {
      var editBannerSpan = editBanner.querySelector('span');
      if (editBannerSpan) editBannerSpan.textContent = '編集モードが有効です。360度画像の任意の場所をクリックしてホットスポットを追加できます。';
    }

  } else {
    // --- 閲覧モードへ ---
    if (bulkInputGroup) bulkInputGroup.style.display = 'none';
    if (uploadBtn) uploadBtn.style.display = 'none';
    if (openFolderBtn) openFolderBtn.style.display = 'none';
    topbar.classList.remove('edit-active');
    badge.classList.remove('edit-active');
    modeLabel.textContent = '閲覧中';
    toggleLbl.textContent = '編集モード';
    toggleIco.innerHTML =
      '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>' +
      '<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>';
    editBanner.classList.remove('visible');
    sidebar.classList.remove('with-banner');
    expandTab.classList.remove('with-banner');
    panoramaEl.style.cursor = 'grab';
    closePopup();
    editModeDragStart = null;
    editModeWasDragging = false;
    if (viewer) viewer.startAutoRotate(-1.5);

    // 2Dモード: 閲覧用カーソルに戻す
    if (is2DMode) {
      var flatImg = document.getElementById('flat-map-img');
      if (flatImg) flatImg.style.cursor = 'default';
      render2DHotspots(current2DHotspots); // コンテキストメニューイベントを取り除いて再描画
    }
  }
}

function shouldIgnorePanoramaPointer(evt) {
  return !!(evt.target && evt.target.closest('#topbar, #edit-banner, #hotspot-popup, #scene-sidebar, #scene-context-menu, #hotspot-context-menu, #scene-properties-backdrop, .hs-marker, .info-popup, #fullscreen-btn, #gyro-toggle-btn'));
}

function shouldIgnoreGyroStopEvent(evt) {
  return !!(evt && evt.target && evt.target.closest('#gyro-toggle-btn'));
}

function setPanningState(isActive) {
  isPanning = isActive;
  document.body.classList.toggle('is-panning', isActive);
}

function onPanoramaPointerDown(evt) {
  if (!shouldIgnoreGyroStopEvent(evt)) {
    stopGyroIfActive('manual-pointer');
  }
  if (shouldIgnorePanoramaPointer(evt)) return;
  setPanningState(true);
}

function onPanoramaPointerUp() {
  if (!isPanning) return;
  setPanningState(false);
}

// =============================================
//  編集モード: ドラッグとクリックの判別（mousedown/move/up）
// =============================================
function onPanoramaMouseDown(evt) {
  if (!canEdit || !isEditMode) return;
  if (shouldIgnorePanoramaPointer(evt)) return;
  editModeDragStart   = { x: evt.clientX, y: evt.clientY };
  editModeWasDragging = false;
}

function onPanoramaMouseMove(evt) {
  if (!canEdit || !isEditMode || !editModeDragStart) return;
  var dx = evt.clientX - editModeDragStart.x;
  var dy = evt.clientY - editModeDragStart.y;
  if (dx * dx + dy * dy > EDIT_MODE_DRAG_THRESHOLD_PX * EDIT_MODE_DRAG_THRESHOLD_PX) {
    editModeWasDragging = true;
  }
}

function onPanoramaMouseUp() {
  editModeDragStart = null;
}

// =============================================
//  編集モード: パノラマクリックで座標取得
// =============================================
function onPanoramaClick(evt) {
  if (!shouldIgnoreGyroStopEvent(evt)) {
    stopGyroIfActive('manual-click');
  }
  if (!canEdit || !isEditMode) return;
  if (suppressNextPanoramaClick) {
    suppressNextPanoramaClick = false;
    return;
  }

  // ドラッグ後のクリックは無視（ホットスポット追加を開かない）
  if (editModeWasDragging) {
    editModeWasDragging = false;
    return;
  }
  editModeWasDragging = false;

  // UIコントロールへのクリックは除外
  if (shouldIgnorePanoramaPointer(evt)) return;

  // ── 移動モード ──────────────────────────────────────
  if (isMovingHotspot) {
    var target = movingHotspotTarget;
    if (!target) {
      isMovingHotspot = false;
      return;
    }

    var newCoords;
    try {
      newCoords = viewer.mouseEventToCoords(evt);
    } catch (e) {
      showToast('座標の取得に失敗しました。再度クリックしてください。', 'error');
      return;
    }

    var newPitch = newCoords[0];
    var newYaw   = newCoords[1];

    // 二重クリック防止
    isMovingHotspot = false;
    movingHotspotTarget = null;

    showToast('移動中...', 'success');

    var saveData = {
      fileId:      currentFileId || '',
      label:       target.label       || '',
      description: target.description || '',
      linkUrl:     target.linkUrl     || '',
      markerShape: target.markerShape || '',
      markerColor: target.markerColor || '',
      markerIcon:  target.markerIcon  || '',
      pitch:       newPitch,
      yaw:         newYaw,
      photoId:     target.photoId     || '',
      jumpSceneId: target.jumpSceneId || ''
    };

    google.script.run
      .withSuccessHandler(function (result) {
        if (result.success) {
          clearHotspotCache(saveData.fileId || '');
          target.pitch = newPitch;
          target.yaw   = newYaw;
          updateSpotInViewer(target, target);
          showToast('ホットスポットを移動しました！', 'success');
        } else {
          isMovingHotspot = false;
          movingHotspotTarget = null;
          showToast('移動に失敗しました: ' + (result.error || '不明なエラー'), 'error');
        }
      })
      .withFailureHandler(function () {
        isMovingHotspot = false;
        movingHotspotTarget = null;
        showToast('通信エラーが発生しました。再度お試しください。', 'error');
      })
      .updateHotspot(withEditToken(saveData), target.id);

    return;
  }

  // ── 通常モード: 新規ホットスポット追加 ───────────────
  try {
    // Pannellum APIでマウス座標 → パノラマ座標（Pitch/Yaw）に変換
    var coords = viewer.mouseEventToCoords(evt);
    pendingPitch = coords[0];
    pendingYaw   = coords[1];
    openPopup(evt.clientX, evt.clientY);
  } catch (e) {
    showToast('座標の取得に失敗しました。再度クリックしてください。', 'error');
  }
}

// =============================================
//  入力ポップアップの開閉
// =============================================

/**
 * ホットスポット入力ポップアップを開く
 *
 * @param {number} clientX   クリック位置X（画面座標）
 * @param {number} clientY   クリック位置Y（画面座標）
 * @param {Object} [editArgs] 編集時: 既存ホットスポットのargs。未指定なら新規追加
 */
function openPopup(clientX, clientY, editArgs) {
  if (!canEdit) return;
  var popup = document.getElementById('hotspot-popup');
  var inFolderMode = !!(allImages && allImages.length > 0);

  if (editArgs) {
    // 編集モード: 既存データを入力欄にセット
    editingHotspot = editArgs;
    pendingPitch   = editArgs.pitch;
    pendingYaw     = editArgs.yaw;
    document.getElementById('input-label').value    = editArgs.label || '';
    document.getElementById('input-link-url').value = editArgs.linkUrl || '';
    document.getElementById('marker-shape').value   = normalizeMarkerShape(editArgs.markerShape);
    document.getElementById('marker-color').value   = normalizeMarkerColor(editArgs.markerColor);
    document.getElementById('marker-icon').value    = normalizeMarkerIcon(editArgs.markerIcon);
    syncMarkerStyleSummaryFromInputs();
    var isQuizEdit = normalizeMarkerIcon(editArgs.markerIcon) === 'quiz';
    if (isQuizEdit) {
      var parts = (editArgs.description || '').split('|');
      document.getElementById('quiz-input-question').value = parts[0] || '';
      document.getElementById('quiz-input-answer').value   = parts.length > 1 ? parts[1] : '';
      document.getElementById('input-desc').value = '';
    } else {
      document.getElementById('input-desc').value = editArgs.description || '';
    }
    setQuizDescMode(isQuizEdit);
    document.getElementById('popup-header-title').textContent =
      isQuizEdit ? 'クイズスポットを編集' : 'ホットスポットを編集';
    document.getElementById('save-label').textContent = '更新する';
  } else {
    // 新規追加モード
    editingHotspot = null;
    document.getElementById('input-label').value         = '';
    document.getElementById('input-desc').value          = '';
    document.getElementById('quiz-input-question').value = '';
    document.getElementById('quiz-input-answer').value   = '';
    document.getElementById('input-link-url').value      = '';
    setQuizDescMode(false);
    syncMarkerStyleInputsFromPreference();
    document.getElementById('popup-header-title').textContent = 'ホットスポットを追加';
    document.getElementById('save-label').textContent = '保存する';
  }

  // フォルダモードなら写真・ジャンプセレクトをビルド
  if (inFolderMode) {
    buildPhotoSelect(editArgs ? (editArgs.photoId || '') : '');
    buildJumpSceneSelect(editArgs ? (editArgs.jumpSceneId || '') : '');
  }

  document.getElementById('input-label').classList.remove('error');

  // ポップアップモードを決定
  if (editArgs) {
    // 編集: ジャンプSceneIdがあればジャンプモード、それ以外は情報モード
    setPopupMode(editArgs.jumpSceneId ? 'jump' : 'info');
  } else if (inFolderMode) {
    // 新規×フォルダモード: タイプ選択画面
    setPopupMode('type');
  } else {
    // 新規×シングルファイル: 情報モード直接
    setPopupMode('info');
  }

  // 画面端から 10px 以上余白を確保して配置
  var pw = 320;
  var vw = window.innerWidth, vh = window.innerHeight;
  popup.style.visibility = 'hidden';
  popup.classList.add('visible');
  var ph = popup.offsetHeight || 360;
  var x = Math.min(clientX + 12, vw - pw - 10);
  var y = Math.min(Math.max(clientY - 20, 70), vh - ph - 10);
  popup.style.left = x + 'px';
  popup.style.top  = y + 'px';
  popup.style.visibility = '';
}

function closePopup() {
  document.getElementById('hotspot-popup').classList.remove('visible');
  document.getElementById('hotspot-popup').style.visibility = '';
  pendingPitch      = null;
  pendingYaw        = null;
  editingHotspot    = null;
  currentPopupMode  = null;
  // タイトル・ボタンテキストをデフォルトに戻す
  document.getElementById('popup-header-title').textContent = 'ホットスポットを追加';
  document.getElementById('save-label').textContent = '保存する';
}

// =============================================
//  ホットスポット保存（GAS呼び出し）
// =============================================
function onSaveClick() {
  if (!canEdit) {
    closePopup();
    return;
  }

  var label = document.getElementById('input-label').value.trim();
  var markerIconRaw = document.getElementById('marker-icon').value;
  var desc;
  if (normalizeMarkerIcon(markerIconRaw) === 'quiz') {
    var q = document.getElementById('quiz-input-question').value.trim();
    var a = document.getElementById('quiz-input-answer').value.trim();
    desc = q + '|' + a;
  } else {
    desc = document.getElementById('input-desc').value.trim();
  }
  var linkUrlInput = document.getElementById('input-link-url').value.trim();
  var labelInput = document.getElementById('input-label');
  var markerShape = normalizeMarkerShape(document.getElementById('marker-shape').value);
  var markerColor = normalizeMarkerColor(document.getElementById('marker-color').value);
  var markerIcon = normalizeMarkerIcon(document.getElementById('marker-icon').value);
  var inFolderMode = !!(allImages && allImages.length > 0);
  // モードに応じて競合するフィールドをクリア（情報モードはjump、ジャンプモードはphoto/desc/linkを無効化）
  var photoId    = (inFolderMode && currentPopupMode === 'info') ? (document.getElementById('input-photo-id').value   || '') : '';
  var jumpSceneId = (inFolderMode && currentPopupMode === 'jump') ? (document.getElementById('input-jump-scene').value || '') : '';
  if (currentPopupMode === 'jump') { desc = ''; linkUrlInput = ''; }

  // バリデーション: ラベル必須
  if (!label) {
    labelInput.classList.add('error');
    labelInput.focus();
    setTimeout(function () { labelInput.classList.remove('error'); }, 1800);
    return;
  }

  if (pendingPitch === null || pendingYaw === null) {
    showToast('座標データがありません。再度クリックしてください。', 'error');
    return;
  }

  var saveData = {
    fileId:      currentFileId || '',
    label:       label,
    description: desc,
    linkUrl:     normalizeHttpUrl(linkUrlInput),
    markerShape: markerShape,
    markerColor: markerColor,
    markerIcon:  markerIcon,
    pitch:       pendingPitch,
    yaw:         pendingYaw,
    photoId:     photoId,
    jumpSceneId: jumpSceneId
  };

  // ボタンをローディング状態に
  var btn       = document.getElementById('btn-save');
  var saveLabel = document.getElementById('save-label');
  btn.disabled  = true;
  btn.classList.add('loading');
  saveLabel.textContent = editingHotspot ? '更新中...' : '保存中...';

  if (editingHotspot) {
    // ── 更新処理 ──────────────────────────────────────
    var targetArgs = editingHotspot; // closePopup前に参照を保持
    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.classList.remove('loading');
        saveLabel.textContent = '更新する';

        if (result.success) {
          clearHotspotCache(saveData.fileId || '');
          persistMarkerStylePreference(markerShape, markerColor, markerIcon);
          updateSpotInViewer(targetArgs, saveData);
          closePopup();
          showToast('ホットスポットを更新しました！', 'success');
        } else {
          showToast('更新に失敗しました: ' + (result.error || '不明なエラー'), 'error');
        }
      })
      .withFailureHandler(function () {
        btn.disabled = false;
        btn.classList.remove('loading');
        saveLabel.textContent = '更新する';
        showToast('通信エラーが発生しました。再度お試しください。', 'error');
      })
      .updateHotspot(withEditToken(saveData), targetArgs.id);

  } else {
    // ── 新規保存処理 ───────────────────────────────────
    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.classList.remove('loading');
        saveLabel.textContent = '保存する';

        if (result.success) {
          clearHotspotCache(saveData.fileId || '');
          persistMarkerStylePreference(markerShape, markerColor, markerIcon);
          addSpotToViewer(saveData, result.id);
          closePopup();
          showToast('ホットスポットを保存しました！', 'success');
        } else {
          showToast('保存に失敗しました: ' + (result.error || '不明なエラー'), 'error');
        }
      })
      .withFailureHandler(function () {
        btn.disabled = false;
        btn.classList.remove('loading');
        saveLabel.textContent = '保存する';
        showToast('通信エラーが発生しました。再度お試しください。', 'error');
      })
      .saveHotspot(withEditToken(saveData));
  }
}

/**
 * 保存成功後、Pannellumにホットスポットをリアルタイムで追加する
 *
 * @param {Object} hs     保存データ
 * @param {string} hsId   ホットスポットのUUID
 */
function addSpotToViewer(hs, hsId) {
  var newId = 'hs_' + Date.now();
  var args = {
    _pannellumId: newId,
    id:           hsId,
    fileId:       hs.fileId,
    label:        hs.label,
    description:  hs.description,
    linkUrl:      hs.linkUrl,
    markerShape:  hs.markerShape,
    markerColor:  hs.markerColor,
    markerIcon:   hs.markerIcon,
    pitch:        hs.pitch,
    yaw:          hs.yaw,
    photoId:      hs.photoId     || '',
    jumpSceneId:  hs.jumpSceneId || ''
  };

  if (is2DMode) {
    // 2Dモード: current2DHotspots に追加して再描画
    current2DHotspots.push(args);
    render2DHotspots(current2DHotspots);
    return;
  }

  try {
    viewer.addHotSpot({
      id:               newId,
      pitch:            hs.pitch,
      yaw:              hs.yaw,
      type:             'custom',
      cssClass:         'hs-marker',
      createTooltipFunc: buildMarkerElement,
      createTooltipArgs: args,
      clickHandlerFunc:  onMarkerClick,
      clickHandlerArgs:  args
    });
  } catch (e) {
    // addHotSpot が失敗しても保存自体は成功しているので無視
  }
}

/**
 * 編集後、Pannellum上のホットスポットをリアルタイムで更新する
 *
 * @param {Object} oldArgs  既存ホットスポットのargs（_pannellumId・id含む）
 * @param {Object} newData  更新後の内容
 */
function updateSpotInViewer(oldArgs, newData) {
  // oldArgs を直接書き換えて参照を維持する
  oldArgs.label       = newData.label;
  oldArgs.description = newData.description;
  oldArgs.linkUrl     = newData.linkUrl;
  oldArgs.markerShape = newData.markerShape;
  oldArgs.markerColor = newData.markerColor;
  oldArgs.markerIcon  = newData.markerIcon;
  oldArgs.photoId     = newData.photoId     || '';
  oldArgs.jumpSceneId = newData.jumpSceneId || '';

  if (is2DMode) {
    // 2Dモード: oldArgs はすでに current2DHotspots 内の参照なので再描画するだけ
    render2DHotspots(current2DHotspots);
    return;
  }

  var pid = oldArgs._pannellumId;
  try { viewer.removeHotSpot(pid); } catch (e) { /* ignore */ }
  try {
    viewer.addHotSpot({
      id:               pid,
      pitch:            oldArgs.pitch,
      yaw:              oldArgs.yaw,
      type:             'custom',
      cssClass:         'hs-marker',
      createTooltipFunc: buildMarkerElement,
      createTooltipArgs: oldArgs,
      clickHandlerFunc:  onMarkerClick,
      clickHandlerArgs:  oldArgs
    });
  } catch (e) { /* ignore */ }
}

// =============================================
//  トースト通知
// =============================================
function showToast(message, type) {
  var toast = document.getElementById('toast');
  var icon  = document.getElementById('toast-icon');
  var msg   = document.getElementById('toast-msg');

  toast.className = (type === 'success') ? 'success' : 'error';
  msg.textContent = message;

  if (type === 'success') {
    icon.innerHTML = '<polyline points="20 6 9 17 4 12"/>';
  } else {
    icon.innerHTML =
      '<circle cx="12" cy="12" r="10"/>' +
      '<line x1="15" y1="9" x2="9" y2="15"/>' +
      '<line x1="9" y1="9" x2="15" y2="15"/>';
  }

  requestAnimationFrame(function () { toast.classList.add('show'); });

  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 3200);
}

// =============================================
//  ローディングエラー表示
// =============================================
function showLoadError(message) {
  var loading = document.getElementById('loading');
  loading.innerHTML =
    '<p style="color:#ef4444;font-size:14px;text-align:center;padding:0 20px">' +
    escapeHtml(message) + '<br><br>' +
    '<button onclick="location.reload()" ' +
    'style="background:#fbbf24;border:none;border-radius:8px;padding:8px 20px;' +
    'font-size:13px;font-weight:600;color:#78350f;cursor:pointer">' +
    '再読み込み</button></p>';
}

/**
 * 写真セレクトに allImages の一覧をセットする
 * @param {string} currentPhotoId  現在選択中のファイルID（編集時）
 */
function buildPhotoSelect(currentPhotoId) {
  var sel = document.getElementById('input-photo-id');
  sel.innerHTML = '';
  var noneOpt = document.createElement('option');
  noneOpt.value = '';
  noneOpt.textContent = '（なし）';
  sel.appendChild(noneOpt);

  if (!allImages) return;
  allImages.forEach(function (img) {
    if (img.type === 'folder') return; // フォルダは除外
    var opt = document.createElement('option');
    opt.value = img.id;
    opt.textContent = img.name;
    if (img.id === currentPhotoId) opt.selected = true;
    sel.appendChild(opt);
  });
}

/**
 * ジャンプ先セレクトに allImages の一覧をセットする（現在のシーンは除外）
 * @param {string} currentJumpSceneId  現在選択中のシーンID（編集時）
 */
function buildJumpSceneSelect(currentJumpSceneId) {
  var sel = document.getElementById('input-jump-scene');
  sel.innerHTML = '';
  var noneOpt = document.createElement('option');
  noneOpt.value = '';
  noneOpt.textContent = '（なし）';
  sel.appendChild(noneOpt);

  if (!allImages) return;
  allImages.forEach(function (img) {
    if (img.type === 'folder') return; // フォルダは除外
    if (img.id === currentFileId) return; // 自分自身は除外
    var opt = document.createElement('option');
    opt.value = img.id;
    opt.textContent = img.name;
    if (img.id === currentJumpSceneId) opt.selected = true;
    sel.appendChild(opt);
  });
}

// =============================================
//  XSS対策: HTMLエスケープ
// =============================================
function normalizeHttpUrl(value) {
  var url = String(value || '').trim();
  if (!url) return '';
  return /^https?:\/\//i.test(url) ? url : '';
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,  '&amp;')
    .replace(/</g,  '&lt;')
    .replace(/>/g,  '&gt;')
    .replace(/"/g,  '&quot;')
    .replace(/'/g,  '&#039;');
}

//  2D平面マップ表示・非表示
// =============================================

/**
 * 2D平面マップ表示モードに切り替える
 * @param {string} imageUrl  表示する画像のURL
 */
function show2DView(imageUrl, onLoadError, onLoaded) {
  document.getElementById('panorama').style.display = 'none';
  var container = document.getElementById('flat-map-container');
  container.style.display = 'flex';
  var inner = document.getElementById('flat-map-inner');
  inner.innerHTML = '';

  var img = document.createElement('img');
  img.id = 'flat-map-img';
  img.alt = '';
  img.style.cursor = isEditMode ? 'crosshair' : 'default';
  img.onload = function () {
    if (typeof onLoaded === 'function') onLoaded();
  };
  img.onerror = function () {
    if (typeof onLoadError === 'function') {
      onLoadError();
    } else {
      showLoadError('2D画像の読み込みに失敗しました。');
    }
  };
  img.addEventListener('click', onFlatMapClick);
  inner.appendChild(img);
  img.src = imageUrl;
}

/**
 * 2D表示を非表示にしてPannellumコンテナを復元する
 */
function hide2DView() {
  var container = document.getElementById('flat-map-container');
  container.style.display = 'none';
  document.getElementById('flat-map-inner').innerHTML = '';
  document.getElementById('panorama').style.display = '';
  current2DHotspots = [];
}

/**
 * 2D画像クリック: 編集モード時にクリック位置のX%/Y%を取得してポップアップを開く
 */
function onFlatMapClick(evt) {
  if (!canEdit || !isEditMode) return;
  var img = evt.currentTarget;
  var rect = img.getBoundingClientRect();
  var xPct = ((evt.clientX - rect.left) / rect.width)  * 100;
  var yPct = ((evt.clientY - rect.top)  / rect.height) * 100;
  pendingYaw   = parseFloat(xPct.toFixed(4)); // X% → Yaw 列に保存
  pendingPitch = parseFloat(yPct.toFixed(4)); // Y% → Pitch 列に保存
  openPopup(evt.clientX, evt.clientY);
}

/**
 * 2Dモード用ホットスポットを画像上にオーバーレイ描画する
 * @param {Array} hotspots  ホットスポット配列（pitch=Y%, yaw=X%）
 */
function render2DHotspots(hotspots) {
  current2DHotspots = hotspots;
  var inner = document.getElementById('flat-map-inner');
  if (!inner) return;

  // 既存オーバーレイを削除
  var old = inner.querySelectorAll('.flat-hs-marker');
  for (var i = 0; i < old.length; i++) {
    old[i].parentNode.removeChild(old[i]);
  }

  hotspots.forEach(function (hs) {
    var el = document.createElement('div');
    el.className = 'flat-hs-marker hs-marker marker-shape-' + (hs.markerShape || 'circle') +
                   ' marker-color-' + (hs.markerColor || 'blue');
    el.style.left = hs.yaw + '%';
    el.style.top  = hs.pitch + '%';

    var core = document.createElement('span');
    core.className = 'hs-marker-core marker-icon-' + (hs.markerIcon || 'info');
    el.appendChild(core);

    // ホバーツールチップ
    if (hs.jumpSceneId) {
      // ジャンプ先がある場合: ジャンプ先シーン名を表示
      el.addEventListener('mouseenter', function () {
        if (isEditMode) return;
        showJumpTooltip(el, hs.jumpSceneId);
      });
      el.addEventListener('mouseleave', function () {
        hideJumpTooltip();
      });
    } else if (hs.label) {
      // 通常ホットスポット: ラベルを表示
      el.addEventListener('mouseenter', function () {
        if (isEditMode) return;
        showLabelTooltip(el, hs.label);
      });
      el.addEventListener('mouseleave', function () {
        hideJumpTooltip();
      });
    }

    el.addEventListener('click', function (e) {
      e.stopPropagation();
      onMarkerClick(e, hs);
    });

    if (canEdit && isEditMode) {
      el.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        e.stopPropagation();
        openHotspotContextMenu(e, hs);
      });
    }

    inner.appendChild(el);
  });
}

/**

 * サブフォルダ内ならそのID、ルートならルートフォルダID。
 * @returns {string|null}
 */
function getCurrentFolderId() {
  if (folderStack.length > 0) {
    return folderStack[folderStack.length - 1].id;
  }
  return rootFolderId;
}

/**
 * 現在のフォルダを Google Drive で別タブ開く。
 */
function openCurrentFolderInDrive() {

function openUploadModal() {
  if (!canEdit) return;
  if (!allImages) return; // フォルダモードのみ対応
  document.getElementById('upload-modal').style.display = 'flex';
  document.getElementById('upload-status').textContent = '';
  document.getElementById('upload-file-input').value = '';
  // ラジオボタンを初期値に戻す
  var radios = document.querySelectorAll('input[name="upload-type"]');
  if (radios.length) radios[0].checked = true;
}

function closeUploadModal() {
  document.getElementById('upload-modal').style.display = 'none';
  document.getElementById('upload-confirm-btn').disabled = false;
}

function sanitizeFileName(fileName) {
  var name = String(fileName || 'image').trim();
  if (!name) return 'image.jpg';
  return name;
}

function readFileAsDataUrl(file, onSuccess, onError) {
  var reader = new FileReader();
  reader.onload = function () {
    onSuccess(String(reader.result || ''));
  };
  reader.onerror = function () {
    onError('ファイルの読み込みに失敗');
  };
  reader.readAsDataURL(file);
}

function convertDataUrlToJpeg(dataUrl, quality, onSuccess, onError) {
  var img = new Image();
  img.onload = function () {
    try {
      var canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth || img.width;
      canvas.height = img.naturalHeight || img.height;
      var ctx = canvas.getContext('2d');
      if (!ctx) {
        onError('画像変換コンテキストの取得に失敗');
        return;
      }
      ctx.drawImage(img, 0, 0);
      var jpegDataUrl = canvas.toDataURL('image/jpeg', quality || 0.92);
      onSuccess(jpegDataUrl);
    } catch (e) {
      onError(e && e.message ? e.message : 'JPEG変換に失敗');
    }
  };
  img.onerror = function () {
    onError('画像のデコードに失敗');
  };
  img.src = dataUrl;
}

function onUploadConfirm() {
  if (!canEdit) {
    closeUploadModal();
    return;
  }

  var fileInput = document.getElementById('upload-file-input');
  if (!fileInput.files || !fileInput.files.length) {
    document.getElementById('upload-status').textContent = 'ファイルを選択してください。';
    return;
  }
  var files = Array.prototype.slice.call(fileInput.files);
  var selectedType = document.querySelector('input[name="upload-type"]:checked');
  var is2D = selectedType && selectedType.value === '2d';

  var statusEl = document.getElementById('upload-status');
  var confirmBtn = document.getElementById('upload-confirm-btn');
  statusEl.textContent = files.length + ' 件のファイルを読み込んでいます...';
  confirmBtn.disabled = true;

  var uploadedFiles = [];
  var errors = [];
  var index = 0;

  function uploadNext() {
    if (index >= files.length) {
      confirmBtn.disabled = false;
      if (uploadedFiles.length) {
        uploadedFiles.forEach(function (f) { allImages.push(f); });
        allImages.sort(function (a, b) { return a.name.localeCompare(b.name, 'ja'); });
        buildSceneSidebar(allImages);
        syncActiveSceneItem(currentFileId);
        var msg = uploadedFiles.length + ' 件アップロード完了';
        if (errors.length) msg += '（' + errors.length + ' 件失敗）';
        showToast(msg, uploadedFiles.length ? 'success' : 'error');
        closeUploadModal();
      } else {
        statusEl.textContent = 'エラー: すべてのアップロードに失敗しました。' + (errors[0] || '');
      }
      return;
    }

    var file = files[index];
    var currentIndex = index + 1;
    statusEl.textContent = currentIndex + '/' + files.length + ' アップロード中...';

    readFileAsDataUrl(file, function (dataUrl) {
      // Canvas変換をスキップして、方位情報入りのオリジナルデータをそのまま送る
      var uploadName = sanitizeFileName(file.name);
      google.script.run
        .withSuccessHandler(function (result) {
          if (result.success) {
            uploadedFiles.push(result.file);
          } else {
            errors.push(file.name + ': ' + (result.error || '不明なエラー'));
          }
          index++;
          uploadNext();
        })
        .withFailureHandler(function (err) {
          errors.push(file.name + ': ' + (err && err.message ? err.message : '通信エラー'));
          index++;
          uploadNext();
        })
        .uploadImageToDrive(withEditToken({
          base64:          dataUrl,
          fileName:        uploadName,
          mimeType:        file.type || 'image/jpeg',
          is2D:            !!is2D,
          targetFolderId:  getCurrentFolderId() || ''
        }));
    }, function (message) {
      errors.push(file.name + ': ' + (message || 'ファイルの読み込みに失敗'));
      index++;
      uploadNext();
    });
  }

  uploadNext();
}

function getCheckedRadioValue(name, fallback) {
  var selected = document.querySelector('input[name="' + name + '"]:checked');
  return selected ? selected.value : fallback;
}

function setCheckedRadioValue(name, value) {
  var radios = document.querySelectorAll('input[name="' + name + '"]');
  for (var i = 0; i < radios.length; i++) {
    radios[i].checked = radios[i].value === value;
  }
}

function getCurrentViewForShare(target) {
  var sceneId = '';
  var yaw = null;
  var pitch = null;

  if ((target === 'scene' || target === 'view') && currentFileId) {
    sceneId = currentFileId;
  }

  if (target === 'view' && sceneId && !is2DMode && viewer) {
    try {
      if (typeof viewer.getYaw === 'function') yaw = viewer.getYaw();
      if (typeof viewer.getPitch === 'function') pitch = viewer.getPitch();
    } catch (e) {
      yaw = null;
      pitch = null;
    }
  }

  return { sceneId: sceneId, yaw: yaw, pitch: pitch };
}

function getShareOptionsFromModal() {
  var target = getCheckedRadioValue('share-target', 'home');
  var currentView = getCurrentViewForShare(target);
  var baseUrl = appBaseUrl || (window.location && window.location.href) || '';
  return {
    format: getCheckedRadioValue('share-format', 'url'),
    baseUrl: baseUrl,
    delivery: getCheckedRadioValue('share-delivery', 'direct'),
    sceneId: currentView.sceneId,
    yaw: currentView.yaw,
    pitch: currentView.pitch
  };
}

function updateShareOutput() {
  var options = getShareOptionsFromModal();
  var url = buildPublicShareUrl(options);
  var isIframe = options.format === 'iframe';
  var isQr = options.format === 'qr';
  var text = isIframe ? buildIframeCode(url) : url;
  var output = document.getElementById('share-output');
  if (output) output.value = text;
  var outputRow = document.getElementById('share-output-row');
  if (outputRow) outputRow.hidden = isQr;

  var label = document.getElementById('share-output-label');
  if (label) label.textContent = isIframe ? 'iframeコード' : (isQr ? 'QRコード用URL' : '共有URL');
  updateShareQrPanel(url, options.format);
  return text;
}

function openShareModal() {
  stopGyroIfActive('share');
  setCheckedRadioValue('share-format', 'url');
  setCheckedRadioValue('share-delivery', 'direct');
  setCheckedRadioValue('share-target', 'home');
  updateShareOutput();
  document.getElementById('embed-modal-backdrop').classList.add('visible');
  document.getElementById('embed-modal').classList.add('visible');
}

/**
 * 旧名称の互換ラッパー。
 */
function openEmbedModal() {
  openShareModal();
}

function closeShareModal() {
  document.getElementById('embed-modal-backdrop').classList.remove('visible');
  document.getElementById('embed-modal').classList.remove('visible');
}

/**
 * 旧名称の互換ラッパー。
 */
function closeEmbedModal() {
  closeShareModal();
}

function copyShareOutput() {
  updateShareOutput();
  var textarea = document.getElementById('share-output');
  if (!textarea) return;
  var text = textarea.value;
  if (!text) return;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      showToast('コピーしました。', 'success');
    }).catch(function () {
      fallbackCopy_(textarea);
    });
  } else {
    fallbackCopy_(textarea);
  }
}

/**
 * 旧名称の互換ラッパー。
 */
function copyEmbedCode() {
  copyShareOutput();
}

//  一括入力用スプシ連携ボタンイベント
// =============================================

/**
 * 現在表示中のシーンを再読み込みする（ホットスポット更新反映用）。
 */
function reloadCurrentScene() {
  if (!currentFileId || !allImages) return;
  var currentImg = null;
  for (var i = 0; i < allImages.length; i++) {
    if (allImages[i].id === currentFileId) { currentImg = allImages[i]; break; }
  }
  if (currentImg) loadScene(currentImg);
}

function onBulkInputDropdownClick(evt) {
  if (!canEdit) {
    closeBulkInputDropdown();
    return;
  }

  var btn = evt.target.closest('.bulk-input-item');
  if (!btn || btn.disabled) return;
  var action = btn.getAttribute('data-action');
  if (!action) return;

  closeBulkInputDropdown();
  var origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '処理中...';

  if (action === 'update-dropdowns') {
    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.textContent = origText;
        if (result && result.success) {
          showToast('入力リストを最新化しました。', 'success');
        } else {
          showToast('更新に失敗しました: ' + ((result && result.error) || '不明なエラー'), 'error');
        }
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = origText;
        showToast('通信エラーが発生しました: ' + (err.message || '不明なエラー'), 'error');
      })
      .updateStudentSheetDropdowns(withEditToken({}));
  } else if (action === 'import-student-data') {
    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.textContent = origText;
        if (result && result.success) {
          var msg = result.count > 0
            ? result.count + '件のデータを取り込みました。'
            : '取り込み対象のデータがありませんでした。';
          showToast(msg, 'success');
          if (result.count > 0) {
            clearHotspotCache(currentFileId || '');
            reloadCurrentScene();
          }
        } else {
          showToast('取り込みに失敗しました: ' + ((result && result.error) || '不明なエラー'), 'error');
        }
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = origText;
        showToast('通信エラーが発生しました: ' + (err.message || '不明なエラー'), 'error');
      })
      .bulkImportStudentSheet(withEditToken({}));
  }
}

/**
 * Clipboard API が使えない場合のフォールバックコピー。
 *
 * @param {HTMLTextAreaElement} textarea
 */
function fallbackCopy_(textarea) {
  textarea.select();
  try {
    document.execCommand('copy');
    showToast('コピーしました。', 'success');
  } catch (e) {
    showToast('コピーに失敗しました。手動でコピーしてください。', 'error');
  }
  window.getSelection().removeAllRanges();
}
