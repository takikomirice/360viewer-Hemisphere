  <style>
    :root {
      --app-safe-top: env(safe-area-inset-top, 0px);
      --app-safe-right: env(safe-area-inset-right, 0px);
      --app-safe-bottom: env(safe-area-inset-bottom, 0px);
      --app-safe-left: env(safe-area-inset-left, 0px);
      --app-viewport-base: 100vh;
      --app-toolbar-height: calc(60px + var(--app-safe-top));
      --app-edit-banner-height: 40px;
      --app-scene-strip-height: calc(80px + var(--app-safe-bottom));
      --app-public-sheet-height: calc(56px + var(--app-safe-bottom));
      --app-public-sheet-expanded-height: min(56vh, 360px);
      --theme-background: #FFFFFF;
      --theme-surface: #FFFFFF;
      --theme-surface-translucent: rgba(255, 255, 255, 0.94);
      --theme-surface-subtle: #F8FAFC;
      --theme-surface-muted: #F4F4F5;
      --theme-surface-hover: #E4E4E7;
      --theme-text: #18181B;
      --theme-text-muted: #52525B;
      --theme-text-soft: #71717A;
      --theme-text-disabled: #A1A1AA;
      --theme-border: #E4E4E7;
      --theme-border-strong: #D4D4D8;
      --theme-input-background: #FFFFFF;
      --theme-button-background: #FFFFFF;
      --theme-floating-background: rgba(255, 255, 255, 0.94);
      --theme-overlay: rgba(24, 24, 27, 0.35);
      --theme-focus-ring: #2563EB;
      --theme-accent: #2563EB;
      --theme-accent-soft: #EFF6FF;
      --theme-edit-background: #FFFBEB;
      --theme-edit-text: #78350F;
      --theme-edit-border: #FBBF24;
      --theme-success-background: #B7D781;
      --theme-success-border: #7DB53A;
      --theme-success-text: #2D5A00;
      --theme-danger-background: #FCA5A5;
      --theme-danger-border: #F87171;
      --theme-danger-text: #7F1D1D;
    }
    html { color-scheme: light; }
    html[data-theme="dark"] {
      color-scheme: dark;
      --theme-background: #09090B;
      --theme-surface: #18181B;
      --theme-surface-translucent: rgba(24, 24, 27, 0.95);
      --theme-surface-subtle: #27272A;
      --theme-surface-muted: #27272A;
      --theme-surface-hover: #3F3F46;
      --theme-text: #FAFAFA;
      --theme-text-muted: #D4D4D8;
      --theme-text-soft: #A1A1AA;
      --theme-text-disabled: #71717A;
      --theme-border: #3F3F46;
      --theme-border-strong: #52525B;
      --theme-input-background: #09090B;
      --theme-button-background: #27272A;
      --theme-floating-background: rgba(24, 24, 27, 0.94);
      --theme-overlay: rgba(0, 0, 0, 0.68);
      --theme-focus-ring: #93C5FD;
      --theme-accent: #60A5FA;
      --theme-accent-soft: #172554;
      --theme-edit-background: #18181B;
      --theme-edit-text: #FAFAFA;
      --theme-edit-border: #60A5FA;
      --theme-success-background: #14532D;
      --theme-success-border: #22C55E;
      --theme-success-text: #DCFCE7;
      --theme-danger-background: #450A0A;
      --theme-danger-border: #EF4444;
      --theme-danger-text: #FEE2E2;
    }
    @supports (height: 100dvh) {
      :root {
        --app-viewport-base: 100dvh;
        --app-public-sheet-expanded-height: min(56dvh, 360px);
      }
    }

    /* =============================================
       リセット・基本
    ============================================= */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      font-family: 'Hiragino Sans', 'Meiryo', 'Inter', sans-serif;
      overflow: hidden;
      background: #fff;
      overscroll-behavior: none;
    }
    body {
      --app-top-offset: var(--app-toolbar-height);
      --app-viewport-height: calc(var(--app-viewport-base) - var(--app-top-offset));
    }
    body.edit-mode-active {
      --app-top-offset: calc(var(--app-toolbar-height) + var(--app-edit-banner-height));
      --app-viewport-height: calc(var(--app-viewport-base) - var(--app-top-offset));
    }
    body[data-app-mode="public"],
    body[data-app-mode="internal"],
    body.topbar-hidden-view,
    body.is-fullscreen {
      --app-top-offset: 0px;
      --app-viewport-height: var(--app-viewport-base);
    }

    /* =============================================
       Pannellum: 全画面コンテナ
    ============================================= */
    #panorama {
      position: fixed;
      top: var(--app-top-offset);
      left: 0;
      width: 100%;
      height: var(--app-viewport-height);
      overflow: hidden;
    }
    /* Pannellumのデフォルトクレジット表示を非表示 */
    .pnlm-about-msg,
    .pnlm-panorama-info { display: none !important; }

    /* =============================================
       UIオーバーレイ（全UI要素の親）
       pointer-events: none でPannellumのドラッグを妨げない
    ============================================= */
    #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--app-viewport-base);
      pointer-events: none;
      z-index: 100;
    }

    /* =============================================
       トップバー
    ============================================= */
    #topbar {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      min-height: calc(60px + var(--app-safe-top));
      height: auto;
      background: #FFFFFF;
      border-bottom: 1px solid #E4E4E7;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      align-content: center;
      justify-content: space-between;
      gap: 6px 12px;
      padding: var(--app-safe-top) calc(20px + var(--app-safe-right)) 0 calc(20px + var(--app-safe-left));
      pointer-events: auto;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      transition: border-color 0.25s, border-width 0.25s;
      z-index: 110;
    }
    body[data-app-mode="public"] #topbar,
    body[data-app-mode="internal"] #topbar,
    body.topbar-hidden-view #topbar,
    body.is-fullscreen #topbar {
      display: none !important;
    }
    /* 編集モード時: アンバー枠で明確に区別 */
    #topbar.edit-active {
      border-bottom: 2px solid #fbbf24;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 0 1 auto;
    }
    .topbar-title {
      font-size: 18px;
      font-weight: 600;
      color: #18181B;
    }
    .topbar-left svg {
      width: 22px; height: 22px;
      color: #2d7baa;
      flex-shrink: 0;
    }

    .topbar-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
      flex: 0 1 auto;
    }

    .theme-toggle {
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border: 1px solid rgba(24, 24, 27, 0.18);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      color: #18181B;
      cursor: pointer;
      font-family: inherit;
      pointer-events: auto;
    }
    .theme-icon { width: 19px; height: 19px; }
    .theme-icon-sun { display: none; }
    html[data-theme="dark"] .theme-icon-moon { display: none; }
    html[data-theme="dark"] .theme-icon-sun { display: block; }

    #toolbar-theme-toggle { display: flex; }
    #floating-theme-toggle {
      display: none;
      position: fixed;
      top: calc(12px + var(--app-safe-top));
      right: calc(64px + var(--app-safe-right));
      z-index: 190;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.24);
    }
    body[data-app-mode="public"] #toolbar-theme-toggle,
    body[data-app-mode="internal"] #toolbar-theme-toggle {
      display: none !important;
    }
    body[data-app-mode="public"] #floating-theme-toggle,
    body[data-app-mode="internal"] #floating-theme-toggle {
      display: flex;
    }

    /* ---- 状態バッジ（「閲覧中」/「編集中」） ---- */
    #mode-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 13px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      background: #fef3c7;
      border: 1px solid #f59e0b;
      color: #78350f;
      transition: border-color 0.25s, background 0.25s;
    }
    #mode-badge.edit-active {
      border-color: #fbbf24;
      border-width: 1.5px;
    }
    #mode-badge .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #92400e;
      flex-shrink: 0;
    }

    /* ---- モード切り替えボタン ---- */
    #mode-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 15px;
      border-radius: 20px;
      background: #FFFFFF;
      border: 1.5px solid #E4E4E7;
      font-size: 13px;
      font-weight: 600;
      color: #18181B;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      font-family: inherit;
    }
    #mode-toggle:hover {
      background: #FAFAFA;
      border-color: #D4D4D8;
    }
    #mode-toggle svg {
      width: 15px; height: 15px;
      color: #71717A;
      flex-shrink: 0;
    }

    .access-notice {
      display: none;
      position: absolute;
      top: calc(var(--app-top-offset) + 8px);
      right: calc(16px + var(--app-safe-right));
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      border: 1px solid #D4D4D8;
      border-radius: 16px;
      background: #F8FAFC;
      color: #3F3F46;
      font-size: 11px;
      line-height: 1.25;
      white-space: nowrap;
      pointer-events: auto;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
      z-index: 175;
    }
    .access-notice.visible { display: flex; }
    .access-notice strong {
      color: #18181B;
      font-size: 11px;
    }
    .access-warning {
      display: none;
      position: absolute;
      top: calc(var(--app-top-offset) + 6px);
      left: 50%;
      max-width: min(760px, calc(100vw - 32px));
      transform: translateX(-50%);
      padding: 8px 12px;
      border: 1px solid #F59E0B;
      border-radius: 8px;
      background: #FFFBEB;
      color: #78350F;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.45;
      pointer-events: auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      z-index: 180;
    }
    .access-warning.visible { display: block; }

    /* ---- 埋め込みコードボタン ---- */
    #embed-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 20px;
      background: #FFFFFF;
      border: 1.5px solid #E4E4E7;
      font-size: 13px;
      font-weight: 600;
      color: #18181B;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      font-family: inherit;
    }
    #embed-btn:hover {
      background: #FAFAFA;
      border-color: #D4D4D8;
    }
    #embed-btn svg {
      width: 14px; height: 14px;
      color: #71717A;
      flex-shrink: 0;
    }

    /* ---- 一括入力グループ（トップバー）ドロップダウン ---- */
    #bulk-input-group {
      display: none;
      position: relative;
      align-items: center;
    }
    #bulk-input-trigger {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #f0fdf4;
      border: 1.5px solid #bbf7d0;
      border-radius: 20px;
      color: #166534;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }

    #open-hotspot-folder-topbar-btn {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 44px;
      min-height: 44px;
      padding: 7px 12px;
      border: 1.5px solid #93C5FD;
      border-radius: 20px;
      background: #EFF6FF;
      color: #1E3A8A;
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    #open-hotspot-folder-topbar-btn:hover:not(:disabled) {
      background: #DBEAFE;
      border-color: #60A5FA;
    }
    #open-hotspot-folder-topbar-btn svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }
    #open-hotspot-folder-topbar-btn.loading,
    #open-hotspot-folder-topbar-btn:disabled {
      cursor: wait;
      opacity: 0.65;
    }
    #bulk-input-trigger:hover {
      background: #dcfce7;
      border-color: #4ade80;
    }
    #bulk-input-trigger svg.chevron {
      width: 14px;
      height: 14px;
      transition: transform 0.2s;
    }
    #bulk-input-group.open #bulk-input-trigger svg.chevron {
      transform: rotate(180deg);
    }
    #bulk-input-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 220px;
      background: #FFFFFF;
      border: 1px solid #E4E4E7;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      z-index: 200;
      overflow: hidden;
    }
    #bulk-input-group.open #bulk-input-dropdown {
      display: block;
    }
    .bulk-input-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 10px 14px;
      background: transparent;
      border: none;
      color: #18181B;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s;
    }
    .bulk-input-item:hover {
      background: #f4f4f5;
    }
    .bulk-input-item:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .bulk-input-item svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: #71717A;
    }

    /* ---- 共有モーダル ---- */
    #embed-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      z-index: 1000;
    }
    #embed-modal-backdrop.visible { display: block; }

    #embed-modal {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(560px, calc(100vw - 32px));
      max-height: calc(var(--app-viewport-base) - 48px);
      background: #FFFFFF;
      border-radius: 9px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      z-index: 1001;
      overflow: hidden;
    }
    #embed-modal.visible { display: block; }

    .embed-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #E4E4E7;
      font-size: 15px;
      font-weight: 700;
      color: #18181B;
    }
    .embed-modal-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px; height: 28px;
      border: none;
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      color: #71717A;
      transition: background 0.15s;
    }
    .embed-modal-close:hover { background: #F4F4F5; }
    .embed-modal-close svg { width: 16px; height: 16px; }

    .embed-modal-body {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: calc(var(--app-viewport-base) - 92px);
      overflow-y: auto;
    }

    .embed-section { display: flex; flex-direction: column; gap: 6px; }

    .share-option-title {
      font-size: 12px;
      font-weight: 700;
      color: #3F3F46;
    }

    .share-segment,
    .share-option-grid {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .share-segment label,
    .share-option-grid label {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 7px 10px;
      border: 1px solid #E4E4E7;
      border-radius: 8px;
      background: #FAFAFA;
      color: #18181B;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      line-height: 1.25;
    }

    .share-option-grid label {
      align-items: center;
      gap: 4px;
      min-width: 150px;
      flex: 1;
    }

    .share-option-grid label input {
      margin-right: 6px;
    }

    .share-option-grid label span {
      color: #71717A;
      font-size: 11px;
      font-weight: 500;
    }

    .share-segment input,
    .share-option-grid input {
      accent-color: #1a73e8;
      flex-shrink: 0;
    }

    .share-icon-segment,
    .share-compact-segment {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }
    .share-icon-option,
    .share-compact-option {
      position: relative;
      justify-content: center;
      min-width: 0;
      min-height: 36px;
      padding: 6px 8px;
      border-radius: 6px;
      background: #FFFFFF;
    }
    .share-icon-option input,
    .share-compact-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .share-icon-option:has(input:checked),
    .share-compact-option:has(input:checked) {
      border-color: #2563EB;
      background: #EFF6FF;
      color: #1D4ED8;
    }
    .share-icon-option:has(input:focus-visible),
    .share-compact-option:has(input:focus-visible) {
      outline: 2px solid #93C5FD;
      outline-offset: 2px;
    }
    .share-format-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .share-format-icon svg {
      width: 16px;
      height: 16px;
    }
    .share-choice-main {
      color: inherit;
      font-size: 12px;
      font-weight: 700;
    }
    .share-choice-sub {
      color: #71717A;
      font-size: 10px;
      font-weight: 500;
      white-space: nowrap;
    }
    .share-compact-option {
      flex-direction: column;
      gap: 1px;
      line-height: 1.15;
    }

    .embed-section-label {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .embed-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .embed-badge-internal {
      background: #DBEAFE;
      color: #1D4ED8;
    }
    .embed-badge-public {
      background: #D1FAE5;
      color: #065F46;
    }
    .embed-section-desc {
      font-size: 12px;
      color: #71717A;
    }

    .embed-code-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .embed-code-row[hidden] { display: none; }
    .embed-textarea {
      flex: 1;
      min-height: 60px;
      height: 68px;
      resize: none;
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: 11px;
      line-height: 1.5;
      padding: 8px 10px;
      border: 1px solid #E4E4E7;
      border-radius: 8px;
      background: #F9FAFB;
      color: #18181B;
      outline: none;
    }
    .embed-textarea:focus { border-color: #A1A1AA; }

    .share-qr-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border: 1px solid #E4E4E7;
      border-radius: 8px;
      background: #FAFAFA;
    }
    .share-qr-panel[hidden] { display: none; }
    .share-qr-code {
      width: 232px;
      height: 232px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
      border: 1px solid #E4E4E7;
      border-radius: 8px;
      padding: 10px;
    }
    .share-qr-code svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .share-qr-note {
      color: #52525B;
      font-size: 11px;
      line-height: 1.4;
      text-align: center;
      margin: 0;
    }
    .share-qr-copy-btn {
      flex-direction: row;
      min-height: 34px;
      padding: 8px 12px;
      border-radius: 7px;
    }

    .embed-copy-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      background: #18181B;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .embed-copy-btn:hover { background: #3F3F46; }
    .embed-copy-btn svg { width: 14px; height: 14px; }

    /* =============================================
       編集モードバナー（編集時のみ表示）
    ============================================= */
    #edit-banner {
      position: absolute;
      top: var(--app-toolbar-height); left: 0;
      width: 100%;
      min-height: 40px;
      height: auto;
      background: #fffbeb;
      border-bottom: 1px solid #fbbf24;
      display: none; /* toggleMode() で visible に切り替え */
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 7px calc(12px + var(--app-safe-right)) 7px calc(12px + var(--app-safe-left));
      pointer-events: auto;

    /* =============================================
       カスタムホットスポットマーカー
    ============================================= */
    .hs-marker,
    .marker-preview {
      --marker-bg-start: #2563eb;
      --marker-bg-end: #1d4ed8;
      --marker-border: #dbeafe;
      --marker-ink: #ffffff;
      --marker-shadow: 0 2px 8px rgba(15, 23, 42, 0.32);
    }
    /* 波紋アニメーション */
    @keyframes ripple {
      0%   { transform: scale(1);   opacity: 0.55; }
      100% { transform: scale(2.8); opacity: 0; }
    }

    .hs-marker {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: linear-gradient(180deg, var(--marker-bg-start) 0%, var(--marker-bg-end) 100%);
      border: 2px solid var(--marker-border);
      box-shadow: var(--marker-shadow);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      contain: layout;
      overflow: visible;
    }
    /* 波紋リング（::after） */
    .hs-marker::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--marker-bg-end);
      animation: ripple 2.2s ease-out infinite;
      pointer-events: none;
      z-index: -1;
    }
    /* ダイヤモンド形は波紋を円に戻す */
    .marker-shape-diamond::after {
      transform-origin: center;
      inset: 0;
      border-radius: 50%;
      animation: ripple 2.2s ease-out infinite;
    }
    .marker-preview {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(180deg, var(--marker-bg-start) 0%, var(--marker-bg-end) 100%);
      border: 2px solid var(--marker-border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .hs-marker:hover {
      transform: scale(1.08);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.72), 0 5px 14px rgba(15,23,42,0.45);
    }
    .hs-marker.marker-shape-diamond:hover {
      transform: rotate(45deg) scale(1.08);
    }
    .hs-marker-core {
      position: relative;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      color: var(--marker-ink);
    }
    .marker-icon-svg {
      width: 16px;
      height: 16px;
      display: block;
      overflow: visible;
    }

    .marker-shape-square {
      border-radius: 10px;
    }
    .marker-shape-diamond {
      border-radius: 10px;
      transform: rotate(45deg);
    }
    .marker-shape-diamond .hs-marker-core {
      transform: rotate(-45deg);
    }
    .marker-color-blue   { --marker-bg-start: #2563eb; --marker-bg-end: #1d4ed8; --marker-border: #dbeafe; --marker-ink: #ffffff; }
    .marker-color-cyan   { --marker-bg-start: #67e8f9; --marker-bg-end: #22d3ee; --marker-border: #155e75; --marker-ink: #083344; }
    .marker-color-teal   { --marker-bg-start: #0f766e; --marker-bg-end: #115e59; --marker-border: #ccfbf1; --marker-ink: #ffffff; }
    .marker-color-green  { --marker-bg-start: #15803d; --marker-bg-end: #166534; --marker-border: #dcfce7; --marker-ink: #ffffff; }
    .marker-color-lime   { --marker-bg-start: #bef264; --marker-bg-end: #84cc16; --marker-border: #3f6212; --marker-ink: #1a2e05; }
    .marker-color-yellow { --marker-bg-start: #fde047; --marker-bg-end: #facc15; --marker-border: #854d0e; --marker-ink: #422006; }
    .marker-color-orange { --marker-bg-start: #ea580c; --marker-bg-end: #c2410c; --marker-border: #ffedd5; --marker-ink: #ffffff; }
    .marker-color-red    { --marker-bg-start: #ef4444; --marker-bg-end: #b91c1c; --marker-border: #fee2e2; --marker-ink: #ffffff; }
    .marker-color-pink   { --marker-bg-start: #db2777; --marker-bg-end: #9d174d; --marker-border: #fce7f3; --marker-ink: #ffffff; }
    .marker-color-purple { --marker-bg-start: #9333ea; --marker-bg-end: #6b21a8; --marker-border: #f3e8ff; --marker-ink: #ffffff; }
    .marker-color-gray   { --marker-bg-start: #52525b; --marker-bg-end: #3f3f46; --marker-border: #f4f4f5; --marker-ink: #ffffff; }
    .marker-color-white  { --marker-bg-start: #ffffff; --marker-bg-end: #f4f4f5; --marker-border: #52525b; --marker-ink: #27272a; }
    .hs-marker.hs-marker-selected {
      box-shadow: 0 0 0 3px rgba(250,204,21,0.95), 0 5px 16px rgba(15,23,42,0.48);
    }
    .hs-marker.hs-marker-moving-source {
      opacity: 0.36;
      filter: saturate(0.55);

    .hs-move-preview-positioner {
      position: fixed;
      left: 0;

      cursor: grabbing;
      pointer-events: none;
      outline: 2px dashed #ffffff;
      outline-offset: 3px;
      box-shadow: 0 0 0 4px rgba(15,23,42,0.7), 0 8px 22px rgba(15,23,42,0.58);
    }
    .hs-marker.hs-marker-move-preview::after {
      animation: none;
      opacity: 0.24;
    }
    .hs-marker.hs-marker-draft {
      opacity: 0.58;
      cursor: default;
      pointer-events: none !important;
      outline: 2px dashed rgba(255,255,255,0.92);
      outline-offset: 3px;
      box-shadow: 0 0 0 3px rgba(15,23,42,0.42), var(--marker-shadow);
    }
    .hs-marker.hs-marker-draft::after {
      animation: none;
      opacity: 0.18;
    }
    .flat-hs-draft {
      pointer-events: none !important;
      z-index: 24;

    body.is-panning .hs-marker {
      box-shadow: none;
      transition: none;
    }
    body.is-panning .hs-marker:hover {
      transform: none;
      box-shadow: none;

    .hs-type-btn-desc  { font-size: 11px; color: #78716c; line-height: 1.3; }

    .popup-buttons {
      display: flex;
      gap: 10px;
    }
    .btn-cancel {
      flex: 1; height: 44px; min-height: 44px;

    button:disabled,
    [aria-disabled="true"] {
      opacity: 0.5;
      cursor: not-allowed !important;
    }
    [aria-disabled="true"] {
      pointer-events: none !important;
    }

    @media (max-width: 600px) {
      .hotspot-photo-actions {
        width: 100%;
      }
      body.hotspot-form-active #flat-map-inner {
        align-self: flex-start;
      }
      #hotspot-popup {
        left: calc(var(--hotspot-visual-left) + max(8px, env(safe-area-inset-left, 0px)));
        right: calc(var(--hotspot-visual-right) + max(8px, env(safe-area-inset-right, 0px)));
        top: auto;
        bottom: calc(var(--hotspot-visual-bottom) + env(safe-area-inset-bottom, 0px));
        width: auto;
        max-width: none;
        max-height: min(
          85dvh,
          calc(var(--hotspot-visual-height) - 8px),
          max(180px, calc(var(--hotspot-visual-height) - var(--app-top-offset) - 72px))
        );
        border-width: 2px 2px 0;
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -10px 32px rgba(15,23,42,0.26);
      }
      #hotspot-popup-content {
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-left: max(16px, env(safe-area-inset-left, 0px));
      }

        padding-right: max(16px, env(safe-area-inset-right, 0px));
        padding-left: max(16px, env(safe-area-inset-left, 0px));
      }

        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(12px, env(safe-area-inset-right, 0px));
      }

    /* 保存中スピナー */
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid #78350f;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .btn-save.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* =============================================
       トースト通知（成功 / エラー）
    ============================================= */
    #toast {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 18px;
      height: 46px;
      border-radius: 10px;
      font-size: 14px; font-weight: 600;
      pointer-events: none;
      opacity: 0;
      white-space: nowrap;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 300;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.success {
      background: #b7d781;
      border: 1px solid #7db53a;
      color: #2d5a00;
      box-shadow: 0 3px 14px rgba(125,181,58,0.22);
    }
    #toast.error {
      background: #fca5a5;
      border: 1px solid #f87171;
      color: #7f1d1d;
      box-shadow: 0 3px 14px rgba(239,68,68,0.22);
    }
    #toast.warning {
      background: #FEF3C7;
      border: 1px solid #F59E0B;
      color: #78350F;
      box-shadow: 0 3px 14px rgba(245,158,11,0.2);
    }
    #toast svg { width: 17px; height: 17px; flex-shrink: 0; }

    /* =============================================
       操作ヒントバー（下部中央）
    ============================================= */
    #hint-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 14px;
      height: 30px;
      background: rgba(250,250,250,0.88);
      border: 1px solid #E4E4E7;
      border-radius: 8px;
      pointer-events: none;
      white-space: nowrap;
    }
    .hint-item {
      display: flex; align-items: center; gap: 4px;
      font-size: 12px; color: #A1A1AA;
    }
    .hint-item svg { width: 13px; height: 13px; }
    .hint-sep { width: 1px; height: 14px; background: #D4D4D8; }

    /* =============================================
       シーン一覧サイドバー（左側）
    ============================================= */
    #scene-sidebar {
      position: absolute;
      top: var(--app-top-offset); left: 0;
      width: 200px;
      height: var(--app-viewport-height);
      background: rgba(255,255,255,0.93);
      border-right: 1px solid #E4E4E7;
      display: flex;
      flex-direction: column;
      pointer-events: auto;
      z-index: 90;
      overflow: hidden;
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #scene-sidebar.hidden { display: none; }
    #scene-sidebar.collapsed {
      transform: translateX(-200px);
      pointer-events: none;
    }

    #scene-sidebar-title {
      padding: 10px 10px 8px 14px;
      font-size: 11px;
      font-weight: 700;
      color: #71717A;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-bottom: 1px solid #E4E4E7;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .scene-sidebar-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    #scene-refresh-btn,
    #sidebar-collapse-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #A1A1AA;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px 4px;
      border-radius: 4px;
      flex-shrink: 0;
      transition: background 0.15s, color 0.15s, opacity 0.15s;
    }
    #scene-refresh-btn:hover:not(:disabled),
    #sidebar-collapse-btn:hover { background: #EBEBEB; color: #71717A; }
    #scene-refresh-btn:disabled {
      cursor: wait;
      opacity: 0.7;
    }
    #scene-refresh-btn svg,
    #sidebar-collapse-btn svg { width: 14px; height: 14px; }
    #scene-refresh-btn.loading svg {
      animation: spin 0.9s linear infinite;
    }

    /* 折りたたみボタン（サイドバー内） */
    
    /* 展開タブ（折りたたみ後に左端に表示） */
    #sidebar-expand-tab {
      position: absolute;
      top: calc(var(--app-top-offset) + 10px);
      left: 0;
      width: 22px;
      height: 52px;
      background: rgba(255,255,255,0.93);
      border: 1px solid #E4E4E7;
      border-left: none;
      border-radius: 0 8px 8px 0;
      box-shadow: 2px 1px 8px rgba(0,0,0,0.09);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 92;
      transition: background 0.15s;
    }
    #sidebar-expand-tab.hidden { display: none; }
    #sidebar-expand-tab:hover { background: rgba(244,244,245,0.97); }
    #sidebar-expand-tab svg { width: 13px; height: 13px; color: #71717A; }

    #scene-list {
      overflow-y: auto;
      flex: 1;
      padding: 6px 0;
    }
    #scene-list::-webkit-scrollbar { width: 4px; }
    #scene-list::-webkit-scrollbar-thumb { background: #D4D4D8; border-radius: 4px; }

    .scene-item {
      display: flex;
      align-items: center;
      min-height: 44px;
      gap: 8px;
      padding: 9px 14px;
      cursor: pointer;
      font-size: 13px;
      color: #3F3F46;
      border-left: 3px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      word-break: break-word;
      line-height: 1.35;
      white-space: nowrap;
    }
    .scene-item:hover { background: #F4F4F5; }
    button.scene-item-name {
      flex: 1;
      min-width: 0;
      min-height: 32px;
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .scene-menu-button {
      flex: 0 0 28px;
      min-height: 36px;
      border: 0;
      padding: 0;
      border-radius: 4px;
      background: transparent;
      color: inherit;
      font-size: 22px;
      cursor: pointer;
    }
    .scene-menu-button:hover { background: rgba(128,128,128,.15); }
    button.scene-item-name:focus-visible,
    .scene-menu-button:focus-visible,
    .scene-folder-item:focus-visible {
      outline: 2px solid #2d7baa;
      outline-offset: 2px;
    }
    .scene-item.active {
      background: #EFF6FF;
      border-left-color: #2d7baa;
      color: #18181B;
      font-weight: 600;
    }
    .scene-item svg {
      width: 14px; height: 14px;
      flex-shrink: 0;
      color: #A1A1AA;
    }
    .scene-item.active svg { color: #2d7baa; }
    .scene-item-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .scene-drag-handle {
      display: none;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 26px;
      margin: -4px 0 -4px -7px;
      padding: 0;
      flex: 0 0 22px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #A1A1AA;
      cursor: grab;
    }
    body.edit-mode-active .scene-drag-handle { display: inline-flex; }
    .scene-drag-handle:hover { background: #E4E4E7; color: #52525B; }
    .scene-drag-handle:active { cursor: grabbing; }
    .scene-drag-handle svg,
    .scene-item.active .scene-drag-handle svg {
      width: 14px;
      height: 16px;
      fill: currentColor;
      stroke: none;
      color: inherit;
    }
    .scene-reorder-saving .scene-drag-handle,
    .scene-drag-handle[aria-disabled="true"] {
      opacity: 0.4;
      cursor: wait;
    }
    .scene-item.dragging {
      opacity: 0.55;
      background: #F4F4F5;
    }
    .scene-drop-zone {
      display: none;
      position: relative;
      height: 2px;
      margin: 0 12px;
      pointer-events: auto;
      transition: height 0.1s;
    }
    body.edit-mode-active .scene-drop-zone { display: block; }
    .scene-list-reordering .scene-drop-zone {
      height: 10px;
    }
    .scene-list-reordering .scene-drop-zone::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 4px;
      height: 2px;
      border-radius: 2px;
      background: transparent;
    }
    .scene-list-reordering .scene-drop-zone.active::after {
      background: #2d7baa;
    }

    /* フォルダアイテム */
    .scene-folder-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      font-size: 13px;
      cursor: pointer;
      border-left: 3px solid transparent;
      color: #3f3f46;
      word-break: break-word;
      line-height: 1.35;
      white-space: nowrap;
    }
    .scene-folder-item:hover { background: #F4F4F5; }
    .scene-folder-item svg { width: 14px; height: 14px; flex-shrink: 0; color: #f59e0b; }
    .scene-folder-item-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

    @media (pointer: coarse) {
      .scene-menu-button { flex-basis: 44px; min-height: 44px; }
      button.scene-item-name { min-height: 44px; }
      body.edit-mode-active .scene-drag-handle,
      body.edit-mode-active .scene-drop-zone { display: none; }
    }
    @media (max-width: 600px) {
      body.edit-mode-active .scene-drag-handle,
      body.edit-mode-active .scene-drop-zone { display: none; }
    }

    /* サイドバー 戻るボタン */
    #sidebar-back-btn {
      display: none;
      align-items: center;
      gap: 6px;
      width: 100%;
      padding: 7px 14px;
      background: #F4F4F5;
      border: none;
      border-bottom: 1px solid #E4E4E7;
      font-size: 12px;
      font-weight: 600;
      color: #3f3f46;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
    }
    #sidebar-back-btn.visible { display: flex; }
    #sidebar-back-btn:hover { background: #E4E4E7; }
    #sidebar-back-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
    #scene-context-menu {
      position: fixed;
      display: none;
      min-width: 168px;
      padding: 6px;
      background: #FFFFFF;
      border: 1px solid #E4E4E7;
      border-radius: 12px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
      pointer-events: auto;
      z-index: 260;
    }
    #scene-context-menu.visible { display: block; }
    .scene-context-menu-btn {
      width: 100%;
      padding: 9px 10px;
      border: none;
      border-radius: 8px;
      background: none;
      text-align: left;

      font-family: inherit;
      color: #18181B;
      cursor: pointer;

    .scene-context-menu-btn:hover { background: #F4F4F5; }
    .scene-context-menu-btn.danger { color: #ef4444; }
    .scene-context-menu-btn:disabled {
      color: #A1A1AA;
      cursor: not-allowed;
      background: transparent;
    }

    #scene-settings-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(24,24,27,0.30);
      z-index: 275;
      pointer-events: auto;
    }
    #scene-settings-backdrop.visible { display: flex; }
    #scene-settings-dialog {
      width: 420px;
      max-width: calc(100vw - 24px);
      max-height: calc(var(--app-viewport-base) - 24px);
      overflow-y: auto;
      background: #FFFFFF;
      border: 1px solid #E4E4E7;
      border-radius: 16px;
      box-shadow: 0 14px 36px rgba(0,0,0,0.18);
      padding: 18px;
      animation: popIn 0.18s ease;
    }
    .scene-settings-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 14px;
    }
    .scene-settings-reference {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #F8FAFC;
      word-break: break-word;
    }
    .scene-settings-label,
    .scene-settings-fieldset legend {
      font-size: 12px;
      font-weight: 700;
      color: #52525B;
    }
    #scene-settings-name {
      width: 100%;
      min-width: 0;
      font-size: 14px;
      color: #18181B;
      background: #FFFFFF;
    }
    .scene-settings-fieldset {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      min-width: 0;
      padding: 10px 12px 12px;
      border: 1px solid #E4E4E7;
      border-radius: 10px;
    }

    .scene-settings-choice {

      min-height: 36px;

      border: 1px solid #E4E4E7;
      border-radius: 8px;

      color: #27272A;
      font-size: 13px;
      cursor: pointer;

    .scene-settings-fieldset:disabled .scene-settings-choice {

      cursor: not-allowed;

    .scene-settings-number-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      grid-column: 1 / -1;
      margin-top: 2px;
    }
    .scene-settings-number-row label {
      font-size: 12px;
      font-weight: 600;
      color: #3F3F46;
    }
    #scene-settings-north-value {
      width: 132px;
      max-width: 48%;
      padding: 8px 9px;
      border: 1px solid #D4D4D8;
      border-radius: 8px;

    .scene-settings-note {

      padding: 8px 10px;

      font-size: 12px;

      font-size: 12px;

    #scene-settings-save-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    @media (max-width: 480px) {

    /* =============================================

    #fullscreen-btn {

      top: calc(var(--app-top-offset) + 54px);

      width: 36px;
      height: 36px;
      background: rgba(0,0,0,0.30);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 95;
      font-size: 17px;
      line-height: 1;
      transition: background 0.2s;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    #btn-home.visible { display: flex; }
    #btn-home:hover { background: rgba(0,0,0,0.52); }
    body.is-fullscreen #btn-home { top: 54px; }

    /* =============================================
       画質切り替えボタン（写真右上・ホームボタンの下）
    ============================================= */
    #quality-toggle-btn {
      position: absolute;
      top: calc(var(--app-top-offset) + 98px);
      right: calc(10px + var(--app-safe-right));
      height: 28px;
      padding: 0 10px;
      background: rgba(0,0,0,0.38);
      border: none;
      border-radius: 7px;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 5px;
      pointer-events: auto;
      z-index: 95;
      font-size: 11px;
      font-weight: 700;
      font-family: inherit;
      color: rgba(255,255,255,0.92);
      white-space: nowrap;
      transition: background 0.2s;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    #quality-toggle-btn.visible { display: flex; }
    #quality-toggle-btn:hover { background: rgba(0,0,0,0.58); }
    #quality-toggle-btn .qt-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #quality-toggle-btn.mode-fast .qt-dot { background: #86efac; }  /* green */
    #quality-toggle-btn.mode-high .qt-dot { background: #fbbf24; }  /* amber */
    body.is-fullscreen #quality-toggle-btn { top: 98px; }

    /* =============================================
       ジャイロ（DeviceOrientation）トグルボタン
    ============================================= */
    #gyro-toggle-btn {
      position: absolute;
      top: calc(var(--app-top-offset) + 136px);
      right: calc(10px + var(--app-safe-right));
      width: 36px;
      height: 36px;
      background: rgba(0,0,0,0.30);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      z-index: 95;
      transition: background 0.2s;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }
    #gyro-toggle-btn.visible { display: flex; }
    #gyro-toggle-btn:hover { background: rgba(0,0,0,0.52); }
    #gyro-toggle-btn svg {
      width: 18px; height: 18px;
      color: rgba(255,255,255,0.90);
      pointer-events: none;
      transition: color 0.2s;
    }
    /* ON状態: ボタン背景をハイライト＋アイコンを水色に */
    #gyro-toggle-btn.gyro-active {
      background: rgba(45,123,170,0.72);
    }
    #gyro-toggle-btn.gyro-active:hover {
      background: rgba(45,123,170,0.90);
    }
    #gyro-toggle-btn.gyro-active svg {
      color: #ffffff;
    }
    body.is-fullscreen #gyro-toggle-btn { top: 136px; }

    body.css-fullscreen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      margin: 0;
      overflow: hidden;
      z-index: 9999;
    }

    /* 幅が狭い場合はサイドバーを下部に切り替える（600px以下） */
    @media (max-width: 600px) {
      #scene-sidebar {
        top: auto;
        bottom: 0;
        left: 0;
        width: 100%;
        height: var(--app-scene-strip-height);
        padding-bottom: var(--app-safe-bottom);
        border-right: none;
        border-top: 1px solid #E4E4E7;
        flex-direction: row;
        transform: none !important; /* モバイルは折りたたみ無効 */
      }
      #scene-sidebar-title { display: none; }
      #scene-list {
        display: flex;
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 0;
      }
      .scene-item {
        flex-direction: column;
        gap: 3px;
        padding: 8px 12px;
        min-width: 90px;
        text-align: center;
        border-left: none;
        border-top: 3px solid transparent;
        font-size: 11px;
        white-space: normal;
      }
      .scene-item.active { border-left-color: transparent; border-top-color: #2d7baa; }
      #panorama.with-sidebar {
        left: 0;
        width: 100%;
        height: auto;
        bottom: var(--app-scene-strip-height);
        top: var(--app-top-offset);
      }
      .marker-style-controls {
        grid-template-columns: 1fr;
      }
      /* モバイルでは折りたたみ関連UIを非表示 */
      #sidebar-collapse-btn,
      #sidebar-expand-tab { display: none !important; }
    }

    /* =============================================
       ローディング画面（写真エリアのみカバー）
    ============================================= */
    #loading {
      position: fixed;
      top: var(--app-top-offset);
      left: 0;
      right: 0;
      bottom: 0;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 999;
      transition: left 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .loading-ring {
      width: 42px; height: 42px;
      border: 3px solid #fef3c7;
      border-top-color: #fbbf24;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loading p { font-size: 14px; color: #71717A; }
    #loading.hidden { display: none; }

    /* =============================================
       シーン遷移オーバーレイ（暗転クロスフェード）
    ============================================= */
    #scene-transition-overlay {
      position: fixed;
      top: var(--app-top-offset);
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 500;
      transition: left 0.28s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease;
    }
    #scene-transition-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    @media (max-width: 600px) {
      #scene-transition-overlay { bottom: var(--app-scene-strip-height); }
    }

    /* =============================================
       アップロードボタン（サイドバー内）
    ============================================= */
    #upload-btn {
      display: none;
      width: calc(100% - 16px);
      min-height: 44px;
      margin: 8px;
      padding: 7px 10px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      text-align: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #upload-btn:hover { background: #1558b0; }

    #drive-folder-actions {
      display: none;
      width: calc(100% - 16px);
      margin: 0 8px 8px;
      gap: 4px;
      flex: 0 0 auto;
      min-width: 0;
    }

    #open-folder-btn,
    #open-hotspot-folder-btn {
      display: none;
      width: auto;
      min-height: 44px;
      min-width: 0;
      padding: 6px 5px;
      background: transparent;
      color: #1a73e8;
      border: 1px solid #1a73e8;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      text-align: center;
      flex: 1 1 0;
      transition: background 0.15s, color 0.15s, opacity 0.15s;
    }
    #open-folder-btn:hover:not(:disabled),
    #open-hotspot-folder-btn:hover:not(:disabled) { background: #e8f0fe; }
    #open-folder-btn svg,
    #open-hotspot-folder-btn svg {
      width: 13px;
      height: 13px;
      vertical-align: -1px;
      margin-right: 4px;
    }
    #open-hotspot-folder-btn.loading,
    #open-hotspot-folder-btn:disabled {
      cursor: wait;
      opacity: 0.65;
    }
    .scene-action-label-compact { display: none; }

    /* =============================================
       2D平面マップ表示コンテナ
    ============================================= */
    #flat-map-container {
      position: fixed;
      top: var(--app-top-offset);
      left: 0;
      width: 100%;
      height: var(--app-viewport-height);
      display: none;
      align-items: center;
      justify-content: center;
      overflow: auto;
      background: #1a1a1a;
      z-index: 1;
    }
    #flat-map-container.with-sidebar {
      left: 200px;
      width: calc(100% - 200px);
    }
    @media (max-width: 600px) {
      #flat-map-container.with-sidebar {
        left: 0;
        width: 100%;
        top: var(--app-top-offset);
        bottom: var(--app-scene-strip-height);
        height: auto;
      }
    }
    #flat-map-inner {
      position: relative;
      display: inline-block;
      line-height: 0;
    }
    #flat-map-img {
      max-width: 100%;
      max-height: var(--app-viewport-height);
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    .flat-hs-marker {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      cursor: pointer;
      z-index: 10;
    }

    /* =============================================
       public閲覧向けモバイルUI
    ============================================= */
    #mobile-scene-sheet-toggle { display: none; }

    @media (max-width: 700px) {
      body.mobile-public-view #topbar {
        display: none;
      }
      body.mobile-public-view #hint-bar {
        bottom: calc(var(--app-public-sheet-height) + 12px);
        max-width: calc(100vw - 24px);
        overflow: hidden;
      }
      body.mobile-public-view #toast {
        bottom: calc(var(--app-public-sheet-height) + 60px);
        width: max-content;
        max-width: calc(100vw - 24px);
        min-height: 46px;
        height: auto;
        padding: 8px 14px;
        white-space: normal;
        text-align: center;
      }
      body.mobile-public-view.mobile-scene-sheet-expanded #hint-bar {
        bottom: calc(var(--app-public-sheet-expanded-height) + 12px);
      }
      body.mobile-public-view.mobile-scene-sheet-expanded #toast {
        bottom: calc(var(--app-public-sheet-expanded-height) + 60px);
      }
      body.mobile-public-view #scene-sidebar {
        top: auto;
        bottom: 0;
        left: 0;
        width: 100%;
        height: var(--app-public-sheet-height);
        padding-bottom: var(--app-safe-bottom);
        border-right: none;
        border-top: 1px solid #D4D4D8;
        border-radius: 14px 14px 0 0;
        background: rgba(255,255,255,0.96);
        box-shadow: 0 -8px 24px rgba(0,0,0,0.16);
        flex-direction: column;
        transform: none !important;
        z-index: 120;
      }
      body.mobile-public-view #scene-sidebar.mobile-expanded {
        height: var(--app-public-sheet-expanded-height);
      }
      body.mobile-public-view #mobile-scene-sheet-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 56px;
        border: none;
        background: transparent;
        color: #18181B;
        font-size: 14px;
        font-weight: 700;
        font-family: inherit;
        line-height: 1.2;
        cursor: pointer;
        pointer-events: auto;
      }
      body.mobile-public-view #mobile-scene-sheet-toggle::before {
        content: '';
        position: absolute;
        top: 7px;
        left: 50%;
        width: 42px;
        height: 4px;
        border-radius: 999px;
        background: #D4D4D8;
        transform: translateX(-50%);
      }
      body.mobile-public-view #scene-sidebar-title,
      body.mobile-public-view #scene-list,
      body.mobile-public-view #sidebar-back-btn {
        display: none;
      }
      body.mobile-public-view #scene-sidebar.mobile-expanded #scene-sidebar-title {
        display: flex;
        height: 40px;
        min-height: 40px;
        padding: 0 14px;
      }
      body.mobile-public-view #scene-sidebar.mobile-expanded #scene-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 4px 10px 12px;
      }
      body.mobile-public-view #scene-sidebar.mobile-expanded #sidebar-back-btn.visible {
        display: flex;
        margin: 0 10px 4px;
        width: auto;
        min-height: 38px;
      }
      body.mobile-public-view .scene-item,
      body.mobile-public-view .scene-folder-item {
        min-height: 44px;
        width: 100%;
        flex-direction: row;
        justify-content: flex-start;
        gap: 8px;
        padding: 9px 10px;
        border-top: none;
        border-left: 3px solid transparent;
        text-align: left;
        font-size: 13px;
      }
      body.mobile-public-view .scene-item.active {
        border-top-color: transparent;
        border-left-color: #2d7baa;
        background: #F0F9FF;
      }
      body.mobile-public-view #panorama.with-sidebar {
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        bottom: var(--app-public-sheet-height);
      }
      body.mobile-public-view.mobile-scene-sheet-expanded #panorama.with-sidebar {
        height: auto;
        bottom: var(--app-public-sheet-expanded-height);
      }
      body.mobile-public-view #flat-map-container.with-sidebar {
        top: 0;
        left: 0;
        bottom: var(--app-public-sheet-height);
        height: auto;
        max-height: none;
      }
      body.mobile-public-view.mobile-scene-sheet-expanded #flat-map-container.with-sidebar {
        bottom: var(--app-public-sheet-expanded-height);
        height: auto;
        max-height: none;
      }
      body.mobile-public-view #flat-map-img {
        max-width: 100vw;
        max-height: calc(var(--app-viewport-height) - var(--app-public-sheet-height));
      }
      body.mobile-public-view #scene-transition-overlay {
        bottom: var(--app-public-sheet-height);
      }
      body.mobile-public-view.mobile-scene-sheet-expanded #scene-transition-overlay {
        bottom: var(--app-public-sheet-expanded-height);
      }
      body.mobile-public-view #fullscreen-btn,
      body.mobile-public-view #btn-home,
      body.mobile-public-view #gyro-toggle-btn {
        width: 44px;
        height: 44px;
        right: calc(12px + var(--app-safe-right));
        border-radius: 12px;
      }
      body.mobile-public-view #fullscreen-btn { top: calc(var(--app-top-offset) + 12px); }
      body.mobile-public-view #btn-home { top: calc(var(--app-top-offset) + 64px); }
      body.mobile-public-view #quality-toggle-btn {
        top: calc(var(--app-top-offset) + 116px);
        right: calc(12px + var(--app-safe-right));
        min-width: 44px;
        height: 44px;
        padding: 0 12px;
        border-radius: 12px;
        font-size: 12px;
      }
      body.mobile-public-view #gyro-toggle-btn { top: calc(var(--app-top-offset) + 168px); }
      body.mobile-public-view .info-popup.mobile-info-sheet {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: calc(var(--app-public-sheet-height) + 10px);
        top: auto;
        width: auto;
        max-width: none;
        max-height: min(70dvh, 420px);
        overflow-y: auto;
        padding: 18px;
        border-radius: 18px 18px 14px 14px;
        box-shadow: 0 -10px 28px rgba(0,0,0,0.22);
        animation: mobileSheetIn 0.18s ease;
      }
      body.mobile-public-view.mobile-scene-sheet-expanded .info-popup.mobile-info-sheet {
        bottom: calc(var(--app-public-sheet-expanded-height) + 10px);
      }
      body.mobile-public-view .info-popup-close {
        min-width: 44px;
        min-height: 44px;
        font-size: 28px;
      }
      body.mobile-public-view .info-popup-title {
        font-size: 17px;
      }
      body.mobile-public-view .info-popup-body {
        font-size: 14px;
        line-height: 1.65;
      }
      body.mobile-public-view .info-popup-photo {
        max-height: 220px;
      }
    }

    @keyframes mobileSheetIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* アップロードモーダル */
    #upload-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      z-index: 2000;
    }
    #upload-modal-inner {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      width: 340px;
      max-width: calc(100vw - 32px);
      box-shadow: 0 12px 36px rgba(0,0,0,0.22);
    }
    #upload-modal h3 { margin: 0 0 16px; font-size: 16px; color: #18181B; }
    #upload-modal label { font-size: 13px; color: #3F3F46; }
    #upload-modal .upload-type-row { margin-bottom: 16px; }

    #upload-home-help { margin: 5px 0 0 23px; color: #71717A; font-size: 11px; line-height: 1.4; }
    #upload-modal .upload-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    #upload-modal .btn-upload-cancel {
      padding: 8px 16px;
      background: #F4F4F5;
      border: 1.5px solid #E4E4E7;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #71717A;
      cursor: pointer;
      font-family: inherit;
    }
    #upload-modal .btn-upload-cancel:hover { background: #E4E4E7; }
    #upload-confirm-btn {
      padding: 8px 18px;
      background: #1a73e8;

      border-radius: 8px;

      font-weight: 700;

    #upload-file-input { width: 100%; margin-bottom: 12px; font-size: 13px; }

    /* =============================================
       クイズ（はてな）モーダル / フリップカード
    ============================================= */
    #quiz-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #quiz-modal-overlay.hidden { display: none; }

    .quiz-card-container {
      perspective: 1000px;
      max-height: calc(100dvh - 64px);
      padding: 4px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .quiz-attachments {
      width: min(300px, calc(100vw - 40px));
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      background: var(--theme-surface);
      color: var(--theme-text);
    }
    .quiz-attachments .info-popup-photo {
      max-height: 160px;
      object-fit: contain;
    }
    #quiz-flip-button, .compatible-retry-button {
      display: block;
      min-height: 44px;
      margin: 12px auto 0;
      padding: 10px 20px;
      border: 0;
      border-radius: 8px;
      background: #fbbf24;
      color: #422006;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .quiz-card {
      width: min(300px, calc(100vw - 40px));
      height: min(400px, calc(var(--app-viewport-base) - 120px));
      position: relative;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      cursor: pointer;
    }
    .quiz-card.is-flipped {
      transform: rotateY(180deg);
    }

    .quiz-card-front,
    .quiz-card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 16px;
      padding: 28px 24px 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.28);
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    .quiz-card-front {
      background: #ffffff;
      align-items: flex-start;
      justify-content: center;
    }
    .quiz-card-front h3 {
      font-size: 13px;
      font-weight: 700;
      color: #71717A;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 0;
    }
    .quiz-card-front p {
      font-size: 17px;
      font-weight: 600;
      color: #18181B;
      line-height: 1.55;
      margin: 0;
    }
    .flip-hint {
      font-size: 12px;
      color: #A1A1AA;
      align-self: flex-end;
    }

    .quiz-card-back {
      background: #1e3a5f;
      transform: rotateY(180deg);
      align-items: flex-start;
      justify-content: center;
    }
    .quiz-card-back h3 {
      font-size: 13px;
      font-weight: 700;
      color: #93c5fd;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 0;
    }
    .quiz-card-back p {
      font-size: 17px;
      font-weight: 600;
      color: #ffffff;
      line-height: 1.55;
      margin: 0;
    }
    #quiz-card-link {
      display: inline-block;
      font-size: 13px;
      font-weight: 600;
      color: #93c5fd;
      text-decoration: underline;
      align-self: flex-start;
    }
    #quiz-card-link.hidden { display: none; }

    #quiz-modal-close {
      position: fixed;
      top: 20px;
      right: 24px;
      background: rgba(255,255,255,0.18);
      border: none;
      color: #ffffff;
      font-size: 24px;
      line-height: 1;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;

    ============================================= */
    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
    body.photo-lightbox-open {
      overflow: hidden;
    }
    .photo-lightbox[hidden] {
      display: none !important;
    }
    .photo-lightbox {
      position: fixed;
      inset: 0;
      z-index: 12000;
      box-sizing: border-box;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      padding:
        max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
      display: flex;
      overflow: hidden;
      isolation: isolate;
      color: var(--theme-text);
      overscroll-behavior: contain;
    }
    .photo-lightbox-backdrop {
      position: absolute;
      inset: 0;
      z-index: -1;
      background: rgba(3, 7, 18, 0.90);
      cursor: zoom-out;
    }
    html[data-theme="dark"] .photo-lightbox-backdrop {
      background: rgba(0, 0, 0, 0.94);
    }
    .photo-lightbox-shell {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .photo-lightbox-toolbar {
      flex: 0 0 auto;
      align-self: center;
      max-width: 100%;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px;
      border: 1px solid var(--theme-border-strong);
      border-radius: 13px;
      background: var(--theme-surface-translucent);
      box-shadow: 0 8px 28px rgba(0,0,0,0.28);
      pointer-events: auto;
    }
    .photo-lightbox-toolbar button {
      min-width: 44px;
      height: 44px;
      padding: 0 10px;
      border: 1px solid var(--theme-border);
      border-radius: 9px;
      background: var(--theme-surface-subtle);
      color: var(--theme-text);
      font: 700 16px/1 inherit;
      cursor: pointer;
    }
    .photo-lightbox-toolbar button:hover {
      background: var(--theme-surface-hover);
    }
    .photo-lightbox-toolbar button:focus-visible {
      outline: 3px solid var(--theme-focus-ring);
      outline-offset: 2px;
    }
    #photo-lightbox-reset {
      font-size: 12px;
    }
    #photo-lightbox-close {
      margin-left: 6px;
      font-size: 24px;
      font-weight: 400;
    }
    .photo-lightbox-stage {
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 10px;
      cursor: default;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .photo-lightbox-stage.can-pan {
      cursor: grab;
    }
    .photo-lightbox-stage.is-dragging {
      cursor: grabbing;
    }
    #photo-lightbox-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      transform-origin: center center;
      pointer-events: auto;
      user-select: none;
      -webkit-user-drag: none;
      will-change: transform;
    }
    @media (max-width: 600px), (max-height: 480px) {
      .photo-lightbox {
        padding:
          max(4px, env(safe-area-inset-top))
          max(4px, env(safe-area-inset-right))
          max(4px, env(safe-area-inset-bottom))
          max(4px, env(safe-area-inset-left));
      }
      .photo-lightbox-shell { gap: 4px; }
      .photo-lightbox-toolbar { padding: 3px; gap: 3px; }
      .photo-lightbox-toolbar button {
        min-width: 44px;

      #photo-lightbox-close { margin-left: 2px; }
