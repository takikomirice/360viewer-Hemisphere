// =============================================
//  モード切り替え
// =============================================
function toggleMode(options) {
  var opts = options || {};
  if (!canEdit) {
    if (isHotspotFormSessionActive()) closePopup({ silent: true });
    isEditMode = false;
    document.body.classList.remove('edit-mode-active');
    scheduleAppLayoutMetrics();
    closePopup();
    closeSceneContextMenu();
    closeHotspotContextMenu();
    closeBulkInputDropdown();
    syncDriveFolderButtons();
    syncSceneActionButtons();
    return;
  }
  if (isHotspotFormSessionActive()) {
    if (opts.forceExit && isEditMode) {
      closePopup({ silent: true });
    } else if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('toggle-mode')) {
      return false;
    }
  }
  if (!isEditMode && !opts.fullscreenExitCompleted && (isFullscreenActive_() || fullscreenEntryPromise)) {
    if (editModeFullscreenExitPending) return false;
    editModeFullscreenExitPending = true;
    fullscreenRequestGeneration += 1;
    return exitFullscreenBeforeEdit_().then(function (exited) {
      editModeFullscreenExitPending = false;
      if (!exited || isEditMode) {
        if (!exited) showToast('全画面表示を終了できないため、編集モードへ切り替えられませんでした。', 'error');
        return false;
      }
      var nextOptions = Object.assign({}, opts, { fullscreenExitCompleted: true });
      return toggleMode(nextOptions);
    });
  }
  stopGyroIfActive('mode');
  isEditMode = !isEditMode;
  document.body.classList.toggle('edit-mode-active', isEditMode);
  if (!isEditMode) {
    finishSceneReorderDrag();
    cancelHotspotMove('編集モードを終了したため移動をキャンセルしました。', { silent: true });
  }

  var topbar     = document.getElementById('topbar');
  var badge      = document.getElementById('mode-badge');
  var modeLabel  = document.getElementById('mode-label');
  var toggleLbl  = document.getElementById('toggle-label');
  var toggleIco  = document.getElementById('toggle-icon');
  var editBanner = document.getElementById('edit-banner');
  var panoramaEl = document.getElementById('panorama');
  var sidebar    = document.getElementById('scene-sidebar');
  var expandTab  = document.getElementById('sidebar-expand-tab');

  var bulkInputGroup = document.getElementById('bulk-input-group');

  var uploadBtn = document.getElementById('upload-btn');
  var openFolderBtn = document.getElementById('open-folder-btn');
  var openHotspotFolderBtn = document.getElementById('open-hotspot-folder-btn');
  var openHotspotFolderTopbarBtn = document.getElementById('open-hotspot-folder-topbar-btn');

  if (isEditMode) {
    // --- 編集モードへ ---
    closePhotoLightbox({ restoreFocus: false });
    if (bulkInputGroup) bulkInputGroup.style.display = 'flex';
    if (uploadBtn) uploadBtn.style.display = 'block';
    topbar.classList.add('edit-active');
    badge.classList.add('edit-active');
    modeLabel.textContent = '編集中';
    badge.setAttribute('aria-label', '編集中');
    toggleLbl.textContent = '閲覧モード';
    document.getElementById('mode-toggle').setAttribute('aria-label', '閲覧モードに切り替える');
    document.getElementById('mode-toggle').title = '閲覧モードに切り替える';
    toggleIco.innerHTML =
      '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>' +
      '<circle cx="12" cy="12" r="3"/>';
    editBanner.classList.add('visible');
    sidebar.classList.add('with-banner');
    expandTab.classList.add('with-banner');
    panoramaEl.style.cursor = 'crosshair';
    if (viewer) viewer.stopAutoRotate();

    closeActiveInfoPopup({ restoreFocus: false });

    // 2Dモード: 編集用カーソルとバナーテキスト更新
    if (is2DMode) {
      var flatImg = document.getElementById('flat-map-img');
      if (flatImg) flatImg.style.cursor = 'crosshair';
      var editBannerSpan = editBanner.querySelector('span');
      if (editBannerSpan) editBannerSpan.textContent = '編集モードが有効です。2D画像の任意の場所をクリックしてホットスポットを追加できます。';
      render2DHotspots(current2DHotspots); // コンテキストメニューイベントを付け替え
    } else {
      var editBannerSpan = editBanner.querySelector('span');
      if (editBannerSpan) editBannerSpan.textContent = '編集モードが有効です。360度画像の任意の場所をクリックしてホットスポットを追加できます。';
    }

  } else {
    // --- 閲覧モードへ ---
    if (bulkInputGroup) bulkInputGroup.style.display = 'none';
    if (uploadBtn) uploadBtn.style.display = 'none';
    if (openFolderBtn) openFolderBtn.style.display = 'none';
    if (openHotspotFolderBtn) openHotspotFolderBtn.style.display = 'none';
    if (openHotspotFolderTopbarBtn) openHotspotFolderTopbarBtn.style.display = 'none';
    topbar.classList.remove('edit-active');
    badge.classList.remove('edit-active');
    modeLabel.textContent = '閲覧中';
    badge.setAttribute('aria-label', '閲覧中');
    toggleLbl.textContent = '編集モード';
    document.getElementById('mode-toggle').setAttribute('aria-label', '編集モードに切り替える');
    document.getElementById('mode-toggle').title = '編集モードに切り替える';
    toggleIco.innerHTML =
      '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>' +
      '<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>';
    editBanner.classList.remove('visible');
    sidebar.classList.remove('with-banner');
    expandTab.classList.remove('with-banner');
    panoramaEl.style.cursor = 'grab';
    closePopup();
    editModeDragStart = null;
    editModeWasDragging = false;
    if (viewer) viewer.startAutoRotate(-1.5);

    // 2Dモード: 閲覧用カーソルに戻す
    if (is2DMode) {
      var flatImg = document.getElementById('flat-map-img');
      if (flatImg) flatImg.style.cursor = 'default';
      render2DHotspots(current2DHotspots); // コンテキストメニューイベントを取り除いて再描画
    }
  }
  setSceneReorderSaving(sceneReorderState.saving);
  syncDriveFolderButtons();
  syncSceneActionButtons();
  if (isEditMode) clearHotspotCache();
  startSceneMetadataPrefetchQueue(allImages);
  scheduleAppLayoutMetrics();
  revealActiveSceneCard();
}

function shouldIgnorePanoramaPointer(evt) {
  return !!(evt.target && evt.target.closest('#topbar, #edit-banner, #hotspot-popup, #hotspot-audio-editor-dialog, #scene-sidebar, #scene-context-menu, #hotspot-context-menu, #scene-properties-backdrop, #photo-lightbox, .hs-marker, .info-popup, #fullscreen-btn, #gyro-toggle-btn'));
}

function shouldIgnoreGyroStopEvent(evt) {
  return !!(evt && evt.target && evt.target.closest('#gyro-toggle-btn'));
}

function setPanningState(isActive) {
  isPanning = isActive;
  document.body.classList.toggle('is-panning', isActive);
}

function onPanoramaPointerDown(evt) {
  if (!shouldIgnoreGyroStopEvent(evt)) {
    stopGyroIfActive('manual-pointer');
  }
  if (shouldIgnorePanoramaPointer(evt)) return;
  setPanningState(true);
}

function onPanoramaPointerUp() {
  if (!isPanning) return;
  setPanningState(false);
}

// =============================================
//  編集モード: ドラッグとクリックの判別（mousedown/move/up）
// =============================================
function onPanoramaMouseDown(evt) {
  if (!canEdit || !isEditMode) return;
  if (shouldIgnorePanoramaPointer(evt)) return;
  editModeDragStart   = { x: evt.clientX, y: evt.clientY };
  editModeWasDragging = false;
}

function onPanoramaMouseMove(evt) {
  if (!canEdit || !isEditMode || !editModeDragStart) return;
  var dx = evt.clientX - editModeDragStart.x;
  var dy = evt.clientY - editModeDragStart.y;
  if (dx * dx + dy * dy > EDIT_MODE_DRAG_THRESHOLD_PX * EDIT_MODE_DRAG_THRESHOLD_PX) {
    editModeWasDragging = true;
  }
}

function onPanoramaMouseUp() {
  editModeDragStart = null;
}

// =============================================
//  編集モード: パノラマクリックで座標取得
// =============================================
function onPanoramaClick(evt) {
  if (!shouldIgnoreGyroStopEvent(evt)) {
    stopGyroIfActive('manual-click');
  }
  if (!canEdit || !isEditMode) return;
  if (suppressNextPanoramaClick) {
    suppressNextPanoramaClick = false;
    return;
  }
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('add-hotspot', { silent: true })) return;

  // ドラッグ後のクリックは無視（ホットスポット追加を開かない）
  if (editModeWasDragging) {
    editModeWasDragging = false;
    return;
  }
  editModeWasDragging = false;

  // UIコントロールへのクリックは除外
  if (shouldIgnorePanoramaPointer(evt)) return;

  // ── 移動モード ──────────────────────────────────────
  if (isMovingHotspot) {
    commitHotspotMove(evt);
    return;
  }

  // ── 通常モード: 新規ホットスポット追加 ───────────────
  try {
    // Pannellum APIでマウス座標 → パノラマ座標（Pitch/Yaw）に変換
    var coords = viewer.mouseEventToCoords(evt);
    pendingPitch = coords[0];
    pendingYaw   = coords[1];
    openPopup(evt.clientX, evt.clientY);
  } catch (e) {
    showToast('座標の取得に失敗しました。再度クリックしてください。', 'error');
  }
}

// =============================================
//  入力ポップアップの開閉
// =============================================

/**
 * ホットスポット入力ポップアップを開く
 *
 * @param {number} clientX   クリック位置X（画面座標）
 * @param {number} clientY   クリック位置Y（画面座標）
 * @param {Object} [editArgs] 編集時: 既存ホットスポットのargs。未指定なら新規追加
 */
function openPopup(clientX, clientY, editArgs) {
  if (!canEdit) return;
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('open-hotspot-form')) return false;
  if (!canStartHotspotMutation()) return false;
  if ((hotspotMoveState.active || hotspotMoveState.previewElement) &&
      !cancelHotspotMove('編集画面を開いたため移動をキャンセルしました。', { silent: true })) {
    return false;
  }
  if (!editArgs && (pendingPitch === null || pendingYaw === null ||
      !isFinite(pendingPitch) || !isFinite(pendingYaw))) {
    showToast('座標データがありません。再度クリックしてください。', 'error');
    return false;
  }
  var popup = document.getElementById('hotspot-popup');
  var inFolderMode = !!(allImages && allImages.length > 0);

  if (editArgs) {
    // 編集モード: 既存データを入力欄にセット
    editingHotspot = editArgs;
    pendingPitch   = editArgs.pitch;
    pendingYaw     = editArgs.yaw;
    document.getElementById('input-label').value    = editArgs.label || '';
    document.getElementById('input-link-url').value = editArgs.linkUrl || '';
    document.getElementById('marker-shape').value   = normalizeMarkerShape(editArgs.markerShape);
    document.getElementById('marker-color').value   = normalizeMarkerColor(editArgs.markerColor);
    setMarkerIconSelectValue(editArgs.markerIcon, true);
    syncMarkerStyleSummaryFromInputs();
    var isQuizEdit = normalizeMarkerIcon(editArgs.markerIcon) === 'quiz';
    if (isQuizEdit) {
      var parts = (editArgs.description || '').split('|');
      document.getElementById('quiz-input-question').value = parts[0] || '';
      document.getElementById('quiz-input-answer').value   = parts.length > 1 ? parts[1] : '';
      document.getElementById('input-desc').value = '';
    } else {
      document.getElementById('input-desc').value = editArgs.description || '';
    }
    setQuizDescMode(isQuizEdit);
    document.getElementById('popup-header-title').textContent =
      isQuizEdit ? 'クイズスポットを編集' : 'ホットスポットを編集';
    document.getElementById('save-label').textContent = '更新する';
  } else {
    // 新規追加モード
    editingHotspot = null;
    document.getElementById('input-label').value         = '';
    document.getElementById('input-desc').value          = '';
    document.getElementById('quiz-input-question').value = '';
    document.getElementById('quiz-input-answer').value   = '';
    document.getElementById('input-link-url').value      = '';
    setQuizDescMode(false);
    syncMarkerStyleInputsFromPreference();
    document.getElementById('popup-header-title').textContent = 'ホットスポットを追加';
    document.getElementById('save-label').textContent = '保存する';
  }

  // 写真アップロードは全モード、既存シーン／ジャンプ候補はフォルダモードで構築する。
  buildPhotoSelect(editArgs ? (editArgs.photoId || '') : '');
  if (inFolderMode) {
    buildJumpSceneSelect(editArgs ? (editArgs.jumpSceneId || '') : '');
  }

  document.getElementById('input-label').classList.remove('error');
  document.getElementById('input-jump-scene').classList.remove('error');

  beginHotspotFormSession(clientX, clientY, !!editArgs);
  initializeHotspotAudioAttachment(
    editArgs && !editArgs.jumpSceneId ? (editArgs.audioId || '') : ''
  );
  if (editArgs) {
    cleanupHotspotDraft();
  } else {
    startHotspotDraft({ pitch: pendingPitch, yaw: pendingYaw });
  }

  // ポップアップモードを決定
  if (editArgs) {
    // 編集: ジャンプSceneIdがあればジャンプモード、それ以外は情報モード
    setPopupMode(editArgs.jumpSceneId ? 'jump' : 'info');
  } else if (inFolderMode) {
    // 新規×フォルダモード: タイプ選択画面
    setPopupMode('type');
  } else {
    // 新規×シングルファイル: 情報モード直接
    setPopupMode('info');
  }

  popup.style.visibility = 'hidden';
  popup.classList.add('visible');
  positionHotspotPopup(clientX, clientY);
  popup.style.visibility = '';
  scheduleHotspotPopupReposition();
  return true;
}

function closePopup(options) {
  var opts = options || {};
  var popup = document.getElementById('hotspot-popup');
  popup.classList.remove('visible', 'is-repositioning');
  popup.style.visibility = '';
  popup.style.left = '';
  popup.style.right = '';
  popup.style.top = '';
  popup.style.bottom = '';
  if (typeof hotspotPopupLayoutFrame !== 'undefined' && hotspotPopupLayoutFrame !== null) {
    cancelAnimationFrame(hotspotPopupLayoutFrame);
    hotspotPopupLayoutFrame = null;
  }
  if (typeof cleanupHotspotDraft === 'function') cleanupHotspotDraft();
  if (typeof disposeHotspotPhotoUploadState === 'function') disposeHotspotPhotoUploadState();
  if (typeof disposeHotspotAudioAttachmentState === 'function') disposeHotspotAudioAttachmentState();
  if (typeof endHotspotFormSession === 'function') endHotspotFormSession();
  pendingPitch      = null;
  pendingYaw        = null;
  editingHotspot    = null;
  currentPopupMode  = null;
  // タイトル・ボタンテキストをデフォルトに戻す
  document.getElementById('popup-header-title').textContent = 'ホットスポットを追加';
  resetHotspotSaveUi(null, '保存する');
  return !opts.silent;
}

// =============================================
//  ホットスポット保存（GAS呼び出し）
// =============================================
function onSaveClick() {
  if (!canEdit) {
    closePopup();
    return;
  }
  if (!canStartHotspotMutation()) return;
  if (!validateHotspotFormScene()) return;
  if (editingHotspot && hasPendingHotspotMutationForTarget(editingHotspot.id)) {
    showToast('このホットスポットの更新を処理中です。完了までお待ちください。', 'error');
    return;
  }
  if (hotspotPhotoUploadState.processing) {
    setHotspotPhotoError('写真の処理が終わるまでお待ちください。');
    return;
  }
  if (hotspotAudioAttachmentState.base64Converting) {
    setHotspotAudioError('音声の保存用データを準備しています。完了までお待ちください。');
    return;
  }

  var label = document.getElementById('input-label').value.trim();
  var markerIconRaw = document.getElementById('marker-icon').value;
  var desc;
  if (normalizeMarkerIcon(markerIconRaw) === 'quiz') {
    var q = document.getElementById('quiz-input-question').value.trim();
    var a = document.getElementById('quiz-input-answer').value.trim();
    desc = q + '|' + a;
  } else {
    desc = document.getElementById('input-desc').value.trim();
  }
  var linkUrlInput = document.getElementById('input-link-url').value.trim();
  var labelInput = document.getElementById('input-label');
  var markerShape = normalizeMarkerShape(document.getElementById('marker-shape').value);
  var markerColor = normalizeMarkerColor(document.getElementById('marker-color').value);
  var markerIcon = normalizeMarkerIcon(document.getElementById('marker-icon').value);
  var inFolderMode = !!(allImages && allImages.length > 0);
  // モードに応じて競合するフィールドをクリア（情報モードはjump、ジャンプモードはphoto/desc/linkを無効化）
  var photoSelectValue = currentPopupMode === 'info'
    ? (document.getElementById('input-photo-id').value || '')
    : '';
  var photoId = photoSelectValue === HOTSPOT_PHOTO_UPLOAD_OPTION ? '' : photoSelectValue;
  var photoUpload = null;
  if (photoSelectValue === HOTSPOT_PHOTO_UPLOAD_OPTION) {
    if (!hotspotPhotoUploadState.blob || !hotspotPhotoUploadState.base64) {
      setHotspotPhotoError('アップロードする写真を選択してください。');
      return;
    }
    photoUpload = {
      fileName: hotspotPhotoUploadState.uploadFileName,
      mimeType: hotspotPhotoUploadState.mimeType,
      originalSizeBytes: hotspotPhotoUploadState.originalSizeBytes,
      sizeBytes: hotspotPhotoUploadState.sizeBytes,
      base64: hotspotPhotoUploadState.base64
    };
  }
  var jumpSceneInput = document.getElementById('input-jump-scene');
  var jumpSceneId = (inFolderMode && currentPopupMode === 'jump') ? (jumpSceneInput.value || '') : '';
  if (currentPopupMode === 'jump') { desc = ''; linkUrlInput = ''; }
  var audioPayload;
  try {
    audioPayload = buildHotspotAudioUpload();
    setHotspotAudioError('');
  } catch (audioError) {
    setHotspotAudioError(audioError && audioError.message ? audioError.message : '音声を保存できません。');
    return;
  }

  // バリデーション: ジャンプは行き先、通常マーカーはラベルを必須にする。
  if (currentPopupMode === 'jump' && !jumpSceneId) {
    jumpSceneInput.classList.add('error');
    jumpSceneInput.focus();
    setTimeout(function () { jumpSceneInput.classList.remove('error'); }, 1800);
    return;
  }
  if (currentPopupMode !== 'jump' && !label) {
    labelInput.classList.add('error');
    labelInput.focus();
    setTimeout(function () { labelInput.classList.remove('error'); }, 1800);
    return;
  }

  var targetArgs = editingHotspot;
  var saveCoordinates = targetArgs
    ? { pitch: pendingPitch, yaw: pendingYaw }
    : hotspotDraftState.coordinates;
  if (!saveCoordinates || saveCoordinates.pitch === null || saveCoordinates.yaw === null ||
      !isFinite(saveCoordinates.pitch) || !isFinite(saveCoordinates.yaw)) {
    showToast('座標データがありません。再度クリックしてください。', 'error');
    return;
  }

  var saveData = {
    fileId:      hotspotFormSessionState.startSceneId,
    sceneType:   hotspotFormSessionState.sceneType,
    label:       label,
    description: desc,
    linkUrl:     normalizeHttpUrl(linkUrlInput),
    markerShape: markerShape,
    markerColor: markerColor,
    markerIcon:  markerIcon,
    pitch:       saveCoordinates.pitch,
    yaw:         saveCoordinates.yaw,
    photoId:     photoId,
    audioId:     audioPayload.audioId,
    jumpSceneId: jumpSceneId
  };
  if (photoUpload) saveData.photoUpload = photoUpload;
  if (audioPayload.audioUpload) saveData.audioUpload = audioPayload.audioUpload;
  // server呼び出し直前にも、フォーム開始時のscene契約を再検証する。
  if (!validateHotspotFormScene()) return;
  var mutationRequest = createHotspotMutationRequest(
    saveData.fileId,
    targetArgs ? 'update' : 'create',
    targetArgs ? targetArgs.id : ''
  );
  hotspotSaveUiRequestId = mutationRequest.id;

  // ボタンをローディング状態に
  var btn       = document.getElementById('btn-save');
  var saveLabel = document.getElementById('save-label');
  btn.disabled  = true;
  btn.classList.add('loading');
  saveLabel.textContent = targetArgs ? '更新中...' : '保存中...';

  if (targetArgs) {
    // ── 更新処理 ──────────────────────────────────────
    google.script.run
      .withSuccessHandler(function (result) {
        finishHotspotMutationRequest(mutationRequest);
        if (result && result.success) clearHotspotCache(mutationRequest.fileId);
        var ownsSaveUi = resetHotspotSaveUi(mutationRequest, '更新する');
        if (!isCurrentHotspotMutationRequest(mutationRequest)) return;

        if (result && result.success) {
          var confirmedHotspot = result.hotspot || Object.assign({}, saveData, {
            id: targetArgs.id,
            photoId: result.photoId != null ? result.photoId : saveData.photoId,
            audioId: result.audioId != null ? result.audioId : saveData.audioId
          });
          persistMarkerStylePreference(markerShape, markerColor, markerIcon);
          updateSpotInViewer(targetArgs, confirmedHotspot);
          if (ownsSaveUi) closePopup();
          if (result.partialSuccess) {
            showToast('ホットスポットを更新しました。' + (result.warning || '古い添付ファイルの整理に失敗しました。'), 'warning');
          } else {
            showToast('ホットスポットを更新しました！', 'success');
          }
        } else {
          showToast(
            '更新に失敗しました: ' + ((result && result.error) || '不明なエラー') +
              (result && result.cleanupRequired && result.warning ? ' ' + result.warning : ''),
            'error'
          );
        }
      })
      .withFailureHandler(function () {
        finishHotspotMutationRequest(mutationRequest);
        resetHotspotSaveUi(mutationRequest, '更新する');
        if (!isCurrentHotspotMutationRequest(mutationRequest)) return;
        showToast('通信エラーが発生しました。再度お試しください。', 'error');
      })
      .updateHotspot(withEditToken(saveData), targetArgs.id);

  } else {
    // ── 新規保存処理 ───────────────────────────────────
    google.script.run
      .withSuccessHandler(function (result) {
        finishHotspotMutationRequest(mutationRequest);
        if (result && result.success) clearHotspotCache(mutationRequest.fileId);
        var ownsSaveUi = resetHotspotSaveUi(mutationRequest, '保存する');
        if (!isCurrentHotspotMutationRequest(mutationRequest)) return;

        if (result && result.success) {
          var confirmedHotspot = result.hotspot || Object.assign({}, saveData, {
            id: result.id,
            photoId: result.photoId != null ? result.photoId : saveData.photoId,
            audioId: result.audioId != null ? result.audioId : saveData.audioId
          });
          persistMarkerStylePreference(markerShape, markerColor, markerIcon);
          completeHotspotDraftSave();
          addSpotToViewer(confirmedHotspot, confirmedHotspot.id || result.id);
          if (ownsSaveUi) closePopup();
          if (result.partialSuccess) {
            showToast('ホットスポットを保存しました。' + (result.warning || '古い添付ファイルの整理に失敗しました。'), 'warning');
          } else {
            showToast('ホットスポットを保存しました！', 'success');
          }
        } else {
          showToast(
            '保存に失敗しました: ' + ((result && result.error) || '不明なエラー') +
              (result && result.cleanupRequired && result.warning ? ' ' + result.warning : ''),
            'error'
          );
        }
      })
      .withFailureHandler(function () {
        finishHotspotMutationRequest(mutationRequest);
        resetHotspotSaveUi(mutationRequest, '保存する');
        if (!isCurrentHotspotMutationRequest(mutationRequest)) return;
        showToast('通信エラーが発生しました。再度お試しください。', 'error');
      })
      .saveHotspot(withEditToken(saveData));
  }
}

/**
 * 保存成功後、Pannellumにホットスポットをリアルタイムで追加する
 *
 * @param {Object} hs     保存データ
 * @param {string} hsId   ホットスポットのUUID
 */
function addSpotToViewer(hs, hsId) {
  var newId = 'hs_' + Date.now();
  var args = {
    _pannellumId: newId,
    id:           hsId,
    fileId:       hs.fileId,
    label:        hs.label,
    description:  hs.description,
    linkUrl:      hs.linkUrl,
    markerShape:  hs.markerShape,
    markerColor:  hs.markerColor,
    markerIcon:   hs.markerIcon,
    pitch:        hs.pitch,
    yaw:          hs.yaw,
    photoId:      hs.photoId     || '',
    audioId:      hs.audioId     || '',
    jumpSceneId:  hs.jumpSceneId || ''
  };

  if (is2DMode) {
    // 2Dモード: current2DHotspots に追加して再描画
    current2DHotspots.push(args);
    render2DHotspots(current2DHotspots);
    return;
  }

  try {
    viewer.addHotSpot({
      id:               newId,
      pitch:            hs.pitch,
      yaw:              hs.yaw,
      type:             'custom',
      cssClass:         'hs-marker',
      createTooltipFunc: buildMarkerElement,
      createTooltipArgs: args,
      clickHandlerFunc:  onMarkerClick,
      clickHandlerArgs:  args
    });
  } catch (e) {
    // addHotSpot が失敗しても保存自体は成功しているので無視
  }
}

/**
 * 編集後、Pannellum上のホットスポットをリアルタイムで更新する
 *
 * @param {Object} oldArgs  既存ホットスポットのargs（_pannellumId・id含む）
 * @param {Object} newData  更新後の内容
 */
function updateSpotInViewer(oldArgs, newData) {
  // oldArgs を直接書き換えて参照を維持する
  oldArgs.fileId      = newData.fileId || oldArgs.fileId || '';
  oldArgs.label       = newData.label;
  oldArgs.description = newData.description;
  oldArgs.linkUrl     = newData.linkUrl;
  oldArgs.markerShape = newData.markerShape;
  oldArgs.markerColor = newData.markerColor;
  oldArgs.markerIcon  = newData.markerIcon;
  if (typeof newData.pitch === 'number' && isFinite(newData.pitch)) oldArgs.pitch = newData.pitch;
  if (typeof newData.yaw === 'number' && isFinite(newData.yaw)) oldArgs.yaw = newData.yaw;
  oldArgs.photoId     = newData.photoId     || '';
  oldArgs.audioId     = newData.audioId     || '';
  oldArgs.jumpSceneId = newData.jumpSceneId || '';

  if (is2DMode) {
    // 2Dモード: oldArgs はすでに current2DHotspots 内の参照なので再描画するだけ
    render2DHotspots(current2DHotspots);
    return;
  }

  var pid = oldArgs._pannellumId;
  try { viewer.removeHotSpot(pid); } catch (e) { /* ignore */ }
  try {
    viewer.addHotSpot({
      id:               pid,
      pitch:            oldArgs.pitch,
      yaw:              oldArgs.yaw,
      type:             'custom',
      cssClass:         'hs-marker',
      createTooltipFunc: buildMarkerElement,
      createTooltipArgs: oldArgs,
      clickHandlerFunc:  onMarkerClick,
      clickHandlerArgs:  oldArgs
    });
  } catch (e) { /* ignore */ }
}

// =============================================
//  トースト通知
// =============================================
function showToast(message, type) {
  var toast = document.getElementById('toast');
  var icon  = document.getElementById('toast-icon');
  var msg   = document.getElementById('toast-msg');

  toast.className = type === 'success' ? 'success' : (type === 'warning' ? 'warning' : 'error');
  msg.textContent = message;

  if (type === 'success') {
    icon.innerHTML = '<polyline points="20 6 9 17 4 12"/>';
  } else if (type === 'warning') {
    icon.innerHTML = '<path d="M12 3 2.5 20h19L12 3z"/><line x1="12" y1="9" x2="12" y2="14"/><circle cx="12" cy="17" r="1" fill="currentColor" stroke="none"/>';
  } else {
    icon.innerHTML =
      '<circle cx="12" cy="12" r="10"/>' +
      '<line x1="15" y1="9" x2="9" y2="15"/>' +
      '<line x1="9" y1="9" x2="15" y2="15"/>';
  }

  requestAnimationFrame(function () { toast.classList.add('show'); });

  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 3200);
}

// =============================================
//  ローディングエラー表示
// =============================================
function showLoadError(message, compatibleRetry) {
  setSceneDisplayReady(false);
  var loading = document.getElementById('loading');
  var transition = document.getElementById('scene-transition-overlay');
  if (transition) transition.classList.remove('active');
  loading.classList.remove('hidden');
  loading.innerHTML =
    '<p style="color:#ef4444;font-size:14px;text-align:center;padding:0 20px">' +
    escapeHtml(message) + '<br><br>' +
    '<button onclick="location.reload()" ' +
    'style="background:#fbbf24;border:none;border-radius:8px;padding:8px 20px;' +
    'font-size:13px;font-weight:600;color:#78350f;cursor:pointer">' +
    '再読み込み</button></p>';
  if (typeof compatibleRetry === 'function') {
    var retry = document.createElement('button');
    retry.type = 'button';
    retry.className = 'compatible-retry-button';
    retry.textContent = '互換表示で再試行';
    retry.addEventListener('click', function () {
      if (retry.disabled) return;
      retry.disabled = true;
      compatibleRetry();
    });
    loading.appendChild(retry);
  }
}

// =============================================
//  写真セレクト / ジャンプ先セレクト構築
// =============================================

function detectHotspotPhotoMime(bytes) {
  var data = bytes || [];
  if (data.length >= 3 && data[0] === 0xff && data[1] === 0xd8 && data[2] === 0xff) {
    return 'image/jpeg';
  }
  if (data.length >= 8 &&
      data[0] === 0x89 && data[1] === 0x50 && data[2] === 0x4e && data[3] === 0x47 &&
      data[4] === 0x0d && data[5] === 0x0a && data[6] === 0x1a && data[7] === 0x0a) {
    return 'image/png';
  }
  if (data.length >= 12 &&
      data[0] === 0x52 && data[1] === 0x49 && data[2] === 0x46 && data[3] === 0x46 &&
      data[8] === 0x57 && data[9] === 0x45 && data[10] === 0x42 && data[11] === 0x50) {
    return 'image/webp';
  }
  return '';
}

function readHotspotPhotoBlobAsArrayBuffer(blob) {
  if (blob && typeof blob.arrayBuffer === 'function') return blob.arrayBuffer();
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () { resolve(reader.result); };
    reader.onerror = function () { reject(new Error('写真データを読み込めませんでした。')); };
    reader.readAsArrayBuffer(blob);
  });
}

function readHotspotPhotoBlobAsBase64(blob) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onload = function () {
      var dataUrl = String(reader.result || '');
      var commaIndex = dataUrl.indexOf(',');
      if (commaIndex < 0) {
        reject(new Error('写真データを変換できませんでした。'));
        return;
      }
      resolve(dataUrl.slice(commaIndex + 1));
    };
    reader.onerror = function () { reject(new Error('写真データを変換できませんでした。')); };
    reader.readAsDataURL(blob);
  });
}

function releaseHotspotPhotoDecodeUrl(objectUrl) {
  var index = hotspotPhotoUploadState.decodeObjectUrls.indexOf(objectUrl);
  if (index === -1) return false;
  hotspotPhotoUploadState.decodeObjectUrls.splice(index, 1);
  URL.revokeObjectURL(objectUrl);
  return true;
}

function loadHotspotPhotoImage(blob) {
  return new Promise(function (resolve, reject) {
    var objectUrl = URL.createObjectURL(blob);
    hotspotPhotoUploadState.decodeObjectUrls.push(objectUrl);
    var image = new Image();
    image.onload = function () {
      releaseHotspotPhotoDecodeUrl(objectUrl);
      if (!(image.naturalWidth > 0) || !(image.naturalHeight > 0)) {
        reject(new Error('写真の大きさを取得できませんでした。'));
        return;
      }
      resolve(image);
    };
    image.onerror = function () {
      releaseHotspotPhotoDecodeUrl(objectUrl);
      reject(new Error('写真を画像として読み込めませんでした。'));
    };
    image.src = objectUrl;
  });
}

function hotspotPhotoCanvasToBlob(canvas, mimeType, quality) {
  return new Promise(function (resolve, reject) {
    canvas.toBlob(function (blob) {
      if (!blob) {
        reject(new Error('写真の圧縮に失敗しました。'));
        return;
      }
      resolve(blob);
    }, mimeType, quality);
  });
}

function resizeAndEncodeHotspotPhoto(file, sourceMimeType) {
  return loadHotspotPhotoImage(file).then(function (image) {
    var sourceWidth = image.naturalWidth;
    var sourceHeight = image.naturalHeight;
    var initialScale = Math.min(1, HOTSPOT_PHOTO_MAX_EDGE / Math.max(sourceWidth, sourceHeight));

    if (sourceMimeType === 'image/png' && initialScale === 1 && file.size <= HOTSPOT_PHOTO_FINAL_MAX_BYTES) {
      return file;
    }

    var outputMimeType = sourceMimeType === 'image/png' ? 'image/webp' : sourceMimeType;
    var scale = initialScale;
    var quality = HOTSPOT_PHOTO_INITIAL_QUALITY;
    var attemptCount = 0;

    function encodeAttempt() {
      var canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(sourceWidth * scale));
      canvas.height = Math.max(1, Math.round(sourceHeight * scale));
      var context = canvas.getContext('2d');
      if (!context) return Promise.reject(new Error('写真処理を開始できませんでした。'));
      context.drawImage(image, 0, 0, canvas.width, canvas.height);

      return hotspotPhotoCanvasToBlob(canvas, outputMimeType, quality).then(function (blob) {
        if (blob.type !== outputMimeType) {
          if (outputMimeType === 'image/webp') {
            outputMimeType = 'image/jpeg';
            return encodeAttempt();
          }
          throw new Error('ブラウザが対応する写真形式へ変換できませんでした。');
        }
        if (blob.size <= HOTSPOT_PHOTO_FINAL_MAX_BYTES) return blob;

        attemptCount += 1;
        if (attemptCount >= 7) {
          throw new Error('写真を6MB以下に圧縮できませんでした。別の写真を選択してください。');
        }
        quality = Math.max(0.62, HOTSPOT_PHOTO_INITIAL_QUALITY - attemptCount * 0.06);
        if (attemptCount % 2 === 0) scale *= 0.82;
        return encodeAttempt();
      });
    }

    return encodeAttempt();
  });
}

function getHotspotPhotoExtensionForMime(mimeType) {
  if (mimeType === 'image/png') return 'png';
  if (mimeType === 'image/webp') return 'webp';
  return 'jpg';
}

function replaceHotspotPhotoFileExtension(fileName, mimeType) {
  var baseName = String(fileName || 'photo').replace(/\.[^.]*$/, '') || 'photo';
  return baseName + '.' + getHotspotPhotoExtensionForMime(mimeType);
}

function processHotspotPhotoFile(file) {
  if (!file) return Promise.reject(new Error('写真が選択されていません。'));
  if (!(file.size > 0)) return Promise.reject(new Error('空の写真ファイルは選択できません。'));
  if (file.size > HOTSPOT_PHOTO_ORIGINAL_MAX_BYTES) {
    return Promise.reject(new Error('元写真は20MB以下を選択してください。'));
  }

  var mimeType = String(file.type || '').trim().toLowerCase();
  var allowedExtensions = {
    'image/jpeg': ['jpg', 'jpeg'],
    'image/png': ['png'],
    'image/webp': ['webp']
  }[mimeType];
  if (!allowedExtensions) {
    return Promise.reject(new Error('JPEG、PNG、WebP形式の写真を選択してください。'));
  }
  var extensionMatch = String(file.name || '').match(/\.([A-Za-z0-9]+)$/);
  var extension = extensionMatch ? String(extensionMatch[1] || '').toLowerCase() : '';
  if (allowedExtensions.indexOf(extension) === -1) {
    return Promise.reject(new Error('写真のMIMEと拡張子が一致しません。'));
  }

  return readHotspotPhotoBlobAsArrayBuffer(file.slice(0, 12)).then(function (signatureBuffer) {
    var detectedMimeType = detectHotspotPhotoMime(new Uint8Array(signatureBuffer));
    if (!detectedMimeType || detectedMimeType !== mimeType) {
      throw new Error('写真の拡張子、MIME、実データの形式が一致しません。');
    }
    return resizeAndEncodeHotspotPhoto(file, mimeType);
  }).then(function (processedBlob) {
    if (!processedBlob || processedBlob.size > HOTSPOT_PHOTO_FINAL_MAX_BYTES) {
      throw new Error('処理後写真は6MB以下にしてください。');
    }
    if (['image/jpeg', 'image/png', 'image/webp'].indexOf(processedBlob.type) === -1) {
      throw new Error('写真を対応形式へ変換できませんでした。');
    }
    return readHotspotPhotoBlobAsBase64(processedBlob).then(function (base64) {
      return {
        blob: processedBlob,
        base64: base64,
        mimeType: processedBlob.type,
        uploadFileName: replaceHotspotPhotoFileExtension(file.name, processedBlob.type),
        originalFileName: String(file.name || 'photo'),
        originalSizeBytes: file.size,
        sizeBytes: processedBlob.size
      };
    });
  });
}

function formatHotspotPhotoBytes(sizeBytes) {
  var size = Number(sizeBytes) || 0;
  if (size >= 1024 * 1024) return (size / (1024 * 1024)).toFixed(1) + ' MB';
  if (size >= 1024) return Math.round(size / 1024) + ' KB';
  return size + ' B';
}

function setHotspotPhotoError(message) {
  var errorElement = document.getElementById('hotspot-photo-error');
  if (!errorElement) return;
  errorElement.textContent = String(message || '');
  errorElement.hidden = !message;
}

function releaseHotspotPhotoProcessedData() {
  if (hotspotPhotoUploadState.previewUrl) {
    URL.revokeObjectURL(hotspotPhotoUploadState.previewUrl);
  }
  hotspotPhotoUploadState.blob = null;
  hotspotPhotoUploadState.base64 = '';
  hotspotPhotoUploadState.mimeType = '';
  hotspotPhotoUploadState.uploadFileName = '';
  hotspotPhotoUploadState.originalFileName = '';
  hotspotPhotoUploadState.originalSizeBytes = 0;
  hotspotPhotoUploadState.sizeBytes = 0;
  hotspotPhotoUploadState.previewUrl = '';
}

function renderHotspotPhotoUploadState() {
  var card = document.getElementById('hotspot-photo-upload-card');
  if (!card) return;
  var hasUpload = !!hotspotPhotoUploadState.blob;
  card.hidden = !hasUpload;
  if (hasUpload) {
    document.getElementById('hotspot-photo-preview').src = hotspotPhotoUploadState.previewUrl;
    document.getElementById('hotspot-photo-file-name').textContent = hotspotPhotoUploadState.originalFileName;
    document.getElementById('hotspot-photo-file-size').textContent =
      '元 ' + formatHotspotPhotoBytes(hotspotPhotoUploadState.originalSizeBytes) +
      ' / 処理後 ' + formatHotspotPhotoBytes(hotspotPhotoUploadState.sizeBytes);
  }
  var disabled = !!hotspotPhotoUploadState.processing;
  var select = document.getElementById('input-photo-id');
  var changeButton = document.getElementById('hotspot-photo-change-btn');
  var clearButton = document.getElementById('hotspot-photo-clear-btn');
  if (select) select.disabled = disabled;
  if (changeButton) changeButton.disabled = disabled;
  if (clearButton) clearButton.disabled = disabled;
  scheduleHotspotPopupReposition();
}

function disposeHotspotPhotoUploadState() {
  hotspotPhotoUploadState.pickerGeneration += 1;
  hotspotPhotoUploadState.pickerOpen = false;
  hotspotPhotoUploadState.processing = false;
  if (hotspotPhotoUploadState.focusFallbackTimer !== null) {
    clearTimeout(hotspotPhotoUploadState.focusFallbackTimer);
    hotspotPhotoUploadState.focusFallbackTimer = null;
  }
  hotspotPhotoUploadState.decodeObjectUrls.slice().forEach(function(objectUrl) {
    releaseHotspotPhotoDecodeUrl(objectUrl);
  });
  releaseHotspotPhotoProcessedData();
  hotspotPhotoUploadState.selectedValue = '';
  hotspotPhotoUploadState.selectValueBeforePicker = '';
  var input = document.getElementById('hotspot-photo-file-input');
  if (input) input.value = '';
  setHotspotPhotoError('');
  renderHotspotPhotoUploadState();
}

function cancelHotspotPhotoPicker(expectedGeneration) {
  if (typeof expectedGeneration === 'number' &&
      expectedGeneration !== hotspotPhotoUploadState.pickerGeneration) return;
  if (!hotspotPhotoUploadState.pickerOpen) return;
  hotspotPhotoUploadState.pickerOpen = false;
  if (hotspotPhotoUploadState.focusFallbackTimer !== null) {
    clearTimeout(hotspotPhotoUploadState.focusFallbackTimer);
    hotspotPhotoUploadState.focusFallbackTimer = null;
  }
  hotspotPhotoUploadState.selectedValue = hotspotPhotoUploadState.selectValueBeforePicker ||
    hotspotPhotoUploadState.selectedValue;
  var select = document.getElementById('input-photo-id');
  var input = document.getElementById('hotspot-photo-file-input');
  if (select) select.value = hotspotPhotoUploadState.selectedValue;
  if (input) input.value = '';
  renderHotspotPhotoUploadState();
}

function openHotspotPhotoPicker() {
  if (hotspotPhotoUploadState.processing) return;
  var input = document.getElementById('hotspot-photo-file-input');
  if (!input) return;
  hotspotPhotoUploadState.selectValueBeforePicker = hotspotPhotoUploadState.selectedValue;
  hotspotPhotoUploadState.pickerOpen = true;
  hotspotPhotoUploadState.pickerGeneration += 1;
  var generation = hotspotPhotoUploadState.pickerGeneration;
  input.value = '';

  window.addEventListener('focus', function () {
    hotspotPhotoUploadState.focusFallbackTimer = setTimeout(function () {
      var hasFile = input.files && input.files.length > 0;
      if (!hasFile) cancelHotspotPhotoPicker(generation);
    }, 250);
  }, { once: true });
  input.click();
}

function onHotspotPhotoSelectChange() {
  var select = document.getElementById('input-photo-id');
  if (!select) return;
  if (select.value === HOTSPOT_PHOTO_UPLOAD_OPTION) {
    openHotspotPhotoPicker();
    return;
  }
  hotspotPhotoUploadState.pickerGeneration += 1;
  hotspotPhotoUploadState.pickerOpen = false;
  releaseHotspotPhotoProcessedData();
  hotspotPhotoUploadState.selectedValue = String(select.value || '');
  hotspotPhotoUploadState.selectValueBeforePicker = hotspotPhotoUploadState.selectedValue;
  setHotspotPhotoError('');
  renderHotspotPhotoUploadState();
}

function handleHotspotPhotoFileChange(event) {
  var input = event && event.target ? event.target : document.getElementById('hotspot-photo-file-input');
  var file = input && input.files && input.files[0];
  if (!file) {
    cancelHotspotPhotoPicker();
    return;
  }
  var generation = hotspotPhotoUploadState.pickerGeneration;
  hotspotPhotoUploadState.pickerOpen = false;
  hotspotPhotoUploadState.processing = true;
  setHotspotPhotoError('');
  renderHotspotPhotoUploadState();

  processHotspotPhotoFile(file).then(function (processed) {
    if (generation !== hotspotPhotoUploadState.pickerGeneration) return;
    releaseHotspotPhotoProcessedData();
    hotspotPhotoUploadState.blob = processed.blob;
    hotspotPhotoUploadState.base64 = processed.base64;
    hotspotPhotoUploadState.mimeType = processed.mimeType;
    hotspotPhotoUploadState.uploadFileName = processed.uploadFileName;
    hotspotPhotoUploadState.originalFileName = processed.originalFileName;
    hotspotPhotoUploadState.originalSizeBytes = processed.originalSizeBytes;
    hotspotPhotoUploadState.sizeBytes = processed.sizeBytes;
    hotspotPhotoUploadState.previewUrl = URL.createObjectURL(processed.blob);
    hotspotPhotoUploadState.selectedValue = HOTSPOT_PHOTO_UPLOAD_OPTION;
    hotspotPhotoUploadState.selectValueBeforePicker = HOTSPOT_PHOTO_UPLOAD_OPTION;
    var select = document.getElementById('input-photo-id');
    if (select) select.value = HOTSPOT_PHOTO_UPLOAD_OPTION;
  }).catch(function (error) {
    if (generation !== hotspotPhotoUploadState.pickerGeneration) return;
    var select = document.getElementById('input-photo-id');
    if (select) select.value = hotspotPhotoUploadState.selectedValue;
    setHotspotPhotoError(error && error.message ? error.message : '写真の処理に失敗しました。');
  }).then(function () {
    if (generation !== hotspotPhotoUploadState.pickerGeneration) return;
    hotspotPhotoUploadState.processing = false;
    if (input) input.value = '';
    renderHotspotPhotoUploadState();
  });
}

function clearHotspotPhotoUpload() {
  hotspotPhotoUploadState.pickerGeneration += 1;
  hotspotPhotoUploadState.pickerOpen = false;
  hotspotPhotoUploadState.processing = false;
  releaseHotspotPhotoProcessedData();
  hotspotPhotoUploadState.selectedValue = '';
  hotspotPhotoUploadState.selectValueBeforePicker = '';
  var select = document.getElementById('input-photo-id');
  var input = document.getElementById('hotspot-photo-file-input');
  if (select) select.value = '';
  if (input) input.value = '';
  setHotspotPhotoError('');
  renderHotspotPhotoUploadState();
}

/**
 * 写真セレクトに allImages の一覧をセットする
 * @param {string} currentPhotoId  現在選択中のファイルID（編集時）
 */
function buildPhotoSelect(currentPhotoId) {

}

function formatHotspotAudioDuration(seconds) {
  var total = Math.max(0, Number(seconds) || 0);
  var minutes = Math.floor(total / 60);
  var remainder = total - minutes * 60;
  return String(minutes).padStart(2, '0') + ':' + remainder.toFixed(1).padStart(4, '0');
}

function setHotspotAudioError(message) {
  var element = document.getElementById('hotspot-audio-error');
  if (!element) return;
  element.textContent = String(message || '');
  element.hidden = !message;
}

function clearAudioElementSource(audio) {
  if (!audio) return;
  try { audio.pause(); } catch (error) {}
  audio.removeAttribute('src');
  try { audio.load(); } catch (error) {}
}

function releaseHotspotAudioLocalResult() {
  if (hotspotAudioAttachmentState.previewObjectUrl) {
    URL.revokeObjectURL(hotspotAudioAttachmentState.previewObjectUrl);
  }
  hotspotAudioAttachmentState.blob = null;
  hotspotAudioAttachmentState.base64 = '';
  hotspotAudioAttachmentState.fileName = '';
  hotspotAudioAttachmentState.mimeType = '';
  hotspotAudioAttachmentState.sizeBytes = 0;
  hotspotAudioAttachmentState.durationSeconds = 0;
  hotspotAudioAttachmentState.previewObjectUrl = '';
  hotspotAudioAttachmentState.base64Converting = false;
}

function renderHotspotAudioAttachmentState() {
  var state = hotspotAudioAttachmentState;
  var card = document.getElementById('hotspot-audio-attachment-card');
  var openButton = document.getElementById('hotspot-audio-open-editor-btn');
  var preview = document.getElementById('hotspot-audio-preview');
  var fileName = document.getElementById('hotspot-audio-file-name');
  var fileMeta = document.getElementById('hotspot-audio-file-meta');
  var removeButton = document.getElementById('hotspot-audio-remove-btn');
  var status = document.getElementById('hotspot-audio-status');
  if (!card || !preview) return;

  var hasLocal = state.operation === 'replace' && !!state.blob;
  var hasExisting = state.operation === 'keep' && !!state.existingAudioId;
  var isRemoved = state.operation === 'remove' && (!!state.existingAudioId || !!state.blob);
  card.hidden = !(hasLocal || hasExisting || isRemoved);
  if (openButton) {
    openButton.textContent = state.vendorLoading
      ? '音声エディターを準備しています…'
      : (hasLocal || hasExisting ? '別の音声を編集' : '音声を選んで編集');
    openButton.disabled = state.base64Converting || state.vendorLoading;
  }
  if (removeButton) {
    removeButton.textContent = isRemoved ? '元に戻す' : '解除';
    removeButton.disabled = state.base64Converting;
  }
  var changeButton = document.getElementById('hotspot-audio-change-btn');
  if (changeButton) {
    changeButton.textContent = state.vendorLoading ? '準備中…' : '変更';
    changeButton.disabled = state.base64Converting || state.vendorLoading;
  }

  if (isRemoved) {
    clearAudioElementSource(preview);
    preview.hidden = true;
    if (fileName) fileName.textContent = '保存時に音声添付を解除します';
    if (fileMeta) fileMeta.textContent = '保存に失敗した場合はこの状態を保持します';
  } else {
    var previewSource = hasLocal ? state.previewObjectUrl : state.existingPreviewUrl;
    if (previewSource && preview.getAttribute('src') !== previewSource) {
      clearAudioElementSource(preview);
      preview.src = previewSource;
    }
    preview.hidden = !previewSource;
    if (fileName) fileName.textContent = hasLocal ? '添付予定の音声' : '添付済み音声';
    if (fileMeta) {
      fileMeta.textContent = hasLocal
        ? formatHotspotPhotoBytes(state.sizeBytes) + ' / ' + formatHotspotAudioDuration(state.durationSeconds)
        : (previewSource ? '保存済み音声' : '保存済み音声を読み込んでいます…');
    }
  }
  if (status) {
    status.textContent = state.vendorLoading
      ? '音声エディターを準備しています…'
      : (state.base64Converting
        ? '保存用データを準備しています…'
        : (hasLocal ? 'MP3は「保存する」を押すまでアップロードされません。' : ''));
  }
  scheduleHotspotPopupReposition();
}

function loadExistingHotspotAudioPreview(audioId) {
  var state = hotspotAudioAttachmentState;
  var targetAudioId = String(audioId || '');
  var hotspotId = String(editingHotspot && editingHotspot.id || '');
  var formSceneId = String(hotspotFormSessionState.startSceneId || '');
  var fileId = String(
    editingHotspot && editingHotspot.fileId ||
    hotspotFormSessionState.startSceneId ||
    currentFileId ||
    ''
  );
  if (!targetAudioId || !hotspotId || !fileId) return;
  var generation = state.generation;
  google.script.run
    .withSuccessHandler(function (result) {
      if (generation !== state.generation || state.existingAudioId !== targetAudioId ||
          state.operation !== 'keep' || !isHotspotFormSessionActive() ||
          String(hotspotFormSessionState.startSceneId || '') !== formSceneId) return;
      if (result && result.success && result.dataUri) {
        state.existingPreviewUrl = result.dataUri;
        setHotspotAudioError('');
      } else {
        setHotspotAudioError('保存済み音声を読み込めませんでした。添付を維持したまま保存できます。');
      }
      renderHotspotAudioAttachmentState();
    })
    .withFailureHandler(function () {
      if (generation !== state.generation || state.existingAudioId !== targetAudioId) return;
      setHotspotAudioError('保存済み音声を読み込めませんでした。添付を維持したまま保存できます。');
      renderHotspotAudioAttachmentState();
    })
    .getHotspotAudioData({ fileId: fileId, hotspotId: hotspotId, audioId: targetAudioId });
}

function initializeHotspotAudioAttachment(audioId) {
  disposeHotspotAudioAttachmentState({ keepFocus: true });
  hotspotAudioAttachmentState.existingAudioId = String(audioId || '');
  hotspotAudioAttachmentState.operation = 'keep';
  hotspotAudioAttachmentState.generation += 1;
  setHotspotAudioError('');
  renderHotspotAudioAttachmentState();
  if (hotspotAudioAttachmentState.existingAudioId) {
    loadExistingHotspotAudioPreview(hotspotAudioAttachmentState.existingAudioId);
  }
}

function loadAudioVendorBundle() {
  if (audioVendorBundlePromise) return audioVendorBundlePromise;

  var request = new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (result) {
        try {
          if (!result || result.version !== '1.50.8') {
            throw new Error('Audio vendor version mismatch.');
          }
          if (typeof result.source !== 'string' || !result.source.trim()) {
            throw new Error('Audio vendor source is empty.');
          }
          var script = document.createElement('script');
          script.type = 'text/javascript';
          script.textContent = result.source;
          (document.head || document.documentElement).appendChild(script);
          script.remove();
          validateAudioVendorRuntime();
          resolve(true);
        } catch (error) {
          reject(error);
        }
      })
      .withFailureHandler(function (error) {
        reject(error instanceof Error ? error : new Error(String(error || 'Audio vendor request failed.')));
      })
      .getAudioVendorBundle(withEditToken({}));
  });

  audioVendorBundlePromise = request.catch(function (error) {
    audioVendorBundlePromise = null;
    throw error;
  });
  return audioVendorBundlePromise;
}

function validateAudioVendorRuntime() {
  var media = window.Mediabunny;
  var extension = window.MediabunnyMp3Encoder;
  if (!media || typeof media.canEncodeAudio !== 'function' ||
      typeof media.BufferTarget !== 'function' ||
      typeof media.Output !== 'function' ||
      typeof media.Mp3OutputFormat !== 'function' ||
      typeof media.AudioBufferSource !== 'function' ||
      !extension || typeof extension.registerMp3Encoder !== 'function') {
    throw new Error('Audio vendor runtime validation failed.');
  }
}

function syncHotspotAudioAttachButton() {
  var button = document.getElementById('hotspot-audio-attach-result');
  if (!button) return;
  var result = window.HemisphereAudioEditor && window.HemisphereAudioEditor.getResult
    ? window.HemisphereAudioEditor.getResult()
    : null;
  var shouldDisable = !(result && result.blob && result.mimeType === 'audio/mpeg');
  if (button.disabled !== shouldDisable) button.disabled = shouldDisable;
}

function openHotspotAudioEditor(trigger) {
  if (!canEdit || !isEditMode || !isHotspotFormSessionActive() || currentPopupMode !== 'info') return false;
  var state = hotspotAudioAttachmentState;
  if (state.base64Converting) return false;
  if (state.editorOpen) return true;
  if (state.editorOpeningPromise) return state.editorOpeningPromise;

  var generation = state.generation;
  var formSceneId = String(hotspotFormSessionState.startSceneId || '');
  state.vendorLoading = true;
  setHotspotAudioError('');
  renderHotspotAudioAttachmentState();

  var openingPromise;
  var editorSetupStarted = false;
  function releaseOpeningAttempt() {
    if (state.editorOpeningPromise !== openingPromise) return false;
    state.vendorLoading = false;
    state.editorOpeningPromise = null;
    renderHotspotAudioAttachmentState();
    return true;
  }

  openingPromise = loadAudioVendorBundle()
    .then(function () {
      var ownsOpeningAttempt = state.editorOpeningPromise === openingPromise;
      if (!ownsOpeningAttempt || generation !== state.generation || !canEdit || !isEditMode ||
          !isHotspotFormSessionActive() || currentPopupMode !== 'info' ||
          String(hotspotFormSessionState.startSceneId || '') !== formSceneId) {
        if (ownsOpeningAttempt) releaseOpeningAttempt();
        return false;
      }
      releaseOpeningAttempt();
      editorSetupStarted = true;
      return showHotspotAudioEditor(trigger);
    })
    .catch(function () {
      var releasedOpeningAttempt = releaseOpeningAttempt();
      if ((releasedOpeningAttempt || editorSetupStarted) &&
          generation === state.generation && isHotspotFormSessionActive() &&
          currentPopupMode === 'info' &&
          String(hotspotFormSessionState.startSceneId || '') === formSceneId) {
        setHotspotAudioError('音声エディターを準備できませんでした。もう一度お試しください。');
        if (trigger && trigger.isConnected) {
          setTimeout(function () { try { trigger.focus(); } catch (error) {} }, 0);
        }
      }
      return false;
    });
  state.editorOpeningPromise = openingPromise;
  return openingPromise;
}

function showHotspotAudioEditor(trigger) {
  var dialog = document.getElementById('hotspot-audio-editor-dialog');
  var editor = window.HemisphereAudioEditor;
  if (!dialog || !editor || typeof editor.init !== 'function') {
    setHotspotAudioError('音声エディターを開始できませんでした。ページを再読み込みしてください。');
    return false;
  }
  var state = hotspotAudioAttachmentState;
  var generation = state.generation + 1;
  var resultObserver = null;
  if (state.resultObserver) {
    state.resultObserver.disconnect();
    state.resultObserver = null;
  }
  try {
    try { editor.destroy(); } catch (error) {}
    if (typeof dialog.showModal === 'function') dialog.showModal();
    else dialog.setAttribute('open', '');
    editor.init();
    editor.setResultHandler(function () {
      if (!state.editorOpen || generation !== state.generation) return;
      syncHotspotAudioAttachButton();
    });
    var resultArea = dialog.querySelector('[data-hae-result]');
    if (resultArea && typeof MutationObserver !== 'undefined') {
      resultObserver = new MutationObserver(syncHotspotAudioAttachButton);
      resultObserver.observe(resultArea, { attributes: true, childList: true, subtree: true });
    }
    var coreCancel = dialog.querySelector('[data-hae-cancel]');
    if (coreCancel && !coreCancel.dataset.hotspotAudioCloseBound) {
      coreCancel.dataset.hotspotAudioCloseBound = 'true';
      coreCancel.addEventListener('click', function () { closeHotspotAudioEditor(); });
    }
    if (!dialog.dataset.hotspotAudioCancelBound) {
      dialog.dataset.hotspotAudioCancelBound = 'true';
      dialog.addEventListener('cancel', function (event) {
        event.preventDefault();
        closeHotspotAudioEditor();
      });
    }
    syncHotspotAudioAttachButton();
    state.editorOpen = true;
    state.editorReturnFocus = trigger || document.activeElement;
    state.generation = generation;
    state.resultObserver = resultObserver;
  } catch (error) {
    if (resultObserver) resultObserver.disconnect();
    try { editor.setResultHandler(null); } catch (cleanupError) {}
    try { editor.destroy(); } catch (cleanupError) {}
    if (dialog.open) {
      try { dialog.close(); } catch (cleanupError) { dialog.removeAttribute('open'); }
    } else {
      dialog.removeAttribute('open');
    }
    state.editorOpen = false;
    state.editorReturnFocus = null;
    state.resultObserver = null;
    throw error;
  }
  var fileInput = dialog.querySelector('#hae-audio-file');
  if (fileInput) setTimeout(function () { fileInput.focus(); }, 0);
  return true;
}

function closeHotspotAudioEditor(options) {
  var opts = options || {};
  var state = hotspotAudioAttachmentState;
  var dialog = document.getElementById('hotspot-audio-editor-dialog');
  var returnFocus = state.editorReturnFocus;
  state.generation += 1;
  state.vendorLoading = false;
  state.editorOpeningPromise = null;
  state.editorOpen = false;
  state.editorReturnFocus = null;
  if (state.resultObserver) {
    state.resultObserver.disconnect();
    state.resultObserver = null;
  }
  if (window.HemisphereAudioEditor) {
    try { window.HemisphereAudioEditor.setResultHandler(null); } catch (error) {}
    try { window.HemisphereAudioEditor.destroy(); } catch (error) {}
  }
  if (dialog && dialog.open) {
    try { dialog.close(); } catch (error) { dialog.removeAttribute('open'); }
  }
  if (opts.restoreFocus !== false && returnFocus && returnFocus.isConnected) {
    setTimeout(function () { try { returnFocus.focus(); } catch (error) {} }, 0);
  }
}

function attachHotspotAudioEditorResult() {
  var editor = window.HemisphereAudioEditor;
  var result = editor && editor.getResult ? editor.getResult() : null;
  if (!result || !result.blob || result.mimeType !== 'audio/mpeg') {
    syncHotspotAudioAttachButton();
    return false;
  }
  if (result.sizeBytes <= 0 || result.sizeBytes > HOTSPOT_AUDIO_FINAL_MAX_BYTES ||
      result.durationSeconds < 0.5 || result.durationSeconds > 120) {
    setHotspotAudioError('生成したMP3が添付可能な上限（4MB・120秒）を超えています。');
    return false;
  }
  var blob = result.blob;
  closeHotspotAudioEditor({ restoreFocus: false });
  releaseHotspotAudioLocalResult();
  var state = hotspotAudioAttachmentState;
  state.operation = 'replace';
  state.blob = blob;
  state.fileName = String(result.fileName || 'trimmed-audio.mp3');
  state.mimeType = 'audio/mpeg';
  state.sizeBytes = Number(result.sizeBytes) || blob.size;
  state.durationSeconds = Number(result.durationSeconds) || 0;
  state.previewObjectUrl = URL.createObjectURL(blob);
  state.base64Converting = true;
  state.base64 = '';
  state.generation += 1;
  var generation = state.generation;
  setHotspotAudioError('');
  renderHotspotAudioAttachmentState();

  var reader = new FileReader();
  reader.onload = function () {
    if (generation !== state.generation || state.blob !== blob) return;
    var dataUrl = String(reader.result || '');
    var comma = dataUrl.indexOf(',');
    if (comma < 0) {
      reader.onerror();
      return;
    }
    state.base64 = dataUrl.slice(comma + 1);
    state.base64Converting = false;
    renderHotspotAudioAttachmentState();
    var changeButton = document.getElementById('hotspot-audio-change-btn');
    if (changeButton) changeButton.focus();
  };
  reader.onerror = function () {
    if (generation !== state.generation || state.blob !== blob) return;
    state.base64Converting = false;
    state.base64 = '';
    setHotspotAudioError('MP3の保存用データを準備できませんでした。音声を編集し直してください。');
    renderHotspotAudioAttachmentState();
  };
  reader.readAsDataURL(blob);
  return true;
}

function toggleHotspotAudioRemoval() {
  var state = hotspotAudioAttachmentState;
  if (state.operation === 'remove') {
    state.operation = state.blob ? 'replace' : 'keep';
  } else {
    state.operation = 'remove';
  }
  setHotspotAudioError('');
  renderHotspotAudioAttachmentState();
}

function buildHotspotAudioUpload() {
  var state = hotspotAudioAttachmentState;
  if (currentPopupMode !== 'info' || state.operation === 'remove') {
    return { audioId: '', audioUpload: null };
  }
  if (state.operation === 'replace') {
    if (state.base64Converting) throw new Error('音声の保存用データを準備しています。完了までお待ちください。');
    if (!state.blob || !state.base64 || state.mimeType !== 'audio/mpeg') {
      throw new Error('添付するMP3を準備できませんでした。音声を編集し直してください。');
    }
    return {
      audioId: '',
      audioUpload: {
        fileName: state.fileName,
        mimeType: state.mimeType,
        sizeBytes: state.sizeBytes,
        durationSeconds: state.durationSeconds,
        base64: state.base64
      }
    };
  }
  return { audioId: state.existingAudioId, audioUpload: null };
}

function disposeHotspotAudioAttachmentState(options) {
  var opts = options || {};
  var state = hotspotAudioAttachmentState;
  closeHotspotAudioEditor({ restoreFocus: false });
  state.generation += 1;
  var preview = document.getElementById('hotspot-audio-preview');
  clearAudioElementSource(preview);
  releaseHotspotAudioLocalResult();
  state.existingAudioId = '';
  state.existingPreviewUrl = '';
  state.operation = 'keep';
  setHotspotAudioError('');
  renderHotspotAudioAttachmentState();
  if (!opts.keepFocus && document.activeElement && preview && preview.contains(document.activeElement)) {
    try { document.activeElement.blur(); } catch (error) {}
  }
}

/**
 * ジャンプ先セレクトに allImages の一覧をセットする（現在のシーンは除外）
 * @param {string} currentJumpSceneId  現在選択中のシーンID（編集時）
 */
function buildJumpSceneSelect(currentJumpSceneId) {

  sel.innerHTML = '';
  var noneOpt = document.createElement('option');
  noneOpt.value = '';
  noneOpt.textContent = '（なし）';
  sel.appendChild(noneOpt);

  if (!allImages) return;
  allImages.forEach(function (img) {

// =============================================
//  XSS対策: HTMLエスケープ
// =============================================
function normalizeHttpUrl(value) {
  var url = String(value || '').trim();
  if (!url) return '';
  return /^https?:\/\//i.test(url) ? url : '';
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g,  '&amp;')
    .replace(/</g,  '&lt;')
    .replace(/>/g,  '&gt;')
    .replace(/"/g,  '&quot;')
    .replace(/'/g,  '&#039;');
}

// =============================================
//  2D平面マップ表示・非表示
// =============================================

/**
 * 2D平面マップ表示モードに切り替える
 * @param {string} imageUrl  表示する画像のURL
 */
function show2DView(imageUrl, onLoadError, onLoaded, shouldHandle) {
  var canHandle = typeof shouldHandle === 'function' ? shouldHandle : function () { return true; };
  if (!canHandle()) return;
  document.getElementById('panorama').style.display = 'none';
  var container = document.getElementById('flat-map-container');
  container.style.display = 'flex';
  var inner = document.getElementById('flat-map-inner');
  inner.innerHTML = '';

  var img = document.createElement('img');
  img.id = 'flat-map-img';
  img.alt = '';
  img.draggable = false;
  img.style.cursor = isEditMode ? 'crosshair' : 'default';
  img.onload = function () {
    if (!canHandle()) return;
    if (typeof onLoaded === 'function') onLoaded();
  };
  img.onerror = function () {
    if (!canHandle()) return;
    if (typeof onLoadError === 'function') {
      onLoadError();
    } else {
      showLoadError('2D画像の読み込みに失敗しました。');
    }
  };
  img.addEventListener('click', onFlatMapClick);
  inner.appendChild(img);
  img.crossOrigin = 'anonymous';
  img.src = imageUrl;
}

/**
 * 2D表示を非表示にしてPannellumコンテナを復元する
 */
function hide2DView() {
  var container = document.getElementById('flat-map-container');
  container.style.display = 'none';
  document.getElementById('flat-map-inner').innerHTML = '';
  document.getElementById('panorama').style.display = '';
  current2DHotspots = [];
}

/**
 * 2D画像クリック: 編集モード時にクリック位置のX%/Y%を取得してポップアップを開く
 */
function onFlatMapClick(evt) {
  if (!canEdit || !isEditMode) return;
  if (suppressNextPanoramaClick) {
    suppressNextPanoramaClick = false;
    return;
  }
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('add-hotspot', { silent: true })) return;
  if (isMovingHotspot) {
    commitHotspotMove(evt);
    return;
  }
  var img = evt.currentTarget;
  var coordinates = get2DHotspotCoordinates(evt.clientX, evt.clientY, img);
  if (!coordinates) return;
  pendingYaw = coordinates.yaw;       // X% → Yaw 列に保存
  pendingPitch = coordinates.pitch;   // Y% → Pitch 列に保存
  openPopup(evt.clientX, evt.clientY);
}

/**
 * 2Dモード用ホットスポットを画像上にオーバーレイ描画する
 * @param {Array} hotspots  ホットスポット配列（pitch=Y%, yaw=X%）
 */
function render2DHotspots(hotspots) {
  current2DHotspots = hotspots;
  var inner = document.getElementById('flat-map-inner');
  if (!inner) return;

  // 既存オーバーレイを削除
  var old = inner.querySelectorAll('.flat-hs-marker:not(.flat-hs-draft)');
  for (var i = 0; i < old.length; i++) {
    old[i].parentNode.removeChild(old[i]);
  }

  hotspots.forEach(function (hs) {
    var el = document.createElement('div');
    el.className = 'flat-hs-marker';
    el.style.left = hs.yaw + '%';
    el.style.top  = hs.pitch + '%';

    var marker = createStandaloneMarkerElement(hs);
    el.appendChild(marker);
    bindHotspotAudioPrefetch(marker, hs);

    // ホバーツールチップ
    if (hs.jumpSceneId) {
      // ジャンプ先がある場合: ジャンプ先シーン名を表示
      el.addEventListener('mouseenter', function () {
        if (isEditMode) return;
        showJumpTooltip(marker, hs.jumpSceneId, hs.label);
      });
      el.addEventListener('mouseleave', function () {
        hideJumpTooltip();
      });
    } else if (hs.label) {
      // 通常ホットスポット: ラベルを表示
      el.addEventListener('mouseenter', function () {
        if (isEditMode) return;
        showLabelTooltip(marker, hs.label);
      });
      el.addEventListener('mouseleave', function () {
        hideJumpTooltip();
      });
    }

    marker.addEventListener('click', function (e) {
      e.stopPropagation();
      onMarkerClick(e, hs);
    });

    if (canEdit && isEditMode) {
      marker.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        e.stopPropagation();
        openHotspotContextMenu(e, hs, marker);
      });
    }

    inner.appendChild(el);
  });
}

// =============================================
//  アップロードモーダル
// =============================================

/**
 * 現在表示中のフォルダID を返す。
 * サブフォルダ内ならそのID、ルートならルートフォルダID。
 * @returns {string|null}
 */
function getCurrentFolderId() {
  if (folderStack.length > 0) {
    return folderStack[folderStack.length - 1].id;
  }
  return rootFolderId;
}

/**
 * 現在のフォルダを Google Drive で別タブ開く。
 */
function openCurrentFolderInDrive() {
  if (!canEdit || !isEditMode) return false;
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('open-drive-folder')) return false;
  var folderId = getCurrentFolderId();
  if (!folderId) {
    showToast('フォルダIDが取得できません。', 'error');
    return false;
  }
  window.open('https://drive.google.com/drive/folders/' + folderId, '_blank');
  return true;
}

/** 正式なHemisphere Hotspotルートを、popup blockerを避けて別タブで開く。 */
function openHotspotFolderInDrive() {
  if (!canEdit || !isEditMode) return false;
  if (hotspotFolderOpenPending) return false;
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('open-hotspot-folder')) return false;

  var popupTab = window.open('', '_blank');
  if (!popupTab) {
    showToast('ポップアップがブロックされました。ブラウザでポップアップを許可してから再度お試しください。', 'error');
    return false;
  }
  try { popupTab.opener = null; } catch (openerError) { /* ignore */ }

  hotspotFolderOpenPending = true;
  setHotspotFolderButtonBusy(true);

  function closePopupTab() {
    try {
      if (!popupTab.closed) popupTab.close();
    } catch (closeError) { /* ignore */ }
  }

  function finishRequest() {
    hotspotFolderOpenPending = false;
    setHotspotFolderButtonBusy(false);
  }

  google.script.run
    .withSuccessHandler(function (result) {
      if (!result || !result.success ||
          !/^https:\/\/drive\.google\.com\/drive\/folders\/[A-Za-z0-9_-]+$/.test(String(result.url || ''))) {
        closePopupTab();
        finishRequest();
        showToast((result && result.error) || 'Hotspotフォルダを開けませんでした。再度お試しください。', 'error');
        return;
      }
      try {
        if (popupTab.closed) throw new Error('popup closed');
        popupTab.location.replace(result.url);
      } catch (navigationError) {
        closePopupTab();
        finishRequest();
        showToast('Hotspotフォルダを開くタブを更新できませんでした。再度お試しください。', 'error');
        return;
      }
      finishRequest();
      if ((result.warnings && result.warnings.length > 0) || result.warning) {
        showToast(result.warning || result.warnings.join(' '), 'warning');
      }
    })
    .withFailureHandler(function () {
      closePopupTab();
      finishRequest();
      showToast('Hotspotフォルダの取得中に通信エラーが発生しました。再度お試しください。', 'error');
    })
    .getHotspotFolderUrlForEdit(withEditToken({}));
  return true;
}

function openUploadModal() {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('upload-image')) return false;
  if (!canEdit) return;
  if (!allImages) return; // フォルダモードのみ対応
  cancelHotspotMove('アップロード画面を開いたため移動をキャンセルしました。', { silent: true });
  document.getElementById('upload-modal').style.display = 'flex';
  document.getElementById('upload-status').textContent = '';
  document.getElementById('upload-file-input').value = '';
  document.getElementById('upload-set-home').checked = false;
  // ラジオボタンを初期値に戻す
  var radios = document.querySelectorAll('input[name="upload-type"]');
  if (radios.length) radios[0].checked = true;
  syncUploadHomeOption();
}

function closeUploadModal() {
  document.getElementById('upload-modal').style.display = 'none';
  document.getElementById('upload-confirm-btn').disabled = false;
  document.getElementById('upload-set-home').checked = false;
}

/** ホーム指定は設定済みルートフォルダへのアップロード時だけ許可する。 */
function syncUploadHomeOption() {
  var homeCheckbox = document.getElementById('upload-set-home');
  var help = document.getElementById('upload-home-help');
  if (!homeCheckbox || !help) return;
  var isRootUpload = folderStack.length === 0 && getCurrentFolderId() === rootFolderId;
  homeCheckbox.disabled = !isRootUpload;
  if (!isRootUpload) homeCheckbox.checked = false;
  help.textContent = isRootUpload
    ? 'すでにホームがある場合は、この画像へ切り替わります。複数選択時は最後の画像がホームになります。'
    : 'サブフォルダへのアップロードではホームに設定できません。';
}

function sanitizeFileName(fileName) {
  var name = String(fileName || 'image').trim();
  if (!name) return 'image.jpg';
  return name;
}

function readFileAsDataUrl(file, onSuccess, onError) {
  var reader = new FileReader();
  reader.onload = function () {
    onSuccess(String(reader.result || ''));
  };
  reader.onerror = function () {
    onError('ファイルの読み込みに失敗');
  };
  reader.readAsDataURL(file);
}

function convertDataUrlToJpeg(dataUrl, quality, onSuccess, onError) {
  var img = new Image();
  img.onload = function () {
    try {
      var canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth || img.width;
      canvas.height = img.naturalHeight || img.height;
      var ctx = canvas.getContext('2d');
      if (!ctx) {
        onError('画像変換コンテキストの取得に失敗');
        return;
      }
      ctx.drawImage(img, 0, 0);
      var jpegDataUrl = canvas.toDataURL('image/jpeg', quality || 0.92);
      onSuccess(jpegDataUrl);
    } catch (e) {
      onError(e && e.message ? e.message : 'JPEG変換に失敗');
    }
  };
  img.onerror = function () {
    onError('画像のデコードに失敗');
  };
  img.src = dataUrl;
}

function onUploadConfirm() {
  if (!canEdit) {
    closeUploadModal();
    return;
  }

  var fileInput = document.getElementById('upload-file-input');
  if (!fileInput.files || !fileInput.files.length) {
    document.getElementById('upload-status').textContent = 'ファイルを選択してください。';
    return;
  }
  var files = Array.prototype.slice.call(fileInput.files);
  var selectedType = document.querySelector('input[name="upload-type"]:checked');
  var is2D = selectedType && selectedType.value === '2d';
  var homeCheckbox = document.getElementById('upload-set-home');
  var setAsHome = !!(homeCheckbox && !homeCheckbox.disabled && homeCheckbox.checked);

  var statusEl = document.getElementById('upload-status');
  var confirmBtn = document.getElementById('upload-confirm-btn');
  statusEl.textContent = files.length + ' 件のファイルを読み込んでいます...';
  confirmBtn.disabled = true;

  var uploadedFiles = [];
  var errors = [];
  var warnings = [];
  var newHomeImageId = null;
  var index = 0;

  function uploadNext() {
    if (index >= files.length) {
      confirmBtn.disabled = false;
      if (uploadedFiles.length) {
        if (newHomeImageId) {
          allImages = applyHomeSelectionToImages(allImages, newHomeImageId, null);
          uploadedFiles = applyHomeSelectionToImages(uploadedFiles, newHomeImageId, null);
          homeImageId = newHomeImageId;
        }
        uploadedFiles.forEach(function (f) { allImages.push(f); });
        allImages = sortSceneListItems(allImages);
        updateRootHomeImageId();
        buildSceneSidebar(allImages);
        syncActiveSceneItem(currentFileId);
        var msg = uploadedFiles.length + ' 件アップロード完了';
        if (errors.length) msg += '（' + errors.length + ' 件失敗）';
        if (warnings.length) msg += '（' + warnings.length + ' 件は後処理が部分成功）';
        if (warnings.length) msg += ': ' + warnings[0];
        showToast(msg, warnings.length ? 'error' : 'success');
        closeUploadModal();
      } else {
        statusEl.textContent = 'エラー: すべてのアップロードに失敗しました。' + (errors[0] || '');
      }
      return;
    }

    var file = files[index];
    var currentIndex = index + 1;
    statusEl.textContent = currentIndex + '/' + files.length + ' アップロード中...';

    readFileAsDataUrl(file, function (dataUrl) {
      // Canvas変換をスキップして、方位情報入りのオリジナルデータをそのまま送る
      var uploadName = sanitizeFileName(file.name);
      google.script.run
        .withSuccessHandler(function (result) {
          if (result.success) {
            uploadedFiles.push(result.file);
            if (result.homeSet && result.file && result.file.id) {
              newHomeImageId = result.file.id;
            }
            if (result.partialSuccess) {
              warnings.push(file.name + ': ' + (result.warning || 'Drive保存後のscenes同期に失敗しました。'));
            }
          } else {
            errors.push(file.name + ': ' + (result.error || '不明なエラー'));
          }
          index++;
          uploadNext();
        })
        .withFailureHandler(function (err) {
          errors.push(file.name + ': ' + (err && err.message ? err.message : '通信エラー'));
          index++;
          uploadNext();
        })
        .uploadImageToDrive(withEditToken({
          base64:          dataUrl,
          fileName:        uploadName,
          mimeType:        file.type || 'image/jpeg',
          is2D:            !!is2D,
          setAsHome:       !!setAsHome,
          targetFolderId:  getCurrentFolderId() || ''
        }));
    }, function (message) {
      errors.push(file.name + ': ' + (message || 'ファイルの読み込みに失敗'));
      index++;
      uploadNext();
    });
  }

  uploadNext();
}

// =============================================
//  共有モーダル

function getCheckedRadioValue(name, fallback) {
  var selected = document.querySelector('input[name="' + name + '"]:checked');
  return selected ? selected.value : fallback;
}

function setCheckedRadioValue(name, value) {
  var radios = document.querySelectorAll('input[name="' + name + '"]');
  for (var i = 0; i < radios.length; i++) {
    radios[i].checked = radios[i].value === value;
  }
}

function getCurrentViewForShare(target) {
  var sceneId = '';
  var yaw = null;
  var pitch = null;

  if ((target === 'scene' || target === 'view') && currentFileId) {
    sceneId = currentFileId;
  }

  if (target === 'view' && sceneId && !is2DMode && viewer) {
    try {
      if (typeof viewer.getYaw === 'function') yaw = viewer.getYaw();
      if (typeof viewer.getPitch === 'function') pitch = viewer.getPitch();
    } catch (e) {
      yaw = null;
      pitch = null;
    }
  }

  return { sceneId: sceneId, yaw: yaw, pitch: pitch };
}

function getShareOptionsFromModal() {
  var target = getCheckedRadioValue('share-target', 'home');
  var currentView = getCurrentViewForShare(target);
  var baseUrl = appBaseUrl || (window.location && window.location.href) || '';
  return {
    format: getCheckedRadioValue('share-format', 'url'),
    baseUrl: baseUrl,
    delivery: getCheckedRadioValue('share-delivery', 'auto'),
    sceneId: currentView.sceneId,
    yaw: currentView.yaw,
    pitch: currentView.pitch
  };
}

function updateShareOutput() {
  var options = getShareOptionsFromModal();
  var url = buildPublicShareUrl(options);
  var isIframe = options.format === 'iframe';
  var isQr = options.format === 'qr';
  var text = isIframe ? buildIframeCode(url) : url;
  var output = document.getElementById('share-output');
  if (output) output.value = text;
  var outputRow = document.getElementById('share-output-row');
  if (outputRow) outputRow.hidden = isQr;

  var label = document.getElementById('share-output-label');
  if (label) label.textContent = isIframe ? 'iframeコード' : (isQr ? 'QRコード用URL' : '共有URL');
  updateShareQrPanel(url, options.format);
  return text;
}

function openShareModal() {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('open-share')) return false;
  cancelHotspotMove('共有画面を開いたため移動をキャンセルしました。', { silent: true });
  stopGyroIfActive('share');
  setCheckedRadioValue('share-format', 'url');
  setCheckedRadioValue('share-delivery', 'auto');
  setCheckedRadioValue('share-target', 'home');
  updateShareOutput();
  document.getElementById('embed-modal-backdrop').classList.add('visible');
  document.getElementById('embed-modal').classList.add('visible');
}

/**
 * 旧名称の互換ラッパー。
 */
function openEmbedModal() {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('open-share')) return false;
  return openShareModal();
}

function closeShareModal() {
  document.getElementById('embed-modal-backdrop').classList.remove('visible');
  document.getElementById('embed-modal').classList.remove('visible');
}

/**
 * 旧名称の互換ラッパー。
 */
function closeEmbedModal() {
  closeShareModal();
}

function copyShareOutput() {
  updateShareOutput();
  var textarea = document.getElementById('share-output');
  if (!textarea) return;
  var text = textarea.value;
  if (!text) return;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      showToast('コピーしました。', 'success');
    }).catch(function () {
      fallbackCopy_(textarea);
    });
  } else {
    fallbackCopy_(textarea);
  }
}

/**
 * 旧名称の互換ラッパー。
 */
function copyEmbedCode() {
  copyShareOutput();
}

/**
 * 現在表示中のシーンを再読み込みする（ホットスポット更新反映用）。
 */
function reloadCurrentScene() {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('reload-current-scene')) return false;
  if (!currentFileId || !allImages) return;
  var currentImg = null;
  for (var i = 0; i < allImages.length; i++) {
    if (allImages[i].id === currentFileId) { currentImg = allImages[i]; break; }
  }
  if (currentImg) loadScene(currentImg);
}

function onBulkInputDropdownClick(evt) {
  if (typeof guardHotspotFormOperation === 'function' && !guardHotspotFormOperation('bulk-input-action')) {
    closeBulkInputDropdown();
    return false;
  }
  if (!canEdit) {
    closeBulkInputDropdown();
    return;
  }

  var btn = evt.target.closest('.bulk-input-item');
  if (!btn || btn.disabled) return;
  var action = btn.getAttribute('data-action');
  if (!action) return;

  closeBulkInputDropdown();
  var origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '処理中...';

  if (action === 'update-dropdowns') {
    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.textContent = origText;
        if (result && result.success) {
          showToast('入力リストを最新化しました。', 'success');
        } else {
          showToast('更新に失敗しました: ' + ((result && result.error) || '不明なエラー'), 'error');
        }
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = origText;
        showToast('通信エラーが発生しました: ' + (err.message || '不明なエラー'), 'error');
      })
      .updateStudentSheetDropdowns(withEditToken({}));
  } else if (action === 'import-student-data') {
    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        btn.textContent = origText;
        if (result && result.success) {
          var msg = result.count > 0
            ? result.count + '件のデータを取り込みました。'
            : '取り込み対象のデータがありませんでした。';
          if (result.skipped > 0) {
            msg += ' ' + result.skipped + '件は参照先・同名重複・ラベルを確認するため未処理のまま残しました。';
          }
          showToast(msg, result.skipped > 0 ? 'error' : 'success');
          if (result.count > 0) {
            clearHotspotCache(currentFileId || '');
            reloadCurrentScene();
          }
        } else {
          showToast('取り込みに失敗しました: ' + ((result && result.error) || '不明なエラー'), 'error');
        }
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = origText;
        showToast('通信エラーが発生しました: ' + (err.message || '不明なエラー'), 'error');
      })
      .bulkImportStudentSheet(withEditToken({}));
  }
}

/**
 * Clipboard API が使えない場合のフォールバックコピー。
 *
 * @param {HTMLTextAreaElement} textarea
 */
function fallbackCopy_(textarea) {
  textarea.select();
  try {
    document.execCommand('copy');
    showToast('コピーしました。', 'success');
  } catch (e) {
    showToast('コピーに失敗しました。手動でコピーしてください。', 'error');
  }
  window.getSelection().removeAllRanges();
}
